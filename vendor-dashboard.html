<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="pragma" content="no-cache">

  <title>لوحة صاحب المتجر - MeshWar</title>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020617}#vendorFrame{width:100%;height:100%;border:0;display:block}</style>
  <script src="js/vendor-barcode-smart-search-v11.js?v=20260823-1301"></script>
  <script src="js/vendor-order-smart-search-scanner-v13.js?v=20260822-1910"></script>
  <script src="js/vendor-theme-pagination-v16.js?v=20260822-1910"></script>
  <script src="js/vendor-order-status-contrast-v18.js?v=20260822-1910"></script>
  <script src="js/vendor-financial-kpi-icons-v19.js?v=20260822-1934"></script>
  <script src="js/vendor-finance-pl-invoices-v21.js?v=20260822-2316"></script>
  <script src="js/vendor-finance-cost-save-guard-v21.js?v=20260822-2316"></script>
  <script src="js/vendor-barcode-margin-autopricing-v22.js?v=20260822-2352"></script>
  <script src="js/vendor-pl-expense-hotfix-v23.js?v=20260823-1324"></script>
  <script src="js/vendor-finance-settlement-v24.js?v=20260824-1253"></script>
  <script src="js/vendor-settlement-pdf-details-v25.js?v=20260824-1435"></script>
  <script src="js/vendor-product-edit-fields-v26.js?v=20260824-1712"></script>
</head>
<body>
  <iframe id="vendorFrame" src="vendor-dashboard-v2.html?v=20260822-1910" title="لوحة صاحب المتجر"></iframe>
  <script>
    (function(){
      const frame=document.getElementById('vendorFrame');
      const ACTIVE_TAB_KEY='meshwar_vendor_active_tab';

      function bindActiveTabPersistence(){
        const win=frame.contentWindow,d=win?.document;
        if(!d||win.__mwActiveTabPersistenceBound)return;
        d.addEventListener('click',e=>{
          const btn=e.target?.closest?.('.vendor-main-tab,[id^="vendorTabBtn-"]');
          if(btn?.id){
            try{win.localStorage.setItem(ACTIVE_TAB_KEY,btn.id)}catch(err){console.warn('Vendor active tab save failed',err)}
          }
        },true);
        win.__mwActiveTabPersistenceBound=true;
      }

      function bindV24PlNavigation(){
        const win=frame.contentWindow,d=win?.document;
        if(!d||win.__mwV24PlNavigationBound)return;
        d.addEventListener('click',e=>{
          if(!e.target?.closest?.('#vendorTabBtn-pl'))return;
          win.requestAnimationFrame(()=>{
            try{window.MeshwarVendorFinanceSettlementV24?.ensureUi(win,{refresh:true})}
            catch(err){console.error('Vendor P&L V24 direct injection failed',err)}
          });
        },true);
        win.__mwV24PlNavigationBound=true;
      }

      function restoreActiveTab(){
        const win=frame.contentWindow,d=win?.document;
        if(!d)return;
        let saved='';
        try{saved=win.localStorage.getItem(ACTIVE_TAB_KEY)||''}catch(err){console.warn('Vendor active tab read failed',err)}
        if(!saved)return;
        const btn=d.getElementById(saved);
        if(btn&&typeof btn.click==='function'&&!btn.classList.contains('active'))btn.click();
      }

      function install(){
        try{window.MeshwarVendorBarcodeV11?.install(frame.contentWindow)}
        catch(e){console.error('Vendor barcode install failed',e)}
        try{window.MeshwarVendorOrderSmartSearchV13?.install(frame.contentWindow)}
        catch(e){console.error('Vendor order smart search install failed',e)}
        try{window.MeshwarVendorThemePaginationV16?.install(frame.contentWindow)}
        catch(e){console.error('Vendor theme/pagination install failed',e)}
        try{window.MeshwarVendorOrderStatusContrastV18?.install(frame.contentWindow)}
        catch(e){console.error('Vendor order status contrast install failed',e)}
        try{window.MeshwarVendorFinancialKpiIconsV19?.install(frame.contentWindow)}
        catch(e){console.error('Vendor financial KPI icons install failed',e)}
        try{window.MeshwarVendorFinanceV21?.install(frame.contentWindow)}
        catch(e){console.error('Vendor finance V21 install failed',e)}
        try{window.MeshwarVendorFinanceCostSaveGuardV21?.install(frame.contentWindow)}
        catch(e){console.error('Vendor finance cost guard V21 install failed',e)}
        try{window.MeshwarVendorBarcodeMarginV22?.install(frame.contentWindow)}
        catch(e){console.error('Vendor barcode/margin V22 install failed',e)}
        try{window.MeshwarVendorPlExpenseV23?.install(frame.contentWindow)}
        catch(e){console.error('Vendor P&L expense V23 install failed',e)}
        try{window.MeshwarVendorFinanceSettlementV24?.install(frame.contentWindow)}
        catch(e){console.error('Vendor P&L settlement V24 install failed',e)}
        try{window.MeshwarVendorSettlementPdfDetailsV25?.install(frame.contentWindow)}
        catch(e){console.error('Vendor settlement PDF details V25 install failed',e)}
        try{window.MeshwarVendorProductEditFieldsV26?.install(frame.contentWindow)}
        catch(e){console.error('Vendor product edit fields V26 install failed',e)}
        bindActiveTabPersistence();
        bindV24PlNavigation();
        restoreActiveTab();
      }
      frame.addEventListener('load',install);
    })();
  </script>
</body>
</html>
