<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>طلب جديد - MeshWar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary-red: #cc0000; --dark-blue: #003366; --bg-light: #f4f6f9; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-light); margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .order-box { background: white; padding: 30px; border-radius: 15px; width: 100%; max-width: 500px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: var(--dark-blue); margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; font-size: 14px; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-family: inherit; }
        input:focus, textarea:focus { border-color: var(--dark-blue); outline: none; }
        .user-info-notice { background: #e8f4fd; border: 1px solid #b6e0fe; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 13px; color: #0369a1; line-height: 1.6; }
        .btn-submit { width: 100%; padding: 12px; background: var(--primary-red); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; transition: background 0.2s; }
        .btn-submit:hover { background: #a30000; }
        .btn-submit:disabled { opacity: .6; cursor: wait; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #64748b; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>

<div class="order-box">
    <h2><i class="fa-solid fa-cart-plus"></i> تقديم طلب جديد</h2>
    <div class="user-info-notice" id="userInfoNotice">
        <i class="fa-solid fa-circle-info"></i> مرحباً بك، يتم استخدام بيانات حسابك السحابية تلقائياً لهذا الطلب.
    </div>

    <div class="form-group">
        <label>رابط المنتج المطلوب *</label>
        <input type="url" id="pUrl" placeholder="الصق رابط المنتج هنا..." required>
    </div>

    <div class="form-group">
        <label>رابط صورة المنتج (اختياري)</label>
        <input type="url" id="pImageUrl" placeholder="https://...">
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div class="form-group">
            <label>اللون (اختياري)</label>
            <input type="text" id="pColor" placeholder="مثال: أسود، أحمر">
        </div>
        <div class="form-group">
            <label>المقاس (اختياري)</label>
            <input type="text" id="pSize" placeholder="مثال: L, XL, 42">
        </div>
    </div>

    <div class="form-group">
        <label>العدد</label>
        <input type="number" id="pQuantity" value="1" min="1">
    </div>

    <div class="form-group">
        <label>ملاحظات إضافية</label>
        <textarea id="pNotes" rows="2" placeholder="أي تفاصيل أخرى تود إضافتها للمنتج..."></textarea>
    </div>

    <button class="btn-submit" id="submitOrderBtn" onclick="submitOrder()">تأكيد وإرسال الطلب</button>
    <a href="dashboard.html" class="back-link"><i class="fa-solid fa-arrow-right"></i> العودة لوحة التحكم</a>
</div>

<script>
    const ORDER_SUPABASE_URL = 'https://hsmmbloouskqdnptiiad.supabase.co';
    const ORDER_SUPABASE_KEY = 'sb_publishable_6_IDhNRdtxboDuCfBeAulQ_RRrBqpFH';
    let orderSupabase = null;

    async function ensureOrderSupabase() {
        if (orderSupabase) return orderSupabase;
        const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
        orderSupabase = createClient(ORDER_SUPABASE_URL, ORDER_SUPABASE_KEY);
        return orderSupabase;
    }

    function getSessionCustomerId() {
        const directId = localStorage.getItem('viewingCustomerId');
        if (directId) return directId;
        try {
            const sessionUser = JSON.parse(localStorage.getItem('loggedInUser') || '{}');
            return sessionUser.id != null ? String(sessionUser.id) : '';
        } catch (e) { return ''; }
    }

    async function loadCurrentCustomer() {
        const customerId = getSessionCustomerId();
        if (!customerId) return null;
        const supabase = await ensureOrderSupabase();
        const { data, error } = await supabase.from('customers').select('*').eq('id', customerId).maybeSingle();
        if (error) throw error;
        return data || null;
    }

    function generateOrderCode() {
        const timePart = Date.now().toString(36).toUpperCase();
        const randomPart = Math.random().toString(36).slice(2, 7).toUpperCase();
        return `MW-${timePart}-${randomPart}`;
    }

    window.onload = async function() {
        try {
            const customer = await loadCurrentCustomer();
            if (!customer) {
                alert('يجب تسجيل الدخول أولاً لتقديم الطلب.');
                window.location.href = 'login.html';
                return;
            }
            document.getElementById('userInfoNotice').innerHTML = `<i class="fa-solid fa-circle-info"></i> العميل: <b>${customer.name || ''}</b> — ${customer.phone || ''}`;
        } catch (error) {
            console.error('Order customer load error:', error);
            alert('تعذر التحقق من بيانات العميل في Supabase.');
        }
    };

    async function submitOrder() {
        const productUrl = document.getElementById('pUrl').value.trim();
        if (!productUrl) return alert('الرجاء إدخال رابط المنتج على الأقل.');

        const button = document.getElementById('submitOrderBtn');
        button.disabled = true;
        try {
            const customer = await loadCurrentCustomer();
            if (!customer) throw new Error('تعذر تحديد العميل الحالي');

            const details = {
                color: document.getElementById('pColor').value.trim() || 'غير محدد',
                size: document.getElementById('pSize').value.trim() || 'غير محدد',
                quantity: Number(document.getElementById('pQuantity').value || 1),
                notes: document.getElementById('pNotes').value.trim()
            };

            const payload = {
                customer_id: customer.id,
                order_code: generateOrderCode(),
                customer_name: customer.name || '',
                customer_phone: customer.phone || '',
                details,
                total_price: 0,
                order_url: productUrl,
                image_url: document.getElementById('pImageUrl').value.trim() || null,
                status: 'انتظار رد الموظف',
                rejection_reason: null
            };

            const supabase = await ensureOrderSupabase();
            const { error } = await supabase.from('orders').insert([payload]);
            if (error) throw error;

            alert(`تم إرسال طلبك بنجاح! رقم الطلب: ${payload.order_code}`);
            window.location.href = 'dashboard.html';
        } catch (error) {
            console.error('Order insert error:', error);
            alert('تعذر إرسال الطلب إلى Supabase: ' + (error.message || error));
            button.disabled = false;
        }
    }

    window.submitOrder = submitOrder;
</script>

</body>
</html>
