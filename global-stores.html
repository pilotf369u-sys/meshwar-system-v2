<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KINTO | المتاجر العالمية</title>
<style>
:root{color-scheme:dark;--bg:#032b25;--panel:#073b31;--gold:#e5b93f;--text:#f7fbfa;--muted:#b7cec8}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:radial-gradient(circle at 85% 0,rgba(229,185,63,.08),transparent 32%),linear-gradient(180deg,#063b32,#032b25);color:var(--text);min-height:100vh}a{text-decoration:none;color:inherit}.top{position:sticky;top:0;z-index:20;background:rgba(3,43,37,.78);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(229,185,63,.22)}.top-inner{max-width:1280px;margin:auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-weight:950}.brand img{width:46px;height:46px;object-fit:contain;border-radius:12px;border:1px solid rgba(229,185,63,.35);background:rgba(255,255,255,.05)}.back{padding:10px 16px;border:1px solid rgba(229,185,63,.48);border-radius:999px;background:rgba(255,255,255,.055);box-shadow:inset 0 1px 0 rgba(255,255,255,.08);font-weight:900}.hero{max-width:1280px;margin:28px auto 18px;padding:28px 20px}.hero-card{padding:30px;border:1px solid rgba(229,185,63,.26);border-radius:28px;background:linear-gradient(135deg,rgba(255,255,255,.075),rgba(255,255,255,.025));backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 24px 60px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.09)}.eyebrow{color:#f3d77b;font-size:12px;font-weight:900;letter-spacing:.08em}.hero h1{font-size:clamp(32px,6vw,62px);margin:8px 0 10px}.hero p{color:var(--muted);line-height:1.95;margin:0;max-width:850px;font-size:15px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.search{flex:1;min-width:220px;padding:14px 16px;border-radius:15px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.065);box-shadow:inset 0 1px 0 rgba(255,255,255,.06);color:#fff;outline:none}.search:focus{border-color:rgba(229,185,63,.55);box-shadow:0 0 0 3px rgba(229,185,63,.08)}.count{display:flex;align-items:center;padding:0 15px;border-radius:15px;border:1px solid rgba(229,185,63,.26);background:rgba(255,255,255,.04);color:#f3d77b;font-weight:900}.filters{display:flex;gap:9px;overflow-x:auto;padding:14px 2px 2px;margin-top:8px;scrollbar-width:thin}.filter-btn{flex:0 0 auto;cursor:pointer;border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:10px 15px;background:rgba(255,255,255,.055);color:#dcebe7;font-weight:900;font-size:13px;white-space:nowrap;transition:.2s}.filter-btn:hover{border-color:rgba(229,185,63,.45);color:#fff}.filter-btn.active,.filter-btn[aria-pressed="true"]{border-color:rgba(240,209,110,.78);background:linear-gradient(135deg,rgba(246,220,131,.18),rgba(211,168,45,.12));color:#ffe69a;box-shadow:0 8px 22px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.08)}.wrap{max-width:1280px;margin:auto;padding:0 20px 56px}.section{margin-top:30px}.section h2{font-size:22px;margin:0 0 14px;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px}.card{position:relative;overflow:hidden;min-height:216px;padding:15px;border-radius:22px;border:1px solid rgba(255,255,255,.11);background:linear-gradient(145deg,rgba(255,255,255,.085),rgba(255,255,255,.035));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 12px 30px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.08);display:flex;flex-direction:column;align-items:center;text-align:center;transition:transform .22s,border-color .22s,box-shadow .22s}.card:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.045),transparent 45%);pointer-events:none}.card:hover{transform:translateY(-4px);border-color:rgba(229,185,63,.52);box-shadow:0 18px 42px rgba(0,0,0,.22),0 0 0 1px rgba(229,185,63,.08),inset 0 1px 0 rgba(255,255,255,.12)}.logo{height:82px;width:100%;display:grid;place-items:center;border-radius:17px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.88);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 8px 20px rgba(0,0,0,.10);padding:10px}.logo img{max-width:90%;max-height:60px;object-fit:contain}.card h3{margin:14px 0 11px;font-size:15px;position:relative}.open{position:relative;margin-top:auto;width:100%;padding:10px 12px;border-radius:12px;border:1px solid rgba(240,209,110,.85);background:linear-gradient(135deg,#f6dc83,#d3a82d);box-shadow:0 8px 18px rgba(0,0,0,.13);color:#12251f;font-weight:950;transition:.2s}.open:hover{filter:brightness(1.06);transform:translateY(-1px)}.note{margin:30px 0 0;padding:17px 19px;border-radius:18px;border:1px solid rgba(229,185,63,.20);background:rgba(255,255,255,.045);backdrop-filter:blur(16px);color:var(--muted);font-size:13px;line-height:1.9}@media(max-width:600px){.hero-card{padding:23px 18px}.top-inner{padding:10px 12px}.back{padding:9px 12px;font-size:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.card{min-height:194px;padding:11px}.logo{height:68px}.hero{padding:18px 12px}.wrap{padding-left:12px;padding-right:12px}.filter-btn{padding:9px 12px;font-size:12px}}
</style>
</head>
<body>
<header class="top"><div class="top-inner"><a class="brand" href="index.html"><img src="images/meshwar-logo.png" alt="KINTO"><span>KINTO</span></a><a class="back" href="index.html">⌂ الرجوع للرئيسية</a></div></header>
<main>
<section class="hero"><div class="hero-card"><div class="eyebrow">KINTO GLOBAL STORES</div><h1>🌍 المتاجر العالمية</h1><p>استكشف أشهر المتاجر العالمية واطلب ما تحتاجه بضغطة زر واحدة لتصلك مشترياتك مباشرة إلى باب منزلك. اختر متجرك المفضل، تصفح أحدث المنتجات والعروض، ودع KINTO يجعل تجربة التسوق أسهل وأقرب إليك.</p><div class="tools"><input id="storeSearch" class="search" type="search" placeholder="ابحث عن متجر..." autocomplete="off"><div class="count"><span id="storeCount">0</span>&nbsp; متجر</div></div><nav class="filters" id="globalStoreFilters" aria-label="تصنيفات المتاجر العالمية"><button class="filter-btn active" type="button" data-filter="all" aria-pressed="true">الكل</button><button class="filter-btn" type="button" data-filter="المتاجر الشاملة" aria-pressed="false">المتاجر الشاملة</button><button class="filter-btn" type="button" data-filter="الأزياء والملابس" aria-pressed="false">الأزياء والملابس</button><button class="filter-btn" type="button" data-filter="الرياضة والأحذية" aria-pressed="false">الرياضة والأحذية</button><button class="filter-btn" type="button" data-filter="التجميل والعناية" aria-pressed="false">التجميل والعناية</button><button class="filter-btn" type="button" data-filter="المنزل والأطفال والسوبر ماركت" aria-pressed="false">المنزل والأطفال والسوبر ماركت</button></nav></div></section>
<div class="wrap" id="directory"></div>
</main>
<script>
(()=>{'use strict';
const groups=[
['المتاجر الشاملة',[['Trendyol','trendyol.png','https://www.trendyol.com'],['Hepsiburada','hepsiburada.png','https://www.hepsiburada.com'],['N11','N11.png','https://www.n11.com'],['Boyner','boyner.png','https://www.boyner.com.tr/'],['Beymen','beymen.png','https://www.beymen.com/tr/']]],
['الأزياء والملابس',[['LC Waikiki','waikiki.png','https://www.lcwaikiki.com'],['Defacto','defacto.png','https://www.defacto.com.tr'],['Koton','KOTON.png','https://www.koton.com'],['Mavi','mavi.png','https://www.mavi.com/'],["Colin's",'colins.png','https://www.colins.com.tr/'],['LTB','ltb.png','https://www.ltbjeans.com/'],['U.S. Polo Assn.','uspolo.png','https://tr.uspoloassn.com/'],['Zara','zara.png','https://www.zara.com/tr/'],['H&M','hm.png','https://www2.hm.com/tr_tr/index.html'],['Mango','mango.png','https://shop.mango.com/tr/tr'],['Bershka','bershka.png','https://www.bershka.com/tr/'],['Pull&Bear','pullandbear.png','https://www.pullandbear.com/tr/en/'],['Stradivarius','stradivarius.png','https://www.stradivarius.com/tr/'],['Oysho','oysho.png','https://www.oysho.com/tr/'],['Massimo Dutti','massimodutti.png','https://www.massimodutti.com/tr/'],['Marks & Spencer','marksandspencer.png','https://www.marksandspencer.com.tr/'],['İpekyol','ipekyol.png','https://www.ipekyol.com.tr/'],['Twist','twist.png','https://www.twist.com.tr/'],["D'S Damat",'dsdamat.png','https://www.dsdamat.com/'],['Lacoste','lacoste.png','https://www.lacoste.com.tr/'],['Esswaap','esswaap.png','https://www.esswaap.com/'],['Kayra','kayra.png','https://www.kayra.com/']]],
['الرياضة والأحذية',[['Nike','nike.png','https://www.nike.com/tr/'],['Adidas','adidas.png','https://www.adidas.com.tr/'],['Puma','puma.png','https://tr.puma.com/'],['FLO','flo.png','https://www.flo.com.tr/'],['SuperStep','superstep.png','https://www.superstep.com.tr/'],['Luvi Shoes','luvishoes.png','https://www.luvishoes.com/']]],
['التجميل والعناية',[['Gratis','gratis.png','https://www.gratis.com'],['Watsons','watsons.png','https://www.watsons.com.tr'],['Eve Shop','eveshop.png','https://www.eveshop.com.tr/'],['Sephora','sephora.png','https://www.sephora.com.tr/'],['MAD Parfumeur','madparfum.png','https://www.madparfum.com/'],['Golden Rose','goldenrose.png','https://shop.goldenrose.com.tr/'],['Penti','penti.png','https://www.penti.com/tr/']]],
['المنزل والأطفال والسوبر ماركت',[['Madame Coco','madamecoco.png','https://www.madamecoco.com/'],['English Home','englishhome.png','https://www.englishhome.com/'],['ebebek','ebebek.png','https://kurumsal.ebebek.com/'],['Kanz','kanz.png','https://www.kanzcocuk.com/'],['Toyzz Shop','toyzzshop.png','https://www.toyzzshop.com/'],['Getir','getir.png','https://getir.com/'],['Migros','migros.png','https://www.migros.com.tr/'],['A101','a101.png','https://www.a101.com.tr/'],['BİM','bim.png','https://www.bim.com.tr/'],['Şok Market','sok.png','https://kurumsal.sokmarket.com.tr/']]]];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const directory=document.getElementById('directory');
directory.innerHTML=groups.map(([title,stores])=>`<section class="section" data-group="${esc(title)}"><h2>${esc(title)}</h2><div class="grid">${stores.map(([name,img,url])=>`<div class="card" data-name="${esc(name)}"><div class="logo"><img src="images/${esc(img)}" alt="${esc(name)}"></div><h3>${esc(name)}</h3><a class="open" href="${esc(url)}" target="_blank" rel="noopener noreferrer">تصفح المنتجات</a></div>`).join('')}</div></section>`).join('')+'<div class="note">اختر متجرك المفضل وتصفح منتجاته مباشرة، ثم استخدم خدمات KINTO لتجربة تسوق وشحن أكثر سهولة وراحة.</div>';
const input=document.getElementById('storeSearch');
const count=document.getElementById('storeCount');
const sections=[...document.querySelectorAll('.section')];
const buttons=[...document.querySelectorAll('.filter-btn')];
let activeFilter='all';
function apply(){
  const q=String(input.value||'').trim().toLowerCase();
  let visible=0;
  sections.forEach(section=>{
    const group=String(section.dataset.group||'');
    const groupMatch=activeFilter==='all'||group===activeFilter;
    let sectionVisible=0;
    section.querySelectorAll('.card').forEach(card=>{
      const text=String(card.dataset.name||'').toLowerCase();
      const show=groupMatch&&(!q||text.includes(q));
      card.hidden=!show;
      if(show){visible++;sectionVisible++}
    });
    section.hidden=sectionVisible===0;
  });
  count.textContent=String(visible);
}
buttons.forEach(btn=>btn.addEventListener('click',()=>{
  activeFilter=String(btn.dataset.filter||'all');
  buttons.forEach(b=>{const on=b===btn;b.classList.toggle('active',on);b.setAttribute('aria-pressed',String(on))});
  apply();
}));
input.addEventListener('input',apply);
apply();
})();
</script>
</body>
</html>
