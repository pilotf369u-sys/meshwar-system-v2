<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>كشف تحويلات الفرع - MeshWar</title>
<style>
*{box-sizing:border-box}
body{font-family:Tahoma,Arial,sans-serif;margin:0;background:#eef2f7;color:#111}
.sheet{width:min(100%,1600px);margin:18px auto;background:#fff;padding:14px;box-shadow:0 2px 12px #0002}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.top-actions button{border:0;border-radius:6px;padding:9px 14px;background:#2563eb;color:#fff;font-weight:800;cursor:pointer}
.top-actions .gray{background:#475569}
.title{text-align:center;margin:0 0 10px;font-size:22px;font-weight:900}
.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.field{border:1px solid #111;padding:6px;min-height:45px}
.field label{display:block;font-size:11px;font-weight:900;margin-bottom:4px}
.field input,.field select{width:100%;border:0;border-bottom:1px dotted #555;padding:3px;font-family:inherit;font-size:12px;background:transparent}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 12px}
.stat{border:1px solid #111;padding:7px;text-align:center;font-weight:900}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th,td{border:1px solid #000;padding:4px 3px;text-align:center;vertical-align:middle;font-size:8.5px;line-height:1.2;overflow-wrap:anywhere;font-weight:700}
th{background:#e5e7eb;font-weight:900}
.mw{width:6.5%}.siparis{width:6.5%}.ccode{width:7%}.customer{width:8%}.phone{width:7.5%}.province{width:6.5%}.address{width:10%}.sender{width:6.5%}.senderphone{width:7%}.collectstatus{width:5.5%}.qty{width:4%}.amount{width:6%}.due{width:6%}.notes{width:12.5%}
.status-chip{display:inline-block;border:1px solid currentColor;border-radius:10px;padding:2px 5px;font-weight:900;white-space:nowrap}
.not-arrived{color:#c62828}.arrived{color:#1565c0}.transport{color:#15803d}
.empty{height:28px}.loading{text-align:center;padding:30px;font-weight:800;color:#475569}.error{color:#b91c1c;text-align:center;padding:20px;font-weight:800}
@page{size:A4 landscape;margin:5mm}
@media print{
html,body{background:#fff;margin:0;padding:0}
.sheet{width:100%;max-width:none;margin:0;padding:0;box-shadow:none}
.top-actions{display:none!important}
.title{font-size:14px;margin:0 0 3mm;font-weight:900}
.meta{grid-template-columns:repeat(4,1fr);gap:2mm;margin-bottom:2mm}
.field{padding:1.2mm;min-height:9mm;border:1px solid #000}
.field label{font-size:7.2px;margin-bottom:.5mm;font-weight:900}
.field input,.field select{font-size:7.6px;padding:.3mm;font-weight:700}
.stats{gap:2mm;margin:2mm 0 3mm}
.stat{padding:1.2mm;font-size:7.5px;border:1px solid #000;font-weight:900}
.table-wrap{overflow:visible}
table{width:100%;table-layout:fixed;border-collapse:collapse}
thead{display:table-header-group}
tr{page-break-inside:avoid}
th,td{border:1px solid #000!important;padding:.8mm .45mm;font-size:6.2px;line-height:1.12;color:#000;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}
th{font-weight:900;background:#e5e7eb!important}
.status-chip{padding:.2mm .5mm;border-width:1px;font-size:6px;font-weight:900}
.not-arrived{color:#c62828!important}.arrived{color:#1565c0!important}.transport{color:#15803d!important}
.empty{height:8mm}
}
</style>
</head>
<body>
<div class="sheet">
<div class="top-actions">
<button onclick="window.print()">طباعة / PDF</button>
<button class="gray" onclick="location.href='employee-dashboard.html'+(employeeId?'?employeeId='+encodeURIComponent(employeeId):'')">رجوع للوحة الموظف</button>
</div>
<h1 class="title">MeshWar — كشف تحويلات الفرع</h1>
<div class="meta">
<div class="field"><label>الفرع</label><select id="branchSelect" onchange="changeBranch()"><option value="">اختر الفرع</option></select></div>
<div class="field"><label>تاريخ الكشف</label><input id="manifestDate" type="date"></div>
<div class="field"><label>رقم الكشف / Manifest No</label><input id="manifestNo" type="text"></div>
<div class="field"><label>اسم الناقل / السائق</label><input id="carrierName" type="text" placeholder="اسم الشخص أو الشركة الناقلة"></div>
</div>
<div class="stats">
<div class="stat">عدد الشحنات: <span id="shipmentCount">0</span></div>
<div class="stat">إجمالي قيمة البضاعة: <span id="goodsTotal">0.00</span></div>
<div class="stat">إجمالي مبلغ التحصيل المطلوب: <span id="collectionTotal">0.00</span></div>
</div>
<div class="table-wrap">
<table>
<thead><tr>
<th class="mw">رقم MW</th>
<th class="siparis">Sipariş</th>
<th class="ccode">Customer Code</th>
<th class="customer">العميل</th>
<th class="phone">هاتف العميل</th>
<th class="province">المحافظة</th>
<th class="address">العنوان</th>
<th class="sender">المرسل</th>
<th class="senderphone">هاتف المرسل</th>
<th class="collectstatus">حالة التحصيل</th>
<th class="qty">الكمية</th>
<th class="amount">المبلغ</th>
<th class="due">التحصيل</th>
<th class="notes">ملاحظات</th>
</tr></thead>
<tbody id="manifestBody"><tr><td colspan="14" class="loading">جاري التحميل...</td></tr></tbody>
</table>
</div>
</div>
<script>
const SB_URL='https://hsmmbloouskqdnptiiad.supabase.co';
const SB_KEY='sb_publishable_6_IDhNRdtxboDuCfBeAulQ_RRrBqpFH';
const params=new URLSearchParams(location.search),employeeId=params.get('employeeId')||'',initialBranchId=params.get('branchId')||'';
let sb=null,branches=[];
async function getSb(){if(sb)return sb;const{createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');return sb=createClient(SB_URL,SB_KEY)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function id(v){return v==null?'':String(v).trim()}
function parseDetails(v){if(!v)return{};if(typeof v==='object')return v;try{return JSON.parse(v)}catch{return{}}}
function quantity(o){const d=parseDetails(o?.details),n=Number(d.quantity??o?.quantity??1);return Number.isFinite(n)&&n>0?Math.max(1,n):1}
function paymentType(v){return['paid_prepaid','cod_full','product_paid_delivery_cod'].includes(v)?v:'cod_full'}
function doorCollection(o){const t=paymentType(o?.delivery_payment_type),p=Number(o?.total_price||0),f=Number(o?.delivery_fee||0);if(t==='paid_prepaid')return 0;if(t==='product_paid_delivery_cod')return f;return p+f}
function collectionStatus(o){const t=paymentType(o?.delivery_payment_type);if(t==='paid_prepaid')return['واصل','arrived'];if(t==='product_paid_delivery_cod')return['نقل','transport'];return['غير واصل','not-arrived']}
function senderName(o){const d=parseDetails(o?.details);return o?.sender_name||o?.sender||d.sender_name||d.sender||''}
function senderPhone(o){const d=parseDetails(o?.details);return o?.sender_phone||d.sender_phone||''}
function customerProvince(o){const d=parseDetails(o?.details);return o?._customer_province||o?.province||o?.state||o?.region||o?.city||d.province||d.state||d.region||d.city||''}
function customerAddress(o){const d=parseDetails(o?.details);return o?._customer_address||o?.address||o?.customer_address||o?.delivery_address||o?.recipient_address||d.address||d.customer_address||d.delivery_address||d.recipient_address||''}
function money(v,c){return Number(v||0).toFixed(2)+' '+esc(c||'$')}
function defaultManifestNo(branchId){const d=new Date(),date=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');return'MF-'+date+'-'+String(branchId||'BR').replace(/[^a-zA-Z0-9]/g,'').slice(-8).toUpperCase()}
async function loadBranches(){const c=await getSb(),{data,error}=await c.from('branches').select('*').order('id',{ascending:true}).limit(1000);if(error)throw error;branches=data||[];branchSelect.innerHTML='<option value="">اختر الفرع</option>'+branches.map(b=>`<option value="${esc(id(b.id))}">${esc(b.name||b.branch_name||b.id)}</option>`).join('');if(initialBranchId&&branches.some(b=>id(b.id)===id(initialBranchId)))branchSelect.value=id(initialBranchId)}
async function enrichCustomers(rows){const ids=[...new Set(rows.map(o=>id(o.customer_id)).filter(Boolean))];if(!ids.length)return;const c=await getSb(),{data,error}=await c.from('customers').select('*').in('id',ids);if(error)throw error;const map=new Map((data||[]).map(x=>[id(x.id),x]));rows.forEach(o=>{const x=map.get(id(o.customer_id));o._customer_code=x?.code||o.customer_code||o.customer_id||'---';o._customer_phone=x?.phone||o.customer_phone||'';o._customer_province=x?.province||x?.state||x?.region||x?.city||'';o._customer_address=x?.address||x?.customer_address||x?.delivery_address||x?.recipient_address||''})}
async function loadManifest(){const branchId=id(branchSelect.value);if(!branchId){manifestBody.innerHTML='<tr><td colspan="14" class="loading">اختر الفرع لعرض الكشف.</td></tr>';shipmentCount.textContent='0';goodsTotal.textContent='0.00';collectionTotal.textContent='0.00';return}manifestBody.innerHTML='<tr><td colspan="14" class="loading">جاري سحب شحنات الفرع من Supabase...</td></tr>';const c=await getSb(),{data,error}=await c.from('orders').select('*').eq('branch_id',branchId).order('created_at',{ascending:false}).limit(10000);if(error)throw error;const rows=data||[];await enrichCustomers(rows);const totalsByCurrency={},dueByCurrency={};rows.forEach(o=>{const cur=o.currency||'$';totalsByCurrency[cur]=(totalsByCurrency[cur]||0)+Number(o.total_price||0);dueByCurrency[cur]=(dueByCurrency[cur]||0)+doorCollection(o)});shipmentCount.textContent=rows.length;goodsTotal.innerHTML=Object.entries(totalsByCurrency).map(([c,v])=>money(v,c)).join(' / ')||'0.00';collectionTotal.innerHTML=Object.entries(dueByCurrency).map(([c,v])=>money(v,c)).join(' / ')||'0.00';manifestBody.innerHTML=rows.map(o=>{const[s,cls]=collectionStatus(o);return`<tr><td>${esc(o.order_code||o.id)}</td><td>${esc(o.reference_order_no||'---')}</td><td>${esc(o._customer_code||'---')}</td><td>${esc(o.customer_name||'---')}</td><td dir="ltr">${esc(o._customer_phone||o.customer_phone||'---')}</td><td>${esc(customerProvince(o)||'')}</td><td>${esc(customerAddress(o)||'')}</td><td>${esc(senderName(o)||'')}</td><td dir="ltr">${esc(senderPhone(o)||'')}</td><td><span class="status-chip ${cls}">${s}</span></td><td>${esc(quantity(o))}</td><td>${money(o.total_price,o.currency)}</td><td>${money(doorCollection(o),o.currency)}</td><td class="empty"></td></tr>`}).join('')||'<tr><td colspan="14">لا توجد شحنات لهذا الفرع.</td></tr>';if(!manifestNo.value)manifestNo.value=defaultManifestNo(branchId)}
async function changeBranch(){const branchId=id(branchSelect.value),u=new URL(location.href);if(branchId)u.searchParams.set('branchId',branchId);else u.searchParams.delete('branchId');history.replaceState(null,'',u.pathname+u.search);manifestNo.value=defaultManifestNo(branchId);await loadManifest()}
window.onload=async()=>{const d=new Date();manifestDate.value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');try{await loadBranches();if(branchSelect.value){manifestNo.value=defaultManifestNo(branchSelect.value);await loadManifest()}else manifestBody.innerHTML='<tr><td colspan="14" class="loading">اختر الفرع لعرض الكشف.</td></tr>'}catch(e){console.error(e);manifestBody.innerHTML=`<tr><td colspan="14" class="error">${esc(e.message||e)}</td></tr>`}};
</script>
</body>
</html>
