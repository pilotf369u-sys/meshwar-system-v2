name: KINTO Deals G3C admin preview contract
on:
  pull_request:
    paths:
      - 'previews/kinto-deals-g3c-admin-review.html'
      - 'ci/kinto-deals-g3c-admin-preview-contract.test.mjs'
      - '.github/workflows/kinto-deals-g3c-admin-preview.yml'
  workflow_dispatch:
jobs:
  g3c-admin-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test ci/kinto-deals-g3c-admin-preview-contract.test.mjs
