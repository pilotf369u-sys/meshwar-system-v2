name: Run delivery integration patch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/run-delivery-patch.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python delivery_patch.py
      - name: Commit application files
        run: |
          git config user.name "meshwar-delivery-bot"
          git config user.email "actions@users.noreply.github.com"
          git add delivery-dashboard.html employee-dashboard.html admin-dashboard.html
          git commit -m "Fix courier assignment and restructure delivery dashboard"
          git push origin main
