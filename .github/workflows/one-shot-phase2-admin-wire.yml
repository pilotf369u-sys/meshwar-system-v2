name: One Shot Phase2 Admin Wire
on:
  push:
    paths:
      - '.github/workflows/one-shot-phase2-admin-wire.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch admin CMS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin-content-cms.html')
          s=p.read_text()
          tag='<script src="js/admin-featured-requests-v2.js?v=20260827-v2.0"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>')
          p.write_text(s)
          PY
          rm -f .github/workflows/one-shot-phase2-admin-wire.yml
      - name: Commit phase 2 wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: wire phase 2 approvals into admin CMS' || exit 0
          git push
