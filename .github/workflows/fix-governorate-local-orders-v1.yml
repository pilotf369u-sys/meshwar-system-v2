name: Fix Local Order Governorate V1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-governorate-local-orders-v1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply governorate patch
        run: python3 tools/fix_governorate_local_orders_v1.py
      - name: Verify governorate only changes
        run: |
          grep -F "customer.governorate||customer.state||customer.city||customer.province" js/local-store-card-v3.js
          grep -F "d.governorate||d.state||d.city" vendor-dashboard.html
          grep -F "<b>المحافظة:</b>" employee-dashboard.html
          grep -F "<b>المحافظة:</b>" admin-dashboard.html
          grep -F "local-store-card-v3.js?v=governorate-fix-v1" index.html
          node --check js/local-store-card-v3.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/local-store-card-v3.js vendor-dashboard.html employee-dashboard.html admin-dashboard.html index.html
          git diff --cached --quiet || git commit -m 'Persist and display local order governorate'
          git push origin main
