name: KINTO Deals G4B draft
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261002_kinto_deals_v1_g4b_vendor_draft_off.sql'
      - 'ci/kinto-deals-g4b-vendor-draft.test.mjs'
      - '.github/workflows/kinto-deals-g4b-vendor-draft.yml'
  workflow_dispatch:
jobs:
  g4b-vendor-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test ci/kinto-deals-g4b-vendor-draft.test.mjs
