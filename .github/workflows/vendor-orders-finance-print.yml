name: Vendor Orders Finance Print
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vendor-orders-finance-print.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply vendor orders patch
        run: python3 tools/vendor_orders_finance_print_patch.py
      - name: Verify
        run: |
          node --check js/local-store-card-v3.js
          grep -F "from('orders')" vendor-dashboard.html
          grep -F "contains('details',{source:'local_store',store_id:String(vendorStore.id)})" vendor-dashboard.html
          grep -F 'printShippingLabel' vendor-dashboard.html
          grep -F 'js/local-store-card-v3.js?v=vendor-orders-v1' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor-dashboard.html js/local-store-card-v3.js index.html
          git diff --cached --quiet || git commit -m 'Link vendor orders finance and shipping labels'
          git push origin main
