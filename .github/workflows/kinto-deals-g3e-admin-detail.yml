name: KINTO Deals G3E admin detail
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261002_kinto_deals_v1_g3e_admin_detail_off.sql'
      - 'ci/kinto-deals-g3e-admin-detail-contract.test.mjs'
      - '.github/workflows/kinto-deals-g3e-admin-detail.yml'
  workflow_dispatch:
jobs:
  g3e-admin-detail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test ci/kinto-deals-g3e-admin-detail-contract.test.mjs
