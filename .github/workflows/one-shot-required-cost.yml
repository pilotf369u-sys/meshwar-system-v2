name: One-shot required cost field patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-required-cost.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch static product cost field and live cache keys
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('vendor-dashboard-v2.html')
          s=p.read_text()
          old='''      <input id="productBasePrice" class="field" type="number" min="0" step="0.01" placeholder="السعر الأصلي ($ USD)">\n      <input id="productDiscountPrice" class="field" type="number" min="0" step="0.01" placeholder="سعر الخصم ($ USD) - اختياري">'''
          new='''      <input id="productBasePrice" class="field" type="number" min="0" step="0.01" placeholder="السعر الأصلي ($ USD)">\n      <input id="mwProductCostPrice" name="cost_price" class="field" type="number" min="0" step="0.01" required aria-required="true" placeholder="سعر التكلفة (Cost Price) *">\n      <input id="productDiscountPrice" class="field" type="number" min="0" step="0.01" placeholder="سعر الخصم ($ USD) - اختياري">'''
          if old not in s: raise SystemExit('static price field anchor not found')
          s=s.replace(old,new,1)
          old="function resetProductForm(){['productId','productName','productImage','productDescription','productBasePrice','productDiscountPrice','productStock','productColors','productSizes','productVolumes'].forEach(id=>$(id).value='');"
          new="function resetProductForm(){['productId','productName','productImage','productDescription','productBasePrice','mwProductCostPrice','productDiscountPrice','productStock','productColors','productSizes','productVolumes'].forEach(id=>$(id).value='');"
          if old not in s: raise SystemExit('resetProductForm anchor not found')
          s=s.replace(old,new,1)
          old="$('productBasePrice').value=p.base_price??'';$('productDiscountPrice').value=p.discount_price??'';"
          new="$('productBasePrice').value=p.base_price??'';$('mwProductCostPrice').value=p.cost_price??'';$('productDiscountPrice').value=p.discount_price??'';"
          if old not in s: raise SystemExit('editProduct price anchor not found')
          s=s.replace(old,new,1)
          old="const base=Number($('productBasePrice').value),discount=$('productDiscountPrice').value.trim()===''?null:Number($('productDiscountPrice').value),stock="
          new="const base=Number($('productBasePrice').value),costRaw=$('mwProductCostPrice').value.trim(),cost=costRaw===''?NaN:Number(costRaw),discount=$('productDiscountPrice').value.trim()===''?null:Number($('productDiscountPrice').value),stock="
          if old not in s: raise SystemExit('saveProduct read anchor not found')
          s=s.replace(old,new,1)
          old="if(discount!=null&&(!Number.isFinite(discount)||discount<0||discount>base))return showNotice('سعر الخصم يجب أن يكون بين 0 والسعر الأصلي.',true);try{"
          new="if(discount!=null&&(!Number.isFinite(discount)||discount<0||discount>base))return showNotice('سعر الخصم يجب أن يكون بين 0 والسعر الأصلي.',true);if(!costRaw||!Number.isFinite(cost)||cost<0){$('mwProductCostPrice').focus();$('mwProductCostPrice').reportValidity?.();return showNotice('سعر التكلفة (Cost Price) مطلوب ويجب أن يكون رقمًا صحيحًا أكبر من أو يساوي صفر.',true)}try{"
          if old not in s: raise SystemExit('saveProduct validation anchor not found')
          s=s.replace(old,new,1)
          old="base_price:base,discount_price:discount,currency:'USD'"
          new="base_price:base,discount_price:discount,cost_price:cost,currency:'USD'"
          if old not in s: raise SystemExit('native payload anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('vendor-dashboard.html')
          s=p.read_text()
          import re
          s=re.sub(r'<meta name="meshwar-build" content="[^"]+">','<meta name="meshwar-build" content="vendor-v36-required-cost-20260825">',s,count=1)
          s=re.sub(r'js/vendor-product-save-complete-v34\.js\?v=[^"]+','js/vendor-product-save-complete-v34.js?v=20260825-v34-required-cost3',s,count=1)
          s=re.sub(r'js/vendor-finance-delivered-orders-v35\.js\?v=[^"]+','js/vendor-finance-delivered-orders-v35.js?v=20260825-v35-quantity-finance3',s,count=1)
          s=re.sub(r'vendor-dashboard-v2\.html\?v=[^"]+','vendor-dashboard-v2.html?v=20260825-v36-required-cost1',s,count=1)
          p.write_text(s)
          PY
      - name: Validate static required cost contract
        run: |
          grep -Fq 'id="mwProductCostPrice" name="cost_price"' vendor-dashboard-v2.html
          grep -Fq 'required aria-required="true" placeholder="سعر التكلفة (Cost Price) *"' vendor-dashboard-v2.html
          grep -Fq "$('mwProductCostPrice').value=p.cost_price??''" vendor-dashboard-v2.html
          grep -Fq 'cost_price:cost' vendor-dashboard-v2.html
          grep -Fq 'vendor-product-save-complete-v34.js?v=20260825-v34-required-cost3' vendor-dashboard.html
          grep -Fq 'vendor-dashboard-v2.html?v=20260825-v36-required-cost1' vendor-dashboard.html
      - name: Commit patch to main
        run: |
          git config user.name 'meshwar-ci-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add vendor-dashboard-v2.html vendor-dashboard.html
          git commit -m 'fix: add required static product cost price field'
          git push origin HEAD:main
