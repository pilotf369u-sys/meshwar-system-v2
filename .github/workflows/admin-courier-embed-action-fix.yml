name: Admin courier embed action fix
on:
  push:
    branches:
      - fix/admin-master-tabs-integration
permissions:
  contents: write
jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply action fix
        run: python3 tools/fix_admin_courier_embed_actions.py
      - name: Remove temporary files
        run: |
          rm -f tools/fix_admin_courier_embed_actions.py
          rm -f .github/workflows/admin-courier-embed-action-fix.yml
      - name: Validate behavior and syntax
        run: |
          grep -Fq 'html.admin-embedded .actions a{display:none!important}' admin-delivery-reports.html
          ! grep -Fq 'html.admin-embedded .actions{display:none}' admin-delivery-reports.html
          rm -rf /tmp/embed-js && mkdir -p /tmp/embed-js
          python3 - <<'PY'
          import re,pathlib
          files=['admin-dashboard.html','admin-delivery-reports.html','admin-branch-reports.html','local-stores-admin.html']
          out=pathlib.Path('/tmp/embed-js')
          for fn in files:
              text=pathlib.Path(fn).read_text(encoding='utf-8'); idx=0
              for attrs,body in re.findall(r'<script([^>]*)>(.*?)</script>',text,flags=re.S|re.I):
                  if re.search(r'\bsrc\s*=',attrs,re.I) or not body.strip(): continue
                  idx+=1
                  ext='.mjs' if re.search(r'type\s*=\s*["\']module["\']',attrs,re.I) else '.js'
                  (out/f'{pathlib.Path(fn).stem}-{idx}{ext}').write_text(body,encoding='utf-8')
          PY
          for f in /tmp/embed-js/*; do node --check "$f"; done
          git diff --check
          git diff --stat
      - name: Commit validated correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-delivery-reports.html tools/fix_admin_courier_embed_actions.py .github/workflows/admin-courier-embed-action-fix.yml
          git commit -m "Keep courier report print action in embedded tab"
          git push origin HEAD:fix/admin-master-tabs-integration
