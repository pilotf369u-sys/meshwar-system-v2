name: Audit surgical fixes
on:
  push:
    branches:
      - fix/audit-security-and-bugs
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply surgical fixes
        id: patch
        shell: bash
        run: |
          set +e
          python3 tools/apply_audit_surgical_fixes.py > /tmp/patch.log 2>&1
          code=$?
          cat /tmp/patch.log
          if [ $code -ne 0 ]; then
            printf '### Audit patch failed\n```text\n' > /tmp/comment.md
            cat /tmp/patch.log >> /tmp/comment.md
            printf '\n```\n' >> /tmp/comment.md
            gh pr comment 8 --body-file /tmp/comment.md || true
            exit $code
          fi
      - name: Remove temporary patch machinery
        run: |
          rm -f tools/apply_audit_surgical_fixes.py
          rm -f .github/workflows/audit-surgical-fix.yml
      - name: Structural assertions
        run: |
          ! grep -q "bootstrapFirstAdmin\|hasAdminAccount" login.html
          ! grep -q "courierCurrency:" admin-dashboard.html
          ! grep -q "courierCurrency:" branch-dashboard.html
          ! grep -q "from('stores').insert\|from('stores').delete" admin-dashboard.html
          grep -q "history.replaceState.*section" admin-dashboard.html
          grep -q "meshwar-session-guard-v1" admin-dashboard.html dashboard.html branch-dashboard.html delivery-dashboard.html employee-dashboard.html admin-branches.html admin-branch-reports.html local-stores-admin.html
      - name: Node syntax check inline JavaScript
        run: |
          mkdir -p /tmp/meshwar-js-check
          python3 - <<'PY'
          import re, pathlib
          files=['login.html','admin-dashboard.html','dashboard.html','branch-dashboard.html','delivery-dashboard.html','employee-dashboard.html','admin-branches.html','admin-branch-reports.html','local-stores-admin.html']
          out=pathlib.Path('/tmp/meshwar-js-check')
          for fn in files:
              text=pathlib.Path(fn).read_text(encoding='utf-8')
              idx=0
              for attrs,body in re.findall(r'<script([^>]*)>(.*?)</script>',text,flags=re.S|re.I):
                  if re.search(r'\bsrc\s*=',attrs,re.I) or not body.strip():
                      continue
                  idx+=1
                  ext='.mjs' if re.search(r'type\s*=\s*["\']module["\']',attrs,re.I) else '.js'
                  (out/f'{pathlib.Path(fn).stem}-{idx}{ext}').write_text(body,encoding='utf-8')
          print('Extracted',len(list(out.iterdir())),'inline scripts')
          PY
          for f in /tmp/meshwar-js-check/*; do echo "node --check $f"; node --check "$f"; done
      - name: Diff validation
        run: |
          git diff --check
          git status --short
          git diff --stat | tee /tmp/diff-stat.txt
      - name: Commit validated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix audit security and consistency issues"
          git push origin HEAD:fix/audit-security-and-bugs
      - name: Report success
        run: |
          printf '### Audit surgical fixes validated ✅\n\n`node --check` and `git diff --check` passed.\n\n```text\n' > /tmp/success.md
          cat /tmp/diff-stat.txt >> /tmp/success.md
          printf '\n```\n' >> /tmp/success.md
          gh pr comment 8 --body-file /tmp/success.md || true
