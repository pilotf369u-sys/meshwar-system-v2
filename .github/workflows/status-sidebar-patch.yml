name: Status sidebar patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/status-sidebar-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python .github/status_sidebar_patch.py
      - name: Commit and cleanup
        run: |
          git config user.name "meshwar-status-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/status-sidebar-patch.yml .github/status_sidebar_patch.py
          git add employee-dashboard.html admin-dashboard.html
          git commit -m "Redesign order status filters as vertical sidebars"
          git push origin main
