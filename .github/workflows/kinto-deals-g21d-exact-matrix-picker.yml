name: KINTO Deals G21D exact matrix picker
on:
  pull_request:
    paths:
      - 'js/vendor-kinto-deals-g4c-draft.js'
      - 'supabase/migrations/20261006_kinto_deals_v1_g21d_exact_matrix_picker.sql'
      - 'ci/kinto-deals-g21d-exact-matrix-picker.test.mjs'
      - '.github/workflows/kinto-deals-g21d-exact-matrix-picker.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check js/vendor-kinto-deals-g4c-draft.js
      - run: node --test ci/kinto-deals-g21d-exact-matrix-picker.test.mjs
