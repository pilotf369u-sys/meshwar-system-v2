name: KINTO independent global orders
on:
  push:
    branches: [fix/world-stores-admission-20261024, app/world-all-stores-20261024, app/world-madame-link-20261024, fix/world-single-product-live-staff-20261023, fix/world-whatsapp-payment-privacy-20261023, fix/world-staff-pricing-stages-20261023, fix/world-order-cards-compact-20261023, fix/world-employee-entry-cache-20261023, fix/world-orders-in-normal-panels-20261023, fix/world-workflow-integrated-20261023, app/kinto-world-staff-specialty-20261023, app/kinto-global-orders-independent-20261023]
  pull_request:
    paths: ['sql/kinto-world-stores*', 'sql/kinto-world-madamecoco*', 'sql/kinto-world-payment-privacy-v3.sql', 'sql/kinto-world-staff-fulfillment-v2.sql', 'sql/kinto-global-orders-independent-v1.sql', 'sql/kinto-world-staff-accounts-v1.sql', 'sql/kinto-world-workflow-integration-v1.sql', 'js/admin-world-staff-v1.js', 'supabase/functions/kinto-world-staff-security-v1/**', 'mobile/global-orders/**', 'js/kinto-world*', '*world-workspace*', 'global-order-review.html', 'global-staff-workspace.html']
permissions:
  contents: read
jobs:
  isolated-workflow:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: kinto_world_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: node --check js/kinto-world-workspace-v1.js
      - run: node --check js/admin-world-staff-v1.js
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test mobile/global-orders/stores-admission.test.cjs mobile/global-orders/staff-edge.test.cjs mobile/global-orders/integrated-login.test.cjs mobile/global-orders/panel-defaults.test.cjs
      - run: node tests/pwa-hosting-contract.cjs
      - name: Independent lifecycle and authorization
        env:
          PGPASSWORD: isolated-test-only
        run: psql -h localhost -U postgres -d kinto_world_test -v ON_ERROR_STOP=1 -f mobile/global-orders/database-check.sql
      - name: Global-only staff accounts and OTP authorization
        env:
          PGPASSWORD: isolated-test-only
        run: psql -h localhost -U postgres -d kinto_world_test -v ON_ERROR_STOP=1 -f mobile/global-orders/staff-accounts-check.sql
      - name: Integrated branch and delivery workflow
        env:
          PGPASSWORD: isolated-test-only
        run: psql -h localhost -U postgres -d kinto_world_test -v ON_ERROR_STOP=1 -f mobile/global-orders/workflow-integration-check.sql
      - name: Global staff shipping stages and search
        env:
          PGPASSWORD: isolated-test-only
        run: psql -h localhost -U postgres -d kinto_world_test -v ON_ERROR_STOP=1 -f mobile/global-orders/staff-fulfillment-check.sql
      - name: Global payment privacy and session security
        env:
          PGPASSWORD: isolated-test-only
        run: psql -h localhost -U postgres -d kinto_world_test -v ON_ERROR_STOP=1 -f mobile/global-orders/payment-privacy-check.sql
      - name: Hepsiburada extension and rollback in disposable database
        env:
          PGPASSWORD: isolated-test-only
        run: psql -h localhost -U postgres -d kinto_world_test -v ON_ERROR_STOP=1 -f mobile/global-orders/hepsiburada-check.sql
      - name: Madame Coco admission and rollback in disposable database
        env:
          PGPASSWORD: isolated-test-only
        run: psql -h localhost -U postgres -d kinto_world_test -v ON_ERROR_STOP=1 -f mobile/global-orders/madamecoco-check.sql
      - name: zara full lifecycle and rollback in disposable database
        env:
          PGPASSWORD: isolated-test-only
        run: psql -h localhost -U postgres -d kinto_world_test -v ON_ERROR_STOP=1 -f mobile/global-orders/zara-link-check.sql
      - name: mango full lifecycle and rollback in disposable database
        env:
          PGPASSWORD: isolated-test-only
        run: psql -h localhost -U postgres -d kinto_world_test -v ON_ERROR_STOP=1 -f mobile/global-orders/mango-link-check.sql
      - name: mad full lifecycle and rollback in disposable database
        env:
          PGPASSWORD: isolated-test-only
        run: psql -h localhost -U postgres -d kinto_world_test -v ON_ERROR_STOP=1 -f mobile/global-orders/mad-link-check.sql
      - name: Two-connection idempotency
        env:
          PGPASSWORD: isolated-test-only
        run: bash mobile/global-orders/concurrency-check.sh
      - name: Customer consent and staff quote browser checks
        run: |
          python3 mobile/global-orders/prepare-employee-page-fixture.py
          python3 mobile/global-orders/prepare-customer-cards-fixture.py
          for fixture in zara-link mango-link mad-link madamecoco hepsiburada compact-staff customer-live single-product staff-live payment-privacy staff-fulfillment staff customer admin-staff dispatch customer-integrated employee-integrated employee-page; do
            google-chrome --headless --no-sandbox --disable-gpu --allow-file-access-from-files --virtual-time-budget=10000 --dump-dom "file://$PWD/mobile/global-orders/$fixture-fixture.html" > "$RUNNER_TEMP/$fixture-world.html"
          done
          google-chrome --headless --no-sandbox --disable-gpu --allow-file-access-from-files --virtual-time-budget=10000 --window-size=420,1000 --dump-dom "file://$PWD/.kinto-customer-cards-test.html" > "$RUNNER_TEMP/customer-styled.html"
          google-chrome --headless --no-sandbox --disable-gpu --allow-file-access-from-files --virtual-time-budget=10000 --window-size=420,1000 --hide-scrollbars --screenshot="$RUNNER_TEMP/customer-cards.png" "file://$PWD/.kinto-customer-cards-test.html"
          google-chrome --headless --no-sandbox --disable-gpu --allow-file-access-from-files --virtual-time-budget=10000 --window-size=1280,1800 --hide-scrollbars --screenshot="$RUNNER_TEMP/staff-review.png" "file://$PWD/.kinto-employee-page-test.html?orderScope=world"
          python3 - <<'PYTEST'
          import os,pathlib
          styled=pathlib.Path(os.environ['RUNNER_TEMP'],'customer-styled.html').read_text()
          assert '>PASS_CUSTOMER_INTEGRATED_UI<' in styled,styled
          for kind in ['zara-link','mango-link','mad-link','madamecoco','hepsiburada','compact-staff','customer-live','single-product','staff-live','payment-privacy','staff-fulfillment','staff','customer','admin-staff','dispatch','customer-integrated','employee-integrated','employee-page']:
            content=pathlib.Path(os.environ['RUNNER_TEMP'],kind+'-world.html').read_text()
            assert '>PASS_'+kind.upper().replace('-','_')+'_UI<' in content,content
          PYTEST

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: global-customer-card-visual-check
          path: |
            ${{ runner.temp }}/customer-cards.png
            ${{ runner.temp }}/staff-review.png
          retention-days: 7
