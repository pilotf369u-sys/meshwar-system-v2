name: KINTO Deals G4H product hydration
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261002_kinto_deals_v1_g4h_draft_product_hydration_off.sql'
      - 'ci/kinto-deals-g4h-product-hydration.test.mjs'
      - '.github/workflows/kinto-deals-g4h-product-hydration.yml'
  workflow_dispatch:
jobs:
  g4h-product-hydration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test ci/kinto-deals-g4h-product-hydration.test.mjs
