name: KINTO Deals G4K revision UI
on: pull_request
jobs:
  g4k-revision-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check js/vendor-kinto-deals-g3g.js
      - run: node --check js/vendor-kinto-deals-g4c-draft.js
      - run: node --test ci/kinto-deals-g4k-revision-ui.test.mjs
