name: Customer Mobile Cards V46 Wire
on:
  push:
    branches: [fix/customer-mobile-cards-v46]
    paths:
      - '.github/workflows/customer-mobile-v46-wire.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/customer-mobile-cards-v46
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/wire-customer-mobile-v46.py
      - name: Verify presentation-only contract
        run: |
          python - <<'PY'
          from pathlib import Path
          d=Path('dashboard.html').read_text(encoding='utf-8')
          c=Path('css/customer-mobile-cards-v46.css').read_text(encoding='utf-8')
          assert 'customer-mobile-cards-v46.css?v=20260830-mobile-v46' in d
          assert '@media (max-width:760px)' in c
          assert '#activeOrders td:nth-child(6)::before{content:"المجموع الكلي النهائي"!important}' in c
          assert 'total_price' not in c and 'external_shipping_fee' not in c and 'delivery_fee' not in c
          print('V46 mobile presentation contract OK')
          PY
      - name: Commit dashboard wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dashboard.html
          git commit -m 'fix: wire customer mobile card layout V46'
          git push
