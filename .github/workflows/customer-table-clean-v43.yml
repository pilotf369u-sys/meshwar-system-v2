name: Customer Table Clean V43
on:
  push:
    branches: [review/customer-table-clean-v43]
    paths:
      - '.github/workflows/customer-table-clean-v43.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/customer-table-clean-v43
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/customer_table_clean_v43.py
      - name: Verify table contract
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('dashboard.html').read_text(encoding='utf-8')
          assert '<th>المجموع الكلي النهائي</th>' in s
          a=s.index('function activeOrderRow(o,index){'); b=s.index('\nfunction historyOrderRow',a); f=s[a:b]
          assert 'grandTotal=money.grandTotal' in f
          assert 'externalShippingFee=' not in f
          assert 'deliveryFee=' not in f
          assert f.count('<td>')==9
          assert 'customerDecisionHtml(o,index,grandTotal,currency)' in f
          d=s[s.index('function customerDecisionHtml'):s.index('\nfunction getOrderSiparisNo')]
          assert 'السعر المقترح' not in d and 'الطلب قبل التسديد' not in d and 'payment-box' not in d
          assert '✓ موافقة / دفع' in d
          assert 'colspan="9">لا توجد طلبات نشطة حالياً.' in s
          print('V43 table contract OK')
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dashboard.html
          git commit -m 'fix: clean customer active orders table v43'
          git push
