name: Hero V14 Wire
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hero-v14-wire.yml'
jobs:
  wire:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Wire V14 skin and cache bust
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<script src="js/index-featured-campaigns-v1.js?v=20260828-v13-hero"></script>'
          new='<link rel="stylesheet" href="css/hero-v14-emerald-glass.css?v=20260828-v14-emerald"><script src="js/index-featured-campaigns-v1.js?v=20260828-v14-emerald"></script>'
          if old not in s:
              raise SystemExit('Expected V13 script tag not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: activate Hero V14 emerald glass design'
          git push