name: Vendor Product Edit V26 Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check V26
        run: node --check js/vendor-product-edit-fields-v26.js
      - name: Validate restored edit-field dependencies and ownership
        run: |
          grep -q "local-store-detailed-description-v8.js" js/vendor-product-edit-fields-v26.js
          grep -q "local-store-categories-v9.js" js/vendor-product-edit-fields-v26.js
          grep -q "local-store-taxonomy-persistence-v10.js" js/vendor-product-edit-fields-v26.js
          grep -q "fieldsReady" js/vendor-product-edit-fields-v26.js
          grep -q "ensureFields" js/vendor-product-edit-fields-v26.js
          grep -q "MutationObserver" js/vendor-product-edit-fields-v26.js
          grep -q "if(!fieldsReady(win))ensureFields(win)" js/vendor-product-edit-fields-v26.js
          grep -q "subcategory_id" js/local-store-taxonomy-persistence-v10.js
          grep -q "saveTaxonomySnapshot" js/local-store-taxonomy-persistence-v10.js
          grep -q "__mwTaxonomyV10LastPayload" js/local-store-taxonomy-persistence-v10.js
          grep -q "20260824-v27-payloadfix1" js/local-store-taxonomy-persistence-v10.js
          grep -q "hydrateTaxonomyForEdit" js/local-store-taxonomy-persistence-v10.js
          grep -q "persistTaxonomy" js/local-store-taxonomy-persistence-v10.js
          grep -q "vendor-product-edit-fields-v26.js?v=20261008-v68-save" vendor-dashboard.html
          grep -q "MeshwarVendorProductEditFieldsV26?.install" vendor-dashboard.html
          ! grep -q "wrapSaveProduct" js/vendor-product-edit-fields-v26.js
          ! grep -q "wrapEditProduct" js/vendor-product-edit-fields-v26.js
          ! grep -q "win.saveProduct=" js/vendor-product-edit-fields-v26.js
          ! grep -q "win.editProduct=" js/vendor-product-edit-fields-v26.js
      - name: Verify product save preserves stock and metadata
        run: node ci/vendor-product-save-v68.test.cjs
      - name: Protect barcode and finance layers
        run: |
          git diff --exit-code "${{ github.event.pull_request.base.sha }}" -- js/vendor-finance-cost-save-guard-v21.js
          node - <<'NODE'
          const fs=require('node:fs'),cp=require('node:child_process'),assert=require('node:assert/strict');
          const base='${{ github.event.pull_request.base.sha }}';
          function fn(source,name){
            const lines=source.split('\n'),start=lines.findIndex(l=>new RegExp('^  (?:async )?function '+name+'\\(').test(l));
            assert.ok(start>=0,name+' exists');
            let end=start+1;while(end<lines.length&&!/^  (?:async )?function /.test(lines[end])&&!/^  window\\./.test(lines[end]))end++;
            return lines.slice(start,end).join('\n').trim();
          }
          for(const [path,names] of [
            ['js/vendor-barcode-smart-search-v11.js',['hydrateBarcodeForEdit','wrapProductFunctions','handleSearch']],
            ['js/vendor-barcode-margin-autopricing-v22.js',['autoPrice','bindProductPricing','loadMargin','saveMargin','injectMarginUi','wrapProductFunctions','persistCanonicalBarcode','bindBarcodeSaveGuard','resolveProductId','handleSmartSearch']]
          ]){
            const before=cp.execFileSync('git',['show',base+':'+path],{encoding:'utf8'}),after=fs.readFileSync(path,'utf8');
            for(const name of names)assert.equal(fn(after,name),fn(before,name),path+': '+name+' unchanged');
          }
          NODE

      - name: Protect retained V21 product cost functions
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),cp=require('node:child_process'),assert=require('node:assert/strict');
          const path='js/vendor-finance-pl-invoices-v21.js';
          const before=cp.execFileSync('git',['show','${{ github.event.pull_request.base.sha }}:'+path],{encoding:'utf8'});
          const after=fs.readFileSync(path,'utf8');
          // Finance rendering is retired; the product cost editor prefix must remain identical.
          const prefix=s=>s.split('  function activatePl')[0].split('  // Product cost editing remains independent')[0].trim();
          assert.equal(prefix(after),prefix(before));
          NODE
