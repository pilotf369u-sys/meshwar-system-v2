name: Fix scanner buttons
on:
  push:
    paths:
      - '.github/fix_scanner_buttons.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 .github/fix_scanner_buttons.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-dashboard.html employee-dashboard.html branch-dashboard.html
          git diff --cached --check
          git commit -m "Fix live scanner modal and button binding"
          git push origin main
