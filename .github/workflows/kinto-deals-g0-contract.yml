name: KINTO Deals G0 Baseline Contract
on:
  pull_request:
    paths:
      - 'ci/kinto-deals-g0-baseline-contract.test.mjs'
      - 'docs/KINTO_DEALS_*.md'
      - '.github/workflows/kinto-deals-g0-contract.yml'
  workflow_dispatch:
jobs:
  deals-g0-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate G0 test syntax
        run: node --check ci/kinto-deals-g0-baseline-contract.test.mjs
      - name: Guard existing checkout, invoices, notices, stock and campaign discounts
        run: node --test ci/kinto-deals-g0-baseline-contract.test.mjs
