name: Fix delivery camera three tier
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-camera-three-tier.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch delivery camera flow
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('delivery-dashboard.html')
          s=p.read_text(encoding='utf-8')
          old='<div id="scannerModal" class="scanner-wrap"><div class="scanner-panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px"><b>مسح باركود مباشر بالكاميرا الخلفية</b><button class="btn btn-red" onclick="stopScanner()">إلغاء المسح</button></div><div id="reader"></div><div id="cameraHint" class="muted" style="margin-top:8px;text-align:center">وجّه الكاميرا الخلفية نحو الباركود، وسيتم التقاطه تلقائياً دون تصوير صورة.</div></div></div>'
          new='<div id="scannerModal" class="scanner-wrap"><div class="scanner-panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px"><b>مسح باركود مباشر بالكاميرا الخلفية</b><button class="btn btn-red" onclick="stopScanner()">إلغاء المسح</button></div><div id="reader"></div><div id="cameraHint" class="muted" style="margin-top:8px;text-align:center">جاري طلب صلاحية الكاميرا وتشغيل البث الحي...</div><button id="barcodePhotoFallbackBtn" class="btn btn-blue" type="button" style="display:none;width:100%;margin-top:10px" onclick="openBarcodePhotoFallback()">📸 التقاط صورة للباركود للتحليل الفوري</button><input id="barcodePhotoFallbackInput" type="file" accept="image/*" capture="environment" style="display:none" onchange="scanBarcodePhotoFallback(this.files[0])"></div></div>'
          if old not in s: raise SystemExit('scanner modal block not found')
          s=s.replace(old,new,1)
          start=s.index('async function toggleScanner(event){')
          end=s.index('async function stopScanner()',start)
          new_block="""async function requestDeliveryCameraPermission(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('mediaDevices unavailable');
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
  stream.getTracks().forEach(track=>track.stop());
}
function showBarcodePhotoFallback(message='تعذر تشغيل البث الحي. يمكنك التقاط صورة للباركود ليتم تحليلها فوراً.'){
  const hint=document.getElementById('cameraHint'),btn=document.getElementById('barcodePhotoFallbackBtn');
  if(hint)hint.textContent=message;
  if(btn)btn.style.display='inline-flex';
}
function hideBarcodePhotoFallback(){const btn=document.getElementById('barcodePhotoFallbackBtn');if(btn)btn.style.display='none'}
function openBarcodePhotoFallback(){const input=document.getElementById('barcodePhotoFallbackInput');if(!input)return;input.value='';input.click()}
async function scanBarcodePhotoFallback(file){
  if(!file)return;
  const hint=document.getElementById('cameraHint');
  if(hint)hint.textContent='جاري تحليل صورة الباركود...';
  let fileScanner=null;
  try{
    if(scanner){try{await scanner.stop()}catch{}try{await scanner.clear()}catch{}scanner=null}
    fileScanner=new Html5Qrcode('reader');
    const decodedText=await fileScanner.scanFile(file,true);
    const clean=cleanBarcodeScannerInput(decodedText);
    if(!clean)throw new Error('invalid barcode');
    await handleCameraScan(clean);
  }catch(e){console.error('Barcode photo fallback error:',e);showBarcodePhotoFallback('لم تتم قراءة الباركود من الصورة. حاول التقاط صورة أوضح أو أعد محاولة البث الحي.')}
  finally{try{await fileScanner?.clear()}catch{}const input=document.getElementById('barcodePhotoFallbackInput');if(input)input.value=''}
}
async function startCameraScanner(){
  const modal=document.getElementById('scannerModal'),hint=document.getElementById('cameraHint');
  modal.classList.add('show');
  hideBarcodePhotoFallback();
  if(hint)hint.textContent='جاري طلب صلاحية الكاميرا...';
  try{
    await requestDeliveryCameraPermission();
    if(hint)hint.textContent='تم السماح بالكاميرا. جاري تشغيل الكاميرا الخلفية...';
    const cameras=await Html5Qrcode.getCameras();
    if(!cameras||!cameras.length)throw new Error('no cameras');
    const selected=cameras.find(c=>/back|rear|environment|traseira|trasera|arrière|خلف/i.test(c.label||''))||cameras[cameras.length-1];
    scanner=new Html5Qrcode('reader');
    const config={fps:10,qrbox:{width:250,height:150},aspectRatio:1.777778};
    const onScanSuccess=async decodedText=>{const clean=cleanBarcodeScannerInput(decodedText);if(!clean)return;await handleCameraScan(clean)};
    await scanner.start(selected.id,config,onScanSuccess,()=>{});
    if(hint)hint.textContent='وجّه الكاميرا الخلفية نحو الباركود، وسيتم التقاطه تلقائياً.';
  }catch(e){
    console.error('Live camera scanner error:',e);
    if(scanner){try{await scanner.stop()}catch{}try{await scanner.clear()}catch{}scanner=null}
    showBarcodePhotoFallback();
  }
}
async function toggleScanner(event){if(event&&event.isTrusted===false)return;if(scanner){await stopScanner();return}await startCameraScanner()}
"""
          s=s[:start]+new_block+s[end:]
          old_stop="async function stopScanner(){if(scanner){try{await scanner.stop()}catch{}try{await scanner.clear()}catch{}scanner=null}document.getElementById('scannerModal')?.classList.remove('show')}"
          new_stop="async function stopScanner(){if(scanner){try{await scanner.stop()}catch{}try{await scanner.clear()}catch{}scanner=null}hideBarcodePhotoFallback();document.getElementById('scannerModal')?.classList.remove('show')}"
          if old_stop not in s: raise SystemExit('stopScanner block not found')
          s=s.replace(old_stop,new_stop,1)
          old_obj="Object.assign(window,{cleanBarcodeScannerInput,deliverySearchInput,deliverySearchKeyup,deliverySearchKeydown,toggleScanner,stopScanner,openDeliveryImage,closeDeliveryImage,chooseDeliveryProof,handleDeliveryProofFile});"
          new_obj="Object.assign(window,{cleanBarcodeScannerInput,deliverySearchInput,deliverySearchKeyup,deliverySearchKeydown,toggleScanner,startCameraScanner,stopScanner,openBarcodePhotoFallback,scanBarcodePhotoFallback,openDeliveryImage,closeDeliveryImage,chooseDeliveryProof,handleDeliveryProofFile});"
          if old_obj not in s: raise SystemExit('window exports block not found')
          s=s.replace(old_obj,new_obj,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit camera fix
        run: |
          git config user.name meshwar-delivery-bot
          git config user.email actions@users.noreply.github.com
          git add delivery-dashboard.html
          git commit -m "Add three-tier camera permission fallback" || exit 0
          git push origin main
