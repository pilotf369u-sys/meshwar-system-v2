name: Fix modern index script close
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-index-script-close.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          old='<\\/script>'
          if old not in s: raise SystemExit('escaped closing script not found')
          s=s.replace(old,'</script>')
          if '<\\/script>' in s: raise SystemExit('escaped closing script remains')
          if 'MESHWAR_INDEX_UI_V3' not in s or 'LOCAL_STORES_PUBLIC_DATA_V1' not in s: raise SystemExit('critical script markers missing')
          p.write_text(s,encoding='utf-8')
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-index-script-close.yml
          git add -A -- index.html .github/workflows/fix-index-script-close.yml
          git diff --cached --check
          git commit -m "Fix modern index script closing tag"
          git push origin main
