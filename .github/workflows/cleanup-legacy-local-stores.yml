name: Cleanup legacy local stores
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-legacy-local-stores.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove legacy local stores markup and harden list reset
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          legacy='''    <h2 class="section-title">المتاجر الشخصية والمحلية</h2>\n    <div class="grid-container">\n    </div>\n\n    \n'''
          if legacy not in s: raise SystemExit('legacy local stores block not found')
          s=s.replace(legacy,'',1)
          old="function showLocalStoreList(){const grid=document.getElementById('localStoresPublicGrid'),filters=document.getElementById('localSpecialtyFilters'),panel=document.getElementById('localStoreProductsPanel');if(panel)panel.style.display='none';if(filters)filters.style.display='flex';if(grid)grid.style.display='grid';renderLocalPublicStores();document.getElementById('localStoresPublic')?.scrollIntoView({behavior:'smooth',block:'start'})}"
          new="function showLocalStoreList(){const grid=document.getElementById('localStoresPublicGrid'),filters=document.getElementById('localSpecialtyFilters'),panel=document.getElementById('localStoreProductsPanel'),products=document.getElementById('localStoreProductsGrid');if(panel)panel.style.display='none';if(products)products.innerHTML='<div class=\\\"local-empty\\\">جاري تحميل المنتجات...</div>';if(filters)filters.style.display='flex';if(grid)grid.style.display='grid';renderLocalPublicStores();document.getElementById('localStoresPublic')?.scrollIntoView({behavior:'smooth',block:'start'})}"
          if old not in s: raise SystemExit('showLocalStoreList block not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Validate cleanup
        run: |
          ! grep -F 'المتاجر الشخصية والمحلية' index.html
          grep -F "from('local_stores')" index.html
          grep -F "if(panel)panel.style.display='none'" index.html
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Remove legacy local stores section'
          git push origin main
