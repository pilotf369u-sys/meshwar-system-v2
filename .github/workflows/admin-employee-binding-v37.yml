name: Admin Employee Binding V37
on:
  push:
    paths:
      - 'scripts/admin_employee_binding_v37.py'
      - '.github/workflows/admin-employee-binding-v37.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply literal employee binding
        run: python scripts/admin_employee_binding_v37.py
      - name: Validate exact employee binding
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('admin-dashboard.html').read_text()
          assert "raw=o.total_price,total=raw===null||raw===undefined||raw===''?null:Number(raw)" in s
          assert "hasPrice=o.total_price!==null&&o.total_price!==undefined&&o.total_price!==''&&Number(o.total_price)>0,price=hasPrice?o.total_price:''" in s
          assert "deliveryFee=o.delivery_fee!==null&&o.delivery_fee!==undefined&&o.delivery_fee!==''?o.delivery_fee:''" in s
          PY
      - name: Commit and push
        run: |
          rm -f scripts/admin_employee_binding_v37.py .github/workflows/admin-employee-binding-v37.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-dashboard.html scripts/admin_employee_binding_v37.py .github/workflows/admin-employee-binding-v37.yml
          git commit -m 'fix: mirror employee order price binding in admin V37'
          git push origin main
