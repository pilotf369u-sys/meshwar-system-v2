name: IQD thousand rounding
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/iqd-thousand-rounding.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python3 tools/iqd_thousand_rounding_patch.py
      - name: Verify
        run: |
          node --check js/local-store-pricing.js
          node --check js/local-store-card-v3.js
          grep -F 'rawLocalPrice/1000' js/local-store-pricing.js
          grep -F "pricing_version:'iqd_ceil_1000_v1'" js/local-store-pricing.js
          grep -F "snap.pricing_version!=='iqd_ceil_1000_v1'" js/local-store-card-v3.js
          grep -F 'iqd-thousand-v1' index.html
          grep -F 'iqd-thousand-v1' vendor-dashboard.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/local-store-pricing.js js/local-store-card-v3.js index.html vendor-dashboard.html
          git diff --cached --quiet || git commit -m 'Round IQD prices up to next thousand'
          git push origin main
