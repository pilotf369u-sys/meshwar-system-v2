name: Delivery defer UI fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/delivery-defer-ui-fix.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix deferred date visibility
        run: python .github/temp-defer-ui.py
      - name: Commit and cleanup
        run: |
          git config user.name "meshwar-delivery-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/temp-defer-ui.py .github/workflows/delivery-defer-ui-fix.yml
          git add delivery-dashboard.html
          git commit -m "Fix deferred delivery date visibility"
          git push origin main
