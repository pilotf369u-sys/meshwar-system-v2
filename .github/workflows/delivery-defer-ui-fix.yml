name: Delivery defer UI fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/delivery-defer-ui-fix.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix deferred date visibility
        run: python -c "from pathlib import Path;p=Path('delivery-dashboard.html');s=p.read_text(encoding='utf-8');s=s.replace(\"style=\\\"display:${o.status==='مؤجل'?'block':'none'}\\\"\",\"style=\\\"display:${(d.delivery_state==='deferred'||d.delivery_deferred_until)?'block':'none'}\\\"\");p.write_text(s,encoding='utf-8')"
      - name: Commit and cleanup
        run: |
          git config user.name "meshwar-delivery-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/delivery-defer-ui-fix.yml
          git add delivery-dashboard.html
          git commit -m "Fix deferred delivery date visibility"
          git push origin main
