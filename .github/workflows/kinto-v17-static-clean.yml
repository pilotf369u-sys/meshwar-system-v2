name: KINTO V17 Static Clean
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kinto-v17-static-clean.yml'
jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove static MeshWar brand remnants
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<span>MeshWar</span>','')
          old='<div class="header-container"><img class="main-logo" src="images/meshwar-logo.png" alt="KINTO Logo"><h1>منصة KINTO</h1><p>دليلك الشامل للتسوق من الأسواق التركية والشحن الدولي.</p></div>'
          new='<div class="header-container kinto-featured-store"><div class="kinto-featured-logo-wrap"><img class="main-logo" src="images/meshwar-logo.png" alt="KINTO Logo"></div><div class="kinto-featured-copy"><span class="kinto-featured-badge">✦ متجر مختار</span><h1 class="kinto-featured-title">KINTO <span class="kinto-featured-accent">Featured Store</span></h1><p class="kinto-featured-subtitle">واجهة مختارة بعناية لتجربة تسوق وشحن متكاملة بهوية KINTO الفاخرة.</p></div></div>'
          if old in s: s=s.replace(old,new,1)
          p.write_text(s)
          Path('.github/workflows/kinto-v17-static-clean.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/kinto-v17-static-clean.yml
          git commit -m 'fix: remove final static MeshWar UI remnants'
          git push
