name: Patch POD visibility
on:
  push:
    paths:
      - '.github/workflows/patch-pod-visibility.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 .github/patch_pod_visibility.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-dashboard.html employee-dashboard.html branch-dashboard.html dashboard.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Show proof of delivery across dashboards"
          git push origin main
