name: Hero V15 Wire
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hero-v15-wire.yml'
jobs:
  wire:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Activate V15 cache bust
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<link rel="stylesheet" href="css/hero-v14-emerald-glass.css?v=20260828-v14-emerald"><script src="js/index-featured-campaigns-v1.js?v=20260828-v14-emerald"></script>'
          new='<link rel="stylesheet" href="css/hero-v14-emerald-glass.css?v=20260828-v15-brand-hero"><script src="js/index-featured-campaigns-v1.js?v=20260828-v15-brand-hero"></script>'
          if old not in s:
              raise SystemExit('Expected V14 tags not found')
          p.write_text(s.replace(old,new,1))
          Path('.github/workflows/hero-v15-wire.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/hero-v15-wire.yml
          git commit -m 'feat: activate Hero V15 brand identity and cache bust'
          git push
