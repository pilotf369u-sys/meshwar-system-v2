name: Force branch manifest bar
on:
  push:
    branches: [main]
    paths: ['.github/workflows/force-branch-bar.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/force-branch-bar.py
      - name: Commit dashboard fixes
        run: |
          git config user.name "meshwar-branchbar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add employee-dashboard.html admin-dashboard.html
          git commit -m "Force branch transfer export bar visibility" || true
          git push
      - name: Cleanup temporary files
        run: |
          git pull --rebase
          git rm .github/force-branch-bar.py .github/workflows/force-branch-bar.yml
          git commit -m "Remove temporary branch bar automation"
          git push
