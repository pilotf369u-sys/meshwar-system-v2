name: Courier collection display
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  courier-collection-display:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/courier-collection-display-v1.test.cjs
