name: KINTO Deals G3B read feed contract
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261002_kinto_deals_v1_g3b_vendor_review_feed_off.sql'
      - 'ci/kinto-deals-g3b-feed-contract.test.mjs'
      - '.github/workflows/kinto-deals-g3b-feed.yml'
  workflow_dispatch:
jobs:
  g3b-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test ci/kinto-deals-g3b-feed-contract.test.mjs
