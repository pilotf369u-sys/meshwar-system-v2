name: Switch local card renderer to v3
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/switch-local-card-v3.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply v3 switch
        run: python3 tools/switch_local_card_v3.py
      - name: Validate
        run: |
          grep -F 'js/local-store-card-v3.js' index.html
          test "$(grep -c 'js/local-store-card-v2.js' index.html || true)" -eq 0
          test "$(grep -c 'js/local-store-enhancements.js' index.html || true)" -eq 0
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Use cache-safe local product renderer v3 only'
          git push origin main
