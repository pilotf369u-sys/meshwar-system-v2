name: Switch local card renderer to v3
on:
  push:
    branches: [main]
    paths: ['.github/workflows/switch-local-card-v3.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove legacy product renderer and load v3 only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          replacement="""async function loadStoreDetails(storeId){const id=String(storeId||'').trim();if(!id)return;const panel=document.getElementById('localStoreProductsPanel'),grid=document.getElementById('localStoreProductsGrid'),title=document.getElementById('localStoreProductsTitle'),meta=document.getElementById('localStoreProductsMeta');if(panel)panel.style.display='block';if(title)title.textContent='منتجات المتجر';if(meta)meta.textContent='';if(grid)grid.innerHTML='<div class=\"local-empty\">جاري تحميل منتجات المتجر...</div>'}
window.loadStoreDetails=loadStoreDetails;"""
          s,n=re.subn(r"async function loadStoreDetails\(storeId\)\{.*?\}\nwindow\.loadStoreDetails=loadStoreDetails;",replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('legacy loadStoreDetails block not found exactly once')
          s=re.sub(r'\n?<script type="module" src="js/local-store-enhancements\.js[^\"]*"></script>','',s)
          s=re.sub(r'\n?<script type="module" src="js/local-store-card-v2\.js[^\"]*"></script>','',s)
          if 'js/local-store-card-v3.js' not in s:
              s=s.replace('</body>','<script type="module" src="js/local-store-card-v3.js"></script>\n</body>',1)
          p.write_text(s)
          PY
      - name: Validate final product DOM source
        run: |
          grep -F 'js/local-store-card-v3.js' index.html
          ! grep -F 'js/local-store-card-v2.js' index.html
          ! grep -F 'js/local-store-enhancements.js' index.html
          ! grep -F 'localEsc(p.base_price)' index.html
          ! grep -F 'localEsc(price)' index.html
          grep -F "const customerPriceUsd=(p,s)=>{const v=vendorPrice(p);return v===null?null:Math.ceil(v/(1-commissionRate(s)))}" js/local-store-card-v3.js
          grep -F "const customerPriceIqd=(p,s)=>{const usd=customerPriceUsd(p,s);return usd===null?null:Math.ceil(usd*exchangeRate(s))}" js/local-store-card-v3.js
          ! grep -F 'local-v2-usd' js/local-store-card-v3.js
      - name: Commit final switch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Use cache-safe local product renderer v3 only'
          git push origin main
