name: Vendor Order Alignment Safe
on:
  push:
    branches: [vendor-order-alignment-safe]
    paths:
      - '.github/workflows/vendor-order-alignment-safe.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vendor-order-alignment-safe
      - name: Apply vendor order alignment patch
        run: python3 tools/vendor_order_alignment_patch.py
      - name: Validate JavaScript syntax and table structure
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          h=Path('vendor-dashboard.html').read_text(encoding='utf-8')
          blocks=[]
          for m in re.finditer(r'<script(?:\s[^>]*)?>(.*?)</script>',h,re.S|re.I):
              tag=h[m.start():h.find('>',m.start())+1]
              if 'src=' not in tag.lower(): blocks.append(m.group(1))
          Path('/tmp/vendor-inline.js').write_text('\n;\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/vendor-inline.js
          grep -F 'table-layout:fixed' vendor-dashboard.html
          grep -F '<colgroup><col style="width:16%">' vendor-dashboard.html
          grep -F 'text-align:center' vendor-dashboard.html
      - name: Commit tested vendor file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor-dashboard.html
          git diff --cached --quiet || git commit -m 'Align vendor order table columns'
          git push origin vendor-order-alignment-safe
