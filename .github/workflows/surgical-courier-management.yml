name: Surgical courier management update
on:
  push:
    branches: [main]
    paths: ['.github/workflows/surgical-courier-management.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch courier management only
        shell: python
        run: |
          from pathlib import Path

          # ---------------- branch-dashboard.html ----------------
          p=Path('branch-dashboard.html')
          s=p.read_text(encoding='utf-8')
          old='''<div id="courierModal" class="modal"><div class="modal-content"><span class="close" onclick="closeCourierModal()">&times;</span><h3>إدارة مندوبي الفرع</h3><form onsubmit="addCourier(event)" class="toolbar"><input id="courierName" placeholder="اسم المندوب" required><input id="courierPhone" placeholder="الهاتف / اسم الدخول" required><input id="courierPassword" type="password" placeholder="كلمة المرور" required><input id="courierFee" type="number" min="0" step="0.01" placeholder="أجرة التوصيل الافتراضية" required><button class="green">حفظ المندوب</button></form><table><thead><tr><th>المندوب</th><th>الهاتف</th><th>الأجرة الافتراضية</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody id="courierManageBody"></tbody></table></div></div>'''
          new='''<div id="courierModal" class="modal"><div class="modal-content"><span class="close" onclick="closeCourierModal()">&times;</span><h3>إدارة مندوبي الفرع</h3><form onsubmit="addCourier(event)" class="toolbar"><input id="courierEditId" type="hidden"><input id="courierName" placeholder="اسم المندوب" required><input id="courierPhone" placeholder="الهاتف / اسم الدخول" required><input id="courierPassword" type="password" placeholder="كلمة المرور"><input id="courierFee" type="number" min="0" step="0.01" placeholder="أجرة التوصيل الافتراضية" required><select id="courierCurrency" aria-label="عملة أجرة التوصيل"><option value="$">الدولار ($)</option><option value="IQD">الدينار العراقي (IQD)</option><option value="TL">الليرة التركية (TL)</option></select><button id="courierSaveBtn" class="green">حفظ المندوب</button><button id="courierCancelEditBtn" type="button" class="gray" style="display:none" onclick="resetCourierForm()">إلغاء التعديل</button></form><table><thead><tr><th>المندوب</th><th>الهاتف</th><th>الأجرة الافتراضية</th><th>الحالة</th><th>الإجراءات</th></tr></thead><tbody id="courierManageBody"></tbody></table></div></div>'''
          if old not in s: raise SystemExit('branch courier modal anchor not found')
          s=s.replace(old,new,1)

          old="""async function loadCouriers(){const c=await getSb(),bid=cloudId(currentBranch.id),{data,error}=await c.from('couriers').select('*').eq('branch_id',bid).order('name');if(error)throw error;couriers=data||[];bulkCourier.innerHTML='<option value=\"\">اختر مندوباً للإسناد الجماعي</option>';courierManageBody.innerHTML='';couriers.forEach(x=>{const id=cloudId(x.id),enc=encodeURIComponent(id);if(x.is_active!==false)bulkCourier.innerHTML+=`<option value=\"${esc(id)}\">${esc(x.name)}</option>`;courierManageBody.innerHTML+=`<tr><td>${esc(x.name)}</td><td>${esc(x.phone)}</td><td>${money(x.delivery_fee)}</td><td>${x.is_active===false?'معطل':'نشط'}</td><td><button class=\"blue\" onclick=\"toggleCourier(decodeURIComponent('${enc}'))\">${x.is_active===false?'تفعيل':'تعطيل'}</button></td></tr>`});if(!couriers.length)courierManageBody.innerHTML='<tr><td colspan=\"5\">لا يوجد مندوبون.</td></tr>'}"""
          new="""async function loadCouriers(){const c=await getSb(),bid=cloudId(currentBranch.id),{data,error}=await c.from('couriers').select('*').eq('branch_id',bid).order('name');if(error)throw error;couriers=data||[];bulkCourier.innerHTML='<option value=\"\">اختر مندوباً للإسناد الجماعي</option>';courierManageBody.innerHTML='';couriers.forEach(x=>{const id=cloudId(x.id),enc=encodeURIComponent(id),cur=String(x.currency||'$');if(x.is_active!==false)bulkCourier.innerHTML+=`<option value=\"${esc(id)}\">${esc(x.name)}</option>`;courierManageBody.innerHTML+=`<tr><td>${esc(x.name)}</td><td>${esc(x.phone)}</td><td>${money(x.delivery_fee,cur)}</td><td>${x.is_active===false?'معطل':'نشط'}</td><td><button class=\"orange\" onclick=\"editCourier(decodeURIComponent('${enc}'))\">✏️ تعديل</button> <button class=\"blue\" onclick=\"toggleCourier(decodeURIComponent('${enc}'))\">${x.is_active===false?'تفعيل':'تعطيل'}</button> <button class=\"red\" onclick=\"deleteCourier(decodeURIComponent('${enc}'))\">🗑️ حذف</button></td></tr>`});if(!couriers.length)courierManageBody.innerHTML='<tr><td colspan=\"5\">لا يوجد مندوبون.</td></tr>'}"""
          if old not in s: raise SystemExit('branch loadCouriers anchor not found')
          s=s.replace(old,new,1)

          old="""function openCourierModal(){courierModal.style.display='block'}function closeCourierModal(){courierModal.style.display='none'}async function addCourier(e){e.preventDefault();const c=await getSb(),payload={branch_id:cloudId(currentBranch.id),name:courierName.value.trim(),phone:courierPhone.value.trim(),password:courierPassword.value,delivery_fee:Number(courierFee.value||0),is_active:true};if(!payload.name||!payload.phone||!payload.password)return alert('أكمل بيانات المندوب.');const{data:dup,error:de}=await c.from('couriers').select('id').eq('phone',payload.phone).maybeSingle();if(de)return alert(de.message);if(dup)return alert('رقم الهاتف مستخدم لمندوب آخر.');const{error}=await c.from('couriers').insert([payload]);if(error)return alert(error.message);e.target.reset();await Promise.all([loadCouriers(),loadOrders(),loadAccounting()])}async function toggleCourier(id){const x=couriers.find(c=>cloudId(c.id)===cloudId(id));if(!x)return;const c=await getSb(),{error}=await c.from('couriers').update({is_active:x.is_active===false}).eq('id',cloudId(id));if(error)return alert(error.message);await Promise.all([loadCouriers(),loadOrders()])}"""
          new="""function resetCourierForm(){courierEditId.value='';courierName.value='';courierPhone.value='';courierPassword.value='';courierFee.value='';courierCurrency.value='$';courierSaveBtn.textContent='حفظ المندوب';courierCancelEditBtn.style.display='none'}function openCourierModal(){resetCourierForm();courierModal.style.display='block'}function closeCourierModal(){courierModal.style.display='none';resetCourierForm()}function editCourier(id){const x=couriers.find(c=>cloudId(c.id)===cloudId(id));if(!x)return;courierEditId.value=cloudId(x.id);courierName.value=x.name||'';courierPhone.value=x.phone||'';courierPassword.value='';courierFee.value=x.delivery_fee??'';courierCurrency.value=String(x.currency||'$');courierSaveBtn.textContent='حفظ التعديل';courierCancelEditBtn.style.display='inline-block';courierModal.style.display='block';courierName.focus()}async function addCourier(e){e.preventDefault();const c=await getSb(),editId=cloudId(courierEditId.value),payload={branch_id:cloudId(currentBranch.id),name:courierName.value.trim(),phone:courierPhone.value.trim(),delivery_fee:Number(courierFee.value||0),currency:String(courierCurrency.value||'$')};if(courierPassword.value)payload.password=courierPassword.value;if(!payload.name||!payload.phone||(!editId&&!payload.password))return alert('أكمل بيانات المندوب.');let dq=c.from('couriers').select('id').eq('phone',payload.phone);if(editId)dq=dq.neq('id',editId);const{data:dup,error:de}=await dq.maybeSingle();if(de)return alert(de.message);if(dup)return alert('رقم الهاتف مستخدم لمندوب آخر.');let result;if(editId){result=await c.from('couriers').update(payload).eq('id',editId)}else{payload.is_active=true;result=await c.from('couriers').insert([payload])}if(result.error)return alert(result.error.message);resetCourierForm();await Promise.all([loadCouriers(),loadOrders(),loadAccounting()])}async function toggleCourier(id){const x=couriers.find(c=>cloudId(c.id)===cloudId(id));if(!x)return;const c=await getSb(),{error}=await c.from('couriers').update({is_active:x.is_active===false}).eq('id',cloudId(id));if(error)return alert(error.message);await Promise.all([loadCouriers(),loadOrders()])}async function deleteCourier(id){const x=couriers.find(c=>cloudId(c.id)===cloudId(id));if(!x||!confirm(`حذف المندوب ${x.name||''}؟ إذا كانت لديه شحنات سابقة سيتم تعطيل الحساب بدلاً من حذف السجل.`))return;const c=await getSb(),cid=cloudId(id);const{data:linked,error:le}=await c.from('orders').select('id').eq('courier_id',cid).limit(1);if(le)return alert(le.message);if(linked&&linked.length){const{error}=await c.from('couriers').update({is_active:false}).eq('id',cid);if(error)return alert(error.message);alert('للمندوب شحنات مرتبطة، لذلك تم تعطيل الحساب مع الحفاظ على السجل السابق.')}else{const{error}=await c.from('couriers').delete().eq('id',cid);if(error)return alert(error.message)}resetCourierForm();await Promise.all([loadCouriers(),loadOrders(),loadAccounting()])}"""
          if old not in s: raise SystemExit('branch courier CRUD anchor not found')
          s=s.replace(old,new,1)
          old="Object.assign(window,{scheduleSearch,handleSearchKeydown,resetPage,changePageSize,goPage,toggleAll,markRow,saveOrder,bulkAssign,openCourierModal,closeCourierModal,addCourier,toggleCourier,openAccountModal"
          new="Object.assign(window,{scheduleSearch,handleSearchKeydown,resetPage,changePageSize,goPage,toggleAll,markRow,saveOrder,bulkAssign,openCourierModal,closeCourierModal,resetCourierForm,editCourier,addCourier,toggleCourier,deleteCourier,openAccountModal"
          if old not in s: raise SystemExit('branch window export anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # ---------------- admin-dashboard.html ----------------
          p=Path('admin-dashboard.html')
          s=p.read_text(encoding='utf-8')
          old='''<div class="card" id="delivery"><h3>إدارة المندوبين — Supabase</h3><input id="delName" placeholder="اسم المندوب"><input id="delPhone" placeholder="الهاتف"><input id="delPass" type="password" placeholder="كلمة المرور"><button class="btn-green" onclick="addDelivery()">+ إضافة</button><div class="table-wrap"><table><thead><tr><th>الاسم</th><th>الهاتف</th><th>الإجراء</th></tr></thead><tbody id="delTableBody"></tbody></table></div></div>'''
          new='''<div class="card" id="delivery"><h3>إدارة المندوبين — Supabase</h3><input id="delEditId" type="hidden"><select id="delBranch"><option value="">اختر الفرع</option></select><input id="delName" placeholder="اسم المندوب"><input id="delPhone" placeholder="الهاتف"><input id="delPass" type="password" placeholder="كلمة المرور"><input id="delFee" type="number" min="0" step="0.01" placeholder="أجرة التوصيل الافتراضية"><select id="delCurrency"><option value="$">الدولار ($)</option><option value="IQD">الدينار العراقي (IQD)</option><option value="TL">الليرة التركية (TL)</option></select><button id="delSaveBtn" class="btn-green" onclick="addDelivery()">+ إضافة</button><button id="delCancelEditBtn" class="btn-dark" style="display:none" onclick="resetDeliveryForm()">إلغاء التعديل</button><div class="table-wrap"><table><thead><tr><th>الفرع</th><th>الاسم</th><th>الهاتف</th><th>الأجرة الافتراضية</th><th>الحالة</th><th>الإجراءات</th></tr></thead><tbody id="delTableBody"></tbody></table></div></div>'''
          if old not in s: raise SystemExit('admin delivery card anchor not found')
          s=s.replace(old,new,1)

          old="""async function loadDelivery(){const b=delTableBody,sb=await ensureCustomerSupabase(),{data,error}=await sb.from('agents').select('*').order('id',{ascending:true}).limit(1000);if(error){b.innerHTML=`<tr><td colspan=\"3\" class=\"mini\">تعذر تحميل agents: ${esc(error.message)}</td></tr>`;return}b.innerHTML=(data||[]).map(a=>`<tr><td>${esc(a.name)}</td><td>${esc(a.phone)}</td><td><button class=\"btn-red\" onclick=\"deleteDelivery('${encodeURIComponent(String(a.id))}')\">حذف</button></td></tr>`).join('')||'<tr><td colspan=\"3\">لا يوجد مندوبون</td></tr>'}async function addDelivery(){const sb=await ensureCustomerSupabase(),{error}=await sb.from('agents').insert([{name:delName.value.trim(),phone:delPhone.value.trim(),password:delPass.value}]);if(error)return alert(error.message);delName.value=delPhone.value=delPass.value='';loadDelivery()}async function deleteDelivery(id){const sb=await ensureCustomerSupabase();await sb.from('agents').delete().eq('id',decodeURIComponent(id));loadDelivery()}"""
          new="""function adminCourierBranchName(id){const b=adminBranches.find(x=>String(x.id)===String(id));return b?.name||b?.branch_name||b?.code||b?.branch_code||id||'---'}function refreshDeliveryBranchOptions(){const el=document.getElementById('delBranch');if(!el)return;const cur=String(el.value||'');el.innerHTML='<option value=\"\">اختر الفرع</option>'+adminBranches.map(b=>`<option value=\"${esc(String(b.id))}\">${esc(b.name||b.branch_name||b.code||b.id)}</option>`).join('');if(cur&&adminBranches.some(b=>String(b.id)===cur))el.value=cur}function resetDeliveryForm(){delEditId.value='';delBranch.value='';delName.value='';delPhone.value='';delPass.value='';delFee.value='';delCurrency.value='$';delSaveBtn.textContent='+ إضافة';delCancelEditBtn.style.display='none'}async function loadDelivery(){const b=delTableBody,sb=await ensureCustomerSupabase();refreshDeliveryBranchOptions();const{data,error}=await sb.from('couriers').select('*').order('name',{ascending:true}).limit(2000);if(error){b.innerHTML=`<tr><td colspan=\"6\" class=\"mini\">تعذر تحميل couriers: ${esc(error.message)}</td></tr>`;return}adminCouriersForOrders=data||[];b.innerHTML=(data||[]).map(a=>{const id=encodeURIComponent(String(a.id)),cur=String(a.currency||'$');return `<tr><td>${esc(adminCourierBranchName(a.branch_id))}</td><td>${esc(a.name)}</td><td>${esc(a.phone)}</td><td>${Number(a.delivery_fee||0).toFixed(2)} ${esc(cur)}</td><td>${a.is_active===false?'معطل':'نشط'}</td><td><button class=\"btn-orange\" onclick=\"editDelivery('${id}')\">✏️ تعديل</button> <button class=\"btn-blue\" onclick=\"toggleDelivery('${id}')\">${a.is_active===false?'تفعيل':'تعطيل'}</button> <button class=\"btn-red\" onclick=\"deleteDelivery('${id}')\">🗑️ حذف</button></td></tr>`}).join('')||'<tr><td colspan=\"6\">لا يوجد مندوبون</td></tr>'}function editDelivery(encodedId){const id=decodeURIComponent(encodedId),a=adminCouriersForOrders.find(x=>String(x.id)===String(id));if(!a)return;delEditId.value=String(a.id);delBranch.value=String(a.branch_id||'');delName.value=a.name||'';delPhone.value=a.phone||'';delPass.value='';delFee.value=a.delivery_fee??'';delCurrency.value=String(a.currency||'$');delSaveBtn.textContent='حفظ التعديل';delCancelEditBtn.style.display='inline-block';delName.focus()}async function addDelivery(){const sb=await ensureCustomerSupabase(),editId=String(delEditId.value||'').trim(),payload={branch_id:String(delBranch.value||'').trim(),name:delName.value.trim(),phone:delPhone.value.trim(),delivery_fee:Number(delFee.value||0),currency:String(delCurrency.value||'$')};if(delPass.value)payload.password=delPass.value;if(!payload.branch_id||!payload.name||!payload.phone||(!editId&&!payload.password))return alert('أكمل الفرع والاسم والهاتف وكلمة المرور للمندوب الجديد.');let dq=sb.from('couriers').select('id').eq('phone',payload.phone);if(editId)dq=dq.neq('id',editId);const{data:dup,error:de}=await dq.maybeSingle();if(de)return alert(de.message);if(dup)return alert('رقم الهاتف مستخدم لمندوب آخر.');let result;if(editId){result=await sb.from('couriers').update(payload).eq('id',editId)}else{payload.is_active=true;result=await sb.from('couriers').insert([payload])}if(result.error)return alert(result.error.message);resetDeliveryForm();await Promise.all([loadDelivery(),loadAdminCouriersForOrders()])}async function toggleDelivery(encodedId){const id=decodeURIComponent(encodedId),a=adminCouriersForOrders.find(x=>String(x.id)===String(id));if(!a)return;const sb=await ensureCustomerSupabase(),{error}=await sb.from('couriers').update({is_active:a.is_active===false}).eq('id',id);if(error)return alert(error.message);await Promise.all([loadDelivery(),loadAdminCouriersForOrders()])}async function deleteDelivery(encodedId){const id=decodeURIComponent(encodedId),a=adminCouriersForOrders.find(x=>String(x.id)===String(id));if(!a||!confirm(`حذف المندوب ${a.name||''}؟ إذا كانت لديه شحنات سابقة سيتم تعطيل الحساب بدلاً من حذف السجل.`))return;const sb=await ensureCustomerSupabase(),{data:linked,error:le}=await sb.from('orders').select('id').eq('courier_id',id).limit(1);if(le)return alert(le.message);if(linked&&linked.length){const{error}=await sb.from('couriers').update({is_active:false}).eq('id',id);if(error)return alert(error.message);alert('للمندوب شحنات مرتبطة، لذلك تم تعطيل الحساب مع الحفاظ على الشحنات السابقة.')}else{const{error}=await sb.from('couriers').delete().eq('id',id);if(error)return alert(error.message)}resetDeliveryForm();await Promise.all([loadDelivery(),loadAdminCouriersForOrders()])}"""
          if old not in s: raise SystemExit('admin delivery CRUD anchor not found')
          s=s.replace(old,new,1)
          old="Object.assign(window,{initAdminDashboard,showSection,switchAdminPipeline,scheduleOrderSearch,handleOrderSearchKeydown,changeOrderPage,goOrderPage,changeOrderPageSize,adminBranchFilterChanged,saveAdminOrderRow,printAdminOrderBarcode,exportAdminBranchCsv,printAdminBranchReport,openOrderDetailsModalData,closeOrderDetailsModal,changeAdminReward,loadEmployees,addEmployee,deleteEmp,scheduleCustomerSearch,resetCustomerPageAndLoad,changeCustomerPage,goCustomerPage,changeCustomerPageSize,saveCustomerData,editCustomer,deleteCustomer,resetCustomerForm,loginAsCloudCustomer,addDelivery,deleteDelivery,addCurrency"
          new="Object.assign(window,{initAdminDashboard,showSection,switchAdminPipeline,scheduleOrderSearch,handleOrderSearchKeydown,changeOrderPage,goOrderPage,changeOrderPageSize,adminBranchFilterChanged,saveAdminOrderRow,printAdminOrderBarcode,exportAdminBranchCsv,printAdminBranchReport,openOrderDetailsModalData,closeOrderDetailsModal,changeAdminReward,loadEmployees,addEmployee,deleteEmp,scheduleCustomerSearch,resetCustomerPageAndLoad,changeCustomerPage,goCustomerPage,changeCustomerPageSize,saveCustomerData,editCustomer,deleteCustomer,resetCustomerForm,loginAsCloudCustomer,resetDeliveryForm,addDelivery,editDelivery,toggleDelivery,deleteDelivery,addCurrency"
          if old not in s: raise SystemExit('admin window export anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "OpenAI"
          git config user.email "openai@users.noreply.github.com"
          git add branch-dashboard.html admin-dashboard.html
          git diff --cached --check
          git commit -m "Add courier currency and management actions"
          git push origin main
