name: Direct Product Link V31
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/direct-product-link-v31.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python3 scripts/direct_product_v31_patch.py
      - name: Verify syntax and markers
        run: |
          cp js/local-store-card-v3.js /tmp/local-store-card-v3.mjs
          node --check /tmp/local-store-card-v3.mjs
          grep -q "DIRECT_PRODUCT_SCROLL_V31" js/local-store-card-v3.js
          grep -q "productId=" admin-dashboard.html
          grep -q "productId=" employee-dashboard.html
          grep -q "20260829-direct-v31b" index.html
      - name: Commit
        run: |
          rm -f .github/workflows/direct-product-link-v31.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: canonical direct product URL and exact storefront focus V31'
          git push origin main
