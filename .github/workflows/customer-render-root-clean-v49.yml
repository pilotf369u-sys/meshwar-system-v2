name: Customer Render Root Clean V49
on:
  push:
    branches: [main]
    paths:
      - 'scripts/customer-render-root-clean-v49.py'
      - '.github/workflows/customer-render-root-clean-v49.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/customer-render-root-clean-v49.py
      - name: Verify canonical customer render
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('dashboard.html').read_text(encoding='utf-8')
          assert 'CUSTOMER_RENDER_ROOT_CLEAN_V49' in s
          assert 'enforceCustomerActiveOrderTemplate' not in s
          assert 'يشمل سعر السلعة' not in s
          assert 'سعر السلعة + الشحن الخارجي' not in s
          assert s.count('<th>المجموع الكلي النهائي</th>') == 1
          print('customer render V49 invariants OK')
          PY
      - name: Commit production patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: remove legacy customer money rerender paths V49'
          git push
