name: KINTO Deals G21B vendor stock gate
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261006_kinto_deals_v1_g21b_vendor_stock_gate.sql'
      - 'ci/kinto-deals-g21b-vendor-stock-gate.test.mjs'
      - '.github/workflows/kinto-deals-g21b-vendor-stock-gate.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test ci/kinto-deals-g21b-vendor-stock-gate.test.mjs
