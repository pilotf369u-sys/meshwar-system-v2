name: Compact index showcase
on:
  push:
    branches: [main]
    paths: ['.github/workflows/compact-index-showcase.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python .github/scripts/compact_index_showcase.py
      - run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/scripts/compact_index_showcase.py .github/workflows/compact-index-showcase.yml
          git add -A -- index.html .github/scripts/compact_index_showcase.py .github/workflows/compact-index-showcase.yml
          git diff --cached --check
          git commit -m "Compact store grids and add video showcase"
          git push origin main
