name: Fix courier save currency payload
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-courier-save-currency.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove unsupported couriers.currency writes only
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              'branch-dashboard.html': (",currency:String(courierCurrency.value||'$')", ""),
              'admin-dashboard.html': (",currency:String(delCurrency.value||'$')", ""),
          }

          for filename, (old, new) in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{filename}: expected exactly one unsupported currency payload field, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          Path('.github/workflows/fix-courier-save-currency.yml').unlink()
      - name: Validate surgical scope
        shell: bash
        run: |
          git diff -- branch-dashboard.html admin-dashboard.html
          test "$(git diff --name-only | sort | tr '\n' ' ')" = ".github/workflows/fix-courier-save-currency.yml admin-dashboard.html branch-dashboard.html "
          ! grep -F "currency:String(courierCurrency.value||'$')" branch-dashboard.html
          ! grep -F "currency:String(delCurrency.value||'$')" admin-dashboard.html
      - name: Commit directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add branch-dashboard.html admin-dashboard.html .github/workflows/fix-courier-save-currency.yml
          git commit -m "Fix courier save currency schema error"
          git push origin main
