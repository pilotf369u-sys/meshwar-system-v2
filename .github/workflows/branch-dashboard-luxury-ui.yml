name: Branch dashboard luxury UI
on:
  push:
    branches:
      - agent/branch-dashboard-luxury-ui
    paths:
      - .github/workflows/branch-dashboard-luxury-ui.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/branch-dashboard-luxury-ui
      - name: Apply UI patch
        run: python3 tools/patch_branch_dashboard_luxury.py
      - name: Validate HTML markers
        run: |
          grep -F 'BRANCH_LUXURY_UI_V1' branch-dashboard.html
          grep -F 'branchStatTotal' branch-dashboard.html
          grep -F 'branchQuickCourier' branch-dashboard.html
          grep -F 'tailwindcss.com' branch-dashboard.html
      - name: Validate added JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, sys
          text=Path('branch-dashboard.html').read_text(encoding='utf-8')
          m=re.search(r'<script>\s*/\* BRANCH_LUXURY_UI_HELPERS_V1.*?</script>',text,flags=re.S)
          if not m:
              raise SystemExit('luxury helper script not found')
          code=re.sub(r'^<script>|</script>$','',m.group(0)).strip()
          with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
              f.write(code); name=f.name
          r=subprocess.run(['node','--check',name],capture_output=True,text=True)
          if r.returncode:
              print(r.stderr)
              sys.exit(r.returncode)
          print('Luxury helper JavaScript syntax OK')
          PY
      - name: Commit UI update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add branch-dashboard.html
          git commit -m 'Redesign branch dashboard with luxury glass UI'
          git push origin agent/branch-dashboard-luxury-ui
