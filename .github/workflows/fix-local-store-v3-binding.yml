name: Fix local store V3 binding
on:
  push:
    branches: [main]
    paths: [.github/workflows/fix-local-store-v3-binding.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch explicit V3 binding
        run: |
          python3 - <<'PY'
          from pathlib import Path

          js=Path('js/local-store-card-v3.js')
          s=js.read_text(encoding='utf-8')
          marker="async function renderStoreProductsV3(storeIdOverride){"
          if marker not in s:
              raise SystemExit('renderStoreProductsV3 not found')
          export="window.loadLocalStoreProductsV3=renderStoreProductsV3;"
          if export not in s:
              needle="const originalLoadStoreDetails=window.loadStoreDetails;"
              if needle not in s: raise SystemExit('V3 hook location not found')
              s=s.replace(needle, export+'\n'+needle, 1)
          js.write_text(s,encoding='utf-8')

          p=Path('index.html')
          h=p.read_text(encoding='utf-8')
          old="await loadStoreDetails(id);panel?.scrollIntoView({behavior:'smooth',block:'start'});return"
          new="await loadStoreDetails(id);if(typeof window.loadLocalStoreProductsV3==='function'){await window.loadLocalStoreProductsV3(id)}else{console.error('Local Store V3 loader is not available for store:',id);if(document.getElementById('localStoreProductsGrid'))document.getElementById('localStoreProductsGrid').innerHTML='<div class=\\\"local-v3-debug-error\\\">تعذر تشغيل محمل منتجات المتجر V3. يرجى تحديث الصفحة.</div>'}panel?.scrollIntoView({behavior:'smooth',block:'start'});return"
          if old not in h:
              raise SystemExit('openStore call site not found')
          h=h.replace(old,new,1)
          import re
          h,n=re.subn(r'src="js/local-store-card-v3\.js(?:\?v=[^"]*)?"','src="js/local-store-card-v3.js?v=v3-binding-072cf86"',h,count=1)
          if n != 1: raise SystemExit('V3 script include not found')
          p.write_text(h,encoding='utf-8')
          PY
      - name: Verify
        run: |
          node --check js/local-store-card-v3.js
          grep -F 'window.loadLocalStoreProductsV3=renderStoreProductsV3;' js/local-store-card-v3.js
          grep -F "typeof window.loadLocalStoreProductsV3==='function'" index.html
          grep -F 'js/local-store-card-v3.js?v=v3-binding-072cf86' index.html
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js/local-store-card-v3.js
          git diff --cached --quiet || git commit -m 'Fix explicit local store V3 product loader binding'
          git push origin main
