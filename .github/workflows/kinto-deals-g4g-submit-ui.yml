name: KINTO Deals G4G submit UI
on:
  pull_request:
    paths:
      - 'vendor-dashboard-v2.html'
      - 'js/vendor-kinto-deals-g4c-draft.js'
      - 'ci/kinto-deals-g4g-submit-ui.test.mjs'
      - '.github/workflows/kinto-deals-g4g-submit-ui.yml'
  workflow_dispatch:
jobs:
  g4g-submit-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check js/vendor-kinto-deals-g4c-draft.js
      - run: node --test ci/kinto-deals-g4g-submit-ui.test.mjs
