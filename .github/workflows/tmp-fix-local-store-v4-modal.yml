name: Temporary V4 Modal Integration Patch
on:
  push:
    branches: [fix/local-store-v4-modal-integration]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/local-store-v4-modal-integration
          fetch-depth: 0
      - name: Apply cache-safe integration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<script src="js/local-store-pricing.js?v=iqd-thousand-v1"></script>\n<script type="module" src="js/local-store-card-v3.js?v=governorate-fix-v1"></script>'
          new='<script src="js/local-store-pricing.js?v=local-modal-v4-2"></script>\n<script type="module" src="js/local-store-card-v3.js?v=local-modal-v4-2"></script>\n<script src="js/local-store-product-details-v4.js?v=local-modal-v4-2" data-mw-product-details-v4></script>'
          if old not in s:
              raise SystemExit('Expected index script block not found')
          p.write_text(s.replace(old,new,1))

          p=Path('js/local-store-pricing.js')
          s=p.read_text()
          old="s.src='js/local-store-product-details-v4.js?v=1';"
          new="s.src='js/local-store-product-details-v4.js?v=local-modal-v4-2';"
          if old not in s:
              raise SystemExit('Expected V4 loader URL not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check js/local-store-pricing.js
          node --check js/local-store-product-details-v4.js
          git diff --check
          grep -F 'local-store-product-details-v4.js?v=local-modal-v4-2' index.html
          grep -F "s.src='js/local-store-product-details-v4.js?v=local-modal-v4-2';" js/local-store-pricing.js
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-fix-local-store-v4-modal.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js/local-store-pricing.js .github/workflows/tmp-fix-local-store-v4-modal.yml
          git commit -m 'fix: load local store v4 modal cache-safely'
          git push origin HEAD:fix/local-store-v4-modal-integration