name: Delivery integration finalize
on:
  push:
    branches: [main]
    paths: ['.github/workflows/delivery-finalize.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply final delivery patches
        run: python .github/temp-delivery-final.py
      - name: Commit final delivery integration
        run: |
          git config user.name "meshwar-delivery-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/temp-delivery-final.py .github/workflows/delivery-finalize.yml
          git add delivery-dashboard.html branch-dashboard.html
          git commit -m "Finalize delivery dashboard statuses ratings and branch reports link"
          git push origin main
