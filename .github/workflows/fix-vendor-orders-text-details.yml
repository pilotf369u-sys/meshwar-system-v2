name: Fix Vendor Orders Text Details
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-vendor-orders-text-details.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python3 tools/fix_vendor_orders_text_details.py
      - name: Verify
        run: |
          grep -F "limit(500)" vendor-dashboard.html
          grep -F "normalizeOrderDetails(o?.details)" vendor-dashboard.html
          if grep -F ".contains('details'" vendor-dashboard.html; then echo 'Old details contains filter remains' && exit 1; fi
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor-dashboard.html
          git diff --cached --quiet || git commit -m 'Fix vendor orders filtering for text details'
          git push origin main
