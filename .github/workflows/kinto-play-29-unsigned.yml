name: KINTO Play 29 unsigned AAB candidate
on:
  push:
    branches: [fix/play-whatsapp-direct-open-and-shop-support-20261030]
    paths: ['mobile/hybrid/android/**', '.github/workflows/kinto-play-29-unsigned.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unsigned-aab:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Verify isolated Android contracts
        run: python3 mobile/hybrid/android/checks/support-update-contract.py
      - name: Build unsigned Play update AAB version 29
        working-directory: mobile/hybrid/android
        run: gradle --no-daemon :app:bundleRelease -PkintoProduction=true -PkintoProductionApplicationId=com.kinto.app -PkintoProductionVersionCode=29 -PkintoUnsignedRelease=true
      - name: Verify generated unsigned AAB
        run: |
          test -s mobile/hybrid/android/app/build/outputs/bundle/release/app-release.aab
          if unzip -Z1 mobile/hybrid/android/app/build/outputs/bundle/release/app-release.aab | grep -Eq '^META-INF/[^/]+[.](RSA|DSA|EC)$'; then
            echo 'Unexpected signing certificate'; exit 1
          fi
          sha256sum mobile/hybrid/android/app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: KINTO-Play-29-UNSIGNED-AAB
          path: mobile/hybrid/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
          if-no-files-found: error
# Never publish or sign in GitHub.
