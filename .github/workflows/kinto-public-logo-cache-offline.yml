name: KINTO Public Logo Cache Offline
on:
  pull_request:
    paths:
      - 'js/kinto-shared-tab-brand-v1.js'
      - 'tests/public-tab-logo-settings-cache.test.cjs'
      - '.github/workflows/kinto-public-logo-cache-offline.yml'
  push:
    branches:
      - 'fix/kinto-public-tab-logo-rpc-cache-20261105'
permissions:
  contents: read
jobs:
  offline-public-logo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate public logo cache without network
        run: |
          node --check js/kinto-shared-tab-brand-v1.js
          node --test tests/public-tab-logo-settings-cache.test.cjs
