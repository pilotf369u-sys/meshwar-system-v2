name: Admin local stores hotfix verification
on:
  push:
    branches: [hotfix/admin-local-stores-query]
    paths: ['.github/workflows/admin-local-stores-hotfix.yml']
permissions:
  contents: write
jobs:
  patch-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/admin-local-stores-query
          fetch-depth: 2
      - name: Patch loadStoresAdmin only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin-dashboard.html')
          s=p.read_text(encoding='utf-8')
          old="async function loadStoresAdmin(){const sb=await ensureCustomerSupabase(),{data,error}=await sb.from('stores').select('*').order('id',{ascending:true}).limit(1000);if(error){storesTableBody.innerHTML=`<tr><td colspan=\"4\" class=\"mini\">تعذر تحميل stores: ${esc(error.message)}</td></tr>`;return}storesTableBody.innerHTML=(data||[]).map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.category)}</td><td>${esc(s.url)}</td><td><button class=\"btn-red\" onclick=\"deleteStore('${encodeURIComponent(String(s.id))}')\">حذف</button></td></tr>`).join('')}"
          new="async function loadStoresAdmin(){const sb=await ensureCustomerSupabase(),{data,error}=await sb.from('local_stores').select('*').order('id',{ascending:true}).limit(1000);if(error){storesTableBody.innerHTML=`<tr><td colspan=\"4\" class=\"mini\">تعذر تحميل local_stores: ${esc(error.message)}</td></tr>`;return}storesTableBody.innerHTML=(data||[]).map(s=>`<tr><td>${esc(s.store_name||s.name||'')}</td><td>${esc([s.store_type,s.specialty].filter(Boolean).join(' / ')||s.category||'')}</td><td>${esc(s.store_url||s.url||'')}</td><td><button class=\"btn-red\" onclick=\"deleteStore('${encodeURIComponent(String(s.id))}')\">حذف</button></td></tr>`).join('')}"
          if old not in s:
              raise SystemExit('loadStoresAdmin marker not found; aborting')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify syntax and scope
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html=Path('admin-dashboard.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html,re.I)
          for i,src in enumerate(scripts):
              if not src.strip(): continue
              with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
                  f.write(src); name=f.name
              r=subprocess.run(['node','--check',name],capture_output=True,text=True)
              if r.returncode: raise SystemExit(f'inline script {i} failed\n{r.stderr}')
          assert "sb.from('local_stores').select('*').order('id'" in html
          assert "async function loadStoresAdmin()" in html
          print('syntax and local_stores load verified')
          PY
          git diff --check
          git diff -- admin-dashboard.html
      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-dashboard.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix admin stores load to use local_stores'
          git push origin HEAD:hotfix/admin-local-stores-query
