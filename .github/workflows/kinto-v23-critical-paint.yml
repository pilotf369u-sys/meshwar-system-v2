name: KINTO V23 Critical Paint
on:
  push:
    branches: [main]
    paths: ['.github/workflows/kinto-v23-critical-paint.yml']
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inject blocking emerald critical CSS and anti-FOUC gate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          anchor='    <title>منصة KINTO - دليل المتاجر والشحن الدولي</title>\n'
          block='''    <title>منصة KINTO - دليل المتاجر والشحن الدولي</title>\n    <style id="kintoCriticalPaintV23">\n      html,body{min-height:100%;margin:0!important;background:#032b25!important;background-image:linear-gradient(180deg,#063b32 0%,#04362e 46%,#032b25 100%)!important;color:#f7fbfa!important;}\n      html.kinto-booting body>*{opacity:0!important;visibility:hidden!important;}\n      html.kinto-ready body>*{visibility:visible!important;opacity:1!important;transition:opacity .22s ease-out!important;}\n      html.kinto-ready,html.kinto-ready body{background:#032b25!important;background-image:linear-gradient(180deg,#063b32 0%,#04362e 46%,#032b25 100%)!important;}\n      @media (prefers-reduced-motion:reduce){html.kinto-ready body>*{transition:none!important;}}\n    </style>\n    <script>document.documentElement.classList.add('kinto-booting');window.__kintoPaintFailsafe=setTimeout(()=>{const r=document.documentElement;r.classList.remove('kinto-booting');r.classList.add('kinto-ready')},2500);</script>\n'''
          assert anchor in s
          s=s.replace(anchor,block,1)
          old='js/index-featured-campaigns-v1.js?v=20260828-v21-kinto'
          new='js/index-featured-campaigns-v1.js?v=20260828-v23-kinto'
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)
          Path('.github/workflows/kinto-v23-critical-paint.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/kinto-v23-critical-paint.yml
          git commit -m 'perf: activate V23 critical emerald paint and anti-FOUC'
          git push
