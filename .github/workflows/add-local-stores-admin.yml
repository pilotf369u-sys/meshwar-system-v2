name: Add local stores admin integration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-local-stores-admin.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Patch admin dashboard and index
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          admin = Path('admin-dashboard.html')
          s = admin.read_text(encoding='utf-8')

          tailwind_marker = '<script src="https://cdn.tailwindcss.com"></script>'
          if tailwind_marker not in s:
              head_anchor = '<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>'
              if head_anchor not in s:
                  raise SystemExit('Admin head anchor not found')
              tw = '''<script src="https://cdn.tailwindcss.com"></script>\n<script>tailwind.config={important:'#localStoresAdmin',corePlugins:{preflight:false}};</script>\n'''
              s = s.replace(head_anchor, tw + head_anchor, 1)

          sidebar_anchor = '<a onclick="showSection(\'exchange\')">أسعار صرف العملات</a>'
          local_sidebar = '<a onclick="openLocalStoresAdmin()">🏪 إدارة المتاجر المحلية</a>'
          if local_sidebar not in s:
              if sidebar_anchor not in s:
                  raise SystemExit('Sidebar anchor not found')
              s = s.replace(sidebar_anchor, local_sidebar + sidebar_anchor, 1)

          local_section = r'''
<div class="card" id="local-stores">
  <section id="localStoresAdmin" class="min-h-[70vh] rounded-2xl border border-white/10 bg-slate-900 p-4 text-slate-100 shadow-2xl md:p-6" dir="rtl">
    <div class="mb-6 flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
      <div>
        <div class="mb-2 inline-flex items-center gap-2 rounded-full border border-cyan-400/20 bg-cyan-400/10 px-3 py-1 text-xs font-bold text-cyan-200">🏪 Local Stores Control Center</div>
        <h2 class="m-0 text-2xl font-black text-white md:text-3xl">إدارة المتاجر المحلية</h2>
        <p class="mt-2 text-sm text-slate-400">إدارة الحسابات والعمولات والحالة ومتابعة صافي الحسابات دون التأثير على دورة الطلبات الحالية.</p>
      </div>
      <button type="button" onclick="openLocalStoreModal()" class="rounded-xl border border-emerald-300/20 bg-emerald-500 px-5 py-3 text-sm font-black text-white shadow-lg shadow-emerald-950/30 transition hover:-translate-y-0.5 hover:bg-emerald-400">+ تسجيل متجر محلي</button>
    </div>

    <div id="localStoresNotice" class="mb-4 hidden rounded-xl border px-4 py-3 text-sm font-bold"></div>

    <div class="mb-6 grid grid-cols-1 gap-3 sm:grid-cols-2 xl:grid-cols-4">
      <article class="rounded-2xl border border-white/10 bg-white/5 p-4 backdrop-blur-xl transition hover:border-cyan-400/30 hover:bg-white/10">
        <div class="text-xs font-bold text-slate-400">إجمالي المتاجر النشطة</div><div id="localStatActiveStores" class="mt-2 text-3xl font-black text-cyan-300">0</div>
      </article>
      <article class="rounded-2xl border border-white/10 bg-white/5 p-4 backdrop-blur-xl transition hover:border-emerald-400/30 hover:bg-white/10">
        <div class="text-xs font-bold text-slate-400">إجمالي المبيعات المحلية</div><div id="localStatSales" class="mt-2 text-lg font-black text-emerald-300">—</div>
      </article>
      <article class="rounded-2xl border border-white/10 bg-white/5 p-4 backdrop-blur-xl transition hover:border-violet-400/30 hover:bg-white/10">
        <div class="text-xs font-bold text-slate-400">أرباح السيستم / العمولة</div><div id="localStatCommission" class="mt-2 text-lg font-black text-violet-300">—</div>
      </article>
      <article class="rounded-2xl border border-white/10 bg-white/5 p-4 backdrop-blur-xl transition hover:border-rose-400/30 hover:bg-white/10">
        <div class="text-xs font-bold text-slate-400">المرتجعات / الغرامات</div><div id="localStatReturns" class="mt-2 text-lg font-black text-rose-300">—</div>
      </article>
    </div>

    <div class="mb-6 rounded-2xl border border-white/10 bg-white/5 p-4 backdrop-blur-xl">
      <div class="mb-4 flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
        <div><h3 class="m-0 text-lg font-black text-white">قائمة المتاجر</h3><p class="mt-1 text-xs text-slate-400">التعديل، تغيير الحالة، والتقرير المالي لكل متجر.</p></div>
        <div class="flex flex-wrap gap-2">
          <input id="localStoreSearch" oninput="renderLocalStoresTable()" class="min-w-[220px] rounded-xl border border-white/10 bg-slate-950/60 px-3 py-2 text-sm text-white outline-none placeholder:text-slate-500 focus:border-cyan-400/50" placeholder="بحث بالاسم، الهاتف، المحافظة...">
          <button type="button" onclick="loadLocalStoresDashboard()" class="rounded-xl border border-white/10 bg-slate-700 px-4 py-2 text-sm font-bold text-white transition hover:bg-slate-600">↻ تحديث</button>
        </div>
      </div>
      <div class="overflow-x-auto rounded-xl border border-white/10">
        <table class="!min-w-[1050px] !bg-transparent text-sm">
          <thead><tr class="!bg-slate-800"><th>الشعار</th><th>المتجر</th><th>النوع / التخصص</th><th>الموقع</th><th>الهاتف</th><th>العمولة</th><th>الحالة</th><th>الإجراءات</th></tr></thead>
          <tbody id="localStoresTableBody"><tr><td colspan="8" class="!border-white/10 !text-slate-400">جاري التحميل...</td></tr></tbody>
        </table>
      </div>
    </div>

    <div class="rounded-2xl border border-white/10 bg-white/5 p-4 backdrop-blur-xl">
      <div class="mb-4"><h3 class="m-0 text-lg font-black text-white">التقرير المالي الشامل للمتاجر</h3><p class="mt-1 text-xs text-slate-400">المبيعات المكتملة − العمولة − النقل − المصروفات − الغرامات = الصافي لصاحب المتجر. كل عملة تعرض بصورة مستقلة.</p></div>
      <div class="overflow-x-auto rounded-xl border border-white/10">
        <table class="!min-w-[1100px] !bg-transparent text-sm">
          <thead><tr class="!bg-slate-800"><th>المتجر</th><th>العملة</th><th>الطلبات المكتملة</th><th>المبيعات</th><th>العمولة</th><th>النقل</th><th>المصروفات</th><th>الغرامات</th><th>الصافي</th></tr></thead>
          <tbody id="localFinancialTableBody"><tr><td colspan="9" class="!border-white/10 !text-slate-400">جاري التحميل...</td></tr></tbody>
        </table>
      </div>
    </div>

    <div id="localStoreModal" class="fixed inset-0 z-[15000] hidden items-center justify-center bg-slate-950/80 p-4 backdrop-blur-sm">
      <div class="max-h-[92vh] w-full max-w-4xl overflow-y-auto rounded-3xl border border-white/10 bg-slate-900/95 p-5 shadow-2xl md:p-7">
        <div class="mb-5 flex items-center justify-between"><div><h3 id="localStoreModalTitle" class="m-0 text-xl font-black text-white">تسجيل متجر محلي</h3><p class="mt-1 text-xs text-slate-400">حقول كلمة المرور مجهزة للربط اللاحق بـ Supabase Auth ولا يتم حفظ كلمة مرور خام.</p></div><button type="button" onclick="closeLocalStoreModal()" class="rounded-xl bg-rose-500 px-3 py-2 text-white hover:bg-rose-400">×</button></div>
        <input type="hidden" id="localStoreEditId">
        <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
          <label class="text-sm font-bold text-slate-300">اسم المتجر<input id="localStoreName" class="mt-1 w-full rounded-xl border border-white/10 bg-slate-950/60 px-3 py-2 text-white outline-none focus:border-cyan-400/50" placeholder="اسم المتجر"></label>
          <label class="text-sm font-bold text-slate-300">رابط الشعار<input id="localStoreLogo" class="mt-1 w-full rounded-xl border border-white/10 bg-slate-950/60 px-3 py-2 text-white outline-none focus:border-cyan-400/50" placeholder="https://..."></label>
          <label class="text-sm font-bold text-slate-300">الدولة<input id="localStoreCountry" class="mt-1 w-full rounded-xl border border-white/10 bg-slate-950/60 px-3 py-2 text-white outline-none focus:border-cyan-400/50" placeholder="الدولة"></label>
          <label class="text-sm font-bold text-slate-300">المحافظة<input id="localStoreGovernorate" class="mt-1 w-full rounded-xl border border-white/10 bg-slate-950/60 px-3 py-2 text-white outline-none focus:border-cyan-400/50" placeholder="المحافظة"></label>
          <label class="text-sm font-bold text-slate-300">اسم المستخدم<input id="localStoreUsername" class="mt-1 w-full rounded-xl border border-white/10 bg-slate-950/60 px-3 py-2 text-white outline-none focus:border-cyan-400/50" placeholder="username" dir="ltr"></label>
          <label class="text-sm font-bold text-slate-300">رقم الهاتف<input id="localStorePhone" class="mt-1 w-full rounded-xl border border-white/10 bg-slate-950/60 px-3 py-2 text-white outline-none focus:border-cyan-400/50" placeholder="رقم الهاتف" dir="ltr"></label>
          <label class="text-sm font-bold text-slate-300 md:col-span-2">كلمة المرور — تجهيز للربط لاحقاً<input id="localStorePassword" type="password" autocomplete="new-password" class="mt-1 w-full rounded-xl border border-amber-300/20 bg-slate-950/60 px-3 py-2 text-white outline-none focus:border-amber-300/50" placeholder="لن يتم تخزين كلمة مرور خام في local_stores"></label>
          <label class="text-sm font-bold text-slate-300">نوع المتجر<select id="localStoreType" class="mt-1 w-full rounded-xl border border-white/10 bg-slate-950/80 px-3 py-2 text-white"><option>شامل</option><option>نسائي</option><option>رجالي</option><option>أطفال</option><option>منزلية</option><option>أثاث</option><option>إلكترونيات</option><option>مطاعم</option><option>غذائية</option><option>حيوانات</option><option>عدد إنشاءات</option><option>صيانة</option><option>قطع غيار</option><option>سيارات</option></select></label>
          <label class="text-sm font-bold text-slate-300">تخصص المتجر<select id="localStoreSpecialty" class="mt-1 w-full rounded-xl border border-white/10 bg-slate-950/80 px-3 py-2 text-white"><option>شامل</option><option>كوزمتك</option><option>عطور</option><option>إكسسوارات</option><option>ألبسة</option><option>أحذية</option><option>سيارات</option><option>ماطورات</option><option>ألعاب</option></select></label>
          <label class="text-sm font-bold text-slate-300">العملة الافتراضية<select id="localStoreCurrency" class="mt-1 w-full rounded-xl border border-white/10 bg-slate-950/80 px-3 py-2 text-white"><option value="USD">USD - $</option><option value="IQD">IQD</option><option value="TL">TL</option><option value="SYP">SYP</option><option value="EUR">EUR - €</option><option value="SAR">SAR</option><option value="AED">AED</option><option value="JOD">JOD</option></select></label>
          <label class="text-sm font-bold text-slate-300">نسبة العمولة %<input id="localStoreCommission" type="number" min="0" max="100" step="0.01" value="10" class="mt-1 w-full rounded-xl border border-white/10 bg-slate-950/60 px-3 py-2 text-white outline-none focus:border-cyan-400/50"></label>
        </div>
        <div class="mt-6 flex flex-wrap justify-end gap-2"><button type="button" onclick="closeLocalStoreModal()" class="rounded-xl bg-slate-700 px-5 py-2.5 text-sm font-bold text-white hover:bg-slate-600">إلغاء</button><button id="localStoreSaveBtn" type="button" onclick="saveLocalStore()" class="rounded-xl bg-cyan-500 px-5 py-2.5 text-sm font-black text-slate-950 hover:bg-cyan-300">حفظ المتجر</button></div>
      </div>
    </div>

    <div id="localStoreReportModal" class="fixed inset-0 z-[15010] hidden items-center justify-center bg-slate-950/80 p-4 backdrop-blur-sm">
      <div class="max-h-[88vh] w-full max-w-5xl overflow-y-auto rounded-3xl border border-white/10 bg-slate-900/95 p-5 shadow-2xl md:p-7">
        <div class="mb-5 flex items-center justify-between"><h3 id="localStoreReportTitle" class="m-0 text-xl font-black text-white">تقرير حساب المتجر</h3><button type="button" onclick="closeLocalStoreReport()" class="rounded-xl bg-rose-500 px-3 py-2 text-white hover:bg-rose-400">×</button></div>
        <div id="localStoreReportBody"></div>
      </div>
    </div>
  </section>
</div>
'''

          if 'id="localStoresAdmin"' not in s:
              close_anchor = '<div class="card" id="content"><h3>إدارة المحتوى والموقع</h3><p>تعديل نصوص وأقسام الموقع الرئيسية.</p></div></div>\n<div id="orderDetailsModal"'
              if close_anchor not in s:
                  raise SystemExit('Main content close anchor not found')
              replacement = '<div class="card" id="content"><h3>إدارة المحتوى والموقع</h3><p>تعديل نصوص وأقسام الموقع الرئيسية.</p></div>' + local_section + '</div>\n<div id="orderDetailsModal"'
              s = s.replace(close_anchor, replacement, 1)

          local_js = r'''
<script>
/* LOCAL_STORES_ADMIN_V1 */
let localStoresCloud=[];
let localFinancialCloud=[];
let localReturnsCloud=[];
let localStoresLoadedOnce=false;

function localStoresMoneyByCurrency(rows,field){
  const out={};
  (rows||[]).forEach(r=>{const c=String(r.currency||'—');const n=Number(r[field]||0);if(Number.isFinite(n))out[c]=(out[c]||0)+n});
  return out;
}
function localStoresMoneyText(map){
  const parts=Object.entries(map||{}).filter(([,n])=>Math.abs(Number(n)||0)>0).map(([c,n])=>`${Number(n).toLocaleString('en-US',{maximumFractionDigits:2})} ${c}`);
  return parts.length?parts.join(' • '):'0';
}
function localStoreNotice(message,type='error'){
  const el=document.getElementById('localStoresNotice');if(!el)return;
  if(!message){el.classList.add('hidden');el.textContent='';return}
  el.textContent=message;el.classList.remove('hidden','border-rose-400/30','bg-rose-500/10','text-rose-200','border-emerald-400/30','bg-emerald-500/10','text-emerald-200','border-amber-400/30','bg-amber-500/10','text-amber-100');
  if(type==='success')el.classList.add('border-emerald-400/30','bg-emerald-500/10','text-emerald-200');else if(type==='warn')el.classList.add('border-amber-400/30','bg-amber-500/10','text-amber-100');else el.classList.add('border-rose-400/30','bg-rose-500/10','text-rose-200');
}
function localStoreRlsHint(e){const msg=String(e?.message||e||'');return /row.level|policy|permission|42501|security/i.test(msg)?'صلاحيات RLS تمنع الوصول إلى جداول المتاجر المحلية. يلزم إضافة Policies/RPC آمن للأدمن قبل الاستخدام الإنتاجي.':msg}
function openLocalStoresAdmin(){showSection('local-stores');loadLocalStoresDashboard();history.replaceState(null,'',location.pathname+location.search+'#local-stores')}
function openLocalStoreModal(id=''){
  const store=localStoresCloud.find(x=>String(x.id)===String(id));
  document.getElementById('localStoreEditId').value=store?.id||'';
  document.getElementById('localStoreName').value=store?.store_name||'';
  document.getElementById('localStoreLogo').value=store?.logo_url||'';
  document.getElementById('localStoreCountry').value=store?.country||'';
  document.getElementById('localStoreGovernorate').value=store?.governorate||'';
  document.getElementById('localStoreUsername').value=store?.username||'';
  document.getElementById('localStorePhone').value=store?.phone||'';
  document.getElementById('localStorePassword').value='';
  document.getElementById('localStoreType').value=store?.store_type||'شامل';
  document.getElementById('localStoreSpecialty').value=store?.specialty||'شامل';
  document.getElementById('localStoreCurrency').value=store?.default_currency||'USD';
  document.getElementById('localStoreCommission').value=Number(store?.commission_rate??10);
  document.getElementById('localStoreModalTitle').textContent=store?'تعديل بيانات المتجر':'تسجيل متجر محلي';
  const modal=document.getElementById('localStoreModal');modal.classList.remove('hidden');modal.classList.add('flex');
}
function closeLocalStoreModal(){const m=document.getElementById('localStoreModal');m.classList.add('hidden');m.classList.remove('flex')}
function closeLocalStoreReport(){const m=document.getElementById('localStoreReportModal');m.classList.add('hidden');m.classList.remove('flex')}

function localStoreStatusBadge(status){const active=status==='active';return `<span class="inline-flex rounded-full border px-2.5 py-1 text-xs font-black ${active?'border-emerald-400/20 bg-emerald-500/10 text-emerald-300':'border-slate-500/30 bg-slate-700/40 text-slate-300'}">${active?'نشط':'معطل'}</span>`}
function renderLocalStoresTable(){
  const body=document.getElementById('localStoresTableBody');if(!body)return;
  const q=String(document.getElementById('localStoreSearch')?.value||'').trim().toLowerCase();
  const rows=localStoresCloud.filter(s=>!q||[s.store_name,s.username,s.phone,s.governorate,s.country,s.store_type,s.specialty].some(v=>String(v||'').toLowerCase().includes(q)));
  body.innerHTML=rows.map(s=>`<tr class="transition hover:!bg-white/5"><td class="!border-white/10">${s.logo_url?`<img src="${esc(s.logo_url)}" alt="" class="mx-auto h-11 w-11 rounded-xl border border-white/10 object-cover" onerror="this.style.display='none'">`:'<div class="mx-auto flex h-11 w-11 items-center justify-center rounded-xl bg-slate-700 text-xl">🏪</div>'}</td><td class="!border-white/10 !text-white"><b>${esc(s.store_name||'—')}</b><div class="mt-1 text-xs text-slate-500">@${esc(s.username||'—')}</div></td><td class="!border-white/10 !text-slate-300">${esc(s.store_type||'—')}<div class="mt-1 text-xs text-slate-500">${esc(s.specialty||'—')}</div></td><td class="!border-white/10 !text-slate-300">${esc(s.governorate||'—')}<div class="mt-1 text-xs text-slate-500">${esc(s.country||'—')}</div></td><td class="!border-white/10 !text-slate-300" dir="ltr">${esc(s.phone||'—')}</td><td class="!border-white/10 !font-black !text-violet-300">${Number(s.commission_rate||0).toFixed(2)}%</td><td class="!border-white/10">${localStoreStatusBadge(s.status)}</td><td class="!border-white/10"><div class="flex flex-wrap justify-center gap-1.5"><button type="button" onclick="openLocalStoreModal('${esc(s.id)}')" class="rounded-lg bg-cyan-600 px-2.5 py-1.5 text-xs font-bold text-white hover:bg-cyan-500">تعديل</button><button type="button" onclick="toggleLocalStoreStatus('${esc(s.id)}','${esc(s.status)}')" class="rounded-lg ${s.status==='active'?'bg-amber-600 hover:bg-amber-500':'bg-emerald-600 hover:bg-emerald-500'} px-2.5 py-1.5 text-xs font-bold text-white">${s.status==='active'?'تعطيل':'تفعيل'}</button><button type="button" onclick="openLocalStoreReport('${esc(s.id)}')" class="rounded-lg bg-violet-600 px-2.5 py-1.5 text-xs font-bold text-white hover:bg-violet-500">تقرير الحساب</button></div></td></tr>`).join('')||'<tr><td colspan="8" class="!border-white/10 !py-8 !text-slate-500">لا توجد متاجر مطابقة.</td></tr>';
}
function renderLocalFinancialTable(){
  const body=document.getElementById('localFinancialTableBody');if(!body)return;
  body.innerHTML=localFinancialCloud.map(r=>`<tr class="transition hover:!bg-white/5"><td class="!border-white/10 !font-bold !text-white">${esc(r.store_name||'—')}</td><td class="!border-white/10 !text-cyan-300">${esc(r.currency||'—')}</td><td class="!border-white/10 !text-slate-300">${Number(r.completed_orders||0).toLocaleString()}</td><td class="!border-white/10 !text-emerald-300">${Number(r.completed_sales||0).toLocaleString()}</td><td class="!border-white/10 !text-violet-300">${Number(r.total_commission||0).toLocaleString()}</td><td class="!border-white/10 !text-slate-300">${Number(r.total_transport||0).toLocaleString()}</td><td class="!border-white/10 !text-slate-300">${Number(r.total_expenses||0).toLocaleString()}</td><td class="!border-white/10 !text-rose-300">${Number(r.total_return_penalties||0).toLocaleString()}</td><td class="!border-white/10 !font-black !text-amber-300">${Number(r.net_store_amount||0).toLocaleString()}</td></tr>`).join('')||'<tr><td colspan="9" class="!border-white/10 !py-8 !text-slate-500">لا توجد حركة مالية مكتملة حتى الآن.</td></tr>';
}
function renderLocalStoreStats(){
  document.getElementById('localStatActiveStores').textContent=localStoresCloud.filter(s=>s.status==='active').length.toLocaleString();
  document.getElementById('localStatSales').textContent=localStoresMoneyText(localStoresMoneyByCurrency(localFinancialCloud,'completed_sales'));
  document.getElementById('localStatCommission').textContent=localStoresMoneyText(localStoresMoneyByCurrency(localFinancialCloud,'total_commission'));
  const penalties=localStoresMoneyText(localStoresMoneyByCurrency(localFinancialCloud,'total_return_penalties'));
  document.getElementById('localStatReturns').textContent=`${localReturnsCloud.length.toLocaleString()} مرتجع • ${penalties}`;
}
async function loadLocalStoresDashboard(){
  const storeBody=document.getElementById('localStoresTableBody'),finBody=document.getElementById('localFinancialTableBody');
  if(storeBody)storeBody.innerHTML='<tr><td colspan="8" class="!border-white/10 !py-8 !text-slate-400">جاري تحميل المتاجر...</td></tr>';
  if(finBody)finBody.innerHTML='<tr><td colspan="9" class="!border-white/10 !py-8 !text-slate-400">جاري تحميل التقرير...</td></tr>';
  localStoreNotice('');
  try{
    const sb=await ensureCustomerSupabase();
    const [storesRes,financeRes,returnsRes]=await Promise.all([
      sb.from('local_stores').select('*').order('created_at',{ascending:false}),
      sb.from('local_store_financial_summary').select('*').order('store_name',{ascending:true}),
      sb.from('local_returns').select('id,penalty_amount,store_id,order_id').order('created_at',{ascending:false}).limit(10000)
    ]);
    if(storesRes.error)throw storesRes.error;if(financeRes.error)throw financeRes.error;if(returnsRes.error)throw returnsRes.error;
    localStoresCloud=storesRes.data||[];localFinancialCloud=financeRes.data||[];localReturnsCloud=returnsRes.data||[];localStoresLoadedOnce=true;
    renderLocalStoresTable();renderLocalFinancialTable();renderLocalStoreStats();
  }catch(e){console.error('Local stores load error:',e);localStoreNotice(localStoreRlsHint(e));if(storeBody)storeBody.innerHTML='<tr><td colspan="8" class="!border-white/10 !py-8 !text-rose-300">تعذر تحميل المتاجر.</td></tr>';if(finBody)finBody.innerHTML='<tr><td colspan="9" class="!border-white/10 !py-8 !text-rose-300">تعذر تحميل التقرير المالي.</td></tr>'}
}
async function saveLocalStore(){
  const id=document.getElementById('localStoreEditId').value.trim();
  const payload={store_name:document.getElementById('localStoreName').value.trim(),logo_url:document.getElementById('localStoreLogo').value.trim()||null,country:document.getElementById('localStoreCountry').value.trim()||null,governorate:document.getElementById('localStoreGovernorate').value.trim()||null,username:document.getElementById('localStoreUsername').value.trim(),phone:document.getElementById('localStorePhone').value.trim()||null,store_type:document.getElementById('localStoreType').value,specialty:document.getElementById('localStoreSpecialty').value,default_currency:document.getElementById('localStoreCurrency').value,commission_rate:Number(document.getElementById('localStoreCommission').value||10)};
  if(!payload.store_name||!payload.username){localStoreNotice('اسم المتجر واسم المستخدم مطلوبان.');return}
  if(!Number.isFinite(payload.commission_rate)||payload.commission_rate<0||payload.commission_rate>100){localStoreNotice('نسبة العمولة يجب أن تكون بين 0 و100.');return}
  const btn=document.getElementById('localStoreSaveBtn');btn.disabled=true;btn.textContent='جاري الحفظ...';localStoreNotice('');
  try{const sb=await ensureCustomerSupabase();const res=id?await sb.from('local_stores').update(payload).eq('id',id).select('id').single():await sb.from('local_stores').insert({...payload,status:'active'}).select('id').single();if(res.error)throw res.error;closeLocalStoreModal();await loadLocalStoresDashboard();localStoreNotice(id?'تم تحديث بيانات المتجر بنجاح.':'تم تسجيل المتجر بنجاح.','success')}catch(e){console.error('Local store save error:',e);localStoreNotice(localStoreRlsHint(e))}finally{btn.disabled=false;btn.textContent='حفظ المتجر'}
}
async function toggleLocalStoreStatus(id,current){
  const next=current==='active'?'inactive':'active';if(!confirm(`هل تريد ${next==='active'?'تفعيل':'تعطيل'} هذا المتجر؟`))return;
  try{const sb=await ensureCustomerSupabase();const{error}=await sb.from('local_stores').update({status:next}).eq('id',id);if(error)throw error;await loadLocalStoresDashboard();localStoreNotice('تم تحديث حالة المتجر.','success')}catch(e){console.error('Local store status error:',e);localStoreNotice(localStoreRlsHint(e))}
}
function openLocalStoreReport(id){
  const store=localStoresCloud.find(s=>String(s.id)===String(id)),rows=localFinancialCloud.filter(r=>String(r.store_id)===String(id));
  document.getElementById('localStoreReportTitle').textContent=`تقرير حساب: ${store?.store_name||'المتجر'}`;
  document.getElementById('localStoreReportBody').innerHTML=rows.length?`<div class="grid grid-cols-1 gap-3 md:grid-cols-2">${rows.map(r=>`<div class="rounded-2xl border border-white/10 bg-white/5 p-4"><div class="mb-3 text-sm font-black text-cyan-300">العملة: ${esc(r.currency||'—')}</div><div class="grid grid-cols-2 gap-2 text-sm"><span class="text-slate-400">المبيعات</span><b class="text-emerald-300">${Number(r.completed_sales||0).toLocaleString()}</b><span class="text-slate-400">العمولة</span><b class="text-violet-300">${Number(r.total_commission||0).toLocaleString()}</b><span class="text-slate-400">النقل</span><b>${Number(r.total_transport||0).toLocaleString()}</b><span class="text-slate-400">المصروفات</span><b>${Number(r.total_expenses||0).toLocaleString()}</b><span class="text-slate-400">الغرامات</span><b class="text-rose-300">${Number(r.total_return_penalties||0).toLocaleString()}</b><span class="text-slate-300">الصافي</span><b class="text-lg text-amber-300">${Number(r.net_store_amount||0).toLocaleString()}</b></div></div>`).join('')}</div>`:'<div class="rounded-2xl border border-white/10 bg-white/5 p-8 text-center text-slate-400">لا توجد معاملات مالية مكتملة لهذا المتجر حتى الآن.</div>';
  const m=document.getElementById('localStoreReportModal');m.classList.remove('hidden');m.classList.add('flex');
}
window.addEventListener('load',()=>{if(location.hash==='#local-stores')setTimeout(openLocalStoresAdmin,0)});
Object.assign(window,{openLocalStoresAdmin,loadLocalStoresDashboard,renderLocalStoresTable,openLocalStoreModal,closeLocalStoreModal,saveLocalStore,toggleLocalStoreStatus,openLocalStoreReport,closeLocalStoreReport});
</script>
