name: Expand courier currency options
on:
  push:
    branches: [main]
    paths: ['.github/workflows/expand-courier-currencies.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Expand courier currency selects only
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              'branch-dashboard.html': (
                  '<select id="courierCurrency" aria-label="عملة أجرة التوصيل"><option value="$">الدولار ($)</option><option value="IQD">الدينار العراقي (IQD)</option><option value="TL">الليرة التركية (TL)</option></select>',
                  '<select id="courierCurrency" aria-label="عملة أجرة التوصيل"><option value="$">الدولار ($) - USD</option><option value="IQD">الدينار العراقي (IQD)</option><option value="TL">الليرة التركية (TL)</option><option value="SYP">الليرة السورية (SYP)</option><option value="EUR">اليورو (€) - EUR</option><option value="SAR">الريال السعودي (SAR)</option><option value="AED">الدرهم الإماراتي (AED)</option><option value="JOD">الدينار الأردني (JOD)</option></select>'
              ),
              'admin-dashboard.html': (
                  '<select id="delCurrency"><option value="$">الدولار ($)</option><option value="IQD">الدينار العراقي (IQD)</option><option value="TL">الليرة التركية (TL)</option></select>',
                  '<select id="delCurrency"><option value="$">الدولار ($) - USD</option><option value="IQD">الدينار العراقي (IQD)</option><option value="TL">الليرة التركية (TL)</option><option value="SYP">الليرة السورية (SYP)</option><option value="EUR">اليورو (€) - EUR</option><option value="SAR">الريال السعودي (SAR)</option><option value="AED">الدرهم الإماراتي (AED)</option><option value="JOD">الدينار الأردني (JOD)</option></select>'
              ),
          }

          for filename, (old, new) in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{filename}: expected exactly one courier currency select anchor, found {text.count(old)}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          Path('.github/workflows/expand-courier-currencies.yml').unlink()
      - name: Commit directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add branch-dashboard.html admin-dashboard.html .github/workflows/expand-courier-currencies.yml
          git commit -m "Expand courier currency options"
          git push origin main
