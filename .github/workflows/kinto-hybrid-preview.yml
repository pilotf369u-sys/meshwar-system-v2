name: KINTO hybrid isolated preview
on:
  push:
    branches: [app/kinto-hybrid-preview-20261022]
    paths: ['mobile/hybrid/**', '.github/workflows/kinto-hybrid-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - name: Reader and existing PWA tests
        run: |
          node --test mobile/hybrid/android/checks/product-reader.test.cjs
          node tests/pwa-hosting-contract.cjs
      - name: Pure Java boundary and pricing tests
        run: |
          mkdir -p "$RUNNER_TEMP/kinto-checks"
          javac -d "$RUNNER_TEMP/kinto-checks" mobile/hybrid/android/app/src/main/java/com/kinto/trendyollab/{UrlPolicy,CartRules,Pricing}.java mobile/hybrid/android/checks/{UrlPolicyCheck,CartRulesCheck,PricingCheck}.java
          for check in UrlPolicyCheck CartRulesCheck PricingCheck; do java -cp "$RUNNER_TEMP/kinto-checks" "$check"; done
      - name: Build and verify private preview only
        env:
          KINTO_BUILD_OUTPUT: ${{ runner.temp }}/kinto-preview-output
          KINTO_PREVIEW_KEYSTORE: ${{ runner.temp }}/kinto-preview.keystore
          KINTO_PREVIEW_PASSWORD_FILE: ${{ runner.temp }}/kinto-preview-password
        run: |
          umask 077
          openssl rand -base64 32 > "$KINTO_PREVIEW_PASSWORD_FILE"
          keytool -genkeypair -keystore "$KINTO_PREVIEW_KEYSTORE" -storepass:file "$KINTO_PREVIEW_PASSWORD_FILE" -keypass:file "$KINTO_PREVIEW_PASSWORD_FILE" -alias kinto-preview -dname 'CN=KINTO Disposable CI Preview' -keyalg RSA -keysize 2048 -validity 3650
          bash mobile/hybrid/tools/build-preview.sh
      - uses: actions/upload-artifact@v4
        with:
          name: KINTO-Hybrid-Preview-APK
          path: ${{ runner.temp }}/kinto-preview-output/KINTO-Preview-0.1.apk
          retention-days: 14
          if-no-files-found: error
# Disposable CI signing can require uninstall between downloads. Not production signing.
# No publishing, Supabase mutation, website deployment, or signing-secret upload.
