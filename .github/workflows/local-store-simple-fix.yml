name: Local store simple fix
on:
  push:
    branches:
      - agent/local-store-simple-fix
    paths:
      - '.github/workflows/local-store-simple-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/local-store-simple-fix
          fetch-depth: 0
      - name: Patch vendor and index
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # vendor-dashboard.html
          p=Path('vendor-dashboard.html')
          s=p.read_text(encoding='utf-8')
          old='<input id="productImage" class="field" placeholder="رابط الصورة">'
          new='''<div class="md:col-span-2">\n        <input id="productImageFile" class="field" type="file" accept="image/*">\n        <input id="productImage" type="hidden">\n        <div class="mt-2 flex items-center gap-3">\n          <img id="productImagePreview" class="hidden h-24 w-24 rounded-2xl border border-white/10 object-cover" alt="معاينة صورة المنتج">\n          <span class="vendor-muted text-xs text-slate-400">اختر صورة من الجهاز وسيتم رفعها مباشرة إلى Supabase Storage.</span>\n        </div>\n      </div>'''
          if old not in s:
              raise SystemExit('productImage field marker not found')
          s=s.replace(old,new,1)

          helper='''\nconst PRODUCT_IMAGES_BUCKET='product-images';\nasync function uploadProductImage(file){\n  if(!file||!vendorStore?.id)return null;\n  const ext=(String(file.name||'').split('.').pop()||'jpg').replace(/[^a-zA-Z0-9]/g,'').toLowerCase()||'jpg';\n  const name=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2))+'.'+ext;\n  const path=vendorStore.id+'/'+name;\n  const{error}=await sb.storage.from(PRODUCT_IMAGES_BUCKET).upload(path,file,{cacheControl:'31536000',upsert:false,contentType:file.type||undefined});\n  if(error)throw error;\n  const{data}=sb.storage.from(PRODUCT_IMAGES_BUCKET).getPublicUrl(path);\n  if(!data?.publicUrl)throw new Error('تعذر الحصول على رابط الصورة بعد الرفع.');\n  return data.publicUrl;\n}\nfunction previewSelectedProductImage(){\n  const file=$('productImageFile')?.files?.[0],preview=$('productImagePreview');\n  if(!preview)return;\n  if(!file){const current=$('productImage')?.value||'';if(current){preview.src=current;preview.classList.remove('hidden')}else{preview.src='';preview.classList.add('hidden')}return}\n  const url=URL.createObjectURL(file);preview.src=url;preview.classList.remove('hidden');preview.onload=()=>URL.revokeObjectURL(url);\n}\n'''
          marker='function openProductModal(){'
          if helper.strip() not in s:
              if marker not in s: raise SystemExit('openProductModal marker not found')
              s=s.replace(marker,helper+marker,1)

          s=re.sub(r"function resetProductForm\(\)\{.*?\}\nfunction editProduct",
                   "function resetProductForm(){['productId','productName','productImage','productDescription','productBasePrice','productDiscountPrice','productStock','productColors','productSizes','productVolumes'].forEach(id=>$(id).value='');$('productImageFile').value='';$('productImagePreview').src='';$('productImagePreview').classList.add('hidden');$('productLowThreshold').value='3';$('productModalTitle').textContent='إضافة منتج'}\nfunction editProduct",
                   s,count=1,flags=re.S)

          s=re.sub(r"function editProduct\(id\)\{.*?\}\nasync function saveProduct",
                   "function editProduct(id){const p=products.find(x=>String(x.id)===String(id));if(!p)return;const o=safeOptions(p.options);$('productId').value=p.id;$('productName').value=p.product_name||'';$('productImage').value=p.image_url||'';$('productImageFile').value='';$('productDescription').value=p.description||'';$('productBasePrice').value=p.base_price??'';$('productDiscountPrice').value=p.discount_price??'';$('productStock').value=p.stock_quantity??0;$('productLowThreshold').value=p.low_stock_threshold??3;$('productColors').value=o.colors.join(', ');$('productSizes').value=o.sizes.join(', ');$('productVolumes').value=o.volumes.join(', ');$('productModalTitle').textContent='تعديل المنتج';previewSelectedProductImage();$('productModal').classList.remove('hidden');$('productModal').classList.add('flex')}\nasync function saveProduct",
                   s,count=1,flags=re.S)

          new_save="""async function saveProduct(){if(!vendorStore)return;const id=$('productId').value.trim(),description=$('productDescription').value.trim();if(description.length>30)return showNotice('الوصف المختصر يجب ألا يتجاوز 30 حرفًا.',true);const base=Number($('productBasePrice').value),discount=$('productDiscountPrice').value.trim()===''?null:Number($('productDiscountPrice').value),stock=Math.max(0,Math.floor(Number($('productStock').value||0))),threshold=Math.max(0,Math.floor(Number($('productLowThreshold').value||0)));if(!$('productName').value.trim()||!Number.isFinite(base)||base<0)return showNotice('أدخل اسم المنتج وسعرًا صحيحًا.',true);if(discount!=null&&(!Number.isFinite(discount)||discount<0||discount>base))return showNotice('سعر الخصم يجب أن يكون بين 0 والسعر الأصلي.',true);try{let imageUrl=$('productImage').value.trim()||null;const file=$('productImageFile')?.files?.[0];if(file){showNotice('جاري رفع صورة المنتج...');imageUrl=await uploadProductImage(file)}const payload={store_id:vendorStore.id,product_name:$('productName').value.trim(),image_url:imageUrl,description,base_price:base,discount_price:discount,currency:vendorStore.default_currency||'USD',stock_quantity:stock,low_stock_threshold:threshold,is_out_of_stock:stock===0,options:{colors:optionsArray($('productColors').value),sizes:optionsArray($('productSizes').value),volumes:optionsArray($('productVolumes').value)},updated_at:new Date().toISOString()};const q=id?sb.from('local_products').update(payload).eq('id',id).eq('store_id',vendorStore.id):sb.from('local_products').insert([payload]);const{error}=await q;if(error)throw error;closeProductModal();showNotice(id?'تم تحديث المنتج.':'تمت إضافة المنتج.');await loadProducts()}catch(e){console.error('Product save error:',e);showNotice('تعذر حفظ المنتج: '+(e.message||e),true)}}"""
          s,n=re.subn(r"async function saveProduct\(\)\{.*?\}\nasync function deleteProduct",new_save+"\nasync function deleteProduct",s,count=1,flags=re.S)
          if n!=1: raise SystemExit('saveProduct marker not found')

          hook="$('productImageFile')?.addEventListener('change',previewSelectedProductImage);\n"
          hook_marker="$('[exchangeRate]'"
          # insert before exchange listeners using exact known marker
          exact="$ ('exchangeRate')"
          listener="$('exchangeRate').addEventListener('input',renderExchangePreview);"
          if hook not in s:
              if listener not in s: raise SystemExit('exchange listener marker not found')
              s=s.replace(listener,hook+listener,1)
          p.write_text(s,encoding='utf-8')

          # index.html
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old_open="function openStore(storeUrl,storeId){console.log('Opening store:',storeUrl,storeId);const url=String(storeUrl||'').trim();if(url){window.open(url,'_blank');return}const id=String(storeId||'').trim();if(id){window.location.href='index.html?storeId='+id;return}alert('تعذر فتح المتجر حالياً.')}"
          new_open="function openStore(storeUrl,storeId){console.log('Opening store:',storeUrl,storeId);const id=String(storeId||'').trim();if(id){window.location.href='index.html?storeId='+encodeURIComponent(id);return}const url=String(storeUrl||'').trim();if(url){window.open(url,'_blank');return}alert('تعذر فتح المتجر حالياً.')}"
          if old_open not in s: raise SystemExit('openStore marker not found')
          s=s.replace(old_open,new_open,1)

          old_script=re.search(r"<script>/\* MESHWAR_COMPACT_SHOWCASE_UI_V5 \*/.*?</script>",s,re.S)
          if not old_script: raise SystemExit('tab script marker not found')
          new_script='''<script>/* MESHWAR_COMPACT_SHOWCASE_UI_V6 */(function(){const intl=document.getElementById('internationalStoresSection'),loc=document.getElementById('localStoresPublic'),bi=document.getElementById('showInternationalStoresBtn'),bl=document.getElementById('showLocalStoresBtn');function paint(btn,active){if(!btn)return;btn.classList.toggle('bg-gradient-to-r',active);btn.classList.toggle('from-sky-600',active);btn.classList.toggle('to-indigo-600',active);btn.classList.toggle('border-amber-400/50',active);btn.classList.toggle('text-white',active);btn.classList.toggle('bg-white/5',!active);btn.classList.toggle('border-amber-400/25',!active);btn.classList.toggle('text-slate-100',!active);btn.setAttribute('aria-selected',active?'true':'false')}function show(k){const local=k==='local';if(intl)intl.style.display=local?'none':'';if(loc)loc.style.display=local?'':'none';paint(bi,!local);paint(bl,local)}window.showStoresTab=show;bi?.addEventListener('click',()=>show('international'));bl?.addEventListener('click',()=>show('local'));const selectedStoreId=new URLSearchParams(window.location.search).get('storeId');show(selectedStoreId?'local':'international');const v=document.getElementById('meshwarPromoVideo'),sb=document.getElementById('meshwarPromoSoundBtn'),pb=document.getElementById('meshwarPromoPlayBtn');sb?.addEventListener('click',()=>{if(!v)return;v.muted=!v.muted;sb.textContent=v.muted?'🔇 تشغيل الصوت':'🔊 كتم الصوت'});pb?.addEventListener('click',()=>{if(!v)return;v.paused?v.play().catch(()=>{}):v.pause()})})();</script>'''
          s=s[:old_script.start()]+new_script+s[old_script.end():]

          old_load="async function loadLocalPublicStores(){const grid=document.getElementById('localStoresPublicGrid');try{const{data,error}=await localStoresSb.from('local_stores').select('id,store_name,logo_url,store_url,country,governorate,store_type,specialty,default_currency,status').eq('status','active').order('created_at',{ascending:false});if(error)throw error;localPublicStores=data||[];renderLocalSpecialtyFilters();renderLocalPublicStores();const storeId=new URLSearchParams(window.location.search).get('storeId');if(storeId){await loadStoreDetails(storeId);document.getElementById('localStoresPublic')?.scrollIntoView({behavior:'smooth',block:'start'})}}catch(e){console.error('Local stores public load error:',e);if(grid)grid.innerHTML='<div class=\"local-empty\">تعذر تحميل المتاجر المحلية حالياً.</div>'}}"
          new_load="async function loadLocalPublicStores(){const grid=document.getElementById('localStoresPublicGrid');try{const{data,error}=await localStoresSb.from('local_stores').select('id,store_name,logo_url,store_url,country,governorate,store_type,specialty,default_currency,status').eq('status','active').order('created_at',{ascending:false});if(error)throw error;localPublicStores=data||[];renderLocalSpecialtyFilters();renderLocalPublicStores();const storeId=new URLSearchParams(window.location.search).get('storeId');if(storeId){window.showStoresTab?.('local');await loadStoreDetails(storeId);document.getElementById('localStoresPublic')?.scrollIntoView({behavior:'smooth',block:'start'})}}catch(e){console.error('Local stores public load error:',e);if(grid)grid.innerHTML='<div class=\"local-empty\">تعذر تحميل المتاجر المحلية حالياً.</div>'}}"
          if old_load not in s: raise SystemExit('loadLocalPublicStores marker not found')
          s=s.replace(old_load,new_load,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate changes
        run: |
          grep -Fq 'id="productImageFile"' vendor-dashboard.html
          grep -Fq "PRODUCT_IMAGES_BUCKET='product-images'" vendor-dashboard.html
          grep -Fq ".storage.from(PRODUCT_IMAGES_BUCKET).upload" vendor-dashboard.html
          grep -Fq "window.location.href='index.html?storeId='+encodeURIComponent(id)" index.html
          grep -Fq 'MESHWAR_COMPACT_SHOWCASE_UI_V6' index.html
          grep -Fq "window.showStoresTab?.('local')" index.html
          grep -Fq ".eq('store_id',id)" index.html
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html vendor-dashboard.html
          git commit -m "Fix local store navigation tabs and image upload"
          git push origin HEAD:agent/local-store-simple-fix
