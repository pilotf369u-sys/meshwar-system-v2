name: Apply index cache policy
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-index-cache-policy.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch index cache policy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          meta='<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">'
          if meta not in s:
              needle='<meta name="viewport" content="width=device-width, initial-scale=1.0">'
              if needle not in s: raise SystemExit('viewport meta not found')
              s=s.replace(needle, needle+'\n    '+meta, 1)
          import re
          s,n=re.subn(r'src="js/local-store-card-v3\.js(?:\?v=[^"]*)?"', 'src="js/local-store-card-v3.js?v=adb5840"', s, count=1)
          if n != 1: raise SystemExit('renderer script include not found')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -F '<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">' index.html
          grep -F 'src="js/local-store-card-v3.js?v=adb5840"' index.html
          node --check js/local-store-card-v3.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Bust local store JS cache and disable HTML caching'
          git push origin main
