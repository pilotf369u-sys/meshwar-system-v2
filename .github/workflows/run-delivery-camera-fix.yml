name: Run delivery camera fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/run-delivery-camera-fix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch delivery dashboard camera and proof images
        shell: python
        run: |
          from pathlib import Path
          p=Path('delivery-dashboard.html')
          s=p.read_text(encoding='utf-8')
          old=".scanner-wrap{display:none;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}.scanner-wrap.show{display:block}#reader{width:100%;max-width:520px;margin:auto}"
          new=".scanner-wrap{display:none;position:fixed;inset:0;z-index:9999;background:rgba(15,23,42,.88);padding:14px;overflow:auto}.scanner-wrap.show{display:flex;align-items:center;justify-content:center}.scanner-panel{width:min(96vw,620px);background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 20px 60px #0006}#reader{width:100%;max-width:560px;margin:auto}.delivery-image-box{margin-top:10px;padding:10px;border:1px solid #e2e8f0;border-radius:10px;background:#f8fafc}.delivery-image-preview{width:100%;max-height:230px;object-fit:contain;border-radius:9px;cursor:zoom-in;background:#fff}.image-overlay{display:none;position:fixed;inset:0;z-index:10010;background:rgba(0,0,0,.88);align-items:center;justify-content:center;padding:18px}.image-overlay.show{display:flex}.image-overlay img{max-width:96vw;max-height:90vh;object-fit:contain;border-radius:10px}.image-overlay button{position:absolute;top:14px;left:14px}.proof-upload{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.proof-status{font-size:12px;font-weight:800;margin-top:6px;color:#475569}"
          if old not in s: raise SystemExit('scanner css block not found')
          s=s.replace(old,new,1)
          s=s.replace('<div id="scannerWrap" class="scanner-wrap"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b>مسح باركود الشحنة</b><button class="btn btn-red" onclick="stopScanner()">إغلاق</button></div><div id="reader"></div></div>', '<div id="scannerWrap" class="scanner-wrap"><div class="scanner-panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px"><b>مسح باركود الشحنة بالكاميرا الخلفية</b><button class="btn btn-red" onclick="stopScanner()">إغلاق</button></div><div id="reader"></div><div id="cameraHint" class="muted" style="margin-top:8px;text-align:center">اسمح للمتصفح باستخدام الكاميرا ثم وجّه الكاميرا الخلفية نحو الباركود.</div></div></div>')
          s=s.replace('<div id="scanResult" class="scan-result"></div>', '<div id="scanResult" class="scan-result"></div><div id="deliveryImageOverlay" class="image-overlay" onclick="if(event.target===this)closeDeliveryImage()"><button class="btn btn-red" onclick="closeDeliveryImage()">إغلاق</button><img id="deliveryImageZoom" alt="صورة الشحنة"></div><input id="deliveryProofCamera" type="file" accept="image/*" capture="environment" style="display:none" onchange="handleDeliveryProofFile(this.files[0])"><input id="deliveryProofGallery" type="file" accept="image/*" style="display:none" onchange="handleDeliveryProofFile(this.files[0])">')
          marker="function customerFullAddress(o,c){"
          helpers="""function parcelImageUrl(o){const d=parseDetails(o?.details);return String(o?.parcel_image_url||o?.package_image_url||o?.image_url||d.package_image_url||d.parcel_image_url||'').trim()}\nfunction deliveryProofUrl(o){const d=parseDetails(o?.details);return String(o?.delivery_proof_url||d.delivery_proof_url||d.proof_of_delivery_url||'').trim()}\nfunction openDeliveryImage(url){if(!url)return;deliveryImageZoom.src=url;deliveryImageOverlay.classList.add('show')}\nfunction closeDeliveryImage(){deliveryImageOverlay.classList.remove('show');deliveryImageZoom.src=''}\nlet deliveryProofOrderId='';\nfunction chooseDeliveryProof(encodedId,source){deliveryProofOrderId=decodeURIComponent(encodedId);const input=source==='camera'?deliveryProofCamera:deliveryProofGallery;input.value='';input.click()}\nfunction safeDeliveryFileName(name){return String(name||'proof.jpg').replace(/[^a-zA-Z0-9._-]+/g,'_').slice(-120)||'proof.jpg'}\nasync function uploadDeliveryProofToStorage(file,orderId){const sb=await getDeliverySb(),buckets=['delivery-proofs','order-images','chat-attachments'],safe=safeDeliveryFileName(file.name),path=`delivery/${idText(currentCourier?.id)||'courier'}/${orderId}/${Date.now()}-${safe}`;let lastError=null;for(const bucket of buckets){const{error}=await sb.storage.from(bucket).upload(path,file,{upsert:false,contentType:file.type||'image/jpeg'});if(error){lastError=error;continue}const{data}=sb.storage.from(bucket).getPublicUrl(path);if(data?.publicUrl)return data.publicUrl}throw lastError||new Error('تعذر رفع صورة إثبات التسليم إلى Storage')}\nasync function handleDeliveryProofFile(file){const orderId=idText(deliveryProofOrderId);if(!file||!orderId)return;if(!String(file.type||'').startsWith('image/'))return alert('اختر صورة فقط.');if(file.size>15*1024*1024)return alert('حجم الصورة يجب ألا يتجاوز 15MB.');const o=deliveryOrders.find(x=>idText(x.id)===orderId);if(!o)return alert('تعذر تحديد الشحنة.');const statusEl=document.getElementById('proof-status-'+encodeURIComponent(orderId));if(statusEl)statusEl.textContent='جاري رفع صورة إثبات التسليم...';try{const url=await uploadDeliveryProofToStorage(file,orderId),details=parseDetails(o.details);details.delivery_proof_url=url;details.proof_of_delivery_url=url;details.delivery_proof_uploaded_at=new Date().toISOString();details.delivery_proof_courier_id=idText(currentCourier?.id);details.delivery_proof_verified=true;const sb=await getDeliverySb(),{error}=await sb.from('orders').update({details}).eq('id',orderId);if(error)throw error;o.details=details;if(statusEl)statusEl.textContent='تم حفظ صورة إثبات التسليم بنجاح.';deliveryProofCamera.value='';deliveryProofGallery.value='';await loadDeliveryOrders()}catch(e){console.error('Delivery proof upload error:',e);if(statusEl)statusEl.textContent='تعذر رفع الصورة: '+(e.message||e)}}\n"""
          if marker not in s: raise SystemExit('customerFullAddress marker not found')
          s=s.replace(marker,helpers+marker,1)
          old_render="<div class=\"actions\">${digits?`<a class=\"btn btn-whatsapp\" target=\"_blank\" rel=\"noopener\" href=\"https://wa.me/${digits}?text=${message}\">واتساب</a><a class=\"btn btn-call\" href=\"tel:${esc(phone)}\">اتصال</a>`:''}${second?`<a class=\"btn btn-call\" href=\"tel:${esc(second)}\">اتصال احتياطي</a>`:''}</div><div class=\"edit-box\">"
          new_render="<div class=\"delivery-image-box\"><b>صورة الطرد الأساسية</b>${parcelImageUrl(o)?`<img class=\"delivery-image-preview\" src=\"${esc(parcelImageUrl(o))}\" alt=\"صورة الطرد\" onclick=\"openDeliveryImage('${esc(parcelImageUrl(o))}')\">`:'<div class=\"muted\" style=\"margin-top:6px\">لا توجد صورة طرد مرفوعة.</div>'}${deliveryProofUrl(o)?`<div style=\"margin-top:10px\"><b>إثبات التسليم</b><img class=\"delivery-image-preview\" src=\"${esc(deliveryProofUrl(o))}\" alt=\"إثبات التسليم\" onclick=\"openDeliveryImage('${esc(deliveryProofUrl(o))}')\"></div>`:''}<div class=\"proof-upload\"><button class=\"btn btn-blue\" type=\"button\" onclick=\"chooseDeliveryProof('${id}','camera')\">📸 التقاط صورة التسليم</button><button class=\"btn btn-gray\" type=\"button\" onclick=\"chooseDeliveryProof('${id}','gallery')\">🖼️ اختيار من المعرض</button></div><div id=\"proof-status-${id}\" class=\"proof-status\">${deliveryProofUrl(o)?'✅ الشحنة موثقة بصورة تسليم.':''}</div></div><div class=\"actions\">${digits?`<a class=\"btn btn-whatsapp\" target=\"_blank\" rel=\"noopener\" href=\"https://wa.me/${digits}?text=${message}\">واتساب</a><a class=\"btn btn-call\" href=\"tel:${esc(phone)}\">اتصال</a>`:''}${second?`<a class=\"btn btn-call\" href=\"tel:${esc(second)}\">اتصال احتياطي</a>`:''}</div><div class=\"edit-box\">"
          if old_render not in s: raise SystemExit('render actions block not found')
          s=s.replace(old_render,new_render,1)
          old_scan="async function toggleScanner(){if(scanner){await stopScanner();return}scannerWrap.classList.add('show');scanner=new Html5Qrcode('reader');try{await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:140}},text=>handleCameraScan(text),()=>{})}catch(e){scanner=null;scannerWrap.classList.remove('show');alert('تعذر فتح الكاميرا: '+(e.message||e))}}"
          new_scan="""async function toggleScanner(){if(scanner){await stopScanner();return}scannerWrap.classList.add('show');scanner=new Html5Qrcode('reader');const config={fps:10,qrbox:(w,h)=>({width:Math.min(300,Math.floor(w*.82)),height:Math.min(170,Math.floor(h*.48))}),aspectRatio:1.777778};const ok=text=>handleCameraScan(text),fail=()=>{};let errors=[];try{const cameras=await Html5Qrcode.getCameras();const back=(cameras||[]).find(c=>/back|rear|environment|traseira|trasera|arrière|خلف/i.test(c.label||''))||(cameras||[]).slice(-1)[0];if(back){try{await scanner.start(back.id,config,ok,fail);return}catch(e){errors.push(e)}}try{await scanner.start({facingMode:{exact:'environment'}},config,ok,fail);return}catch(e){errors.push(e)}try{await scanner.start({facingMode:{ideal:'environment'}},config,ok,fail);return}catch(e){errors.push(e)}throw errors[errors.length-1]||new Error('لم يتم العثور على كاميرا متاحة')}catch(e){console.error('Mobile barcode camera error:',e);try{await scanner.clear()}catch{}scanner=null;scannerWrap.classList.remove('show');alert('تعذر فتح كاميرا الهاتف. تأكد من السماح بصلاحية الكاميرا واستخدام HTTPS ثم حاول مجدداً. '+(e.message||e))}}"""
          if old_scan not in s: raise SystemExit('scanner function not found')
          s=s.replace(old_scan,new_scan,1)
          s=s.replace("window.cleanBarcodeScannerInput=cleanBarcodeScannerInput;window.onload=initDelivery;", "Object.assign(window,{cleanBarcodeScannerInput,openDeliveryImage,closeDeliveryImage,chooseDeliveryProof,handleDeliveryProofFile});window.onload=initDelivery;")
          p.write_text(s,encoding='utf-8')
      - name: Commit dashboard fix
        run: |
          git config user.name meshwar-delivery-bot
          git config user.email actions@users.noreply.github.com
          git add delivery-dashboard.html
          git commit -m "Fix mobile scanner and add delivery proof images" || exit 0
          git push origin main
