name: Install local product enhancements
on:
  push:
    branches:
      - main
    paths:
      - js/local-store-enhancements.js
      - .github/workflows/local-product-order-ui.yml
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Inject enhancement module
        run: |
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); tag='<script type=\"module\" src=\"js/local-store-enhancements.js\"></script>'; s=s if tag in s else s.replace('</body>',tag+'\\n</body>',1); p.write_text(s)"
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Enable local product ordering enhancements'
          git push origin main
