name: Strike fix v1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/strike-fix-v1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python3 tools/strike_fix_patch.py
      - name: Verify
        run: |
          node --check js/local-store-card-v3.js
          grep -F '<del class="local-v3-old"' js/local-store-card-v3.js
          grep -F 'text-decoration:line-through !important' js/local-store-card-v3.js
          grep -F 'js/local-store-card-v3.js?v=strike-fix-v1' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/local-store-card-v3.js index.html
          git diff --cached --quiet || git commit -m 'Force old price strikethrough in product cards'
          git push origin main
