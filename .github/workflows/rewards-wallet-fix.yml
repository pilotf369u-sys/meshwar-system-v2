name: Rewards wallet fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rewards-wallet-fix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch reward dashboards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          employee = r'''
          <script>
          /* REWARDS_WALLET_CURRENCY_FIX_V2 */
          const EMPLOYEE_REWARD_CURRENCIES=[['USD','USD $'],['IQD','IQD'],['TRY','TRY']];
          function employeeOwnField(c,names){return names.find(n=>Object.prototype.hasOwnProperty.call(c||{},n))||null}
          function employeeBalanceField(c){return employeeOwnField(c,['wallet_balance','balance'])}
          function employeeCountField(c){return employeeOwnField(c,['rewards_count','usage_count','usageCount'])}
          function employeeCycleField(c){return employeeOwnField(c,['current_cycle_delivered','delivered_orders_count'])}
          function employeeCurrencyField(c){return employeeOwnField(c,['wallet_currency','balance_currency','reward_currency'])}
          function employeeStoredCurrency(c){const f=employeeCurrencyField(c);if(f&&c?.[f])return String(c[f]);const logs=employeeRewardLog(c);for(let i=logs.length-1;i>=0;i--){if(logs[i]?.currency)return String(logs[i].currency)}return''}
          function employeeRewardBalance(c){const f=employeeBalanceField(c),n=Number(f?c?.[f]:NaN);if(Number.isFinite(n))return n;return employeeRewardLog(c).reduce((s,r)=>s+Number(r.amount||0),0)}
          function employeeRewardUsage(c){const f=employeeCountField(c),stored=Number(f?c?.[f]:0),grants=employeeRewardGrants(c).length;return Math.max(Number.isFinite(stored)?stored:0,grants)}
          function employeeRewardWindow(c,orders){return employeeRewardCycle(c,orders).slice(0,EMPLOYEE_REWARD_TARGET)}
          function employeeRewardCurrencyOptions(selected){const cur=selected||'USD';return EMPLOYEE_REWARD_CURRENCIES.map(([v,l])=>`<option value="${v}" ${v===cur?'selected':''}>${l}</option>`).join('')}
          function employeeWalletText(c){const cur=employeeStoredCurrency(c);return `${employeeRewardBalance(c).toFixed(2)}${cur?' '+escapeHtml(cur):''}`}
          async function employeeBestEffortRewardLog(sb,c,id,entry){const f=employeeOwnField(c,['rewards_log','rewardsLog']);if(!f)return false;try{const log=employeeRewardLog(c),{error}=await sb.from('customers').update({[f]:[...log,entry]}).eq('id',id);if(error){console.warn('Optional rewards log skipped:',error);return false}return true}catch(e){console.warn('Optional rewards log skipped:',e);return false}}
          async function employeeBestEffortRewardMessage(sb,id,amount,currency,dir){try{const text=dir>0?`🎁 تم إضافة مكافأة بقيمة ${amount.toFixed(2)} ${currency} إلى رصيدك.`:`تم خصم ${amount.toFixed(2)} ${currency} من رصيد المكافآت.`;const payload={customer_id:id,sender_type:'employee',message:text};if(currentEmployee?.id)payload.employee_id=cloudId(currentEmployee.id);const{error}=await sb.from('messages').insert([payload]);if(error)console.warn('Reward message skipped:',error)}catch(e){console.warn('Reward message skipped:',e)}}
          loadRewardsManagementTable=async function(){const body=document.getElementById('rewardsTableBody'),panel=document.getElementById('rewardPanel');body.innerHTML='<tr><td colspan="8">جاري التحميل...</td></tr>';const p=panel?.querySelector('p.mini'),head=panel?.querySelector('thead tr');if(p)p.innerText='المكافأة عند 6 طلبات مسلمة. الرصيد والعداد هما الحفظ الأساسي، وسجل rewards_log اختياري ولا يعطل الصرف.';if(head)head.innerHTML='<th>العميل</th><th>الهاتف</th><th>تقدم الدورة</th><th>إجمالي مشتريات الدورة</th><th>الرصيد</th><th>قيمة المكافأة</th><th>العملة</th><th>الإجراء</th>';try{const{customers,by}=await employeeRewardDataset();cloudCustomers=customers;employeeRewardOrdersByCustomer=by;const eligible=customers.map(c=>({c,cycle:employeeRewardCycle(c,by.get(cloudId(c.id))||[])})).filter(x=>x.cycle.length>=EMPLOYEE_REWARD_TARGET);body.innerHTML=eligible.map(({c,cycle})=>{const cid=encodeURIComponent(cloudId(c.id)),windowRows=cycle.slice(0,EMPLOYEE_REWARD_TARGET),totals=employeeRewardTotals(windowRows),cur=employeeStoredCurrency(c)||'USD';return `<tr><td>${escapeHtml(c.name||'---')}<br><span class="customer-code">${escapeHtml(c.code||c.id)}</span></td><td>${escapeHtml(c.phone||'---')}${c.secondary_phone?`<div class="mini" style="color:#9a3412">احتياطي: ${escapeHtml(c.secondary_phone)}</div>`:''}</td><td><b>${Math.min(cycle.length,EMPLOYEE_REWARD_TARGET)} / ${EMPLOYEE_REWARD_TARGET}</b></td><td><b>${employeeRewardTotalsText(totals)}</b></td><td><b>${employeeWalletText(c)}</b></td><td><input id="reward-${cid}" type="number" min="0" step="0.01" placeholder="قيمة المكافأة" style="width:110px"></td><td><select id="reward-currency-${cid}">${employeeRewardCurrencyOptions(cur)}</select></td><td><button class="btn btn-purple" onclick="changeReward('${cid}',1)">منح المكافأة</button> <button class="btn btn-orange" onclick="changeReward('${cid}',-1)">سحب</button></td></tr>`}).join('')||'<tr><td colspan="8">لا يوجد مستحقون حالياً.</td></tr>'}catch(e){console.error(e);body.innerHTML=`<tr><td colspan="8" style="color:red">${escapeHtml(e.message||e)}</td></tr>`}};
          changeReward=async function(cid,dir){const id=cloudId(decodeURIComponent(cid)),c=cloudCustomers.find(x=>cloudId(x.id)===id),amount=Number(document.getElementById('reward-'+cid)?.value||0),currency=String(document.getElementById('reward-currency-'+cid)?.value||'USD');if(!c||!Number.isFinite(amount)||amount<=0)return alert('أدخل قيمة مكافأة صحيحة.');const rows=employeeRewardOrdersByCustomer.get(id)||[],cycle=employeeRewardCycle(c,rows),windowRows=cycle.slice(0,EMPLOYEE_REWARD_TARGET);if(dir>0&&windowRows.length<EMPLOYEE_REWARD_TARGET)return alert('العميل لم يصل إلى 6 طلبات مسلمة في الدورة الحالية.');const balanceField=employeeBalanceField(c);if(!balanceField)return alert('لا يوجد حقل wallet_balance أو balance في سجل العميل. يجب إضافة أحدهما إلى جدول customers لحفظ الرصيد.');const currentBalance=Number(c[balanceField]||0),nextBalance=currentBalance+(dir>0?amount:-amount);if(nextBalance<0)return alert('الرصيد غير كافٍ لإجراء السحب.');const currencyField=employeeCurrencyField(c),storedCurrency=employeeStoredCurrency(c);if(currentBalance!==0&&storedCurrency&&storedCurrency!==currency)return alert(`رصيد العميل الحالي بعملة ${storedCurrency}. لا يمكن خلط ${currency} معه في نفس الرصيد.`);const countField=employeeCountField(c),cycleField=employeeCycleField(c),payload={[balanceField]:nextBalance};if(currencyField)payload[currencyField]=currency;if(dir>0&&countField)payload[countField]=employeeRewardUsage(c)+1;if(dir>0&&cycleField)payload[cycleField]=0;const sb=await ensureEmployeeSupabase(),{error}=await sb.from('customers').update(payload).eq('id',id);if(error)return alert('تعذر تحديث الرصيد الأساسي: '+error.message);Object.assign(c,payload);const entry={amount:dir>0?amount:-amount,currency,type:dir>0?'grant':'withdraw',date:new Date().toISOString(),employee_id:cloudId(currentEmployee?.id),employee_name:currentEmployee?.name||''};if(dir>0){entry.order_ids=windowRows.map(o=>o.id);entry.cycle_orders=windowRows.length;entry.cycle_totals=employeeRewardTotals(windowRows)}await employeeBestEffortRewardLog(sb,c,id,entry);await employeeBestEffortRewardMessage(sb,id,amount,currency,dir);const warnings=[];if(!countField&&dir>0)warnings.push('لا يوجد rewards_count/usage_count');if(!cycleField&&dir>0)warnings.push('لا يوجد current_cycle_delivered/delivered_orders_count');if(!currencyField&&!employeeOwnField(c,['rewards_log','rewardsLog']))warnings.push('لا يوجد حقل مخصص لحفظ العملة ولا rewards_log');await Promise.all([loadRewardsManagementTable(),refreshPipelineCounts()]);if(warnings.length)alert('تم تحديث الرصيد، مع ملاحظة: '+warnings.join('، '))};
          Object.assign(window,{loadRewardsManagementTable,changeReward});
          </script>
          '''

          admin = r'''
          <script>
          /* REWARDS_WALLET_CURRENCY_FIX_V2 */
          const ADMIN_REWARD_CURRENCIES=[['USD','USD $'],['IQD','IQD'],['TRY','TRY']];
          function adminOwnField(c,names){return names.find(n=>Object.prototype.hasOwnProperty.call(c||{},n))||null}
          function adminBalanceField(c){return adminOwnField(c,['wallet_balance','balance'])}
          function adminCountField(c){return adminOwnField(c,['rewards_count','usage_count','usageCount'])}
          function adminCycleField(c){return adminOwnField(c,['current_cycle_delivered','delivered_orders_count'])}
          function adminCurrencyField(c){return adminOwnField(c,['wallet_currency','balance_currency','reward_currency'])}
          function adminStoredCurrency(c){const f=adminCurrencyField(c);if(f&&c?.[f])return String(c[f]);const logs=adminRewardLog(c);for(let i=logs.length-1;i>=0;i--){if(logs[i]?.currency)return String(logs[i].currency)}return''}
          function adminRewardBalanceOf(c){const f=adminBalanceField(c),n=Number(f?c?.[f]:NaN);if(Number.isFinite(n))return n;return adminRewardLog(c).reduce((s,r)=>s+Number(r.amount||0),0)}
          function adminRewardUsageOf(c){const f=adminCountField(c),stored=Number(f?c?.[f]:0),grants=adminRewardGrantsOf(c).length;return Math.max(Number.isFinite(stored)?stored:0,grants)}
          function adminRewardCurrencyOptions(selected){const cur=selected||'USD';return ADMIN_REWARD_CURRENCIES.map(([v,l])=>`<option value="${v}" ${v===cur?'selected':''}>${l}</option>`).join('')}
          function adminWalletText(c){const cur=adminStoredCurrency(c);return `${adminRewardBalanceOf(c).toFixed(2)}${cur?' '+esc(cur):''}`}
          async function adminBestEffortRewardLog(sb,c,id,entry){const f=adminOwnField(c,['rewards_log','rewardsLog']);if(!f)return false;try{const log=adminRewardLog(c),{error}=await sb.from('customers').update({[f]:[...log,entry]}).eq('id',id);if(error){console.warn('Optional rewards log skipped:',error);return false}return true}catch(e){console.warn('Optional rewards log skipped:',e);return false}}
          async function adminBestEffortRewardMessage(sb,id,amount,currency,dir){try{const text=dir>0?`🎁 تم إضافة مكافأة بقيمة ${amount.toFixed(2)} ${currency} إلى رصيدك.`:`تم خصم ${amount.toFixed(2)} ${currency} من رصيد المكافآت.`;const payload={customer_id:id,sender_type:'admin',message:text};const{error}=await sb.from('messages').insert([payload]);if(error)console.warn('Reward message skipped:',error)}catch(e){console.warn('Reward message skipped:',e)}}
          loadAdminRewards=async function(){const body=document.getElementById('adminRewardTableBody'),panel=document.getElementById('adminRewardPanel'),head=panel?.querySelector('thead tr');body.innerHTML='<tr><td colspan="8">جاري التحميل...</td></tr>';if(head)head.innerHTML='<th>العميل</th><th>الهاتف</th><th>تقدم الدورة</th><th>إجمالي مشتريات الدورة</th><th>الرصيد</th><th>قيمة المكافأة</th><th>العملة</th><th>الإجراء</th>';try{const{customers,by}=await adminRewardDataset();adminRewardOrdersByCustomer=by;adminRewardCustomers=customers.filter(c=>adminRewardCycleOf(c,by.get(String(c.id))||[]).length>=ADMIN_REWARD_TARGET);body.innerHTML=adminRewardCustomers.map(c=>{const id=encodeURIComponent(String(c.id)),cycle=adminRewardCycleOf(c,by.get(String(c.id))||[]),windowRows=cycle.slice(0,ADMIN_REWARD_TARGET),cur=adminStoredCurrency(c)||'USD';return `<tr><td>${esc(c.name||'---')}<br><span class="customer-code">${esc(c.code||c.id)}</span></td><td>${esc(c.phone||'')}${secondaryContactHtml(c.secondary_phone)}</td><td>${adminRewardProgressHtml(cycle.length)}</td><td><b>${adminRewardTotalsText(adminRewardTotalsOf(windowRows))}</b></td><td><b>${adminWalletText(c)}</b></td><td><input id="adminReward-${id}" type="number" min="0" step="0.01" placeholder="قيمة المكافأة" style="width:110px"></td><td><select id="adminRewardCurrency-${id}">${adminRewardCurrencyOptions(cur)}</select></td><td><button class="btn-purple" onclick="changeAdminReward('${id}',1)">منح المكافأة</button> <button class="btn-orange" onclick="changeAdminReward('${id}',-1)">سحب</button></td></tr>`}).join('')||'<tr><td colspan="8">لا يوجد مستحقون.</td></tr>'}catch(e){console.error(e);body.innerHTML=`<tr><td colspan="8" style="color:red">${esc(e.message||e)}</td></tr>`}};
          changeAdminReward=async function(encodedId,dir){const id=decodeURIComponent(encodedId),c=adminRewardCustomers.find(x=>String(x.id)===String(id)),amount=Number(document.getElementById('adminReward-'+encodedId)?.value||0),currency=String(document.getElementById('adminRewardCurrency-'+encodedId)?.value||'USD');if(!c||!Number.isFinite(amount)||amount<=0)return alert('أدخل قيمة مكافأة صحيحة.');const rows=adminRewardOrdersByCustomer.get(String(id))||[],cycle=adminRewardCycleOf(c,rows),windowRows=cycle.slice(0,ADMIN_REWARD_TARGET);if(dir>0&&windowRows.length<ADMIN_REWARD_TARGET)return alert('العميل لم يصل إلى 6 طلبات مسلمة في الدورة الحالية.');const balanceField=adminBalanceField(c);if(!balanceField)return alert('لا يوجد حقل wallet_balance أو balance في سجل العميل. يجب إضافة أحدهما إلى جدول customers لحفظ الرصيد.');const currentBalance=Number(c[balanceField]||0),nextBalance=currentBalance+(dir>0?amount:-amount);if(nextBalance<0)return alert('الرصيد غير كافٍ لإجراء السحب.');const currencyField=adminCurrencyField(c),storedCurrency=adminStoredCurrency(c);if(currentBalance!==0&&storedCurrency&&storedCurrency!==currency)return alert(`رصيد العميل الحالي بعملة ${storedCurrency}. لا يمكن خلط ${currency} معه في نفس الرصيد.`);const countField=adminCountField(c),cycleField=adminCycleField(c),payload={[balanceField]:nextBalance};if(currencyField)payload[currencyField]=currency;if(dir>0&&countField)payload[countField]=adminRewardUsageOf(c)+1;if(dir>0&&cycleField)payload[cycleField]=0;const sb=await ensureCustomerSupabase(),{error}=await sb.from('customers').update(payload).eq('id',id);if(error)return alert('تعذر تحديث الرصيد الأساسي: '+error.message);Object.assign(c,payload);const entry={amount:dir>0?amount:-amount,currency,type:dir>0?'grant':'withdraw',date:new Date().toISOString(),admin_id:String(currentAdminCloud?.id||'')};if(dir>0){entry.order_ids=windowRows.map(o=>o.id);entry.cycle_orders=windowRows.length;entry.cycle_totals=adminRewardTotalsOf(windowRows)}await adminBestEffortRewardLog(sb,c,id,entry);await adminBestEffortRewardMessage(sb,id,amount,currency,dir);const warnings=[];if(!countField&&dir>0)warnings.push('لا يوجد rewards_count/usage_count');if(!cycleField&&dir>0)warnings.push('لا يوجد current_cycle_delivered/delivered_orders_count');if(!currencyField&&!adminOwnField(c,['rewards_log','rewardsLog']))warnings.push('لا يوجد حقل مخصص لحفظ العملة ولا rewards_log');await Promise.all([loadAdminRewards(),refreshAdminPipelineCounts(),loadCustomers()]);if(warnings.length)alert('تم تحديث الرصيد، مع ملاحظة: '+warnings.join('، '))};
          Object.assign(window,{loadAdminRewards,changeAdminReward});
          </script>
          '''

          dashboard = r'''
          <script>
          /* REWARDS_WALLET_CURRENCY_FIX_V2 */
          let customerRewardProfileTimer=null,customerRewardProfileChannel=null;
          function customerOwnField(c,names){return names.find(n=>Object.prototype.hasOwnProperty.call(c||{},n))||null}
          function customerBalanceField(){return customerOwnField(currentCustomerCloud,['wallet_balance','balance'])}
          function customerCountField(){return customerOwnField(currentCustomerCloud,['rewards_count','usage_count','usageCount'])}
          function customerCurrencyField(){return customerOwnField(currentCustomerCloud,['wallet_currency','balance_currency','reward_currency'])}
          function customerRewardLog(){const f=customerOwnField(currentCustomerCloud,['rewards_log','rewardsLog']);const raw=f?currentCustomerCloud?.[f]:[];return Array.isArray(raw)?raw:[]}
          function customerRewardBalance(){const f=customerBalanceField(),n=Number(f?currentCustomerCloud?.[f]:NaN);if(Number.isFinite(n))return n;return customerRewardLog().reduce((sum,r)=>sum+Number(r.amount||0),0)}
          function customerRewardUsageCount(){const f=customerCountField(),n=Number(f?currentCustomerCloud?.[f]:NaN),grants=customerRewardGrantEntries().length;return Number.isFinite(n)?Math.max(n,grants):grants}
          function customerRewardCurrency(){const f=customerCurrencyField();if(f&&currentCustomerCloud?.[f])return String(currentCustomerCloud[f]);const log=customerRewardLog();for(let i=log.length-1;i>=0;i--){if(log[i]?.currency)return String(log[i].currency)}return''}
          function customerRewardCycleOrders(){const delivered=currentCustomerOrdersGlobal.filter(o=>o?.status==='تم التسليم').sort((a,b)=>new Date(a.created_at||0)-new Date(b.created_at||0)),used=new Set(),grants=customerRewardGrantEntries();let explicit=0;grants.forEach(r=>{if(Array.isArray(r.order_ids)&&r.order_ids.length){explicit++;r.order_ids.forEach(x=>used.add(String(x)))}});let remaining=delivered.filter(o=>!used.has(String(o.id))),legacy=Math.max(0,customerRewardUsageCount()-explicit);if(legacy)remaining=remaining.slice(Math.min(remaining.length,legacy*CUSTOMER_REWARD_TARGET));return remaining}
          function renderCustomerRewardHistory(){const hist=document.getElementById('rewardsHistoryList');if(!hist)return;const log=customerRewardLog();hist.innerHTML=log.map((r,i)=>`<div style="padding:8px;border-bottom:1px solid #eee"><b>${i+1}.</b> ${escapeHtml(r.amount||0)} ${escapeHtml(r.currency||'')} — ${escapeHtml(r.date||'')}</div>`).join('')||'<p>لا توجد مكافآت مسجلة.</p>'}
          renderCustomerRewardSummary=function(){const box=document.getElementById('rewardStatusBadge');if(!box||!currentCustomerCloud)return;const cycle=customerRewardCycleOrders(),windowRows=cycle.slice(0,CUSTOMER_REWARD_TARGET),count=cycle.length,progress=Math.min(100,Math.round(Math.min(count,CUSTOMER_REWARD_TARGET)/CUSTOMER_REWARD_TARGET*100)),balance=customerRewardBalance(),uses=customerRewardUsageCount(),eligible=count>=CUSTOMER_REWARD_TARGET,totals=customerRewardCycleTotals(windowRows),currency=customerRewardCurrency();document.getElementById('customerUsageCount').innerText=uses;box.innerHTML=`<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:7px"><b style="color:${eligible?'#15803d':'#334155'}">${eligible?'مستحق مكافأة 🎁':'التقدم نحو المكافأة'}</b><span><b>${Math.min(count,CUSTOMER_REWARD_TARGET)} / ${CUSTOMER_REWARD_TARGET}</b> طلبات مسلمة</span></div><div style="height:12px;background:#e2e8f0;border-radius:999px;overflow:hidden"><div style="height:100%;width:${progress}%;background:${eligible?'#16a34a':'#2563eb'};transition:width .25s"></div></div><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:9px"><span>الرصيد الحالي: <b>${balance.toFixed(2)} ${escapeHtml(currency)}</b></span><span>إجمالي مشتريات الدورة: <b>${customerRewardTotalsText(totals)}</b></span></div>`;renderCustomerRewardHistory()};
          async function refreshCustomerRewardProfile(){if(!currentCustomerCloud?.id)return;try{const sb=await ensureCustomerPortalSupabase(),{data,error}=await sb.from('customers').select('*').eq('id',currentCustomerCloud.id).maybeSingle();if(error)throw error;if(data){const keepDraft=currentDraftField;currentCustomerCloud=normalizeCloudCustomer(data);if(keepDraft)currentDraftField=keepDraft;renderCustomerRewardSummary()}}catch(e){console.warn('Reward profile refresh error:',e)}}
          async function setupCustomerRewardProfileSync(){try{const sb=await ensureCustomerPortalSupabase();customerRewardProfileChannel=sb.channel('customer-reward-profile-'+currentCustomerCloud.id).on('postgres_changes',{event:'UPDATE',schema:'public',table:'customers',filter:`id=eq.${currentCustomerCloud.id}`},refreshCustomerRewardProfile).subscribe()}catch(e){console.warn('Reward customer realtime unavailable:',e)}if(customerRewardProfileTimer)clearInterval(customerRewardProfileTimer);customerRewardProfileTimer=setInterval(refreshCustomerRewardProfile,7000)}
          const rewardSetupOrdersBase=setupOrdersRealtime;setupOrdersRealtime=async function(...args){const r=await rewardSetupOrdersBase(...args);await setupCustomerRewardProfileSync();return r};
          openRewardsModal=async function(){await refreshCustomerRewardProfile();renderCustomerRewardHistory();document.getElementById('rewardsModal').style.display='flex'};
          window.addEventListener('beforeunload',async()=>{if(customerRewardProfileTimer)clearInterval(customerRewardProfileTimer);try{const sb=await ensureCustomerPortalSupabase();if(customerRewardProfileChannel)await sb.removeChannel(customerRewardProfileChannel)}catch(e){}});
          Object.assign(window,{renderCustomerRewardSummary,openRewardsModal,refreshCustomerRewardProfile});
          </script>
          '''

          for name, addon in [('employee-dashboard.html', employee), ('admin-dashboard.html', admin), ('dashboard.html', dashboard)]:
              p=Path(name)
              text=p.read_text(encoding='utf-8')
              if 'REWARDS_WALLET_CURRENCY_FIX_V2' not in text:
                  p.write_text(text.rstrip()+"\n"+addon.strip()+"\n",encoding='utf-8')

          wf=Path('.github/workflows/rewards-wallet-fix.yml')
          if wf.exists(): wf.unlink()
          PY
      - name: Commit fixes to main
        shell: bash
        run: |
          git config user.name "meshwar-rewards-bot"
          git config user.email "actions@users.noreply.github.com"
          git add employee-dashboard.html admin-dashboard.html dashboard.html .github/workflows/rewards-wallet-fix.yml
          git commit -m "Fix reward wallet persistence and currency selection"
          git push origin HEAD:main
