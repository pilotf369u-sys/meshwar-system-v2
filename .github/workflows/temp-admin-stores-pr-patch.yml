name: temp-admin-stores-pr-patch
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.head_ref == 'fix/admin-stores-and-logo-paths'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-stores-and-logo-paths
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply surgical patch
        run: python3 tools/apply_admin_stores_patch.py
      - name: Validate syntax and diff
        shell: bash
        run: |
          node --check js/local-store-pricing.js
          python3 - <<'PY'
          import re,subprocess,tempfile,pathlib
          for html in ['admin-dashboard.html','index.html']:
              text=pathlib.Path(html).read_text(encoding='utf-8')
              for i,(attrs,code) in enumerate(re.findall(r'<script\b([^>]*)>(.*?)</script>',text,re.S|re.I)):
                  if re.search(r'\bsrc\s*=',attrs,re.I): continue
                  suffix='.mjs' if re.search(r'type=["\']module["\']',attrs,re.I) else '.js'
                  p=pathlib.Path(tempfile.gettempdir())/f'{pathlib.Path(html).stem}-{i}{suffix}'
                  p.write_text(code,encoding='utf-8')
                  subprocess.run(['node','--check',str(p)],check=True)
          PY
          git diff --check
      - name: Commit final branch state
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/temp-admin-stores-patch.yml .github/workflows/temp-admin-stores-pr-patch.yml tools/apply_admin_stores_patch.py tools/trigger-admin-stores-patch.txt
          git add -A
          git diff --cached --check
          git commit -m 'fix: unify global store management and logo paths'
          git push origin HEAD:fix/admin-stores-and-logo-paths
