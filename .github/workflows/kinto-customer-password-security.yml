name: KINTO customer password isolated security gate
on:
  pull_request:
    paths:
      - 'sql/kinto-customer-password-change-proposal-20261030.sql'
      - 'sql/customer-password-v1/**'
      - 'docs/customer-password-v1/**'
      - 'ci/customer-password-install.integration.mjs'
      - 'ci/customer-password-change.integration.mjs'
      - 'ci/customer-password-ui.test.mjs'
      - 'ci/customer-password-browser.test.mjs'
      - 'js/kinto-customer-password-v1.js'
      - 'js/customer-navigation-drawer-v156.js'
      - 'dashboard.html'
      - '.github/workflows/kinto-customer-password-security.yml'
  workflow_dispatch:
jobs:
  isolated-customer-password:
    # Playwright 1.55.0 does not support the Ubuntu 26.04 ubuntu-latest image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated SQL engine (no production credentials)
        run: npm install --prefix "$RUNNER_TEMP/kinto-pg" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.8
      - name: Run customer password security cases
        run: KINTO_PGLITE_MODULE="$RUNNER_TEMP/kinto-pg/node_modules/@electric-sql/pglite/dist/index.js" node ci/customer-password-change.integration.mjs
      - name: Test standalone installer, verification and safe rollback
        run: |
          KINTO_PGLITE_MODULE="$RUNNER_TEMP/kinto-pg/node_modules/@electric-sql/pglite/dist/index.js" node ci/customer-password-install.integration.mjs
          KINTO_PGLITE_MODULE="$RUNNER_TEMP/kinto-pg/node_modules/@electric-sql/pglite/dist/index.js" node ci/customer-password-change.integration.mjs --installer
      - name: Test isolated password UI contract
        run: node --test ci/customer-password-ui.test.mjs
      - name: Install Chromium test dependencies
        run: |
          npm install --ignore-scripts --no-package-lock --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Test password session messages in isolated Chromium
        run: node --test ci/customer-password-browser.test.mjs
