name: Index Auth Header V51
on:
  push:
    branches: [main]
    paths:
      - 'scripts/index-auth-header-v51.py'
      - '.github/workflows/index-auth-header-v51.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/index-auth-header-v51.py
      - name: Verify header auth placement
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert s.count('id="authLink"') == 1
          assert s.count('id="logoutBtn"') == 1
          assert 'indexAuthHeaderV51' in s
          assert '!fixed !bottom-4 !left-4 !top-auto' not in s
          nav=s[s.index('<nav class="sticky'):s.index('</nav>')]
          assert 'id="authLink"' in nav and 'id="logoutBtn"' in nav
          print('Index auth header V51 OK')
          PY
      - name: Commit production UI patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: move customer auth controls into top header V51'
          git push
