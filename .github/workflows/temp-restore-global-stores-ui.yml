name: temp-restore-global-stores-ui
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  patch:
    if: github.head_ref == 'fix/restore-global-stores-and-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-global-stores-and-ui
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply surgical patch
        run: python3 tools/restore_global_stores_ui_patch.py
      - name: Validate JavaScript and diff
        shell: bash
        run: |
          node --check js/local-store-pricing.js
          python3 - <<'PY'
          import re,subprocess,tempfile,pathlib
          text=pathlib.Path('admin-dashboard.html').read_text(encoding='utf-8')
          for i,(attrs,code) in enumerate(re.findall(r'<script\b([^>]*)>(.*?)</script>',text,re.S|re.I)):
              if re.search(r'\bsrc\s*=',attrs,re.I):
                  continue
              p=pathlib.Path(tempfile.gettempdir())/f'admin-dashboard-{i}.js'
              p.write_text(code,encoding='utf-8')
              subprocess.run(['node','--check',str(p)],check=True)
          PY
          git diff --check
          grep -F 'images/N11.png' supabase/migrations/20260820_restore_global_stores_seed.sql
          grep -F 'images/KOTON.png' supabase/migrations/20260820_restore_global_stores_seed.sql
      - name: Commit final patch and remove temporary tooling
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp-restore-global-stores-ui.yml tools/restore_global_stores_ui_patch.py
          git add admin-dashboard.html js/local-store-pricing.js supabase/migrations/20260820_restore_global_stores_seed.sql
          git diff --cached --check
          git commit -m 'fix: restore global stores and polish logo UI'
          git push origin HEAD:fix/restore-global-stores-and-ui
