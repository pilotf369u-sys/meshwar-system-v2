name: Bump local card style version
on:
  push:
    branches: [main]
    paths: [.github/workflows/bump-local-card-style-version.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update local card cache version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r'src="js/local-store-card-v3\.js(?:\?v=[^"]*)?"','src="js/local-store-card-v3.js?v=ed1a02a"',s,count=1)
          if n!=1: raise SystemExit('local-store-card-v3 include not found')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: |
          node --check js/local-store-card-v3.js
          grep -F 'js/local-store-card-v3.js?v=ed1a02a' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Bump local store card style cache version'
          git push origin main
