name: Emergency Restore Customer V43
on:
  push:
    branches: [main]
    paths: ['.github/workflows/emergency-restore-v43.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact stable V43 dashboard and remove V46 CSS
        run: |
          git show e6f99778b206ed81a35b4e9e0146f8074f8cbc9f:dashboard.html > dashboard.html
          rm -f css/customer-mobile-cards-v46.css
          test "$(wc -c < dashboard.html)" -gt 10000
          ! grep -q 'customer-mobile-cards-v46.css' dashboard.html
      - name: Commit exact rollback
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dashboard.html css/customer-mobile-cards-v46.css
          git commit -m 'revert: restore exact stable customer V43 baseline'
          git push
