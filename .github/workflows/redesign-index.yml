name: Modern customer index redesign
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/redesign-index.yml'
permissions:
  contents: write
jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Redesign index without touching legacy behavior
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          original=s

          old_scripts=re.findall(r'<script\b[^>]*>.*?</script>', original, flags=re.S|re.I)
          old_ids=set(re.findall(r'\bid=["\']([^"\']+)["\']', original, flags=re.I))
          old_classes=set()
          for raw in re.findall(r'\bclass=["\']([^"\']*)["\']', original, flags=re.I):
              old_classes.update(x for x in raw.split() if x)

          # Tailwind + dark mode initialization. Existing scripts remain byte-for-byte unchanged.
          if 'cdn.tailwindcss.com' not in s:
              marker='<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">'
              if marker not in s: raise SystemExit('font-awesome marker missing')
              inject='''\n    <script src="https://cdn.tailwindcss.com"></script>\n    <script>tailwind.config={darkMode:'class',corePlugins:{preflight:false}};</script>\n    <script>(()=>{try{const v=localStorage.getItem('meshwar-theme');document.documentElement.classList.toggle('dark',v!=='light')}catch{document.documentElement.classList.add('dark')}})();</script>'''
              s=s.replace(marker,marker+inject,1)

          # Preserve all existing class names; only append Tailwind utilities to static UI elements.
          replacements={
            '<body>':'<body class="min-h-screen bg-slate-950 text-slate-100 antialiased transition-colors duration-300">',
            'class="header-container"':'class="header-container relative mx-auto max-w-7xl overflow-hidden rounded-3xl border border-white/10 bg-slate-900/60 px-6 py-10 backdrop-blur-md shadow-2xl"',
            'class="nav-container"':'class="nav-container mx-auto flex max-w-7xl flex-wrap items-center justify-center gap-3 rounded-2xl border border-white/10 bg-slate-900/70 p-3 backdrop-blur-md shadow-lg"',
            'class="section-title"':'class="section-title mx-auto mt-14 max-w-7xl text-xl font-black tracking-tight text-slate-100"',
            'class="grid-container"':'class="grid-container mx-auto max-w-7xl gap-5"',
            'class="store-card"':'class="store-card group relative overflow-hidden rounded-2xl border border-white/10 bg-slate-900/60 backdrop-blur-md shadow-lg transition-all duration-300 hover:scale-[1.02] hover:shadow-cyan-500/10"',
            'class="logo-container"':'class="logo-container rounded-xl bg-white/5 p-2"',
            'class="store-logo"':'class="store-logo transition-transform duration-300 group-hover:scale-105"',
            'class="store-link"':'class="store-link transition-all duration-300 hover:shadow-lg hover:shadow-sky-500/20"'
          }
          for a,b in replacements.items():
              s=s.replace(a,b)

          modern_css=r'''

        /* MESHWAR_MODERN_INDEX_V2 */
        :root{--mw-bg:#020617;--mw-panel:rgba(15,23,42,.66);--mw-border:rgba(255,255,255,.10);--mw-text:#e2e8f0;--mw-muted:#94a3b8;--mw-accent:#38bdf8}
        html{scroll-behavior:smooth;color-scheme:dark}
        html:not(.dark){color-scheme:light;--mw-bg:#eef2ff;--mw-panel:rgba(255,255,255,.76);--mw-border:rgba(15,23,42,.10);--mw-text:#0f172a;--mw-muted:#475569;--mw-accent:#0284c7}
        body{background:
          radial-gradient(circle at 12% 8%,rgba(56,189,248,.13),transparent 28%),
          radial-gradient(circle at 88% 18%,rgba(99,102,241,.16),transparent 30%),
          radial-gradient(circle at 50% 90%,rgba(14,165,233,.08),transparent 34%),var(--mw-bg)!important;color:var(--mw-text)!important;padding:0!important;overflow-x:hidden}
        html:not(.dark) body{background:radial-gradient(circle at 10% 8%,rgba(14,165,233,.14),transparent 30%),radial-gradient(circle at 90% 14%,rgba(99,102,241,.12),transparent 30%),#f8fafc!important}
        .meshwar-modern-nav{position:sticky;top:0;z-index:11000;border-bottom:1px solid var(--mw-border);background:rgba(2,6,23,.76);backdrop-filter:blur(20px)}
        html:not(.dark) .meshwar-modern-nav{background:rgba(248,250,252,.82)}
        .meshwar-modern-nav-inner{max-width:1180px;margin:auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px}
        .meshwar-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--mw-text);font-weight:900}.meshwar-brand img{width:44px;height:44px;object-fit:contain;border-radius:13px;background:rgba(255,255,255,.06);border:1px solid var(--mw-border);padding:4px}.meshwar-brand small{display:block;color:var(--mw-muted);font-size:10px;font-weight:700;margin-top:2px}
        .meshwar-nav-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.meshwar-nav-chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--mw-border);background:rgba(255,255,255,.055);color:var(--mw-text);border-radius:999px;padding:9px 13px;text-decoration:none;font-size:12px;font-weight:800;cursor:pointer;transition:.25s}.meshwar-nav-chip:hover{transform:translateY(-1px);border-color:rgba(56,189,248,.45);box-shadow:0 8px 24px rgba(14,165,233,.10)}
        .meshwar-hero{max-width:1180px;margin:34px auto 10px;padding:0 18px}.meshwar-hero-panel{position:relative;overflow:hidden;border-radius:30px;border:1px solid var(--mw-border);background:linear-gradient(135deg,rgba(15,23,42,.84),rgba(30,41,59,.60));box-shadow:0 30px 80px rgba(2,6,23,.34);backdrop-filter:blur(18px);padding:clamp(24px,5vw,54px)}html:not(.dark) .meshwar-hero-panel{background:linear-gradient(135deg,rgba(255,255,255,.92),rgba(238,242,255,.80));box-shadow:0 30px 80px rgba(15,23,42,.10)}
        .meshwar-hero-panel:before{content:"";position:absolute;width:330px;height:330px;border-radius:50%;background:rgba(56,189,248,.15);filter:blur(18px);top:-210px;right:-70px}.meshwar-hero-panel:after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;background:rgba(99,102,241,.18);filter:blur(20px);bottom:-190px;left:-40px}.meshwar-hero-grid{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(320px,.8fr);gap:30px;align-items:center}.meshwar-eyebrow{display:inline-flex;gap:8px;align-items:center;border:1px solid rgba(56,189,248,.25);background:rgba(56,189,248,.08);color:#7dd3fc;border-radius:999px;padding:7px 12px;font-size:11px;font-weight:900}.meshwar-hero h2{font-size:clamp(31px,5vw,57px);line-height:1.08;margin:15px 0 12px;font-weight:950;letter-spacing:-1.8px;color:var(--mw-text)}.meshwar-hero h2 span{background:linear-gradient(90deg,#38bdf8,#818cf8,#60a5fa);-webkit-background-clip:text;color:transparent}.meshwar-hero-copy{color:var(--mw-muted);font-size:14px;line-height:1.9;max-width:680px}.meshwar-hero-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.meshwar-primary-btn,.meshwar-secondary-btn{border:0;border-radius:14px;padding:12px 17px;font-weight:900;cursor:pointer;transition:.25s;display:inline-flex;align-items:center;gap:8px;text-decoration:none}.meshwar-primary-btn{background:linear-gradient(90deg,#0284c7,#4f46e5);color:#fff;box-shadow:0 12px 35px rgba(56,189,248,.18)}.meshwar-secondary-btn{border:1px solid var(--mw-border);background:rgba(255,255,255,.06);color:var(--mw-text)}.meshwar-primary-btn:hover,.meshwar-secondary-btn:hover{transform:translateY(-2px) scale(1.01)}
        .meshwar-track-card{border:1px solid var(--mw-border);background:rgba(2,6,23,.46);border-radius:22px;padding:18px;backdrop-filter:blur(14px)}html:not(.dark) .meshwar-track-card{background:rgba(255,255,255,.55)}.meshwar-track-card h3{margin:0 0 5px;font-size:15px;color:var(--mw-text)}.meshwar-track-card p{margin:0 0 14px;color:var(--mw-muted);font-size:11px}.meshwar-track-row{display:flex;gap:8px}.meshwar-track-row input{min-width:0;flex:1;border:1px solid var(--mw-border)!important;background:rgba(2,6,23,.55)!important;color:#fff!important;border-radius:13px!important;padding:12px!important;margin:0!important;outline:none}.meshwar-track-row input:focus{border-color:rgba(56,189,248,.55)!important;box-shadow:0 0 0 3px rgba(56,189,248,.10)}html:not(.dark) .meshwar-track-row input{background:rgba(255,255,255,.9)!important;color:#0f172a!important}
        .header-container{margin:26px auto 0!important;background:var(--mw-panel)!important;border-color:var(--mw-border)!important;color:var(--mw-text)!important}.header-container .main-logo{width:250px!important;filter:drop-shadow(0 10px 30px rgba(56,189,248,.12))}.header-container h1{color:var(--mw-text)!important;font-size:28px!important}.header-container p{color:var(--mw-muted)!important}.user-auth-zone{position:fixed!important;top:auto!important;bottom:20px!important;left:20px!important;z-index:10500!important}.account-btn{background:linear-gradient(90deg,#0369a1,#4338ca)!important;box-shadow:0 12px 30px rgba(14,165,233,.18)!important}.fixed-order-btn{background:linear-gradient(90deg,#0284c7,#4f46e5)!important;box-shadow:0 15px 35px rgba(14,165,233,.24)!important}
        .nav-container{position:relative!important;top:auto!important;margin-top:24px!important;background:var(--mw-panel)!important;border-color:var(--mw-border)!important;box-shadow:0 18px 45px rgba(2,6,23,.16)!important}.nav-container a{background:rgba(255,255,255,.055)!important;color:var(--mw-text)!important;border-color:var(--mw-border)!important}.nav-container a:hover{background:rgba(14,165,233,.18)!important;color:#7dd3fc!important;border-color:rgba(56,189,248,.38)!important;box-shadow:none!important}
        .section-title{color:var(--mw-text)!important;border:0!important;padding:0 18px 12px!important;position:relative}.section-title:after{content:"";display:block;width:72px;height:3px;margin-top:9px;border-radius:99px;background:linear-gradient(90deg,#38bdf8,#6366f1)}.grid-container{padding:0 18px;display:grid!important;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))!important;justify-content:stretch!important}.store-card{width:auto!important;height:210px!important;background:var(--mw-panel)!important;border-color:var(--mw-border)!important;color:var(--mw-text)!important;padding:16px!important}.store-card h3{margin:8px 0;color:var(--mw-text);font-size:14px}.logo-container{height:86px!important;background:rgba(255,255,255,.035)!important}.store-logo{max-width:88%!important;max-height:68px!important}.store-link{background:linear-gradient(90deg,#0369a1,#4338ca)!important;border-radius:10px!important;padding:9px 12px!important}.local-link{background:linear-gradient(90deg,#ea580c,#f59e0b)!important}
        .local-stores-shell{max-width:1180px!important;margin:42px auto 0!important;background:var(--mw-panel)!important;border-color:var(--mw-border)!important;box-shadow:0 28px 70px rgba(2,6,23,.25)!important}.local-stores-head h2,.local-public-name{color:var(--mw-text)!important}.local-stores-head p,.local-public-meta,.local-empty{color:var(--mw-muted)!important}.local-public-card{background:rgba(255,255,255,.045)!important;border-color:var(--mw-border)!important;transition:.3s!important}.local-public-card:hover{transform:translateY(-5px) scale(1.015)!important;border-color:rgba(56,189,248,.35)!important;box-shadow:0 18px 50px rgba(14,165,233,.10)!important}.local-filter-btn{color:var(--mw-text)!important;border-color:var(--mw-border)!important;background:rgba(255,255,255,.05)!important}.local-filter-btn:hover,.local-filter-btn.active{background:linear-gradient(90deg,#0284c7,#4f46e5)!important;border-color:transparent!important;color:#fff!important}.local-public-chip{color:#7dd3fc!important}
        .modal-overlay,.modal{backdrop-filter:blur(10px)}
        @media(max-width:820px){.meshwar-modern-nav-inner{align-items:flex-start}.meshwar-brand small{display:none}.meshwar-nav-actions{justify-content:flex-end}.meshwar-nav-chip span{display:none}.meshwar-hero{margin-top:22px}.meshwar-hero-grid{grid-template-columns:1fr}.meshwar-hero-panel{padding:24px}.meshwar-hero h2{letter-spacing:-1px}.grid-container{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:12px!important}.store-card{height:196px!important;padding:12px!important}.user-auth-zone{left:12px!important;bottom:12px!important}.fixed-order-btn{right:12px!important;bottom:12px!important;padding:12px 16px!important}.local-stores-shell{margin-left:12px!important;margin-right:12px!important;padding:18px!important}.header-container{margin-left:12px!important;margin-right:12px!important}.nav-container{margin-left:12px!important;margin-right:12px!important}}
        @media(max-width:460px){.meshwar-modern-nav-inner{padding:10px 12px}.meshwar-nav-chip{padding:8px 10px}.meshwar-hero{padding:0 12px}.meshwar-hero-panel{border-radius:22px;padding:20px}.meshwar-track-row{flex-direction:column}.grid-container{padding:0 12px}.section-title{padding-left:12px!important;padding-right:12px!important}.store-card{height:188px!important}.header-container .main-logo{width:190px!important}}
'''
          first_close=s.find('</style>')
          if first_close<0: raise SystemExit('style close missing')
          if 'MESHWAR_MODERN_INDEX_V2' not in s:
              s=s[:first_close]+modern_css+s[first_close:]

          navbar=r'''
    <nav class="meshwar-modern-nav" aria-label="التنقل الرئيسي">
      <div class="meshwar-modern-nav-inner">
        <a class="meshwar-brand" href="index.html"><img src="images/meshwar-logo.png" alt="MeshWar"><div>MeshWar<small>تسوق وشحن بواجهة واحدة</small></div></a>
        <div class="meshwar-nav-actions">
          <a class="meshwar-nav-chip" href="#localStoresPublic"><i class="fa-solid fa-store"></i><span>المتاجر المحلية</span></a>
          <button type="button" class="meshwar-nav-chip" onclick="document.getElementById('orderModal').style.display='block'"><i class="fa-solid fa-cart-shopping"></i><span>طلب منتج</span></button>
          <button type="button" id="meshwarThemeToggle" class="meshwar-nav-chip" aria-label="تبديل الوضع"><i class="fa-solid fa-moon"></i><span>المظهر</span></button>
        </div>
      </div>
    </nav>
    <section class="meshwar-hero">
      <div class="meshwar-hero-panel">
        <div class="meshwar-hero-grid">
          <div>
            <div class="meshwar-eyebrow"><i class="fa-solid fa-bolt"></i> منصة MeshWar الجديدة</div>
            <h2>كل مشترياتك وشحناتك<br><span>في مكان واحد.</span></h2>
            <p class="meshwar-hero-copy">تصفح المتاجر المحلية والعالمية، اطلب منتجك مباشرة، وتابع شحنتك من واجهة سريعة ومتجاوبة مصممة للعمل بسلاسة على الهاتف والكمبيوتر.</p>
            <div class="meshwar-hero-cta"><button type="button" class="meshwar-primary-btn" onclick="document.getElementById('orderModal').style.display='block'"><i class="fa-solid fa-bag-shopping"></i> طلب منتج مباشر</button><a class="meshwar-secondary-btn" href="#localStoresPublic"><i class="fa-solid fa-shop"></i> استكشف المتاجر المحلية</a></div>
          </div>
          <div class="meshwar-track-card">
            <h3><i class="fa-solid fa-location-crosshairs"></i> تتبع سريع للطلب</h3>
            <p>أدخل رقم الطلب أو الباركود وسنحوّلك لأداة التتبع الموجودة في الصفحة.</p>
            <div class="meshwar-track-row"><input id="meshwarHeroTrackInput" type="text" placeholder="MW / رقم الطلب / الباركود" autocomplete="off"><button id="meshwarHeroTrackBtn" type="button" class="meshwar-primary-btn" onclick="meshwarQuickTrack()"><i class="fa-solid fa-magnifying-glass"></i> تتبع</button></div>
          </div>
        </div>
      </div>
    </section>
'''
          if 'meshwar-modern-nav' not in s:
              s=s.replace('<body class="min-h-screen bg-slate-950 text-slate-100 antialiased transition-colors duration-300">','<body class="min-h-screen bg-slate-950 text-slate-100 antialiased transition-colors duration-300">\n'+navbar,1)

          extra_script=r'''
<script>
/* MESHWAR_MODERN_INDEX_UI_V2 — additive only; legacy functions remain untouched */
(function(){
  const root=document.documentElement,btn=document.getElementById('meshwarThemeToggle');
  function sync(){if(!btn)return;const dark=root.classList.contains('dark');const i=btn.querySelector('i');if(i)i.className=dark?'fa-solid fa-sun':'fa-solid fa-moon';btn.title=dark?'الوضع الفاتح':'الوضع الداكن'}
  if(btn)btn.addEventListener('click',function(){const dark=!root.classList.contains('dark');root.classList.toggle('dark',dark);try{localStorage.setItem('meshwar-theme',dark?'dark':'light')}catch{}sync()});sync();
})();
function meshwarQuickTrack(){
  const source=document.getElementById('meshwarHeroTrackInput'),code=String(source?.value||'').trim();
  if(!code)return source?.focus();
  const inputs=[...document.querySelectorAll('input')].filter(el=>el!==source && /track|order|barcode|shipment|code|تتبع|طلب|باركود|شحنة/i.test([el.id,el.name,el.placeholder].filter(Boolean).join(' ')));
  if(inputs[0]){inputs[0].value=code;inputs[0].dispatchEvent(new Event('input',{bubbles:true}));inputs[0].dispatchEvent(new Event('change',{bubbles:true}));}
  if(typeof window.trackOrder==='function')return window.trackOrder();
  if(typeof window.trackShipment==='function')return window.trackShipment();
  const target=[...document.querySelectorAll('button,a')].find(el=>el.id!=='meshwarHeroTrackBtn' && /تتبع|track/i.test(el.textContent||''));
  if(target){target.scrollIntoView({behavior:'smooth',block:'center'});if(target.tagName==='BUTTON')setTimeout(()=>target.click(),350)}
}
</script>
'''
          if 'MESHWAR_MODERN_INDEX_UI_V2' not in s:
              pos=s.rfind('</body>')
              if pos<0: raise SystemExit('body close missing')
              s=s[:pos]+extra_script+s[pos:]

          # Safety checks: old script blocks must remain exact; all previous ids/classes must remain present.
          for i,block in enumerate(old_scripts):
              if block not in s: raise SystemExit(f'legacy script block changed or missing: {i}')
          new_ids=set(re.findall(r'\bid=["\']([^"\']+)["\']', s, flags=re.I))
          new_classes=set()
          for raw in re.findall(r'\bclass=["\']([^"\']*)["\']', s, flags=re.I):
              new_classes.update(x for x in raw.split() if x)
          missing_ids=old_ids-new_ids
          missing_classes=old_classes-new_classes
          if missing_ids: raise SystemExit('missing legacy ids: '+','.join(sorted(missing_ids)))
          if missing_classes: raise SystemExit('missing legacy class tokens: '+','.join(sorted(missing_classes)))
          for token in ['orderModal','localStoresPublic','localSpecialtyFilters','localStoresPublicGrid','fixed-order-btn']:
              if token not in s: raise SystemExit('critical token missing: '+token)

          p.write_text(s,encoding='utf-8')
          print('legacy scripts preserved:',len(old_scripts),'ids:',len(old_ids),'classes:',len(old_classes))
          PY
      - name: Commit redesign to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/redesign-index.yml
          git add -A -- index.html .github/workflows/redesign-index.yml
          git diff --cached --check
          git commit -m "Redesign customer index with modern Tailwind UI"
          git push origin main
