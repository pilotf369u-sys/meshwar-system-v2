name: Admin executive premerge verification
on:
  push:
    branches: [agent/admin-executive-gold]
    paths: ['.github/workflows/admin-executive-premerge.yml']
permissions:
  contents: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/admin-executive-gold
          fetch-depth: 2
      - name: Apply isolated admin UI patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # ---------- admin-dashboard.html ----------
          p=Path('admin-dashboard.html')
          s=p.read_text(encoding='utf-8')

          old_cards='''<div class="vendor-finance-cards"><div class="vendor-finance-card">إجمالي المبيعات<b id="adminFinSales">0</b></div><div class="vendor-finance-card">عمولة MeshWar<b id="adminFinCommission">0</b></div><div class="vendor-finance-card">المبلغ المعلق<b id="adminFinPending">0</b></div><div class="vendor-finance-card">المبلغ المدفوع<b id="adminFinPaid">0</b></div><div class="vendor-finance-card">صافي حساب المتاجر<b id="adminFinNet">0</b></div></div>'''
          new_cards='''<div class="vendor-finance-cards executive-metrics"><div class="vendor-finance-card"><span>💰 إجمالي التحصيل والمبيعات</span><b id="adminFinSales">0</b><small>المبيعات المكتملة للمتاجر</small></div><div class="vendor-finance-card"><span>👑 عمولة المنصة الإجمالية</span><b id="adminFinCommission">0</b><small>عمولة MeshWar المحتسبة</small></div><div class="vendor-finance-card"><span>🧾 إجمالي مبالغ أخرى</span><b id="adminFinOther">0</b><small>الخصومات والمبالغ الإضافية</small></div><div class="vendor-finance-card"><span>🏦 صافي مستحقات المتاجر</span><b id="adminFinNet">0</b><small>بعد العمولة ومبالغ أخرى</small></div></div>'''
          if old_cards not in s: raise SystemExit('admin finance cards marker not found')
          s=s.replace(old_cards,new_cards,1)

          old_summary="document.getElementById('adminFinSales').innerText=adminVendorFinanceSummaryText(all,'total');document.getElementById('adminFinCommission').innerText=adminVendorFinanceSummaryText(all,'commission');document.getElementById('adminFinPending').innerText=adminVendorFinanceSummaryText(all.filter(r=>r.paymentStatus==='pending'),'net');document.getElementById('adminFinPaid').innerText=adminVendorFinanceSummaryText(all.filter(r=>r.paymentStatus==='paid'),'net');document.getElementById('adminFinNet').innerText=adminVendorFinanceSummaryText(all,'net');"
          new_summary="document.getElementById('adminFinSales').innerText=adminVendorFinanceSummaryText(all,'total');document.getElementById('adminFinCommission').innerText=adminVendorFinanceSummaryText(all,'commission');document.getElementById('adminFinOther').innerText=adminVendorFinanceSummaryText(all,'other');document.getElementById('adminFinNet').innerText=adminVendorFinanceSummaryText(all,'net');"
          if old_summary not in s: raise SystemExit('admin finance summary marker not found')
          s=s.replace(old_summary,new_summary,1)

          insert='''
<style id="admin-executive-gold-v1">
:root{--exec-gold:#f6c85f;--exec-gold2:#d7a62e;--exec-navy:#040b14;--exec-slate:#0d1a2d;--exec-card:rgba(13,26,45,.86);--exec-line:rgba(246,200,95,.22);--exec-text:#f8fafc;--exec-muted:#a9b8cc}
html{background:var(--exec-navy);color-scheme:dark}body{background:radial-gradient(circle at 10% 0%,rgba(246,200,95,.12),transparent 25%),radial-gradient(circle at 92% 8%,rgba(37,99,235,.18),transparent 30%),linear-gradient(145deg,#02060d,#06101d 48%,#0a1424)!important;color:var(--exec-text)!important;min-height:100vh}.sidebar{width:270px!important;background:linear-gradient(180deg,rgba(12,29,49,.98),rgba(5,13,24,.98))!important;border-left:1px solid rgba(246,200,95,.25)!important;box-shadow:-18px 0 55px rgba(0,0,0,.32),inset 1px 0 rgba(255,255,255,.03)!important;padding:18px 14px!important;backdrop-filter:blur(22px)}.sidebar h2{color:#fff!important;letter-spacing:.3px}.sidebar a{background:rgba(30,53,79,.76)!important;border:1px solid rgba(148,163,184,.10)!important;border-radius:12px!important;color:#e8eef7!important;transition:.2s ease!important;box-shadow:none!important}.sidebar a:hover,.sidebar a.active{background:linear-gradient(135deg,rgba(246,200,95,.98),rgba(215,166,46,.96))!important;color:#151515!important;border-color:#f6c85f!important;transform:translateX(-3px);box-shadow:0 10px 24px rgba(215,166,46,.18)!important}.main-content{margin-right:300px!important;padding:30px!important}.main-content>h1{color:#fff!important;text-shadow:0 4px 28px rgba(246,200,95,.12)}.card{background:linear-gradient(145deg,rgba(13,26,45,.91),rgba(6,15,28,.88))!important;border:1px solid var(--exec-line)!important;border-radius:22px!important;box-shadow:0 22px 60px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.035)!important;color:#f8fafc!important;backdrop-filter:blur(18px)}.card h3{color:#fde7a4!important}.mini{color:var(--exec-muted)!important}.order-toolbar,.branch-tools,.finance-filter-row,.perm-box{background:rgba(10,22,39,.78)!important;border:1px solid rgba(246,200,95,.16)!important;border-radius:15px!important;color:#e6edf7!important}.table-wrap{background:rgba(4,12,23,.72)!important;border:1px solid rgba(246,200,95,.14)!important;border-radius:16px!important}table{background:transparent!important}th{background:#102139!important;color:#fde7a4!important;border-color:rgba(148,163,184,.12)!important}td{color:#e7eef8!important;border-color:rgba(148,163,184,.10)!important}tr.order-row-new{background:rgba(246,200,95,.08)!important}tr.order-row-approved{background:rgba(22,163,74,.08)!important}tr.order-row-rejected{background:rgba(220,38,38,.08)!important}input,select{background:rgba(2,8,18,.72)!important;color:#f8fafc!important;border:1px solid rgba(148,163,184,.20)!important;outline:none}input:focus,select:focus{border-color:rgba(246,200,95,.62)!important;box-shadow:0 0 0 3px rgba(246,200,95,.08)!important}.modal-content,.dashboard-scanner-panel,.detail-box{background:#0d1a2d!important;color:#f8fafc!important;border-color:rgba(246,200,95,.18)!important}.pipeline-tab{background:rgba(15,32,53,.84)!important;color:#dbe6f4!important;border-color:rgba(148,163,184,.14)!important}.pipeline-tab.active{background:linear-gradient(135deg,#fde7a4,#f6c85f 55%,#d7a62e)!important;color:#121212!important;border-color:#f6c85f!important;box-shadow:0 8px 24px rgba(215,166,46,.20)!important}.executive-metrics{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:14px!important}.vendor-finance-card{position:relative;overflow:hidden;background:linear-gradient(145deg,rgba(18,36,59,.94),rgba(8,19,34,.92))!important;border:1px solid rgba(246,200,95,.26)!important;border-radius:20px!important;padding:18px!important;min-height:128px;box-shadow:0 18px 38px rgba(0,0,0,.24),inset 3px 0 0 rgba(246,200,95,.86)!important}.vendor-finance-card:after{content:'';position:absolute;inset:auto -20px -45px auto;width:100px;height:100px;border-radius:50%;background:rgba(246,200,95,.08);filter:blur(4px)}.vendor-finance-card span{display:block;color:#fde7a4;font-weight:900}.vendor-finance-card b{font-size:22px!important;color:#fff!important;margin:12px 0 6px!important;direction:ltr;unicode-bidi:isolate;text-align:right}.vendor-finance-card small{color:#92a5bd;font-size:10px}.finance-filter-row label{color:#e8eef7!important}.finance-filter-row button.active,#vendor-finance .btn-green,#vendor-finance .btn-purple{background:linear-gradient(135deg,#f6c85f,#d7a62e)!important;color:#171717!important;border:1px solid #f9da8a!important;box-shadow:0 8px 22px rgba(215,166,46,.18)!important}.finance-filter-row .btn-purple{padding-inline:16px!important}#vendor-finance input[id^="adminVendorOther-"]{border-color:rgba(246,200,95,.45)!important;background:rgba(246,200,95,.08)!important;color:#fde7a4!important;font-weight:900}.btn-green,.btn-blue,.btn-purple,.btn-orange,.btn-dark{transition:.2s ease!important}.btn-green:hover,.btn-blue:hover,.btn-purple:hover,.btn-orange:hover,.btn-dark:hover{transform:translateY(-1px);filter:brightness(1.08)}
@media(max-width:1100px){.executive-metrics{grid-template-columns:repeat(2,minmax(0,1fr))!important}.main-content{margin-right:285px!important;padding:18px!important}}
@media(max-width:850px){.sidebar{position:static!important;width:auto!important;border-left:0!important;border-bottom:1px solid rgba(246,200,95,.24)!important}.main-content{margin:0!important;padding:10px!important}.executive-metrics{grid-template-columns:1fr!important}}
</style>
<script id="admin-executive-nav-v1">
window.addEventListener('load',()=>{const section=new URLSearchParams(location.search).get('section');if(!section)return;setTimeout(()=>{try{if(section==='local-stores'&&typeof openLocalStoresAdmin==='function'){openLocalStoresAdmin();return}if(section==='vendor-finance'){showSection('vendor-finance');if(typeof loadAdminVendorFinance==='function')loadAdminVendorFinance();return}if(document.getElementById(section)&&typeof showSection==='function')showSection(section)}catch(e){console.warn('Admin section navigation:',e)}},80)});
</script>
'''
          if '</body></html>' not in s: raise SystemExit('admin dashboard closing marker not found')
          s=s.replace('</body></html>',insert+'</body></html>',1)
          p.write_text(s,encoding='utf-8')

          # ---------- admin-branches.html ----------
          p=Path('admin-branches.html')
          s=p.read_text(encoding='utf-8')
          old_sidebar='''<div class="sidebar"><h2>لوحة الإدارة</h2><a id="adminDashboardLink" href="admin-dashboard.html">إدارة الطلبات</a><a id="branchesLink" class="active" href="admin-branches.html">إدارة الفروع والمخازن</a><a id="reportsLink" href="admin-branch-reports.html">تقارير الفروع</a><a href="login.html" style="background:#c0392b">تسجيل الخروج</a></div>'''
          new_sidebar='''<div class="sidebar"><h2>لوحة الإدارة</h2><a id="adminDashboardLink" data-admin-section="orders" href="admin-dashboard.html">إدارة الطلبات</a><a data-admin-section="pricing" href="admin-dashboard.html">إدارة التسعير والشحن</a><a data-admin-section="whatsapp" href="admin-dashboard.html">إشعارات الواتساب</a><a data-admin-section="employees" href="admin-dashboard.html">إدارة الموظفين</a><a data-admin-section="delivery" href="admin-dashboard.html">إدارة المندوبين</a><a data-admin-page="admin-delivery-reports.html" href="admin-delivery-reports.html">تقرير ومتابعة المندوبين</a><a id="branchesLink" class="active" data-admin-page="admin-branches.html" href="admin-branches.html">إدارة الفروع والمخازن</a><a id="reportsLink" data-admin-page="admin-branch-reports.html" href="admin-branch-reports.html">تقرير ومتابعة الفروع</a><a data-admin-section="vendor-finance" href="admin-dashboard.html">💰 الحسابات والتقارير المالية</a><a data-admin-section="local-stores" href="admin-dashboard.html">🏪 إدارة المتاجر المحلية</a><a data-admin-section="exchange" href="admin-dashboard.html">أسعار صرف العملات</a><a data-admin-section="stores" href="admin-dashboard.html">إدارة المتاجر</a><a data-admin-section="customers" href="admin-dashboard.html">إدارة العملاء</a><a data-admin-section="content" href="admin-dashboard.html">إدارة المحتوى</a><a href="login.html" class="logout-link">تسجيل الخروج</a></div>'''
          if old_sidebar not in s: raise SystemExit('admin branches sidebar marker not found')
          s=s.replace(old_sidebar,new_sidebar,1)

          old_links="function updateLinks(){const q='?adminId='+encodeURIComponent(cloudId(currentAdmin.id));adminDashboardLink.href='admin-dashboard.html'+q;branchesLink.href='admin-branches.html'+q;reportsLink.href='admin-branch-reports.html'+q}"
          new_links="function updateLinks(){const id=encodeURIComponent(cloudId(currentAdmin.id)),q='adminId='+id;document.querySelectorAll('[data-admin-section]').forEach(a=>{a.href='admin-dashboard.html?'+q+'&section='+encodeURIComponent(a.dataset.adminSection)});document.querySelectorAll('[data-admin-page]').forEach(a=>{a.href=a.dataset.adminPage+'?'+q})}"
          if old_links not in s: raise SystemExit('admin branches updateLinks marker not found')
          s=s.replace(old_links,new_links,1)

          branches_style='''
<style id="admin-branches-executive-gold-v1">
:root{--exec-gold:#f6c85f;--exec-gold2:#d7a62e;--exec-navy:#040b14;--exec-slate:#0d1a2d;--exec-line:rgba(246,200,95,.22)}html{background:var(--exec-navy);color-scheme:dark}body{background:radial-gradient(circle at 10% 0%,rgba(246,200,95,.12),transparent 25%),radial-gradient(circle at 92% 8%,rgba(37,99,235,.16),transparent 30%),linear-gradient(145deg,#02060d,#06101d 48%,#0a1424)!important;color:#f8fafc!important}.sidebar{width:270px!important;background:linear-gradient(180deg,rgba(12,29,49,.98),rgba(5,13,24,.98))!important;border-left:1px solid rgba(246,200,95,.25)!important;box-shadow:-18px 0 55px rgba(0,0,0,.32)!important;padding:18px 14px!important;overflow:auto!important}.sidebar h2{color:#fff!important}.sidebar a{background:rgba(30,53,79,.76)!important;border:1px solid rgba(148,163,184,.10)!important;border-radius:12px!important;color:#e8eef7!important;transition:.2s ease!important}.sidebar a:hover,.sidebar a.active{background:linear-gradient(135deg,#fde7a4,#f6c85f 55%,#d7a62e)!important;color:#151515!important;border-color:#f6c85f!important;transform:translateX(-3px);box-shadow:0 10px 24px rgba(215,166,46,.18)!important}.sidebar .logout-link{background:linear-gradient(135deg,#c2413a,#8f2725)!important;color:#fff!important;border-color:rgba(255,255,255,.08)!important}.main{margin-right:285px!important;padding:30px!important;width:calc(100% - 285px)!important}.card{background:linear-gradient(145deg,rgba(13,26,45,.91),rgba(6,15,28,.88))!important;border:1px solid var(--exec-line)!important;border-radius:22px!important;box-shadow:0 22px 60px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.035)!important;color:#f8fafc!important}.card h2,.card h3{color:#fde7a4!important}.toolbar,form{background:rgba(10,22,39,.78)!important;border-color:rgba(246,200,95,.16)!important;border-radius:15px!important}input,select{background:rgba(2,8,18,.72)!important;color:#f8fafc!important;border:1px solid rgba(148,163,184,.20)!important;outline:none}input:focus,select:focus{border-color:rgba(246,200,95,.62)!important;box-shadow:0 0 0 3px rgba(246,200,95,.08)!important}table{background:rgba(4,12,23,.62)!important;border-radius:14px;overflow:hidden}th{background:#102139!important;color:#fde7a4!important;border-color:rgba(148,163,184,.12)!important}td{color:#e7eef8!important;border-color:rgba(148,163,184,.10)!important}.ok{background:rgba(22,163,74,.10)!important;border-color:rgba(74,222,128,.24)!important;color:#bbf7d0!important}.muted{color:#a9b8cc!important}.green{background:linear-gradient(135deg,#f6c85f,#d7a62e)!important;color:#171717!important}.blue{background:linear-gradient(135deg,#2563eb,#1d4ed8)!important}.red{background:linear-gradient(135deg,#c2413a,#8f2725)!important}.orange{background:linear-gradient(135deg,#d7a62e,#a97916)!important;color:#151515!important}.purple{background:linear-gradient(135deg,#7c3aed,#5b21b6)!important}button{transition:.2s ease!important}button:hover{transform:translateY(-1px);filter:brightness(1.07)}
@media(max-width:900px){.sidebar{position:static!important;width:100%!important;min-height:auto!important;border-left:0!important;border-bottom:1px solid rgba(246,200,95,.24)!important}.main{margin:0!important;width:100%!important;padding:10px!important}}
</style>
'''
          if '</head>' not in s: raise SystemExit('admin branches head marker not found')
          s=s.replace('</head>',branches_style+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify inline JavaScript syntax and required navigation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          for path in ['admin-dashboard.html','admin-branches.html']:
              html=Path(path).read_text(encoding='utf-8')
              scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html,re.I)
              checked=0
              for i,src in enumerate(scripts):
                  if not src.strip(): continue
                  with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
                      f.write(src); name=f.name
                  r=subprocess.run(['node','--check',name],capture_output=True,text=True)
                  if r.returncode: raise SystemExit(f'{path}: inline script {i} failed\n{r.stderr}')
                  checked+=1
              print(path,'inline scripts checked:',checked)
          PY
          grep -F 'data-admin-section="vendor-finance"' admin-branches.html
          grep -F 'data-admin-section="delivery"' admin-branches.html
          grep -F 'id="adminFinOther"' admin-dashboard.html
          grep -F "adminVendorFinanceSummaryText(all,'other')" admin-dashboard.html
          grep -F "vendor_payment_status" admin-dashboard.html
          grep -F 'exportAdminVendorPaidStatement' admin-dashboard.html
      - name: Commit only admin pages
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-dashboard.html admin-branches.html
          git diff --cached --quiet || git commit -m 'Unify admin navigation and add executive gold UI'
          git push origin agent/admin-executive-gold
