name: KINTO Deals G3A isolation contract
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261002_kinto_deals_v1_g3a_admin_moderation_off.sql'
      - 'ci/kinto-deals-g3a-isolation-contract.test.mjs'
      - '.github/workflows/kinto-deals-g3a-isolation.yml'
  workflow_dispatch:
jobs:
  g3a-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test ci/kinto-deals-g3a-isolation-contract.test.mjs
