name: KINTO Deals G3G vendor review
on:
  pull_request:
    paths:
      - 'vendor-dashboard-v2.html'
      - 'js/vendor-kinto-deals-g3g.js'
      - 'ci/kinto-deals-g3g-vendor-review-ui.test.mjs'
      - '.github/workflows/kinto-deals-g3g-vendor-review.yml'
  workflow_dispatch:
jobs:
  g3g-vendor-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check js/vendor-kinto-deals-g3g.js
      - run: node --test ci/kinto-deals-g3g-vendor-review-ui.test.mjs
