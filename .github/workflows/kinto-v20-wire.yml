name: KINTO V20 Wire
on:
  push:
    branches: [main]
    paths: ['.github/workflows/kinto-v20-wire.yml']
jobs:
  wire:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Activate V20 cache bust
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          old='js/index-featured-campaigns-v1.js?v=20260828-v19-kinto'
          new='js/index-featured-campaigns-v1.js?v=20260828-v20-kinto'
          assert old in s
          p.write_text(s.replace(old,new))
          Path('.github/workflows/kinto-v20-wire.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/kinto-v20-wire.yml
          git commit -m 'feat: activate KINTO V20 DOM and emerald reset'
          git push
