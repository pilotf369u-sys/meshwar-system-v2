name: V93 Bundle Adapters One-Time Wiring
on:
  push:
    branches: [fix/local-cart-v93-bundle-ops]
    paths: ['.github/workflows/v93-bundle-adapters-once.yml']
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/local-cart-v93-bundle-ops
          fetch-depth: 0
      - name: Wire shared bundle UI into dashboards
        shell: python
        run: |
          from pathlib import Path
          files=['dashboard.html','employee-dashboard.html','admin-dashboard.html','branch-dashboard.html']
          marker='KINTO_V93_BUNDLE_ADAPTER'
          include='<script src="js/kinto-bundle-ui-v93.js?v=20260902-v93"></script>'
          adapter=r'''<script id="kinto-v93-bundle-adapter">
          /* KINTO_V93_BUNDLE_ADAPTER — canonical Bundle details + invoice bridge. */
          (()=>{'use strict';
          let last='';
          function pools(){const out=[];for(const k of Object.keys(window)){let v;try{v=window[k]}catch{continue}if(Array.isArray(v)&&v.some(x=>x&&typeof x==='object'&&('details'in x||'order_code'in x||('status'in x&&'total_price'in x))))out.push(v)}return out}
          function visible(){const selectors=['#customerOrderDetailsContent','#orderDetailsContent','#detailsContent','#customerOrderDetailsModal .modal-content','#orderDetailsModal .modal-content','#detailsModal .modal-content'];for(const s of selectors){const el=document.querySelector(s);if(el&&el.offsetParent!==null)return el}return [...document.querySelectorAll('.modal-content')].find(el=>el.offsetParent!==null)||null}
          function orderFor(box){const text=box?.innerText||'';for(const p of pools())for(const o of p){const code=String(o?.order_code||'').trim(),id=String(o?.id||'').trim();if(code&&text.includes(code))return o;if(id&&text.includes(id))return o}return null}
          function run(){const box=visible();if(!box||!window.KintoBundleV93)return;const o=orderFor(box);if(!o)return;const sig=String(o.id||o.order_code||'')+'|'+String(o.updated_at||o.created_at||'');if(box.dataset.kintoV93Sig===sig&&box.querySelector('.kinto-v93-bundle'))return;window.KintoBundleV93.enhance(box,o);box.dataset.kintoV93Sig=sig;last=sig}
          const observer=new MutationObserver(()=>requestAnimationFrame(run));
          function start(){observer.observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['style','class']});document.addEventListener('click',()=>setTimeout(run,60),true);run()}
          if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
          })();
          </script>'''
          for name in files:
              p=Path(name); text=p.read_text(encoding='utf-8')
              if marker in text and 'kinto-bundle-ui-v93.js' in text:
                  continue
              block='\n'+include+'\n'+adapter+'\n'
              pos=text.lower().rfind('</body>')
              if pos<0: raise SystemExit(f'{name}: missing </body>')
              text=text[:pos]+block+text[pos:]
              p.write_text(text,encoding='utf-8')
          wf=Path('.github/workflows/v93-bundle-adapters-once.yml')
          if wf.exists(): wf.unlink()
      - name: Static adapter checks
        run: |
          set -e
          for f in dashboard.html employee-dashboard.html admin-dashboard.html branch-dashboard.html; do
            grep -q 'js/kinto-bundle-ui-v93.js?v=20260902-v93' "$f"
            grep -q 'KINTO_V93_BUNDLE_ADAPTER' "$f"
          done
          node --check js/kinto-bundle-ui-v93.js
      - name: Commit adapter wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard.html employee-dashboard.html admin-dashboard.html branch-dashboard.html .github/workflows/v93-bundle-adapters-once.yml
          git commit -m 'fix: wire V93 bundle details and invoice adapters'
          git push origin HEAD:fix/local-cart-v93-bundle-ops
