name: KINTO V27 Specialty Source Fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/kinto-v27-specialty-source-fix.yml']
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch original specialty generator at source
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="function renderLocalSpecialtyFilters(){const box=document.getElementById('localSpecialtyFilters');if(!box)return;const specs=['الكل',...new Set(localPublicStores.map(s=>String(s.specialty||'شامل').trim()).filter(Boolean))];box.innerHTML=specs.map(x=>`<button class=\"local-filter-btn ${x===localActiveSpecialty?'active':''}\" data-specialty=\"${localEsc(x)}\">${localEsc(x)}</button>`).join('');box.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{localActiveSpecialty=b.dataset.specialty||'الكل';renderLocalSpecialtyFilters();renderLocalPublicStores()}))}"
          new="function renderLocalSpecialtyFilters(){const box=document.getElementById('localSpecialtyFilters');if(!box)return;const specs=['الكل',...new Set(localPublicStores.map(s=>String(s.specialty||'شامل').trim()).filter(Boolean))];box.replaceChildren(...specs.map(x=>{const label=String(x||'').trim()||'شامل',b=document.createElement('button');b.type='button';b.className='local-filter-btn '+(label===localActiveSpecialty?'active':'');b.dataset.specialty=label;b.textContent=label;b.setAttribute('aria-label',label);b.style.setProperty('color','#ffffff','important');b.style.setProperty('-webkit-text-fill-color','#ffffff','important');b.style.setProperty('opacity','1','important');b.style.setProperty('visibility','visible','important');b.addEventListener('click',()=>{localActiveSpecialty=label;renderLocalSpecialtyFilters();renderLocalPublicStores()});return b}))}"
          assert old in s, 'original renderLocalSpecialtyFilters signature not found'
          s=s.replace(old,new,1)
          s=s.replace('js/index-featured-campaigns-v1.js?v=20260828-v26-kinto','js/index-featured-campaigns-v1.js?v=20260828-v27-kinto',1)
          p.write_text(s)

          lp=Path('js/index-featured-campaigns-v1.js')
          l=lp.read_text()
          old_loader="/* KINTO Public Featured Campaigns loader V26 */\n(()=>{'use strict';const load=src=>new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;document.head.appendChild(s)});const css=(href)=>{const l=document.createElement('link');l.rel='stylesheet';l.href=href;document.head.appendChild(l)};css('css/site-identity-v16.css?v=20260828-v26');css('css/site-identity-v17.css?v=20260828-v26');css('css/site-identity-v18.css?v=20260828-v26');load('js/index-featured-campaigns-v1-core-v15.js?v=20260828-v26').then(()=>load('js/site-brand-hero-v15.js?v=20260828-v26')).then(()=>load('js/site-identity-v17.js?v=20260828-v26')).then(()=>load('js/site-identity-v18.js?v=20260828-v26')).then(()=>load('js/local-specialty-labels-v26.js?v=20260828-v26')).catch(e=>{console.error('Public V26 loader failed',e);document.documentElement.classList.remove('kinto-booting');document.documentElement.classList.add('kinto-ready')});})();"
          new_loader="/* KINTO Public Featured Campaigns loader V27 */\n(()=>{'use strict';const load=src=>new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;document.head.appendChild(s)});const css=(href)=>{const l=document.createElement('link');l.rel='stylesheet';l.href=href;document.head.appendChild(l)};css('css/site-identity-v16.css?v=20260828-v27');css('css/site-identity-v17.css?v=20260828-v27');css('css/site-identity-v18.css?v=20260828-v27');load('js/index-featured-campaigns-v1-core-v15.js?v=20260828-v27').then(()=>load('js/site-brand-hero-v15.js?v=20260828-v27')).then(()=>load('js/site-identity-v17.js?v=20260828-v27')).then(()=>load('js/site-identity-v18.js?v=20260828-v27')).catch(e=>{console.error('Public V27 loader failed',e);document.documentElement.classList.remove('kinto-booting');document.documentElement.classList.add('kinto-ready')});})();"
          assert old_loader in l, 'V26 loader not found'
          lp.write_text(l.replace(old_loader,new_loader,1))
          Path('.github/workflows/kinto-v27-specialty-source-fix.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js/index-featured-campaigns-v1.js .github/workflows/kinto-v27-specialty-source-fix.yml
          git commit -m 'fix: rebuild specialty buttons with real text at source'
          git push