name: Direct live scanner patch
on:
  push:
    paths:
      - '.github/workflows/direct-live-scanner.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply scanner patch
        run: python3 .github/direct_live_patch.py
      - name: Commit scanner fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add delivery-dashboard.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix delivery scanner with direct live camera stream"
          git push origin main
