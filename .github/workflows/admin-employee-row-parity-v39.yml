name: Admin Employee Row Parity V39
on:
  push:
    paths:
      - 'scripts/admin_employee_row_parity_v39.py'
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply V39
        run: python scripts/admin_employee_row_parity_v39.py
      - name: Validate exact input bindings
        run: |
          grep -Fq 'value="${esc(product(o))}"' js/external-shipping-native-order-render-v1.js
          grep -Fq 'value="${esc(localFee(o))}"' js/external-shipping-native-order-render-v1.js
          grep -Fq 'delivery_fee:Number.isFinite(extFee)?extFee:0' js/external-shipping-native-order-render-v1.js
          grep -Fq '20260829-admin-money-v39' external-shipping-shell.html
          grep -Fq '20260829-native-render-v39' external-shipping-shell.html
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/external-shipping-native-order-render-v1.js external-shipping-shell.html
          git commit -m "fix: mirror employee money sources in admin row V39"
          git push
