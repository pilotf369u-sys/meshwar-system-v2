name: KINTO Deals G3F admin UI
on:
  pull_request:
    paths:
      - 'admin-dashboard.html'
      - 'js/admin-kinto-deals-g3f.js'
      - 'ci/kinto-deals-g3f-admin-live-ui.test.mjs'
      - '.github/workflows/kinto-deals-g3f-admin-ui.yml'
  workflow_dispatch:
jobs:
  g3f-admin-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check js/admin-kinto-deals-g3f.js
      - run: node --test ci/kinto-deals-g3f-admin-live-ui.test.mjs
