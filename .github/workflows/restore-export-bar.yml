name: Restore export bar
on:
  push:
    paths:
      - '.github/workflows/restore-export-bar.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/restore_export_bar.py
      - run: |
          git config user.name "meshwar-export-bot"
          git config user.email "actions@users.noreply.github.com"
          git add employee-dashboard.html admin-dashboard.html
          git commit -m "Restore branch export bar and manifest actions"
          git push origin main
      - run: |
          git pull --rebase origin main
          rm -f .github/restore_export_bar.py .github/workflows/restore-export-bar.yml
          git add -A
          git commit -m "Remove temporary export bar automation"
          git push origin main
