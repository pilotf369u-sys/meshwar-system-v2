name: Vendor USD price label fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/vendor-price-label-fix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update vendor price labels
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('vendor-dashboard.html')
          s=p.read_text()
          old='placeholder="السعر الأصلي"'
          new='placeholder="السعر الأصلي ($ USD)"'
          if old not in s: raise SystemExit('base price label not found')
          s=s.replace(old,new,1)
          old2='placeholder="سعر الخصم - اختياري"'
          new2='placeholder="سعر الخصم ($ USD) - اختياري"'
          if old2 in s: s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Validate
        run: grep -F 'السعر الأصلي ($ USD)' vendor-dashboard.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor-dashboard.html
          git commit -m 'Clarify vendor product prices are USD'
          git push origin main
