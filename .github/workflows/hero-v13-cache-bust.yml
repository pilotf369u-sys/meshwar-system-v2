name: Hero V13 Cache Bust

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hero-v13-cache-bust.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cache-bust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update featured Hero cache version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'js/index-featured-campaigns-v1.js?v=20260827-v2.0-premium-hero'
          new = 'js/index-featured-campaigns-v1.js?v=20260828-v13-hero'
          if old not in s:
              print('Cache version already updated or source tag changed.')
          else:
              p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit cache bust when changed
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: activate Hero V13 frontend cache bust'
          git push origin HEAD:main
