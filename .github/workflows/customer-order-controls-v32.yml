name: Customer Order Controls V32
on:
  push:
    branches: [main]
    paths: ['.github/workflows/customer-order-controls-v32.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch product pulse and customer pre-payment controls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('js/local-store-card-v3.js'); s=p.read_text()
          marker='/* DIRECT_PRODUCT_SCROLL_V31 — exact product focus for dashboard deep-links */'
          assert marker in s, 'V31 focus marker missing'
          # Add pulse stylesheet once; no product modal is opened by this resolver.
          if 'DIRECT_PRODUCT_PULSE_V32' not in s:
              s=s.replace(marker, r'''/* DIRECT_PRODUCT_PULSE_V32 — visual focus only; never auto-opens product modal */
(()=>{if(document.getElementById('directProductPulseV32'))return;const st=document.createElement('style');st.id='directProductPulseV32';st.textContent=`@keyframes kintoDirectProductPulseV32{0%,100%{outline-color:#fbbf24;box-shadow:0 0 0 4px rgba(251,191,36,.18),0 18px 50px rgba(2,6,23,.35)}35%{outline-color:#fde68a;box-shadow:0 0 0 12px rgba(251,191,36,.30),0 0 38px rgba(251,191,36,.62),0 18px 50px rgba(2,6,23,.42)}70%{outline-color:#d99b27;box-shadow:0 0 0 6px rgba(217,155,39,.22),0 0 24px rgba(251,191,36,.38),0 18px 50px rgba(2,6,23,.38)}}.local-v3-card[data-direct-product-focus="true"]{animation:kintoDirectProductPulseV32 1.05s ease-in-out 4!important;position:relative!important;z-index:6!important}`;document.head.appendChild(st)})();

'''+marker,1)
          p.write_text(s)

          p=Path('dashboard.html'); s=p.read_text()
          old="const CUSTOMER_CANCEL_ALLOWED=['بانتظار موافقة العميل','بانتظار موافقة الزبون','بانتظار التسعير','تم التسعير / بانتظار موافقة العميل'];\nconst CUSTOMER_CANCEL_BLOCKED=['تم الشحن','مخزن محلي','تم التسديد','تم التسليم'];"
          new="const CUSTOMER_PREPAY_EDIT_ALLOWED=['انتظار رد الموظف','بانتظار موافقة العميل','بانتظار موافقة الزبون','بانتظار التسعير','تم التسعير / بانتظار موافقة العميل','تمت الموافقة - بانتظار الدفع','تمت الموافقة'];\nconst CUSTOMER_CANCEL_ALLOWED=CUSTOMER_PREPAY_EDIT_ALLOWED;\nconst CUSTOMER_CANCEL_BLOCKED=['تم التسديد','قيد الطلب','مخزن شركة','تجهيز شحن','تم الشحن','مخزن محلي','مندوب','توزيع داخلي','تم التسليم','رفض الطلب','مرفوض','ملغي من قبل العميل'];"
          assert old in s, 'customer status constants marker missing'
          s=s.replace(old,new,1)
          old="function canCustomerCancelStatus(s){return CUSTOMER_CANCEL_ALLOWED.includes(s)&&!CUSTOMER_CANCEL_BLOCKED.includes(s);}"
          new="function canCustomerEditStatus(s){return CUSTOMER_PREPAY_EDIT_ALLOWED.includes(String(s||'').trim())&&!CUSTOMER_CANCEL_BLOCKED.includes(String(s||'').trim());}\nfunction canCustomerCancelStatus(s){return canCustomerEditStatus(s);}"
          assert old in s, 'cancel predicate marker missing'
          s=s.replace(old,new,1)
          old="function customerDecisionHtml(order,index,price,currency){const status=order.status||'انتظار رد الموظف',priced=price!==null&&Number.isFinite(price)&&price>0;if(isWaitingCustomerApprovalStatus(status)&&priced){return `<div class=\"decision-box\"><div style=\"margin-bottom:7px;font-weight:bold;color:#9a3412\">السعر المقترح: ${price.toFixed(2)} ${escapeHtml(currency)}</div><button class=\"btn-approve\" onclick=\"approveOrder(${index})\">موافقة على الشراء</button>${canCustomerCancelStatus(status)?`<button class=\"btn-cancel\" onclick=\"cancelOrder(${index})\">رفض السعر / إلغاء</button>`:''}</div>`}if(status==='تمت الموافقة - بانتظار الدفع'){return `<div class=\"payment-box\"><b>تمت الموافقة على الطلب</b><br><b>المبلغ:</b> ${price===null?'---':price.toFixed(2)+' '+escapeHtml(currency)}<br>يرجى متابعة تعليمات الدفع من الموظف.</div>`}return canCustomerCancelStatus(status)&&priced?`<button class=\"btn-cancel\" onclick=\"cancelOrder(${index})\">إلغاء الطلب</button>`:'---';}"
          new="function customerDecisionHtml(order,index,price,currency){const status=order.status||'انتظار رد الموظف',priced=price!==null&&Number.isFinite(price)&&price>0,editable=canCustomerEditStatus(status);if(!editable)return '---';const edit=`<button class=\"btn-details\" onclick=\"editCustomerOrder(${index})\">تعديل الطلب</button>`;const cancel=`<button class=\"btn-cancel\" onclick=\"cancelOrder(${index})\">إلغاء الطلب</button>`;if(isWaitingCustomerApprovalStatus(status)&&priced)return `<div class=\"decision-box\"><div style=\"margin-bottom:7px;font-weight:bold;color:#9a3412\">السعر المقترح: ${price.toFixed(2)} ${escapeHtml(currency)}</div><button class=\"btn-approve\" onclick=\"approveOrder(${index})\">موافقة على الشراء</button>${edit}${cancel}</div>`;if(status==='تمت الموافقة - بانتظار الدفع'||status==='تمت الموافقة')return `<div class=\"decision-box\"><div class=\"payment-box\" style=\"margin-bottom:7px\"><b>الطلب قبل التسديد</b><br><b>المبلغ:</b> ${price===null?'---':price.toFixed(2)+' '+escapeHtml(currency)}</div>${edit}${cancel}</div>`;return `<div class=\"decision-box\">${edit}${cancel}</div>`;}"
          assert old in s, 'customer decision renderer marker missing'
          s=s.replace(old,new,1)
          anchor="async function cancelOrder(i){"
          assert anchor in s, 'cancelOrder marker missing'
          edit_fn=r'''async function editCustomerOrder(i){const o=currentCustomerOrdersGlobal[i];if(!o||!canCustomerEditStatus(o.status))return alert('لا يمكن تعديل الطلب بعد مرحلة تم التسديد.');const d=parseOrderDetails(o.details),currentQty=Math.max(1,Number(d.quantity??o.quantity??1)||1),raw=prompt('أدخل الكمية الجديدة للطلب:',String(currentQty));if(raw===null)return;const qty=Math.max(1,Math.floor(Number(raw)||0));if(!Number.isFinite(qty)||qty<1)return alert('أدخل كمية صحيحة.');try{const sb=await ensureCustomerPortalSupabase(),{data:latest,error:readError}=await sb.from('orders').select('id,status,details').eq('id',o.id).eq('customer_id',currentCustomerCloud.id).maybeSingle();if(readError)throw readError;if(!latest||!canCustomerEditStatus(latest.status))return alert('تم منع التعديل لأن الطلب وصل إلى مرحلة تم التسديد أو ما بعدها.');const latestDetails=parseOrderDetails(latest.details),nextDetails={...latestDetails,quantity:qty,requested_quantity:qty};const{error}=await sb.from('orders').update({details:JSON.stringify(nextDetails)}).eq('id',o.id).eq('customer_id',currentCustomerCloud.id);if(error)throw error;await loadCustomerOrdersFromCloud(currentCustomerCloud.id)}catch(e){console.error('Edit order error:',e);alert('تعذر تعديل الطلب: '+(e.message||e))}}
'''
          if 'async function editCustomerOrder(i)' not in s:s=s.replace(anchor,edit_fn+anchor,1)
          # Harden cancellation against stale UI state using the same payment boundary.
          s=s.replace("return alert('لا يمكن إلغاء الطلب بعد انتقاله من مرحلة التسعير/الموافقة.');","return alert('لا يمكن إلغاء الطلب بعد مرحلة تم التسديد.');")
          # Export edit handler if an Object.assign export block exists; inline onclick can already resolve global function declarations.
          p.write_text(s)
          PY
          cp js/local-store-card-v3.js /tmp/local-store-card-v3.mjs
          node --check /tmp/local-store-card-v3.mjs
          python3 - <<'PY'
          from pathlib import Path
          s=Path('dashboard.html').read_text()
          assert 'CUSTOMER_PREPAY_EDIT_ALLOWED' in s
          assert 'async function editCustomerOrder(i)' in s
          assert "'تم التسديد','قيد الطلب','مخزن شركة'" in s
          assert 'DIRECT_PRODUCT_PULSE_V32' in Path('js/local-store-card-v3.js').read_text()
          PY
          rm .github/workflows/customer-order-controls-v32.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: pulse direct product and lock customer changes after payment V32'
          git push origin main
