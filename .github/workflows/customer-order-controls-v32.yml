name: Customer Order Controls V32
on:
  push:
    branches: [main]
    paths: ['.github/workflows/customer-order-controls-v32.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply customer controls and strong product pulse
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('dashboard.html'); s=p.read_text()
          s=s.replace("const CUSTOMER_CANCEL_ALLOWED=['بانتظار موافقة العميل','بانتظار موافقة الزبون','بانتظار التسعير','تم التسعير / بانتظار موافقة العميل'];\nconst CUSTOMER_CANCEL_BLOCKED=['تم الشحن','مخزن محلي','تم التسديد','تم التسليم'];", "const CUSTOMER_PREPAY_EDIT_ALLOWED=['انتظار رد الموظف','بانتظار موافقة العميل','بانتظار موافقة الزبون','بانتظار التسعير','تم التسعير / بانتظار موافقة العميل','تمت الموافقة - بانتظار الدفع','تمت الموافقة'];\nconst CUSTOMER_CANCEL_ALLOWED=CUSTOMER_PREPAY_EDIT_ALLOWED;\nconst CUSTOMER_CANCEL_BLOCKED=['تم التسديد','قيد الطلب','مخزن شركة','تجهيز شحن','تم الشحن','مخزن محلي','مندوب','توزيع داخلي','تم التسليم','رفض الطلب','مرفوض','ملغي من قبل العميل'];")
          s=s.replace("function canCustomerCancelStatus(s){return CUSTOMER_CANCEL_ALLOWED.includes(s)&&!CUSTOMER_CANCEL_BLOCKED.includes(s);}", "function canCustomerEditStatus(s){const v=String(s||'').trim();return CUSTOMER_PREPAY_EDIT_ALLOWED.includes(v)&&!CUSTOMER_CANCEL_BLOCKED.includes(v);}\nfunction canCustomerCancelStatus(s){return canCustomerEditStatus(s);}")
          start=s.index('function customerDecisionHtml(order,index,price,currency){')
          end=s.index('function getOrderSiparisNo(order)',start)
          s=s[:start]+'''function customerDecisionHtml(order,index,price,currency){const status=String(order.status||'انتظار رد الموظف').trim(),priced=price!==null&&Number.isFinite(price)&&price>0,editable=canCustomerEditStatus(status);if(!editable)return '---';const edit=`<button class="btn-details" style="margin:3px" onclick="editCustomerOrder(${index})">✏️ تعديل الطلب</button>`,cancel=`<button class="btn-cancel" style="margin:3px" onclick="cancelOrder(${index})">🗑️ إلغاء الطلب</button>`;if(isWaitingCustomerApprovalStatus(status)&&priced)return `<div class="decision-box"><div style="margin-bottom:7px;font-weight:bold;color:#f5c451">السعر المقترح: ${price.toFixed(2)} ${escapeHtml(currency)}</div><button class="btn-approve" onclick="approveOrder(${index})">موافقة على الشراء</button><br>${edit}${cancel}</div>`;if(status==='تمت الموافقة - بانتظار الدفع'||status==='تمت الموافقة')return `<div class="decision-box"><div class="payment-box" style="margin-bottom:7px"><b>الطلب قبل التسديد</b><br><b>المبلغ:</b> ${price===null?'---':price.toFixed(2)+' '+escapeHtml(currency)}</div>${edit}${cancel}</div>`;return `<div class="decision-box">${edit}${cancel}</div>`;}\n'''+s[end:]
          if 'async function editCustomerOrder(i)' not in s:
            anchor='async function cancelOrder(i){'
            fn='''async function editCustomerOrder(i){const o=currentCustomerOrdersGlobal[i];if(!o||!canCustomerEditStatus(o.status))return alert('لا يمكن تعديل الطلب بعد مرحلة تم التسديد.');const d=parseOrderDetails(o.details),currentQty=Math.max(1,Number(d.quantity??o.quantity??1)||1),raw=prompt('أدخل الكمية الجديدة للطلب:',String(currentQty));if(raw===null)return;const qty=Math.floor(Number(raw));if(!Number.isFinite(qty)||qty<1)return alert('أدخل كمية صحيحة.');try{const sb=await ensureCustomerPortalSupabase(),{data:latest,error:readError}=await sb.from('orders').select('id,status,details').eq('id',o.id).eq('customer_id',currentCustomerCloud.id).maybeSingle();if(readError)throw readError;if(!latest||!canCustomerEditStatus(latest.status))return alert('تم منع التعديل لأن الطلب وصل إلى مرحلة تم التسديد أو ما بعدها.');const latestDetails=parseOrderDetails(latest.details),nextDetails={...latestDetails,quantity:qty,requested_quantity:qty};const{error}=await sb.from('orders').update({details:JSON.stringify(nextDetails)}).eq('id',o.id).eq('customer_id',currentCustomerCloud.id);if(error)throw error;await loadCustomerOrdersFromCloud(currentCustomerCloud.id)}catch(e){console.error('Edit order error:',e);alert('تعذر تعديل الطلب: '+(e.message||e))}}\n'''
            s=s.replace(anchor,fn+anchor,1)
          s=s.replace("return alert('لا يمكن إلغاء الطلب بعد انتقاله من مرحلة التسعير/الموافقة.');", "return alert('لا يمكن إلغاء الطلب بعد مرحلة تم التسديد.');")
          assert 'CUSTOMER_PREPAY_EDIT_ALLOWED' in s and '✏️ تعديل الطلب' in s
          p.write_text(s)

          p=Path('js/local-store-card-v3.js'); s=p.read_text()
          marker='/* DIRECT_PRODUCT_SCROLL_V31 — exact product focus for dashboard deep-links */'
          assert marker in s
          pulse='''/* DIRECT_PRODUCT_PULSE_V32_STRONG — visual focus only; no modal */\n(()=>{if(document.getElementById('directProductPulseV32Strong'))return;const st=document.createElement('style');st.id='directProductPulseV32Strong';st.textContent=`@keyframes kintoDirectProductPulseV32Strong{0%,100%{transform:scale(1);filter:brightness(1)}25%{transform:scale(1.045);filter:brightness(1.16) drop-shadow(0 0 14px #fbbf24)}50%{transform:scale(.985);filter:brightness(1.04) drop-shadow(0 0 28px #fde68a)}75%{transform:scale(1.035);filter:brightness(1.18) drop-shadow(0 0 18px #d99b27)}}.local-v3-card[data-direct-product-focus="true"]{animation:kintoDirectProductPulseV32Strong .72s ease-in-out 6!important;transform-origin:center!important;will-change:transform,filter!important;z-index:20!important}`;document.head.appendChild(st)})();\n\n'''
          if 'DIRECT_PRODUCT_PULSE_V32_STRONG' not in s:s=s.replace(marker,pulse+marker,1)
          p.write_text(s)

          p=Path('index.html'); s=p.read_text()
          s=re.sub(r'(js/local-store-card-v3\.js\?v=)[^"\']+', r'\1'+'20260829-v32pulse2', s)
          p.write_text(s)
          PY
          cp js/local-store-card-v3.js /tmp/local-store-card-v3.mjs
          node --check /tmp/local-store-card-v3.mjs
          grep -q '✏️ تعديل الطلب' dashboard.html
          grep -q 'DIRECT_PRODUCT_PULSE_V32_STRONG' js/local-store-card-v3.js
          grep -q '20260829-v32pulse2' index.html
          rm .github/workflows/customer-order-controls-v32.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: render customer controls and strong product pulse V32'
          git push origin main
