name: Finalize local pricing source
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-local-pricing-source.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python3 tools/finalize_local_pricing_patch.py
      - name: Verify
        run: |
          node --check js/local-store-pricing.js
          node --check js/local-store-card-v3.js
          grep -F 'pricingSnapshot' js/local-store-pricing.js
          grep -F 'syncProductPricingSnapshots' vendor-dashboard.html
          grep -F 'is_out_of_stock,options' js/local-store-card-v3.js
          grep -F 'discountPct!==null' js/local-store-card-v3.js
          ! grep -F 'roundIqdCommercial' js/local-store-card-v3.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/local-store-pricing.js js/local-store-card-v3.js vendor-dashboard.html index.html
          git diff --cached --quiet || git commit -m 'Persist and unify rounded local store pricing'
          git push origin main
