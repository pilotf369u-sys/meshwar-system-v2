name: One Shot Wire Index Featured

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-wire-index-featured.yml'

permissions:
  contents: write

jobs:
  wire:
    if: github.event.head_commit.message != 'feat: wire public featured campaigns loader'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Inject loader and self-clean
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="js/index-featured-campaigns-v1.js?v=20260827-v1.0-active"></script>'
          if tag not in s:
              if '</body>' not in s:
                  raise SystemExit('index.html missing </body>')
              s = s.replace('</body>', tag + '\n</body>', 1)
              p.write_text(s, encoding='utf-8')
          Path('.github/workflows/one-shot-wire-index-featured.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: wire public featured campaigns loader'
          git push origin HEAD:main
