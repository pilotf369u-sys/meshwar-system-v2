name: Local pricing rounding sync
on:
  push:
    branches: [main]
    paths: ['.github/workflows/local-rounding-sync.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Sync index cache and vendor rounding
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text()
          old='js/local-store-enhancements.js?v=20260814-1950'
          new='js/local-store-enhancements.js?v=20260814-2020'
          if old not in s:
              raise SystemExit('local store enhancement cache tag not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('vendor-dashboard.html')
          s=p.read_text()
          old='customerUsd=Math.ceil(vendorUsd/(1-(Number.isFinite(commission)&&commission>=0&&commission<100?commission:10)/100)),converted=(String(target||\'\').toUpperCase()===\'USD\'?customerUsd:Math.ceil(customerUsd*rate));'
          new='customerUsd=Math.round(vendorUsd/(1-(Number.isFinite(commission)&&commission>=0&&commission<100?commission:10)/100)),converted=(String(target||\'\').toUpperCase()===\'USD\'?customerUsd:Math.round(customerUsd*rate));'
          if old not in s:
              raise SystemExit('vendor Math.ceil pricing expression not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          grep -F 'local-store-enhancements.js?v=20260814-2020' index.html
          grep -F 'customerUsd=Math.round' vendor-dashboard.html
          ! grep -F 'customerUsd=Math.ceil' vendor-dashboard.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html vendor-dashboard.html
          git commit -m 'Sync local pricing rounding and cache version'
          git push origin main
