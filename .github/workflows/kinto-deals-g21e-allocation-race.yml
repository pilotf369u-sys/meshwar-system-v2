name: KINTO Deals G21E allocation race contract
on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'ci/kinto-deals-g21e-allocation-race.test.mjs'
      - '.github/workflows/kinto-deals-g21e-allocation-race.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test ci/kinto-deals-g21e-allocation-race.test.mjs
