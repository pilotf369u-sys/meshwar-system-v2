name: Cache bust local card
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cache-bust-local-card.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate renderer syntax
        run: node --check js/local-store-card-v3.js
      - name: Cache bust renderer include
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='src="js/local-store-card-v3.js"'
          new='src="js/local-store-card-v3.js?v=v3_adb5840"'
          if new not in s:
              if old not in s:
                  raise SystemExit('local-store-card-v3 include not found')
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Verify single include
        run: |
          grep -F 'js/local-store-card-v3.js?v=v3_adb5840' index.html
          test "$(grep -o 'local-store-card-v3.js' index.html | wc -l)" -eq 1
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Cache bust local store renderer v3'
          git push origin main
