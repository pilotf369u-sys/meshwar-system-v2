name: Patch store logo Data URL support
on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  patch:
    if: github.head_ref == 'fix/admin-file-input-for-store-logo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply public Data URL support
        run: python3 scripts/patch-store-logo-data-url.py
      - name: Validate JavaScript
        run: |
          node --check js/admin-store-logo-file-input.js
          node --check js/global-stores-defaults.js
          node --check js/local-store-pricing.js
          git diff --check
      - name: Remove temporary tooling
        run: |
          rm -f scripts/patch-store-logo-data-url.py .github/workflows/patch-store-logo-data-url.yml
      - name: Commit final patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/local-store-pricing.js js/admin-store-logo-file-input.js js/global-stores-defaults.js scripts/patch-store-logo-data-url.py .github/workflows/patch-store-logo-data-url.yml
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'fix: support store logo file picker data URLs'
            git push origin HEAD:${{ github.head_ref }}
          fi
