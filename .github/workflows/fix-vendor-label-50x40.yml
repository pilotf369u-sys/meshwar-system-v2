name: Fix Vendor Label 50x40
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-vendor-label-50x40.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python3 tools/fix_vendor_label_50x40.py
      - name: Verify
        run: |
          grep -F '@page{size:50mm 40mm;margin:0}' vendor-dashboard.html
          grep -F 'height:22px' vendor-dashboard.html
          grep -F "c.governorate||c.city||c.province" vendor-dashboard.html
          grep -F 'class="label-card"' vendor-dashboard.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor-dashboard.html
          git diff --cached --quiet || git commit -m 'Constrain vendor thermal label to 50x40mm'
          git push origin main
