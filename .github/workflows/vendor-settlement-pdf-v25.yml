name: Vendor settlement PDF details V25 validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'vendor-dashboard.html'
      - 'js/vendor-settlement-pdf-details-v25.js'
      - 'js/vendor-settlement-archive-v163.js'
      - 'tests/e2e/vendor-settlement-pdf-v25.e2e.spec.mjs'
      - '.github/workflows/vendor-settlement-pdf-v25.yml'
  push:
    branches: [main]
    paths:
      - 'vendor-dashboard.html'
      - 'js/vendor-settlement-pdf-details-v25.js'
      - 'js/vendor-settlement-archive-v163.js'
      - 'tests/e2e/vendor-settlement-pdf-v25.e2e.spec.mjs'
      - '.github/workflows/vendor-settlement-pdf-v25.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate retired V25 and current immutable archive PDF
        run: |
          node --check js/vendor-settlement-pdf-details-v25.js
          ! grep -Fq 'vendor-settlement-pdf-details-v25.js' vendor-dashboard.html
          node --check js/vendor-settlement-archive-v163.js
          grep -Fq 'vendor-settlement-archive-v163.js' vendor-dashboard-v2.html
          grep -Fq 'segment_ids' js/vendor-settlement-archive-v163.js
          grep -Fq 'detail_version:VERSION' js/vendor-settlement-pdf-details-v25.js
          grep -Fq 'orders:details.orders,expenses:details.expenses' js/vendor-settlement-pdf-details-v25.js
          grep -Fq 'bindCloseEnrichment' js/vendor-settlement-pdf-details-v25.js
          grep -Fq 'armSettlementPost' js/vendor-settlement-pdf-details-v25.js
          ! grep -Fq 'wrapSettlementPost' js/vendor-settlement-pdf-details-v25.js
          grep -Fq 'data-mw-settlement-print' js/vendor-settlement-pdf-details-v25.js
          grep -Fq 'الطلبات المسلّمة الداخلة في الدورة' js/vendor-settlement-pdf-details-v25.js
          grep -Fq 'المصاريف التشغيلية الداخلة في الدورة' js/vendor-settlement-pdf-details-v25.js
          grep -Fq 'MUTATED AFTER CLOSE' tests/e2e/vendor-settlement-pdf-v25.e2e.spec.mjs
