name: Force Strike 2026
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/force-strike-2026.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Wire active featured loader into index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="js/index-featured-campaigns-v1.js?v=20260827-v1.0-active"></script>'
          if tag not in s:
              if '</body>' not in s:
                  raise SystemExit('index.html missing </body>')
              s=s.replace('</body>',tag+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
          grep -F 'js/index-featured-campaigns-v1.js?v=20260827-v1.0-active' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'feat: wire public featured campaigns loader'
          git push origin HEAD:main
