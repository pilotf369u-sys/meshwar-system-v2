name: Employee luxury and vendor realtime test
on:
  push:
    branches: [agent/vendor-realtime-employee-luxury]
    paths:
      - '.github/workflows/force-strike-2026.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vendor-realtime-employee-luxury
      - name: Apply isolated patch
        run: python3 tools/force_strike_2026.py
      - name: Syntax check
        run: |
          python3 - <<'PY'
          import re,pathlib,subprocess,tempfile,sys
          for name in ['vendor-dashboard.html','employee-dashboard.html']:
              html=pathlib.Path(name).read_text(encoding='utf-8')
              for i,(attrs,code) in enumerate(re.findall(r'<script([^>]*)>([\s\S]*?)</script>',html,re.I)):
                  if 'src=' in attrs.lower() or not code.strip(): continue
                  suffix='.mjs' if 'module' in attrs.lower() else '.js'
                  f=pathlib.Path(tempfile.gettempdir())/f'{pathlib.Path(name).stem}-{i}{suffix}'
                  f.write_text(code,encoding='utf-8')
                  r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
                  if r.returncode:
                      print(r.stderr);sys.exit(r.returncode)
          PY
          grep -F "postgres_changes" vendor-dashboard.html
          grep -F "employeeWorkspaceTabs" employee-dashboard.html
          grep -F "50mm × 40mm" employee-dashboard.html
          grep -F "table-layout:fixed" employee-dashboard.html
      - name: Commit target files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor-dashboard.html employee-dashboard.html
          git diff --cached --quiet || git commit -m 'Add vendor realtime and luxury employee workspace'
          git push origin HEAD:agent/vendor-realtime-employee-luxury
