name: Force Strike 2026
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/force-strike-2026.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bump featured campaigns loader cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='js/index-featured-campaigns-v1.js?v=20260827-v1.0-active'
          new='js/index-featured-campaigns-v1.js?v=20260827-v2.0-premium-hero'
          if old not in s and new not in s:
              raise SystemExit('featured loader tag not found')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          grep -F 'js/index-featured-campaigns-v1.js?v=20260827-v2.0-premium-hero' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'feat: activate premium featured campaigns hero v2'
          git push origin main