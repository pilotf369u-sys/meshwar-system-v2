name: Patch POD status cell
on:
  push:
    paths:
      - '.github/workflows/patch-pod-status-cell.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/patch_pod_status_cell.py
      - name: Commit functional files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-dashboard.html employee-dashboard.html
          git diff --cached --quiet || git commit -m "Fix POD button placement in admin and employee"
          git push origin main
