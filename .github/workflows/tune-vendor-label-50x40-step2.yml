name: Tune Vendor Label 50x40 Step2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tune-vendor-label-50x40-step2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply print-only tuning
        run: python3 tools/tune_vendor_label_50x40_step2.py
      - name: Verify print geometry
        run: |
          grep -F '@page{size:50mm 40mm;margin:0}' vendor-dashboard.html
          grep -F 'height:22px' vendor-dashboard.html
          grep -F 'max-height:37mm' vendor-dashboard.html
          grep -F 'font-size:7.5px' vendor-dashboard.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor-dashboard.html
          git diff --cached --quiet || git commit -m 'Tighten vendor thermal label 50x40 print geometry'
          git push origin main
