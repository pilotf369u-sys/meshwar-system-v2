name: Complete legacy cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/complete-cleanup.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Remove final legacy files and references
        shell: bash
        run: |
          set -euo pipefail
          targets=(kids.html men.html women.html pets.html tech.html template.html viewer.html home.html meshwar.html meshwar-app.js gifts.html supermarket.html products.js scraping_test.html beauty.html)
          for f in "${targets[@]}"; do
            rm -f -- "$f"
          done

          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          targets = ('supermarket.html','gifts.html','beauty.html')
          lines = s.splitlines(True)
          kept = [line for line in lines if not any(f'href="{t}"' in line or f"href='{t}'" in line for t in targets)]
          p.write_text(''.join(kept), encoding='utf-8')
          PY

          refs='kids\.html|men\.html|women\.html|pets\.html|tech\.html|template\.html|viewer\.html|home\.html|meshwar\.html|meshwar-app\.js|gifts\.html|supermarket\.html|products\.js|scraping_test\.html|beauty\.html'
          if grep -RInE "$refs" --include='*.html' --include='*.js' . --exclude-dir='.git' --exclude='complete-cleanup.yml'; then
            echo 'Found remaining references to removed legacy files.' >&2
            exit 1
          fi

          rm -- '.github/workflows/complete-cleanup.yml'
      - name: Commit directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove final legacy local store files"
          git push origin main
