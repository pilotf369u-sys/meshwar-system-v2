name: Polish local store CRO
on:
  push:
    branches: [main]
    paths: [.github/workflows/polish-local-store-cro.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch product card CRO
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/local-store-card-v3.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('.local-v3-card{display:flex!important;flex-direction:column!important;height:auto!important;min-width:0!important;overflow:hidden!important;border-radius:18px!important;','.local-v3-card{position:relative!important;display:flex!important;flex-direction:column!important;height:auto!important;min-width:0!important;overflow:hidden!important;border-radius:18px!important;',1)
          s=s.replace('.local-v3-name{font-size:17px!important;font-weight:900!important;color:#fff!important;margin-bottom:5px!important}.local-v3-desc{font-size:.85rem!important;color:#cbd5e1!important;line-height:1.4!important;min-height:20px!important;margin-top:3px!important}', '.local-v3-name{font-size:1.1rem!important;font-weight:900!important;color:#ffffff!important;margin-bottom:6px!important}.local-v3-desc{font-size:.9rem!important;color:#f1f5f9!important;line-height:1.4!important;min-height:20px!important;margin-top:3px!important}',1)
          s=s.replace('.local-v3-price{margin-top:12px!important;padding:12px!important;border-radius:12px!important;background:rgba(14,165,233,.10)!important;border:1px solid rgba(56,189,248,.24)!important}.local-v3-old-row{display:flex!important;align-items:center!important;justify-content:flex-start!important;gap:8px!important;margin-bottom:10px!important;padding-bottom:8px!important;border-bottom:1px solid rgba(148,163,184,.16)!important}.local-v3-old{display:inline-block!important;color:#94a3b8!important;font-size:12px!important;text-decoration:line-through!important;text-decoration-thickness:2px!important;text-decoration-color:#fb7185!important}.local-v3-discount-badge{display:inline-flex!important;align-items:center!important;justify-content:center!important;padding:3px 8px!important;border-radius:999px!important;background:rgba(239,68,68,.18)!important;border:1px solid rgba(248,113,113,.38)!important;color:#fca5a5!important;font-size:10px!important;font-weight:900!important;white-space:nowrap!important}', '.local-v3-price{margin-top:12px!important;padding:12px!important;border-radius:12px!important;background:rgba(14,165,233,.10)!important;border:1px solid rgba(56,189,248,.24)!important}.local-v3-old-row{display:block!important;margin-bottom:10px!important;padding-bottom:8px!important;border-bottom:1px solid rgba(148,163,184,.16)!important}.local-v3-old{display:inline-block!important;color:#94a3b8!important;font-size:12px!important;text-decoration:line-through!important;text-decoration-thickness:2px!important;text-decoration-color:#94a3b8!important}.local-v3-discount-badge{position:absolute!important;top:14px!important;right:14px!important;z-index:4!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;padding:4px 10px!important;border-radius:6px!important;background:#ef4444!important;color:white!important;font-size:12px!important;font-weight:900!important;box-shadow:0 2px 10px rgba(239,68,68,.4)!important;white-space:nowrap!important}',1)
          s=s.replace('.local-v3-order{display:flex!important;width:100%!important;min-height:46px!important;margin-top:16px!important;padding:11px 14px!important;align-items:center!important;justify-content:center!important;border-radius:12px!important;border:1px solid rgba(251,191,36,.55)!important;background:linear-gradient(90deg,#0284c7,#4f46e5)!important;color:#fff!important;font-weight:900!important;cursor:pointer!important}', '.local-v3-order{display:flex!important;width:100%!important;min-height:48px!important;margin-top:16px!important;padding:12px 14px!important;align-items:center!important;justify-content:center!important;border-radius:12px!important;border:1px solid rgba(96,165,250,.65)!important;background:linear-gradient(90deg,#2563eb,#4f46e5)!important;color:#fff!important;font-weight:700!important;cursor:pointer!important;box-shadow:0 10px 28px rgba(37,99,235,.35)!important;transition:transform .2s ease,box-shadow .2s ease!important}.local-v3-order:hover{transform:translateY(-2px)!important;box-shadow:0 14px 34px rgba(37,99,235,.48)!important}',1)
          s=s.replace('const customerPriceIqd=(p,s)=>{const usd=customerPriceUsd(p,s);return usd===null?null:ceilPrice(usd*exchangeRate(s))};', 'const roundIqdCommercial=v=>Math.ceil(Number(v)/250)*250;\nconst customerPriceIqd=(p,s)=>{const usd=customerPriceUsd(p,s);return usd===null?null:roundIqdCommercial(usd*exchangeRate(s))};',1)
          s=s.replace('const oldCustomerPriceIqd=(p,s)=>{if(p.discount_price==null||p.base_price==null||Number(p.discount_price)>=Number(p.base_price))return null;const oldUsd=ceilPrice(Number(p.base_price)/(1-commissionRate(s)));return ceilPrice(oldUsd*exchangeRate(s))};', 'const oldCustomerPriceIqd=(p,s)=>{if(p.discount_price==null||p.base_price==null||Number(p.discount_price)>=Number(p.base_price))return null;const oldUsd=ceilPrice(Number(p.base_price)/(1-commissionRate(s)));return roundIqdCommercial(oldUsd*exchangeRate(s))};',1)
          s=s.replace('const old=oldIqd===null?\'\':`<div class="local-v3-old-row"><span class="local-v3-old"><span class="local-v3-money" dir="ltr">${esc(iqdLabel(oldIqd))}</span></span><span class="local-v3-discount-badge">خصم</span></div>`;', 'const hasDiscount=oldIqd!==null;\n    const old=hasDiscount?`<div class="local-v3-old-row"><span class="local-v3-old"><span class="local-v3-money" dir="ltr">${esc(iqdLabel(oldIqd))}</span></span></div>`:\'\';\n    const badge=hasDiscount?\'<span class="local-v3-discount-badge">خصم</span>\':\'\';',1)
          s=s.replace('return `<article class="local-v3-card"><div class="local-v3-img-wrap">','return `<article class="local-v3-card">${badge}<div class="local-v3-img-wrap">',1)
          p.write_text(s,encoding='utf-8')
          idx=Path('index.html')
          h=idx.read_text(encoding='utf-8')
          old='src="js/local-store-card-v3.js?v=ed1a02a"'
          new='src="js/local-store-card-v3.js?v=cro-20260815"'
          if old not in h and new not in h: raise SystemExit('renderer include not found')
          h=h.replace(old,new,1)
          idx.write_text(h,encoding='utf-8')
          PY
      - name: Verify
        run: |
          node --check js/local-store-card-v3.js
          grep -F 'roundIqdCommercial' js/local-store-card-v3.js
          grep -F 'background:#ef4444' js/local-store-card-v3.js
          grep -F 'js/local-store-card-v3.js?v=cro-20260815' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/local-store-card-v3.js index.html
          git diff --cached --quiet || git commit -m 'Polish local store product cards for conversion'
          git push origin main
