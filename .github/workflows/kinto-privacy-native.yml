name: KINTO privacy native compatibility
'on':
  push:
    branches:
    - app/privacy-controls-20261025
    paths:
    - mobile/hybrid/**
    - mobile/release/audit-package.py
    - mobile/release/source-scope-check.py
    - .github/workflows/kinto-privacy-native.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  candidate-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools platforms;android-36 build-tools;35.0.0
        log-accepted-android-sdk-licenses: false
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.11.1
    - name: Build unsigned non-production release candidate
      run: gradle --no-daemon -p mobile/hybrid/android :app:bundleRelease :app:assembleRelease :app:lintRelease
    - name: Print all release Lint errors for review
      if: always()
      run: "python3 - <<'PYCHECK'\nimport pathlib,xml.etree.ElementTree as E\np=pathlib.Path('mobile/hybrid/android/app/build/reports/lint-results-release.xml')\n\
        if p.exists():\n for e in E.parse(p).getroot().findall('issue'):\n  if e.get('severity') in ('Error','Fatal'):\n \
        \  print(e.attrib)\n   for loc in e.findall('location'):print(loc.attrib)\nPYCHECK\n"
    - name: Verify fixture exclusion and signing separation
      run: python3 mobile/hybrid/tools/check-release-artifacts.py
    - name: Audit compiled distribution and read-only policy gates
      run: 'python3 mobile/release/source-scope-check.py

        python3 mobile/release/audit-package.py

        python3 mobile/release/release-inputs.test.py

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: KINTO-Unsigned-Candidate-NOT-FOR-UPLOAD
        path: 'mobile/hybrid/android/app/build/outputs/bundle/release/app-release.aab

          mobile/hybrid/android/app/build/outputs/apk/release/app-release-unsigned.apk

          mobile/hybrid/android/app/build/reports/lint-results-release.html

          mobile/hybrid/android/app/build/reports/lint-results-release.xml

          mobile/release/evidence/package-audit.json

          '
        retention-days: 14
        if-no-files-found: error
  preview:
    needs: candidate-bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools platforms;android-36 build-tools;35.0.0
        log-accepted-android-sdk-licenses: false
    - name: MAD reported layout and preserved readers
      run: 'node --test mobile/hybrid/android/checks/product-reader.test.cjs mobile/hybrid/android/checks/hepsiburada-reader.test.cjs
        mobile/hybrid/android/checks/zara-reader.test.cjs

        node --test mobile/release/account-deletion.test.cjs

        python3 mobile/hybrid/tools/new-store-markup-check.py

        python3 mobile/hybrid/tools/mad-price-check.py

        python3 mobile/hybrid/tools/mad-identity-check.py

        python3 mobile/hybrid/tools/check-mad-preservation.py'
    - name: Pure Java boundary and pricing tests
      run: 'mkdir -p "$RUNNER_TEMP/kinto-checks"

        javac -d "$RUNNER_TEMP/kinto-checks" mobile/hybrid/android/app/src/main/java/com/kinto/trendyollab/{UrlPolicy,CartRules,Pricing}.java
        mobile/hybrid/android/checks/{UrlPolicyCheck,CartRulesCheck,PricingCheck}.java

        for check in UrlPolicyCheck CartRulesCheck PricingCheck; do java -cp "$RUNNER_TEMP/kinto-checks" "$check"; done

        '
    - name: Build and verify private preview only
      env:
        KINTO_BUILD_OUTPUT: ${{ runner.temp }}/kinto-preview-output
        KINTO_PREVIEW_KEYSTORE: ${{ runner.temp }}/kinto-preview.keystore
        KINTO_PREVIEW_PASSWORD_FILE: ${{ runner.temp }}/kinto-preview-password
      run: 'umask 077

        openssl rand -base64 32 > "$KINTO_PREVIEW_PASSWORD_FILE"

        keytool -genkeypair -keystore "$KINTO_PREVIEW_KEYSTORE" -storepass:file "$KINTO_PREVIEW_PASSWORD_FILE" -keypass:file
        "$KINTO_PREVIEW_PASSWORD_FILE" -alias kinto-preview -dname ''CN=KINTO Disposable CI Preview'' -keyalg RSA -keysize
        2048 -validity 3650

        bash mobile/hybrid/tools/build-preview.sh

        '
    - name: Update guard version boundary
      run: 'javac -cp "$ANDROID_HOME/platforms/android-36/android.jar:$RUNNER_TEMP/kinto-preview-output/classes" -d "$RUNNER_TEMP/kinto-preview-output/classes"
        mobile/hybrid/android/checks/WebViewGuardCheck.java

        java -cp "$ANDROID_HOME/platforms/android-36/android.jar:$RUNNER_TEMP/kinto-preview-output/classes" com.kinto.trendyollab.WebViewGuardCheck

        '
    - uses: actions/download-artifact@v4
      with:
        name: KINTO-Unsigned-Candidate-NOT-FOR-UPLOAD
        path: ${{ runner.temp }}/kinto-candidate
    - name: Sign candidate APK with disposable test key only
      env:
        KINTO_PREVIEW_KEYSTORE: ${{ runner.temp }}/kinto-preview.keystore
        KINTO_PREVIEW_PASSWORD_FILE: ${{ runner.temp }}/kinto-preview-password
      run: 'kinto_candidate_apk="$(python3 -c ''import pathlib,sys; hits=list(pathlib.Path(sys.argv[1]).rglob("app-release-unsigned.apk"));
        assert len(hits)==1; print(hits[0])'' "$RUNNER_TEMP/kinto-candidate")"

        java -jar "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" sign --ks "$KINTO_PREVIEW_KEYSTORE" --ks-key-alias
        kinto-preview --ks-pass "file:$KINTO_PREVIEW_PASSWORD_FILE" --out "$RUNNER_TEMP/kinto-preview-output/KINTO-Candidate-0.28.apk"
        "$kinto_candidate_apk"

        '
    - name: Enable KVM for synthetic UI test
      run: 'echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm

        '
    - name: Supported renderer compatibility or explicit old-renderer update guidance
      uses: reactivecircus/android-emulator-runner@v2
      env:
        KINTO_APK: ${{ runner.temp }}/kinto-preview-output/KINTO-Preview-0.28.apk
        KINTO_ONLY_STORE: mango
      with:
        api-level: ${{ matrix.api }}
        arch: x86_64
        target: google_apis
        profile: pixel_2
        disable-animations: false
        emulator-options: -wipe-data -no-window -noaudio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
        script: "if [ \"${{ matrix.api }}\" = \"29\" ]; then\n  python3 mobile/hybrid/tools/webview-update-smoke.py\nelse\n\
          \  python3 mobile/hybrid/tools/launch-functional-smoke.py\n  python3 mobile/hybrid/tools/webview-smoke.py\nfi\n"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: KINTO-Privacy-Native-${{ matrix.api }}
        path: '${{ runner.temp }}/kinto-preview-output/KINTO-Preview-0.28.apk

          ${{ runner.temp }}/kinto-preview-output/KINTO-Candidate-0.28.apk

          ${{ runner.temp }}/kinto-preview-output/launch-*.png

          ${{ runner.temp }}/kinto-preview-output/launch-*.mp4

          ${{ runner.temp }}/kinto-preview-output/invoice-test.png

          ${{ runner.temp }}/kinto-preview-output/store-test.png

          ${{ runner.temp }}/kinto-preview-output/navigation-return-test.png

          ${{ runner.temp }}/kinto-preview-output/product-review-test.png

          ${{ runner.temp }}/kinto-preview-output/hepsiburada-review-test.png

          ${{ runner.temp }}/kinto-preview-output/zara-native-failure.png

          '
        retention-days: 14
        if-no-files-found: error
    strategy:
      fail-fast: false
      matrix:
        api:
        - 29
        - 36
