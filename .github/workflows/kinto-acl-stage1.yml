name: KINTO ACL Stage 1 static gate
on:
  pull_request:
    paths:
      - 'sql/kinto-*.sql'
      - 'ci/sensitive-session-*'
      - 'ci/fixtures/sensitive-rpc-*'
      - 'js/admin-featured-*.js'
      - 'admin-content-cms.html'
      - 'scripts/verify_kinto_session_rpc_v1.py'
      - 'scripts/verify_kinto_acl_stage1.py'
      - '.github/workflows/kinto-acl-stage1.yml'
  workflow_dispatch:
jobs:
  static-acl-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify ACL SQL scope and rollback contract
        run: python scripts/verify_kinto_acl_stage1.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned isolated PostgreSQL runtime
        run: npm install --prefix "$RUNNER_TEMP/kinto-pg" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.8
      - name: Execute isolated authorization and UI migration tests
        run: |
          KINTO_PGLITE_MODULE="$RUNNER_TEMP/kinto-pg/node_modules/@electric-sql/pglite/dist/index.js" node ci/sensitive-session-rpc.integration.mjs
          node --test ci/sensitive-session-ui.test.mjs
