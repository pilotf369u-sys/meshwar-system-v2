name: One Shot Admin Featured Phase1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-admin-featured-phase1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch admin CMS includes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin-content-cms.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="css/admin-featured-campaigns-v1.css?v=20260827-v1.0">'
          js='<script src="js/admin-featured-campaigns-v1.js?v=20260827-v1.0"></script>'
          if css not in s:
              s=s.replace('</head>', css+'\n</head>', 1)
          if js not in s:
              s=s.replace('</body>', js+'\n</body>', 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-admin-featured-phase1.yml
          git add -A
          git commit -m "feat: wire featured campaigns into admin CMS phase 1"
          git push
