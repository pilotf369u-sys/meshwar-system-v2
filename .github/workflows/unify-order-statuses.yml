name: Unify order statuses
on:
  push:
    paths:
      - '.github/workflows/unify-order-statuses.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/unify-order-statuses.py
      - name: Commit dashboard changes
        run: |
          git config user.name 'meshwar-status-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add employee-dashboard.html admin-dashboard.html branch-dashboard.html
          git commit -m 'Unify order status dropdowns across dashboards' || true
          git push origin main
      - name: Remove temporary automation files
        run: |
          git pull --rebase origin main
          git rm .github/scripts/unify-order-statuses.py .github/workflows/unify-order-statuses.yml
          git commit -m 'Remove temporary order status automation'
          git push origin main
