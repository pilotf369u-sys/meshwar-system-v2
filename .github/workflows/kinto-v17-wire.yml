name: KINTO V17 Wire
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kinto-v17-wire.yml'
jobs:
  wire:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Activate V17 cache bust and static brand purge
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('منصة MeshWar','منصة KINTO').replace('عروض MeshWar','عروض KINTO').replace('أهلاً بكم في MeshWar','أهلاً بكم في KINTO').replace('عبر منصة MeshWar','عبر منصة KINTO')
          s=s.replace('alt="MeshWar"','alt="KINTO"').replace('alt="MeshWar Logo"','alt="KINTO Logo"')
          s=re.sub(r'(<script src="js/index-featured-campaigns-v1\.js\?v=)[^"]+("[^>]*></script>)',r'\g<1>20260828-v17-kinto\2',s,count=1)
          p.write_text(s)
          Path('.github/workflows/kinto-v17-wire.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/kinto-v17-wire.yml
          git commit -m 'feat: activate KINTO V17 identity and static brand purge'
          git push
