name: Fix Vendor Label One Sheet
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-vendor-label-one-sheet.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python3 tools/fix_vendor_label_one_sheet.py
      - name: Verify
        run: |
          grep -F 'page-break-after:avoid' vendor-dashboard.html
          grep -F 'orderPaymentStatus' vendor-dashboard.html
          grep -F 'الدفع عند الاستلام - COD' vendor-dashboard.html
          grep -F 'المحافظة / المدينة' vendor-dashboard.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor-dashboard.html
          git diff --cached --quiet || git commit -m 'Fix thermal label one-page city and payment status'
          git push origin main
