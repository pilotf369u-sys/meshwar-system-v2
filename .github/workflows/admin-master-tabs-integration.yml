name: Admin master tabs integration
on:
  push:
    branches:
      - fix/admin-master-tabs-integration
permissions:
  contents: write
jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply integration patch
        run: python3 tools/apply_admin_master_tabs_integration.py
      - name: Remove temporary patch machinery
        run: |
          rm -f tools/apply_admin_master_tabs_integration.py
          rm -f .github/workflows/admin-master-tabs-integration.yml
      - name: Structural assertions
        run: |
          grep -Fq 'data-admin-section="courier-reports"' admin-dashboard.html
          grep -Fq 'data-admin-section="branch-reports"' admin-dashboard.html
          grep -Fq 'data-admin-section="local-stores"' admin-dashboard.html
          grep -Fq 'id="courierReportsFrame"' admin-dashboard.html
          grep -Fq 'id="branchReportsFrame"' admin-dashboard.html
          grep -Fq 'id="localStoresFrame"' admin-dashboard.html
          grep -Fq "history.replaceState" admin-dashboard.html
          grep -Fq "embed','1" admin-dashboard.html
          grep -Fq 'admin-embedded' admin-delivery-reports.html
          grep -Fq 'admin-embedded' admin-branch-reports.html
          grep -Fq 'admin-embedded' local-stores-admin.html
          ! grep -Fq 'data-admin-page="admin-delivery-reports.html"' admin-dashboard.html
          ! grep -Fq 'data-admin-page="admin-branch-reports.html"' admin-dashboard.html
          ! grep -Fq 'data-admin-page="local-stores-admin.html"' admin-dashboard.html
      - name: Node syntax check inline JavaScript
        run: |
          rm -rf /tmp/meshwar-js-check && mkdir -p /tmp/meshwar-js-check
          python3 - <<'PY'
          import re, pathlib
          files=['admin-dashboard.html','admin-delivery-reports.html','admin-branch-reports.html','local-stores-admin.html']
          out=pathlib.Path('/tmp/meshwar-js-check')
          count=0
          for fn in files:
              text=pathlib.Path(fn).read_text(encoding='utf-8')
              idx=0
              for attrs,body in re.findall(r'<script([^>]*)>(.*?)</script>',text,flags=re.S|re.I):
                  if re.search(r'\bsrc\s*=',attrs,re.I) or not body.strip():
                      continue
                  idx+=1; count+=1
                  ext='.mjs' if re.search(r'type\s*=\s*["\']module["\']',attrs,re.I) else '.js'
                  (out/f'{pathlib.Path(fn).stem}-{idx}{ext}').write_text(body,encoding='utf-8')
          print('Extracted',count,'inline scripts')
          PY
          for f in /tmp/meshwar-js-check/*; do echo "node --check $f"; node --check "$f"; done
      - name: Diff validation
        run: |
          git diff --check
          git status --short
          git diff --stat
          git diff -- admin-dashboard.html admin-delivery-reports.html admin-branch-reports.html local-stores-admin.html | sed -n '1,360p'
      - name: Commit validated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-dashboard.html admin-delivery-reports.html admin-branch-reports.html local-stores-admin.html tools/apply_admin_master_tabs_integration.py .github/workflows/admin-master-tabs-integration.yml
          git commit -m "Integrate admin reports into master dashboard tabs"
          git push origin HEAD:fix/admin-master-tabs-integration
