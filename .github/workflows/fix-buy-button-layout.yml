name: Fix Buy Button Layout
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-buy-button-layout.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python3 tools/fix_buy_button_layout.py
      - name: Verify
        run: |
          node --check js/local-store-card-v3.js
          grep -F 'display:inline-flex!important' js/local-store-card-v3.js
          grep -F '<span aria-hidden="true" style="display:inline-block;line-height:1">🛒</span><span style="display:inline-block;line-height:1.2">اطلب الآن</span>' js/local-store-card-v3.js
          grep -F 'js/local-store-card-v3.js?v=cta-layout-fix-v1' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/local-store-card-v3.js index.html
          git diff --cached --quiet || git commit -m 'Fix buy button icon and text alignment'
          git push origin main
