name: Admin sidebar master audit
on:
  push:
    branches: [agent/admin-sidebar-master-audit]
    paths: ['.github/workflows/admin-sidebar-master-audit.yml']
permissions:
  contents: write
jobs:
  patch-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/admin-sidebar-master-audit
          fetch-depth: 2
      - name: Apply sidebar master patch
        run: python3 .github/admin_sidebar_master_patch.py
      - name: Syntax and finance audit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          files=['admin-dashboard.html','admin-branches.html','admin-branch-reports.html']
          for fn in files:
              html=Path(fn).read_text(encoding='utf-8')
              scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html,re.I)
              for i,src in enumerate(scripts):
                  if not src.strip(): continue
                  with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
                      f.write(src); name=f.name
                  r=subprocess.run(['node','--check',name],capture_output=True,text=True)
                  if r.returncode:
                      raise SystemExit(f'{fn}: inline script {i} failed\n{r.stderr}')
              assert 'admin-master-sidebar-v2' in html
              assert 'overflow-y:auto!important' in html
              assert 'تسجيل الخروج' in html
          dash=Path('admin-dashboard.html').read_text(encoding='utf-8')
          required=['vendor_payment_status','vendor_other_deductions','exportAdminVendorPaidStatement','adminVendorStoreFilter',"sb.from('local_stores')"]
          for token in required: assert token in dash, token
          tables=sorted(set(re.findall(r"\.from\(['\"]([^'\"]+)['\"]\)",dash)))
          print('Admin dashboard Supabase table inventory:', ', '.join(tables))
          # The automatic store loader must use local_stores, never the removed stores table.
          m=re.search(r'async function loadStoresAdmin\(\)\{([\s\S]*?)\}async function addStore',dash)
          assert m and ".from('local_stores')" in m.group(1)
          print('Inline JS syntax: OK for all three admin pages')
          print('Finance settlement invariants: OK')
          PY
          git diff --check
      - name: Commit admin-only changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-dashboard.html admin-branches.html admin-branch-reports.html
          git diff --cached --quiet && exit 0
          git commit -m 'Unify admin sidebar and verify finance scripts'
          git push origin HEAD:agent/admin-sidebar-master-audit
