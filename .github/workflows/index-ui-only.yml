name: Index UI validation
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/index-ui-only.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate index storefront wiring
        run: |
          grep -q "function openStore(storeUrl,storeId)" index.html
          grep -q "window.open(url,'_blank','noopener,noreferrer')" index.html
          grep -q "index.html?storeId=" index.html
          grep -q "store_url" index.html
