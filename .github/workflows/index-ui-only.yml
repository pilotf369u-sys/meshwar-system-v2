name: Index UI only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/index-ui-only.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply UI-only patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=s
          old_scripts=re.findall(r'<script(?:\s[^>]*)?>.*?</script>',s,re.S|re.I)
          old_ids=set(re.findall(r'\bid=["\']([^"\']+)["\']',s,re.I))

          s=s.replace('<nav class="sticky top-0 z-[11000] border-b border-white/10 bg-slate-950/80 backdrop-blur-xl dark:bg-slate-950/80">','<nav class="sticky top-0 z-50 border-b border-white/10 bg-slate-950/90 shadow-lg shadow-black/20 backdrop-blur-xl dark:bg-slate-950/90">',1)
          s=s.replace('<span class="inline-flex rounded-full border border-sky-400/20 bg-sky-400/10 px-3 py-1 text-xs font-black text-sky-500">MeshWar • Smart Commerce</span>','',1)

          old_video='''<div id="meshwarVideoAd" class="mx-auto mt-4 max-w-7xl px-4"><div class="grid gap-4 rounded-3xl border border-amber-400/20 bg-slate-900/60 p-4 shadow-xl shadow-amber-400/5 backdrop-blur-md md:grid-cols-[1.2fr_.8fr]"><div class="overflow-hidden rounded-2xl border border-white/10 bg-black/40"><video id="meshwarPromoVideo" class="aspect-video h-full w-full object-cover" autoplay muted loop playsinline preload="metadata"><source src="videos/promo.mp4" type="video/mp4"></video></div><div class="flex flex-col justify-center rounded-2xl border border-white/10 bg-slate-950/40 p-5"><div class="text-xs font-black text-amber-300">MeshWar Showcase</div><h3 class="mt-2 text-xl font-black text-white">مساحة العروض والإعلانات المرئية</h3><p class="mt-2 text-sm leading-7 text-slate-300">فيديوهات قصيرة للعروض والمتاجر الجديدة مع تشغيل تلقائي صامت ومتجاوب.</p><div class="mt-4 flex flex-wrap gap-2"><button id="meshwarPromoSoundBtn" type="button" class="rounded-xl border border-amber-400/40 bg-white/5 px-4 py-2 text-sm font-black text-white">🔇 تشغيل الصوت</button><button id="meshwarPromoPlayBtn" type="button" class="rounded-xl border border-white/10 bg-gradient-to-r from-sky-600 to-indigo-600 px-4 py-2 text-sm font-black text-white">⏯ تشغيل / إيقاف</button></div></div></div></div>'''
          new_video='''<div id="meshwarVideoAd" class="mx-auto mt-4 max-w-7xl px-4"><div class="overflow-hidden rounded-3xl border border-amber-400/20 bg-black shadow-2xl shadow-amber-400/5"><video id="meshwarPromoVideo" class="aspect-[16/5] min-h-[180px] w-full object-cover sm:aspect-[16/6]" autoplay muted loop playsinline controls preload="metadata"><source src="videos/promo.mp4" type="video/mp4"></video><button id="meshwarPromoSoundBtn" type="button" class="hidden" aria-hidden="true" tabindex="-1">🔇 تشغيل الصوت</button><button id="meshwarPromoPlayBtn" type="button" class="hidden" aria-hidden="true" tabindex="-1">⏯ تشغيل / إيقاف</button></div></div>'''
          if old_video not in s: raise SystemExit('video block not found')
          s=s.replace(old_video,new_video,1)

          s=s.replace('class="rounded-xl border border-amber-400/40 bg-gradient-to-r from-sky-600 to-indigo-600 px-5 py-2.5 text-sm font-black text-white shadow-lg shadow-amber-400/10"','class="min-w-[220px] flex-1 rounded-2xl border border-amber-400/50 bg-gradient-to-r from-sky-600 to-indigo-600 px-8 py-4 text-base font-black text-white shadow-xl shadow-amber-400/10 transition hover:scale-[1.02] md:text-lg"',1)
          s=s.replace('class="rounded-xl border border-white/10 bg-white/5 px-5 py-2.5 text-sm font-black text-slate-200"','class="min-w-[220px] flex-1 rounded-2xl border border-amber-400/25 bg-white/5 px-8 py-4 text-base font-black text-slate-100 shadow-lg transition hover:scale-[1.02] hover:border-amber-400/50 md:text-lg"',1)

          tabs='''    <section id="meshwarStoreTabs"'''
          ticker='''    <section id="meshwarTicker" class="mx-auto mt-6 max-w-7xl overflow-hidden rounded-2xl border border-amber-400/25 bg-slate-900/75 px-3 py-3 shadow-lg backdrop-blur-md"><div class="meshwar-ticker-track whitespace-nowrap text-sm font-black text-amber-200 md:text-base">✨ عروض MeshWar الجديدة قريباً • تابع أحدث المتاجر والخصومات والخدمات من مكان واحد • أهلاً بكم في MeshWar ✨</div></section>\n\n'''
          if 'id="meshwarTicker"' not in s:
              if tabs not in s: raise SystemExit('tabs marker not found')
              s=s.replace(tabs,ticker+tabs,1)

          css='''\n<style>/* MESHWAR_UI_ONLY_M1 */\n@keyframes meshwarTickerMove{from{transform:translateX(-100%)}to{transform:translateX(100%)}}\n.meshwar-ticker-track{display:inline-block;min-width:100%;animation:meshwarTickerMove 22s linear infinite}\n#meshwarStoreTabs>div{gap:14px!important;padding:10px!important}\n#meshwarVideoAd video{display:block;background:#020617}\n</style>\n'''
          if 'MESHWAR_UI_ONLY_M1' not in s: s=s.replace('</head>',css+'</head>',1)

          footer='''\n<footer id="meshwarSocialFooter" class="mx-auto mt-14 max-w-7xl px-4 pb-10"><div class="flex flex-col items-center justify-between gap-5 rounded-3xl border border-white/10 bg-slate-900/60 p-6 text-center shadow-xl backdrop-blur-md md:flex-row md:text-right"><div><div class="font-black text-white">MeshWar</div><div class="mt-1 text-xs text-slate-400">تواصل معنا عبر منصاتنا الاجتماعية</div></div><div class="flex items-center gap-3"><a href="#" aria-label="WhatsApp" class="flex h-11 w-11 items-center justify-center rounded-full border border-emerald-400/30 bg-emerald-400/10 text-lg text-emerald-300 transition hover:scale-110"><i class="fa-brands fa-whatsapp"></i></a><a href="#" aria-label="Telegram" class="flex h-11 w-11 items-center justify-center rounded-full border border-sky-400/30 bg-sky-400/10 text-lg text-sky-300 transition hover:scale-110"><i class="fa-brands fa-telegram"></i></a><a href="#" aria-label="Instagram" class="flex h-11 w-11 items-center justify-center rounded-full border border-pink-400/30 bg-pink-400/10 text-lg text-pink-300 transition hover:scale-110"><i class="fa-brands fa-instagram"></i></a></div></div></footer>\n'''
          if 'id="meshwarSocialFooter"' not in s: s=s.replace('<div id="orderModal"',footer+'\n    <div id="orderModal"',1)

          new_ids=set(re.findall(r'\bid=["\']([^"\']+)["\']',s,re.I))
          missing=old_ids-new_ids
          if missing: raise SystemExit('missing ids: '+','.join(sorted(missing)))
          new_scripts=re.findall(r'<script(?:\s[^>]*)?>.*?</script>',s,re.S|re.I)
          if old_scripts!=new_scripts: raise SystemExit('existing scripts changed')
          for marker in ['meshwarTicker','meshwarSocialFooter','sticky top-0 z-50','controls preload="metadata"']:
              if marker not in s: raise SystemExit('missing '+marker)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit UI only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Polish customer UI with clean media and ticker"
          git push origin main
