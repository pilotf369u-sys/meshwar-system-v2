name: Index UI only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/index-ui-only.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply local store fallback patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="function openStore(storeUrl){const url=String(storeUrl||'').trim();if(!url){alert('رابط المتجر غير متوفر حالياً.');return}window.open(url,'_blank','noopener,noreferrer')}"
          new="function openStore(storeUrl,storeId){const url=String(storeUrl||'').trim();if(url){window.open(url,'_blank','noopener,noreferrer');return}const id=String(storeId||'').trim();if(id){window.location.href='index.html?storeId='+encodeURIComponent(id)+'#localStoresPublic';return}alert('تعذر فتح المتجر حالياً.')}"
          if old not in s: raise SystemExit('openStore marker not found')
          s=s.replace(old,new,1)
          old_btn="onclick=\"openStore(decodeURIComponent('${encodeURIComponent(String(s.store_url||''))}'))\""
          new_btn="onclick=\"openStore(decodeURIComponent('${encodeURIComponent(String(s.store_url||''))}'),decodeURIComponent('${encodeURIComponent(String(s.id||''))}'))\""
          if old_btn not in s: raise SystemExit('store button marker not found')
          s=s.replace(old_btn,new_btn,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate and commit
        run: |
          grep -q "function openStore(storeUrl,storeId)" index.html
          grep -q "index.html?storeId=" index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add internal fallback for local store opening"
          git push origin main
