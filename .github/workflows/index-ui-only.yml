name: Index and local store V4 validation
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'vendor-dashboard.html'
      - 'vendor-dashboard-v2.html'
      - 'vendor-dashboard-barcode-shell.html'
      - 'employee-dashboard.html'
      - 'js/vendor-barcode-smart-search-v11.js'
      - 'js/vendor-order-smart-search-scanner-v13.js'
      - 'js/vendor-theme-pagination-v16.js'
      - 'js/vendor-order-status-contrast-v18.js'
      - 'js/vendor-finance-settlement-v24.js'
      - 'js/local-store-card-v3.js'
      - 'js/local-store-pricing.js'
      - 'js/local-store-product-details-v4.js'
      - 'js/local-store-global-search-v12.js'
      - 'js/local-store-variant-stock-v5.js'
      - 'js/local-store-matrix-stock-v6.js'
      - 'js/local-store-ui-stock-v7.js'
      - 'supabase/migrations/20260821_local_store_matrix_combination_stock.sql'
      - 'supabase/migrations/20260822_local_product_barcode.sql'
      - '.github/workflows/index-ui-only.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'vendor-dashboard.html'
      - 'vendor-dashboard-v2.html'
      - 'vendor-dashboard-barcode-shell.html'
      - 'employee-dashboard.html'
      - 'js/vendor-barcode-smart-search-v11.js'
      - 'js/vendor-order-smart-search-scanner-v13.js'
      - 'js/vendor-theme-pagination-v16.js'
      - 'js/vendor-order-status-contrast-v18.js'
      - 'js/vendor-finance-settlement-v24.js'
      - 'js/local-store-card-v3.js'
      - 'js/local-store-pricing.js'
      - 'js/local-store-product-details-v4.js'
      - 'js/local-store-global-search-v12.js'
      - 'js/local-store-variant-stock-v5.js'
      - 'js/local-store-matrix-stock-v6.js'
      - 'js/local-store-ui-stock-v7.js'
      - 'supabase/migrations/20260821_local_store_matrix_combination_stock.sql'
      - 'supabase/migrations/20260822_local_product_barcode.sql'
      - '.github/workflows/index-ui-only.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check js/local-store-card-v3.js
          node --check js/local-store-pricing.js
          node --check js/local-store-product-details-v4.js
          node --check js/local-store-global-search-v12.js
          node --check js/local-store-variant-stock-v5.js
          node --check js/local-store-matrix-stock-v6.js
          node --check js/local-store-ui-stock-v7.js
          node --check js/vendor-barcode-smart-search-v11.js
          node --check js/vendor-order-smart-search-scanner-v13.js
          node --check js/vendor-theme-pagination-v16.js
          node --check js/vendor-order-status-contrast-v18.js
          node --check js/vendor-finance-settlement-v24.js
      - name: Validate current local store routing
        run: |
          grep -Fq 'id="localStoreProductsPanel"' index.html
          grep -Fq "show(selectedStoreId?'local':'international')" index.html
          grep -Fq "new URLSearchParams(window.location.search).get('storeId')" index.html
          grep -Fq 'window.loadStoreDetails=async function(storeId)' js/local-store-card-v3.js
          grep -Fq 'local_products?select=' js/local-store-card-v3.js
      - name: Validate V4 V5 V6 V7 integration
        run: |
          grep -Fq '<script src="js/local-store-pricing.js?v=local-modal-v4-2"></script>' index.html
          grep -Fq '<script type="module" src="js/local-store-card-v3.js?v=local-modal-v4-2"></script>' index.html
          grep -Fq '<script src="js/local-store-product-details-v4.js?v=local-modal-v4-2" data-mw-product-details-v4></script>' index.html
          grep -Fq "s.src='js/local-store-product-details-v4.js?v=local-modal-v4-2';" js/local-store-pricing.js
          grep -Fq "btn.textContent='عرض التفاصيل والطلب'" js/local-store-product-details-v4.js
          grep -Fq "local-store-variant-stock-v5.js?v=desc-unlimit-v8-1" js/local-store-product-details-v4.js
          grep -Fq "local-store-matrix-stock-v6.js?v=desc-unlimit-v8-1" js/local-store-product-details-v4.js
          grep -Fq "local-store-ui-stock-v7.js?v=desc-unlimit-v8-1" js/local-store-product-details-v4.js
          grep -Fq 'variant_stock' js/local-store-variant-stock-v5.js
          grep -Fq 'matrix_stock' js/local-store-matrix-stock-v6.js
          grep -Fq 'MeshwarMatrixStock' js/local-store-matrix-stock-v6.js
          grep -Fq 'line-clamp:2' js/local-store-ui-stock-v7.js
          grep -Fq 'validateMatrixTotal' js/local-store-ui-stock-v7.js
          grep -Fq 'normalizeBlankInputs' js/local-store-ui-stock-v7.js
          grep -Fq 'openAddProductModal' js/local-store-ui-stock-v7.js
          grep -Fq 'button[onclick="openProductModal()"]' js/local-store-ui-stock-v7.js
          grep -Fq "onclick=\"editProduct('" vendor-dashboard-v2.html
          grep -Fq "onclick=\"deleteProduct('" vendor-dashboard-v2.html
          grep -Fq 'Object.assign(window,{vendorLogin,vendorLogout,toggleTheme,openProductModal,closeProductModal,editProduct,saveProduct,deleteProduct' vendor-dashboard-v2.html
          grep -Fq 'meshwar_adjust_matrix_stock' supabase/migrations/20260821_local_store_matrix_combination_stock.sql
          grep -Fq 'for update' supabase/migrations/20260821_local_store_matrix_combination_stock.sql
      - name: Validate customer storefront global search isolation
        run: |
          grep -Fq "local-store-global-search-v12.js?v=customer-global-search-v12" js/local-store-product-details-v4.js
          grep -Fq 'MeshwarLocalStoreGlobalSearchV12' js/local-store-global-search-v12.js
          grep -Fq 'product_name,barcode,stock_quantity,is_out_of_stock' js/local-store-global-search-v12.js
          grep -Fq "card.style.setProperty('display',show?'flex':'none','important')" js/local-store-global-search-v12.js
          grep -Fq 'MeshwarStoreCategoriesV9.initStorefront' js/local-store-global-search-v12.js
          grep -Fq '#mwCategoryShell [data-cat-filter]' js/local-store-global-search-v12.js
      - name: Validate vendor order smart search and employee camera parity
        run: |
          grep -Fq '<script src="js/vendor-order-smart-search-scanner-v13.js?v=20260822-1910"></script>' vendor-dashboard.html
          grep -Fq 'MeshwarVendorOrderSmartSearchV13?.install(frame.contentWindow)' vendor-dashboard.html
          grep -Fq 'vendorOrderSmartSearch' js/vendor-order-smart-search-scanner-v13.js
          grep -Fq 'Html5Qrcode' js/vendor-order-smart-search-scanner-v13.js
          grep -Fq 'html5-qrcode@2.3.8' js/vendor-order-smart-search-scanner-v13.js
          grep -Fq 'data-mw-order-highlight' js/vendor-order-smart-search-scanner-v13.js
          grep -Fq "row.style.setProperty('display',show?'':'none','important')" js/vendor-order-smart-search-scanner-v13.js
          grep -Fq 'sanitizeInput(win)' js/vendor-order-smart-search-scanner-v13.js
          grep -Fq "{facingMode:'environment'}" employee-dashboard.html
          grep -Fq "{fps:10,qrbox:{width:250,height:150}}" employee-dashboard.html
          grep -Fq "{facingMode:'environment'}" js/vendor-order-smart-search-scanner-v13.js
          grep -Fq "{fps:10,qrbox:{width:250,height:150}}" js/vendor-order-smart-search-scanner-v13.js
          ! grep -Fq 'Html5Qrcode.getCameras()' js/vendor-order-smart-search-scanner-v13.js
          ! grep -Fq 'deviceId' js/vendor-order-smart-search-scanner-v13.js
          ! grep -Fq 'getDisplayMedia' js/vendor-order-smart-search-scanner-v13.js
          ! grep -Fq 'scanFile' js/vendor-order-smart-search-scanner-v13.js
          grep -Fq 'MW-' js/vendor-order-smart-search-scanner-v13.js
          grep -Fq 'ordersBody' js/vendor-order-smart-search-scanner-v13.js
      - name: Validate vendor lux theme tab isolation and pagination
        run: |
          grep -Fq '<script src="js/vendor-theme-pagination-v16.js?v=20260822-1910"></script>' vendor-dashboard.html
          grep -Fq 'MeshwarVendorThemePaginationV16?.install(frame.contentWindow)' vendor-dashboard.html
          grep -Fq "orders:{container:'#ordersBody'" js/vendor-theme-pagination-v16.js
          grep -Fq "products:{container:'#productsBody'" js/vendor-theme-pagination-v16.js
          grep -Fq "categories:{container:'#mwCatList'" js/vendor-theme-pagination-v16.js
          grep -Fq "sizes:{orders:10,products:10,categories:10}" js/vendor-theme-pagination-v16.js
          grep -Fq '<option value="10">10</option><option value="20">20</option>' js/vendor-theme-pagination-v16.js
          grep -Fq '.vendor-tab-panel{display:none!important}.vendor-tab-panel.active{display:block!important}' js/vendor-theme-pagination-v16.js
          grep -Fq 'enforceSingleTab' js/vendor-theme-pagination-v16.js
          grep -Fq 'html.light body{background:#f2efe8!important' js/vendor-theme-pagination-v16.js
          grep -Fq 'background:linear-gradient(135deg,#b98b17,#e0bc53)!important' js/vendor-theme-pagination-v16.js
          grep -Fq 'html.dark .field' js/vendor-theme-pagination-v16.js
          grep -Fq 'mw-page-hidden' js/vendor-theme-pagination-v16.js
          grep -Fq "e.target?.id==='vendorOrderSmartSearch'" js/vendor-theme-pagination-v16.js
          grep -Fq "e.target?.id==='vendorSmartProductSearch'" js/vendor-theme-pagination-v16.js
          ! grep -Fq "sb.from('orders')" js/vendor-theme-pagination-v16.js
          ! grep -Fq "sb.from('local_products')" js/vendor-theme-pagination-v16.js
      - name: Validate vendor V18 order contrast isolation
        run: |
          grep -Fq '<script src="js/vendor-order-status-contrast-v18.js?v=20260822-1910"></script>' vendor-dashboard.html
          grep -Fq 'MeshwarVendorOrderStatusContrastV18?.install(frame.contentWindow)' vendor-dashboard.html
          grep -Fq 'data-mw-order-status-tone' js/vendor-order-status-contrast-v18.js
          grep -Fiq '#f3f4f6' js/vendor-order-status-contrast-v18.js
          grep -Fiq '#e5e7eb' js/vendor-order-status-contrast-v18.js
          ! grep -Fq "sb.from(" js/vendor-order-status-contrast-v18.js
          ! grep -Fq '/rest/v1/' js/vendor-order-status-contrast-v18.js
      - name: Validate V24 direct P&L injection lifecycle
        run: |
          grep -Fq '<meta name="meshwar-build" content="vendor-v24-pl-direct-injection-20260824-1253">' vendor-dashboard.html
          grep -Fq '<script src="js/vendor-finance-settlement-v24.js?v=20260824-1253"></script>' vendor-dashboard.html
          grep -Fq 'MeshwarVendorFinanceSettlementV24?.install(frame.contentWindow)' vendor-dashboard.html
          grep -Fq 'MeshwarVendorFinanceSettlementV24?.ensureUi(win,{refresh:true})' vendor-dashboard.html
          grep -Fq "closest?.('#vendorTabBtn-pl')" vendor-dashboard.html
          grep -Fq "panel.querySelector('.mw-pl-kpis')" js/vendor-finance-settlement-v24.js
          grep -Fq 'kpis.parentNode.insertBefore(toolbar,kpis)' js/vendor-finance-settlement-v24.js
          grep -Fq 'function ensureUi(win,{refresh=false}={})' js/vendor-finance-settlement-v24.js
          grep -Fq "closest?.('#vendorTabBtn-pl')" js/vendor-finance-settlement-v24.js
          grep -Fq 'new win.MutationObserver' js/vendor-finance-settlement-v24.js
          grep -Fq "querySelector('#vendorTab-pl .mw-pl-kpis')" js/vendor-finance-settlement-v24.js
          grep -Fq "frame.addEventListener('load',install)" vendor-dashboard.html
          ! grep -Fq 'setTimeout(install,250)' vendor-dashboard.html
          ! grep -Fq 'setTimeout(install,900)' vendor-dashboard.html
          test ! -e js/vendor-financial-periods-v24.js
      - name: Validate direct vendor barcode entry and unrestricted product description
        run: |
          ! grep -Fq 'location.replace(' vendor-dashboard.html
          grep -Fq '<script src="js/vendor-barcode-smart-search-v11.js?v=20260823-1301"></script>' vendor-dashboard.html
          grep -Fq 'id="vendorFrame"' vendor-dashboard.html
          grep -Fq 'src="vendor-dashboard-v2.html?v=20260822-1910"' vendor-dashboard.html
          grep -Fq 'MeshwarVendorBarcodeV11?.install(frame.contentWindow)' vendor-dashboard.html
          grep -Fq 'local_products?select=id,product_name,barcode,stock_quantity' js/vendor-barcode-smart-search-v11.js
          grep -Fq 'data-mw-barcode-cell' js/vendor-barcode-smart-search-v11.js
          grep -Fq 'data-mw-barcode-label' js/vendor-barcode-margin-autopricing-v22.js
          ! grep -Fq "row.querySelector('[data-mw-barcode-label]')?.remove()" js/vendor-barcode-smart-search-v11.js
          grep -Fq 'filterExistingRows' js/vendor-barcode-smart-search-v11.js
          grep -Fq 'resetSearchInput(win)' js/vendor-barcode-smart-search-v11.js
          grep -Fq 'resetSearchInput(win,{focus:true})' js/vendor-barcode-smart-search-v11.js
          grep -Fq 'refocusSearchInput(win)' js/vendor-barcode-smart-search-v11.js
          grep -Fq 'add column if not exists barcode text null' supabase/migrations/20260822_local_product_barcode.sql
          grep -Fq 'idx_local_products_barcode' supabase/migrations/20260822_local_product_barcode.sql
          grep -Fq 'placeholder="وصف المنتج (اختياري)..."' vendor-dashboard-v2.html
          ! grep -Fq 'الوصف المختصر يجب ألا يتجاوز 30 حرفًا' vendor-dashboard-v2.html
          ! grep -Fq 'maxlength="30"' vendor-dashboard-v2.html
          ! grep -Eq 'description\.length[[:space:]]*>[[:space:]]*30' vendor-dashboard-v2.html
