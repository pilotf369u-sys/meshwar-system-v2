name: Bind isolated site content
on:
  push:
    branches: [main]
    paths: ['.github/workflows/index-ui-only.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch HTML references only
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          admin=Path('admin-dashboard.html')
          s=admin.read_text(encoding='utf-8')
          old_show=re.search(r'function showSection\(id\)\{[^\n]*\}',s).group(0)
          s=s.replace("<a onclick=\"showSection('content')\">إدارة المحتوى</a>","<a onclick=\"showSection('content');handleSiteContent('load')\">إدارة المحتوى</a>",1)
          old='<div class="card" id="content"><h3>إدارة المحتوى والموقع</h3><p>تعديل نصوص وأقسام الموقع الرئيسية.</p></div>'
          form=Path('.site-content-form.html').read_text(encoding='utf-8')
          if old in s:s=s.replace(old,form,1)
          elif 'id="siteTickerText"' not in s:raise SystemExit('content card not found')
          if 'js/site-content.js' not in s:s=s.replace('</body>','<script src="js/site-content.js"></script>\n</body>',1)
          if re.search(r'function showSection\(id\)\{[^\n]*\}',s).group(0)!=old_show:raise SystemExit('showSection changed')
          admin.write_text(s,encoding='utf-8')
          index=Path('index.html')
          s=index.read_text(encoding='utf-8')
          if 'js/public-content.js' not in s:s=s.replace('</body>','<script src="js/public-content.js"></script>\n</body>',1)
          index.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          node --check js/site-content.js
          node --check js/public-content.js
          grep -q "showSection('content');handleSiteContent('load')" admin-dashboard.html
          grep -q 'src="js/site-content.js"' admin-dashboard.html
          grep -q 'src="js/public-content.js"' index.html
          grep -q 'adminOrdersTableBody' admin-dashboard.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-dashboard.html index.html
          git commit -m "Safely connect site content controls"
          git push origin main
