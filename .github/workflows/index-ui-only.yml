name: Index and local store V4 validation
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'vendor-dashboard.html'
      - 'vendor-dashboard-v2.html'
      - 'vendor-dashboard-barcode-shell.html'
      - 'js/vendor-barcode-smart-search-v11.js'
      - 'js/local-store-card-v3.js'
      - 'js/local-store-pricing.js'
      - 'js/local-store-product-details-v4.js'
      - 'js/local-store-global-search-v12.js'
      - 'js/local-store-variant-stock-v5.js'
      - 'js/local-store-matrix-stock-v6.js'
      - 'js/local-store-ui-stock-v7.js'
      - 'supabase/migrations/20260821_local_store_matrix_combination_stock.sql'
      - 'supabase/migrations/20260822_local_product_barcode.sql'
      - '.github/workflows/index-ui-only.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'vendor-dashboard.html'
      - 'vendor-dashboard-v2.html'
      - 'vendor-dashboard-barcode-shell.html'
      - 'js/vendor-barcode-smart-search-v11.js'
      - 'js/local-store-card-v3.js'
      - 'js/local-store-pricing.js'
      - 'js/local-store-product-details-v4.js'
      - 'js/local-store-global-search-v12.js'
      - 'js/local-store-variant-stock-v5.js'
      - 'js/local-store-matrix-stock-v6.js'
      - 'js/local-store-ui-stock-v7.js'
      - 'supabase/migrations/20260821_local_store_matrix_combination_stock.sql'
      - 'supabase/migrations/20260822_local_product_barcode.sql'
      - '.github/workflows/index-ui-only.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check js/local-store-card-v3.js
          node --check js/local-store-pricing.js
          node --check js/local-store-product-details-v4.js
          node --check js/local-store-global-search-v12.js
          node --check js/local-store-variant-stock-v5.js
          node --check js/local-store-matrix-stock-v6.js
          node --check js/local-store-ui-stock-v7.js
          node --check js/vendor-barcode-smart-search-v11.js
      - name: Validate current local store routing
        run: |
          grep -Fq 'id="localStoreProductsPanel"' index.html
          grep -Fq "show(selectedStoreId?'local':'international')" index.html
          grep -Fq "new URLSearchParams(window.location.search).get('storeId')" index.html
          grep -Fq 'window.loadStoreDetails=async function(storeId)' js/local-store-card-v3.js
          grep -Fq 'local_products?select=' js/local-store-card-v3.js
      - name: Validate V4 V5 V6 V7 integration
        run: |
          grep -Fq '<script src="js/local-store-pricing.js?v=local-modal-v4-2"></script>' index.html
          grep -Fq '<script type="module" src="js/local-store-card-v3.js?v=local-modal-v4-2"></script>' index.html
          grep -Fq '<script src="js/local-store-product-details-v4.js?v=local-modal-v4-2" data-mw-product-details-v4></script>' index.html
          grep -Fq "s.src='js/local-store-product-details-v4.js?v=local-modal-v4-2';" js/local-store-pricing.js
          grep -Fq "btn.textContent='عرض التفاصيل والطلب'" js/local-store-product-details-v4.js
          grep -Fq "local-store-variant-stock-v5.js?v=desc-unlimit-v8-1" js/local-store-product-details-v4.js
          grep -Fq "local-store-matrix-stock-v6.js?v=desc-unlimit-v8-1" js/local-store-product-details-v4.js
          grep -Fq "local-store-ui-stock-v7.js?v=desc-unlimit-v8-1" js/local-store-product-details-v4.js
          grep -Fq 'variant_stock' js/local-store-variant-stock-v5.js
          grep -Fq 'matrix_stock' js/local-store-matrix-stock-v6.js
          grep -Fq 'MeshwarMatrixStock' js/local-store-matrix-stock-v6.js
          grep -Fq 'line-clamp:2' js/local-store-ui-stock-v7.js
          grep -Fq 'validateMatrixTotal' js/local-store-ui-stock-v7.js
          grep -Fq 'normalizeBlankInputs' js/local-store-ui-stock-v7.js
          grep -Fq 'openAddProductModal' js/local-store-ui-stock-v7.js
          grep -Fq 'button[onclick="openProductModal()"]' js/local-store-ui-stock-v7.js
          grep -Fq "onclick=\"editProduct('" vendor-dashboard-v2.html
          grep -Fq "onclick=\"deleteProduct('" vendor-dashboard-v2.html
          grep -Fq 'Object.assign(window,{vendorLogin,vendorLogout,toggleTheme,openProductModal,closeProductModal,editProduct,saveProduct,deleteProduct' vendor-dashboard-v2.html
          grep -Fq 'meshwar_adjust_matrix_stock' supabase/migrations/20260821_local_store_matrix_combination_stock.sql
          grep -Fq 'for update' supabase/migrations/20260821_local_store_matrix_combination_stock.sql
      - name: Validate customer storefront global search isolation
        run: |
          grep -Fq "local-store-global-search-v12.js?v=customer-global-search-v12" js/local-store-product-details-v4.js
          grep -Fq 'MeshwarLocalStoreGlobalSearchV12' js/local-store-global-search-v12.js
          grep -Fq 'product_name,barcode,stock_quantity,is_out_of_stock' js/local-store-global-search-v12.js
          grep -Fq "card.style.setProperty('display',show?'flex':'none','important')" js/local-store-global-search-v12.js
          grep -Fq 'MeshwarStoreCategoriesV9.initStorefront' js/local-store-global-search-v12.js
          grep -Fq '#mwCategoryShell [data-cat-filter]' js/local-store-global-search-v12.js
      - name: Validate direct vendor barcode entry and unrestricted product description
        run: |
          ! grep -Fq 'location.replace(' vendor-dashboard.html
          grep -Fq '<meta name="meshwar-build" content="vendor-barcode-v11-pages-20260822-1618">' vendor-dashboard.html
          grep -Fq '<script src="js/vendor-barcode-smart-search-v11.js?v=20260822-1618"></script>' vendor-dashboard.html
          grep -Fq 'id="vendorFrame"' vendor-dashboard.html
          grep -Fq 'src="vendor-dashboard-v2.html?v=20260822-1618"' vendor-dashboard.html
          grep -Fq 'MeshwarVendorBarcodeV11?.install(frame.contentWindow)' vendor-dashboard.html
          grep -Fq 'local_products?select=id,product_name,barcode,stock_quantity' js/vendor-barcode-smart-search-v11.js
          grep -Fq 'data-mw-barcode-label' js/vendor-barcode-smart-search-v11.js
          grep -Fq 'filterExistingRows' js/vendor-barcode-smart-search-v11.js
          grep -Fq 'add column if not exists barcode text null' supabase/migrations/20260822_local_product_barcode.sql
          grep -Fq 'idx_local_products_barcode' supabase/migrations/20260822_local_product_barcode.sql
          grep -Fq 'placeholder="وصف المنتج (اختياري)..."' vendor-dashboard-v2.html
          ! grep -Fq 'الوصف المختصر يجب ألا يتجاوز 30 حرفًا' vendor-dashboard-v2.html
          ! grep -Fq 'maxlength="30"' vendor-dashboard-v2.html
          ! grep -Eq 'description\.length[[:space:]]*>[[:space:]]*30' vendor-dashboard-v2.html
