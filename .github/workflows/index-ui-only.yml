name: Index internal store validation
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/index-ui-only.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate local store details routing
        run: |
          grep -Fq 'async function loadStoreDetails(storeId)' index.html
          grep -Fq ".from('local_products')" index.html
          grep -Fq ".eq('store_id',id)" index.html
          grep -Fq "show(selectedStoreId?'local':'international')" index.html
          grep -Fq 'id="localStoreProductsPanel"' index.html
          grep -Fq "new URLSearchParams(window.location.search).get('storeId')" index.html
