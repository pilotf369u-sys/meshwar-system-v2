name: Final delivery camera patch
on:
  push:
    paths:
      - '.github/final_camera_patch.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 .github/final_camera_patch.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add delivery-dashboard.html
          git commit -m "Fix delivery camera permission handling" || exit 0
          git push origin main
