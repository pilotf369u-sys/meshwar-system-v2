name: V93 Bundle Adapter Pool Hardening
on:
  push:
    branches: [fix/local-cart-v93-bundle-ops]
    paths: ['.github/workflows/v93-bundle-adapters-pools-once.yml']
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/local-cart-v93-bundle-ops
          fetch-depth: 0
      - name: Bind adapters to dashboard lexical order collections
        shell: python
        run: |
          from pathlib import Path
          files=['dashboard.html','employee-dashboard.html','admin-dashboard.html','branch-dashboard.html']
          old="function pools(){const out=[];for(const k of Object.keys(window)){let v;try{v=window[k]}catch{continue}if(Array.isArray(v)&&v.some(x=>x&&typeof x==='object'&&('details'in x||'order_code'in x||('status'in x&&'total_price'in x))))out.push(v)}return out}"
          new="function pools(){const out=[];const known=[typeof currentCustomerOrdersGlobal!=='undefined'?currentCustomerOrdersGlobal:null,typeof cloudOrders!=='undefined'?cloudOrders:null,typeof adminOrdersCloud!=='undefined'?adminOrdersCloud:null,typeof orders!=='undefined'?orders:null];for(const v of known)if(Array.isArray(v)&&!out.includes(v))out.push(v);for(const k of Object.keys(window)){let v;try{v=window[k]}catch{continue}if(Array.isArray(v)&&!out.includes(v)&&v.some(x=>x&&typeof x==='object'&&('details'in x||'order_code'in x||('status'in x&&'total_price'in x))))out.push(v)}return out}"
          for name in files:
              p=Path(name); text=p.read_text(encoding='utf-8')
              if old not in text: raise SystemExit(f'{name}: adapter pools signature not found')
              p.write_text(text.replace(old,new,1),encoding='utf-8')
          Path('.github/workflows/v93-bundle-adapters-pools-once.yml').unlink()
      - name: Verify adapters
        run: |
          set -e
          for f in dashboard.html employee-dashboard.html admin-dashboard.html branch-dashboard.html; do
            grep -q 'js/kinto-bundle-ui-v93.js?v=20260902-v93' "$f"
            grep -q "typeof currentCustomerOrdersGlobal" "$f"
            grep -q "typeof cloudOrders" "$f"
            grep -q "typeof adminOrdersCloud" "$f"
            grep -q "typeof orders" "$f"
          done
          node --check js/kinto-bundle-ui-v93.js
      - name: Commit hardened adapters
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard.html employee-dashboard.html admin-dashboard.html branch-dashboard.html .github/workflows/v93-bundle-adapters-pools-once.yml
          git commit -m 'fix: bind V93 bundle adapters to dashboard orders'
          git push origin HEAD:fix/local-cart-v93-bundle-ops
