name: Run camera three tier patch
on:
  push:
    branches: [main]
    paths: ['camera_three_tier_patch.py']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python camera_three_tier_patch.py
      - run: |
          git config user.name meshwar-delivery-bot
          git config user.email actions@users.noreply.github.com
          git add delivery-dashboard.html
          git commit -m "Add three-tier camera permission fallback" || exit 0
          git push origin main
