name: Local Order Direct Product V29
on:
  push:
    branches: [main]
    paths: ['.github/workflows/local-order-direct-product-v29.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Patch local order source and dashboards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1) Canonical direct product URL at order creation.
          p=Path('js/local-store-enhancements.js'); s=p.read_text()
          old="order_url:'index.html?storeId='+encodeURIComponent(currentStoreId),"
          new="order_url:'index.html?storeId='+encodeURIComponent(currentStoreId)+'&productId='+encodeURIComponent(String(product.id))+'#localStoreProductsPanel',"
          assert old in s, 'order_url source not found'
          s=s.replace(old,new,1)
          old_details="details:{source:'local_store',store_id:currentStoreId,store_name:currentStore?.store_name||'',product_id:String(product.id),product_name:product.product_name||'',vendor_price_usd:vendorUsd,commission_rate:rate,platform_margin_usd:platformMarginUsd,customer_price_usd:finalUsd,exchange_rate:fx,customer_price_local:finalLocal,local_currency:localCurrency,quantity:1},"
          new_details="details:{source:'local_store',store_id:currentStoreId,store_name:currentStore?.store_name||'',product_id:String(product.id),product_name:product.product_name||'',product_url:'index.html?storeId='+encodeURIComponent(currentStoreId)+'&productId='+encodeURIComponent(String(product.id))+'#localStoreProductsPanel',product_image:product.image_url||null,vendor_price_usd:vendorUsd,commission_rate:rate,platform_margin_usd:platformMarginUsd,customer_price_usd:finalUsd,exchange_rate:fx,customer_price_local:finalLocal,local_currency:localCurrency,quantity:1},"
          assert old_details in s, 'details payload source not found'
          s=s.replace(old_details,new_details,1)
          # Deep-link scroll/highlight support.
          s += """

// V29 canonical direct-product deep link.
const directProductId=new URLSearchParams(location.search).get('productId')||new URLSearchParams(location.search).get('product');
if(q&&directProductId){
  setTimeout(()=>{
    const btn=[...document.querySelectorAll('.meshwar-local-product-order[data-product-id]')].find(x=>String(x.dataset.productId)===String(directProductId));
    const card=btn?.closest('.meshwar-local-product-card');
    if(card){card.style.setProperty('outline','3px solid #fbbf24','important');card.style.setProperty('outline-offset','3px','important');card.scrollIntoView({behavior:'smooth',block:'center'});}
  },900);
}
"""
          p.write_text(s)

          # 2) Shared dashboard addon: injects image + canonical direct link into order-detail modals/cards.
          addon=Path('js/local-order-product-details-v29.js')
          addon.write_text(r'''/* KINTO V29 — canonical local-order product image + direct link for admin/employee/vendor */
(()=>{'use strict';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function parseDetails(v){if(!v)return{};if(typeof v==='object')return v;try{return JSON.parse(v)||{}}catch{return{}}}
function info(o){const d=parseDetails(o?.details),sid=String(d.store_id||o?.store_id||''),pid=String(d.product_id||o?.product_id||''),img=o?.image_url||d.product_image||d.image_url||'',url=d.product_url||o?.product_url||o?.order_url||(sid&&pid?`index.html?storeId=${encodeURIComponent(sid)}&productId=${encodeURIComponent(pid)}#localStoreProductsPanel`:o?.order_url||'');return{d,sid,pid,img,url,name:d.product_name||o?.product_name||''}}
function block(o){const x=info(o);if(!x.img&&!x.url)return'';return `<section class="kinto-v29-order-product" style="display:grid;grid-template-columns:${x.img?'92px ':''}minmax(0,1fr);gap:12px;align-items:center;margin:12px 0;padding:12px;border:1px solid rgba(56,189,248,.25);border-radius:14px;background:rgba(15,23,42,.08)">${x.img?`<img src="${esc(x.img)}" alt="صورة الطلب" style="width:92px;height:92px;object-fit:contain;border-radius:12px;background:#fff">`:''}<div><div style="font-weight:900;margin-bottom:6px">🖼️ صورة ورابط المنتج</div>${x.name?`<div style="font-size:13px;margin-bottom:7px">${esc(x.name)}</div>`:''}${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener" style="display:inline-flex;padding:8px 12px;border-radius:10px;background:#b95504;color:#fff!important;text-decoration:none;font-weight:900">🔗 فتح المنتج مباشرة</a><div style="font-size:10px;opacity:.7;margin-top:5px;word-break:break-all">${esc(x.url)}</div>`:''}</div></section>`}
window.KintoLocalOrderV29={info,block};
function findOrder(id){const pools=[window.orders,window.allOrders,window.currentOrders,window.vendorOrders,window.filteredOrders];for(const p of pools){if(Array.isArray(p)){const o=p.find(x=>String(x.id||x.order_id||x.order_code)===String(id));if(o)return o}}return null}
function enhance(){document.querySelectorAll('[data-order-id]').forEach(el=>{if(el.dataset.kintoV29)return;const o=findOrder(el.dataset.orderId);if(!o)return;const host=el.closest('[role="dialog"],.modal,.order-details,.order-card,tr')||el.parentElement;if(host&&!host.querySelector('.kinto-v29-order-product'))host.insertAdjacentHTML('beforeend',block(o));el.dataset.kintoV29='1'});}
document.addEventListener('click',()=>setTimeout(enhance,80),true);setInterval(enhance,1200);
})();''')

          # 3) Wire addon into all three requested dashboards without replacing their business logic.
          for fn in ['admin-dashboard.html','employee-dashboard.html','vendor-dashboard-v2.html']:
            p=Path(fn); s=p.read_text(); tag='<script src="js/local-order-product-details-v29.js?v=20260829-v29"></script>'
            if tag not in s:
              assert '</body>' in s, f'{fn}: body end missing'
              s=s.replace('</body>',tag+'\n</body>',1)
            p.write_text(s)

          # 4) Vendor: ensure fetched order rows include image/order_url/details; add one-step detail action addon hook.
          p=Path('vendor-dashboard-v2.html'); s=p.read_text()
          # Existing select('*') needs no schema change; addon exposes renderer for native functions.
          # Patch common product cell expression if exact marker is present by appending visible image/link to product text.
          marker="window.KintoLocalOrderV29"
          # Add delegated vendor details button for rendered rows when order object is discoverable.
          extra=r'''<script>
(function(){
  function parseD(v){if(!v)return{};if(typeof v==='object')return v;try{return JSON.parse(v)||{}}catch{return{}}}
  window.vendorOrderProductDetailsV29=function(order){
    if(!order)return'';
    return window.KintoLocalOrderV29?window.KintoLocalOrderV29.block(order):'';
  };
})();
</script>'''
          if 'vendorOrderProductDetailsV29' not in s:s=s.replace('</body>',extra+'\n</body>',1)
          p.write_text(s)

          Path('.github/workflows/local-order-direct-product-v29.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/local-store-enhancements.js js/local-order-product-details-v29.js admin-dashboard.html employee-dashboard.html vendor-dashboard-v2.html .github/workflows/local-order-direct-product-v29.yml
          git commit -m 'fix: preserve direct local product details across order dashboards'
          git push origin main
