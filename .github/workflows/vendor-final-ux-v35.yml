name: Vendor Final UX V35
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/vendor_final_ux_v35_patch.py'
      - '.github/workflows/vendor-final-ux-v35.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/vendor_final_ux_v35_patch.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add vendor-dashboard-v2.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: final vendor UX contrast counters sticky header V35"
          git push
# trigger-v35-final
