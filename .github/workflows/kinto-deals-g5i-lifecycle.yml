name: kinto-deals-g5i-lifecycle
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261003_kinto_deals_v1_g5i_redemption_payment_lifecycle_off.sql'
      - 'ci/kinto-deals-g5i-lifecycle.test.mjs'
      - '.github/workflows/kinto-deals-g5i-lifecycle.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node ci/kinto-deals-g5i-lifecycle.test.mjs
