name: Employee Label Governorate Safe
on:
  push:
    branches: [employee-label-governorate-safe]
    paths:
      - '.github/workflows/employee-label-governorate-safe.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: employee-label-governorate-safe
      - name: Apply employee label patch
        run: python3 tools/employee-label-governorate-patch.py
      - name: Syntax check inline JavaScript
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          h=Path('employee-dashboard.html').read_text(encoding='utf-8')
          blocks=[]
          for m in re.finditer(r'<script(?:\s[^>]*)?>(.*?)</script>',h,re.S|re.I):
              tag=h[m.start():h.find('>',m.start())+1]
              if 'src=' not in tag.lower(): blocks.append(m.group(1))
          Path('/tmp/employee-inline.js').write_text('\n;\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/employee-inline.js
          grep -F 'المحافظة:' employee-dashboard.html
          grep -F 'عدد القطع:' employee-dashboard.html
          grep -F 'عدد الطرود:' employee-dashboard.html
          grep -F '@page{size:50mm 40mm' employee-dashboard.html
      - name: Commit tested employee file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add employee-dashboard.html
          git diff --cached --quiet || git commit -m 'Show governorate on employee thermal label'
          git push origin employee-label-governorate-safe
