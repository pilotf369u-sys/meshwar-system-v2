name: Final local currency DOM fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/final-local-currency-dom-fix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply literal customer currency and vendor LTR fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('js/local-store-card-v2.js')
          s=p.read_text()
          old="const moneyLabel=(value,currency)=>`${fmt(value)} ${String(currency||'').toUpperCase()}`;"
          new="const moneyLabel=(value,currency)=>`${String(currency||'').toUpperCase()} ${fmt(value)}`;"
          if old not in s:
              raise SystemExit('moneyLabel pattern not found')
          s=s.replace(old,new,1)
          # Guard: no customer USD element may be emitted by V2 renderer.
          s=s.replace('.local-v2-usd{font-size:21px!important;font-weight:900!important;color:#67e8f9!important}','',1)
          p.write_text(s)

          p=Path('vendor-dashboard.html')
          s=p.read_text()
          s=s.replace('style="unicode-bidi:isolate;display:inline-block"','style="display:inline-block;direction:ltr;unicode-bidi:isolate"')
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          # Force a fresh V2 asset version regardless of the previous numeric version.
          s,n=re.subn(r'js/local-store-card-v2\.js\?v=[0-9-]+','js/local-store-card-v2.js?v=20260814-2108',s,count=1)
          if n!=1:
              raise SystemExit('V2 script cache tag not found exactly once')
          # Remove any unversioned duplicate enhancement loader that can repaint old cards.
          s=s.replace('<script type="module" src="js/local-store-enhancements.js"></script>\n','')
          p.write_text(s)
          PY
      - name: Validate exact DOM and calculations
        run: |
          grep -F 'Math.ceil(v/(1-rateOf(s)/100))' js/local-store-card-v2.js
          grep -F "Math.ceil(usd*fxOf(s))" js/local-store-card-v2.js
          grep -F 'const moneyLabel=(value,currency)=>`${String(currency||' js/local-store-card-v2.js
          ! grep -F 'local-v2-usd' js/local-store-card-v2.js
          grep -F 'display:inline-block;direction:ltr;unicode-bidi:isolate' vendor-dashboard.html
          grep -F 'local-store-card-v2.js?v=20260814-2108' index.html
      - name: Commit final currency DOM fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/local-store-card-v2.js vendor-dashboard.html index.html
          git commit -m 'Fix local customer currency DOM and vendor LTR display'
          git push origin main
