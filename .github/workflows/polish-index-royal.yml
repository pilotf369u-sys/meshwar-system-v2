name: Royal index polish
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/polish-index-royal.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply validated royal polish
        run: python .github/scripts/polish_index_royal.py
      - name: Commit index polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/scripts/polish_index_royal.py .github/workflows/polish-index-royal.yml
          git add -A -- index.html .github/scripts/polish_index_royal.py .github/workflows/polish-index-royal.yml
          git diff --cached --check
          git commit -m "Polish customer index with royal gold accents"
          git push origin main
