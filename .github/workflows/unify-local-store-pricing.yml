name: Unify local store pricing
on:
  push:
    branches: [main]
    paths: [.github/workflows/unify-local-store-pricing.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch shared pricing and discount ribbon
        run: |
          python3 - <<'PY'
          from pathlib import Path

          v3=Path('js/local-store-card-v3.js')
          s=v3.read_text(encoding='utf-8')
          s=s.replace("const ceilPrice=v=>Math.ceil(Number(v));", "const Pricing=window.MeshwarLocalPricing||{ceilNumber:v=>Math.ceil(Number(v)),commissionFraction:r=>{const n=Number(r);return Number.isFinite(n)&&n>=0&&n<100?n/100:.10},customerPriceUSD:(v,r)=>Math.ceil(Number(v)/(1-(Number(r)||10)/100)),customerPriceLocal:(v,r,x)=>Math.ceil(Math.ceil(Number(v)/(1-(Number(r)||10)/100))*Number(x||1)),discountPercent:(b,d)=>Math.max(1,Math.min(99,Math.round(((Number(b)-Number(d))/Number(b))*100)))};\nconst ceilPrice=Pricing.ceilNumber;",1)
          s=s.replace("const commissionRate=s=>{const n=Number(s?.commission_rate);return Number.isFinite(n)&&n>=0&&n<100?n/100:0.10};", "const commissionRate=s=>Pricing.commissionFraction(s?.commission_rate);",1)
          s=s.replace("const customerPriceUsd=(p,s)=>{const v=vendorPrice(p);return v===null?null:ceilPrice(v/(1-commissionRate(s)))};\nconst roundIqdCommercial=v=>Math.ceil(Number(v)/250)*250;\nconst customerPriceIqd=(p,s)=>{const usd=customerPriceUsd(p,s);return usd===null?null:roundIqdCommercial(usd*exchangeRate(s))};\nconst oldCustomerPriceIqd=(p,s)=>{if(p.discount_price==null||p.base_price==null||Number(p.discount_price)>=Number(p.base_price))return null;const oldUsd=ceilPrice(Number(p.base_price)/(1-commissionRate(s)));return roundIqdCommercial(oldUsd*exchangeRate(s))};", "const customerPriceUsd=(p,s)=>{const v=vendorPrice(p);return v===null?null:Pricing.customerPriceUSD(v,s?.commission_rate)};\nconst customerPriceIqd=(p,s)=>{const v=vendorPrice(p);return v===null?null:Pricing.customerPriceLocal(v,s?.commission_rate,exchangeRate(s))};\nconst oldCustomerPriceIqd=(p,s)=>{if(p.discount_price==null||p.base_price==null||Number(p.discount_price)>=Number(p.base_price))return null;return Pricing.customerPriceLocal(Number(p.base_price),s?.commission_rate,exchangeRate(s))};",1)
          s=s.replace("const badge=hasDiscount?'<span class=\"local-v3-discount-badge\">خصم</span>':'';", "const discountPct=hasDiscount?Pricing.discountPercent(p.base_price,p.discount_price):null;\n    const badge=hasDiscount?`<span class=\"local-v3-discount-badge\">خصم ${esc(discountPct)}%</span>`:'';",1)
          s=s.replace(".local-v3-discount-badge{position:absolute!important;top:14px!important;right:14px!important;z-index:4!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;padding:4px 10px!important;border-radius:6px!important;background:#ef4444!important;color:white!important;font-size:12px!important;font-weight:900!important;box-shadow:0 2px 10px rgba(239,68,68,.4)!important;white-space:nowrap!important}", ".local-v3-discount-badge{position:absolute!important;top:14px!important;right:-34px!important;z-index:4!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;min-width:150px!important;padding:7px 16px!important;background:linear-gradient(90deg,#dc2626,#f97316)!important;color:#fff!important;font-size:13px!important;font-weight:900!important;letter-spacing:.2px!important;box-shadow:0 6px 18px rgba(239,68,68,.42)!important;white-space:nowrap!important;transform:rotate(35deg)!important}",1)
          v3.write_text(s,encoding='utf-8')

          idx=Path('index.html')
          h=idx.read_text(encoding='utf-8')
          tag='<script src="js/local-store-pricing.js?v=pricing-1"></script>\n'
          if 'js/local-store-pricing.js' not in h:
              h=h.replace('<script type="module" src="js/local-store-card-v3.js?v=cro-20260815"></script>',tag+'<script type="module" src="js/local-store-card-v3.js?v=pricing-unified-1"></script>',1)
          else:
              h=h.replace('js/local-store-card-v3.js?v=cro-20260815','js/local-store-card-v3.js?v=pricing-unified-1',1)
          idx.write_text(h,encoding='utf-8')

          vendor=Path('vendor-dashboard.html')
          v=vendor.read_text(encoding='utf-8')
          if 'js/local-store-pricing.js' not in v:
              v=v.replace('<script type="module">','<script src="js/local-store-pricing.js?v=pricing-1"></script>\n<script type="module">',1)
          old="function renderProducts(){const rate=Number(vendorStore?.exchange_rate||1),target=vendorStore?.exchange_target_currency||vendorStore?.default_currency||'',rows=products.map(p=>{const opt=safeOptions(p.options),stock=Number(p.stock_quantity||0),threshold=Number(p.low_stock_threshold||0),low=stock<=threshold,vendorUsd=Number(p.discount_price??p.base_price??0),commission=Number(vendorStore?.commission_rate??10),customerUsd=Math.ceil(vendorUsd/(1-(Number.isFinite(commission)&&commission>=0&&commission<100?commission:10)/100)),converted=(String(target||'').toUpperCase()==='USD'?customerUsd:Math.ceil(customerUsd*rate));"
          new="function renderProducts(){const rate=Number(vendorStore?.exchange_rate||1),target=vendorStore?.exchange_target_currency||vendorStore?.default_currency||'',rows=products.map(p=>{const opt=safeOptions(p.options),stock=Number(p.stock_quantity||0),threshold=Number(p.low_stock_threshold||0),low=stock<=threshold,vendorUsd=Number(p.discount_price??p.base_price??0),commission=Number(vendorStore?.commission_rate??10),pricing=window.MeshwarLocalPricing,customerUsd=pricing.customerPriceUSD(vendorUsd,commission),converted=(String(target||'').toUpperCase()==='USD'?customerUsd:pricing.customerPriceLocal(vendorUsd,commission,rate));"
          if old not in v: raise SystemExit('vendor pricing block not found')
          v=v.replace(old,new,1)
          vendor.write_text(v,encoding='utf-8')
          PY
      - name: Verify
        run: |
          node --check js/local-store-pricing.js
          node --check js/local-store-card-v3.js
          grep -F 'pricing-unified-1' index.html
          grep -F 'js/local-store-pricing.js?v=pricing-1' vendor-dashboard.html
          grep -F 'customerPriceLocal(vendorUsd,commission,rate)' vendor-dashboard.html
          grep -F 'خصم ${esc(discountPct)}%' js/local-store-card-v3.js
          ! grep -F 'roundIqdCommercial' js/local-store-card-v3.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/local-store-card-v3.js index.html vendor-dashboard.html
          git diff --cached --quiet || git commit -m 'Unify local store pricing and discount ribbon'
          git push origin main
