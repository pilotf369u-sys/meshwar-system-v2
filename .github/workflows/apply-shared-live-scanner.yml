name: Apply shared live scanner
on:
  push:
    paths:
      - '.github/apply_shared_live_scanner.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 .github/apply_shared_live_scanner.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-dashboard.html employee-dashboard.html branch-dashboard.html
          git diff --cached --check
          git commit -m "Unify live barcode scanner and global search across dashboards"
          git push origin main
