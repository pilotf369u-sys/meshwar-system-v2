name: Fix courier update persistence
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-courier-update-persistence.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply surgical courier persistence patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          p = Path('branch-dashboard.html')
          s = p.read_text(encoding='utf-8')
          s = replace_once(s,
              "couriers=data||[];bulkCourier.innerHTML=",
              "const{data:currencyRows,error:currencyError}=await c.from('settings').select('key,value').like('key','courier_currency:%');if(currencyError)console.warn('Courier currency load warning:',currencyError);const currencyMap=Object.fromEntries((currencyRows||[]).map(r=>[String(r.key||'').replace('courier_currency:',''),String(r.value||'$')]));couriers=(data||[]).map(x=>({...x,_courier_currency:currencyMap[cloudId(x.id)]||'$'}));bulkCourier.innerHTML=",
              'branch load currency map')
          s = replace_once(s, "cur=String(x.currency||'$')", "cur=String(x._courier_currency||'$')", 'branch render currency')
          s = replace_once(s, "courierCurrency.value=String(x.currency||'$')", "courierCurrency.value=String(x._courier_currency||'$')", 'branch edit currency')
          s = replace_once(s,
              "const c=await getSb(),editId=cloudId(courierEditId.value),payload=",
              "const c=await getSb(),editId=cloudId(courierEditId.value),selectedCurrency=String(courierCurrency.value||'$'),payload=",
              'branch selected currency')
          s = replace_once(s,
              "result=await c.from('couriers').update(payload).eq('id',editId)}else{payload.is_active=true;result=await c.from('couriers').insert([payload])}",
              "result=await c.from('couriers').update(payload).eq('id',editId).select('id').maybeSingle()}else{payload.is_active=true;result=await c.from('couriers').insert([payload]).select('id').single()}",
              'branch save confirmation')
          s = replace_once(s,
              "if(result.error)return alert(result.error.message);resetCourierForm();await Promise.all([loadCouriers(),loadOrders(),loadAccounting()])",
              "if(result.error)return alert(result.error.message);const savedId=cloudId(result.data?.id||editId);if(!savedId)return alert('لم يتم تأكيد حفظ المندوب في Supabase.');const{error:currencySaveError}=await c.from('settings').upsert([{key:'courier_currency:'+savedId,value:selectedCurrency}],{onConflict:'key'});if(currencySaveError)return alert('تم حفظ بيانات المندوب، لكن تعذر حفظ العملة: '+currencySaveError.message);resetCourierForm();courierModal.style.display='none';await Promise.all([loadCouriers(),loadOrders(),loadAccounting()])",
              'branch refresh after save')
          p.write_text(s, encoding='utf-8')

          p = Path('admin-dashboard.html')
          s = p.read_text(encoding='utf-8')
          s = replace_once(s,
              "adminCouriersForOrders=data||[];b.innerHTML=(data||[]).map(a=>",
              "const{data:currencyRows,error:currencyError}=await sb.from('settings').select('key,value').like('key','courier_currency:%');if(currencyError)console.warn('Courier currency load warning:',currencyError);const currencyMap=Object.fromEntries((currencyRows||[]).map(r=>[String(r.key||'').replace('courier_currency:',''),String(r.value||'$')]));adminCouriersForOrders=(data||[]).map(a=>({...a,_courier_currency:currencyMap[String(a.id)]||'$'}));b.innerHTML=adminCouriersForOrders.map(a=>",
              'admin load currency map')
          s = replace_once(s, "cur=String(a.currency||'$')", "cur=String(a._courier_currency||'$')", 'admin render currency')
          s = replace_once(s, "delCurrency.value=String(a.currency||'$')", "delCurrency.value=String(a._courier_currency||'$')", 'admin edit currency')
          s = replace_once(s,
              "const sb=await ensureCustomerSupabase(),editId=String(delEditId.value||'').trim(),payload=",
              "const sb=await ensureCustomerSupabase(),editId=String(delEditId.value||'').trim(),selectedCurrency=String(delCurrency.value||'$'),payload=",
              'admin selected currency')
          s = replace_once(s,
              "result=await sb.from('couriers').update(payload).eq('id',editId)}else{payload.is_active=true;result=await sb.from('couriers').insert([payload])}",
              "result=await sb.from('couriers').update(payload).eq('id',editId).select('id').maybeSingle()}else{payload.is_active=true;result=await sb.from('couriers').insert([payload]).select('id').single()}",
              'admin save confirmation')
          s = replace_once(s,
              "if(result.error)return alert(result.error.message);resetDeliveryForm();await Promise.all([loadDelivery(),loadAdminCouriersForOrders()])",
              "if(result.error)return alert(result.error.message);const savedId=String(result.data?.id||editId||'').trim();if(!savedId)return alert('لم يتم تأكيد حفظ المندوب في Supabase.');const{error:currencySaveError}=await sb.from('settings').upsert([{key:'courier_currency:'+savedId,value:selectedCurrency}],{onConflict:'key'});if(currencySaveError)return alert('تم حفظ بيانات المندوب، لكن تعذر حفظ العملة: '+currencySaveError.message);resetDeliveryForm();await Promise.all([loadDelivery(),loadAdminCouriersForOrders()])",
              'admin refresh after save')
          p.write_text(s, encoding='utf-8')

          Path('.github/workflows/fix-courier-update-persistence.yml').unlink()
          PY
      - name: Validate scope
        run: |
          test "$(git diff --name-only | sort | tr '\n' ' ')" = ".github/workflows/fix-courier-update-persistence.yml admin-dashboard.html branch-dashboard.html "
          grep -F "courier_currency:" branch-dashboard.html
          grep -F "courier_currency:" admin-dashboard.html
          grep -F ".update(payload).eq('id',editId).select('id').maybeSingle()" branch-dashboard.html
          grep -F ".update(payload).eq('id',editId).select('id').maybeSingle()" admin-dashboard.html
      - name: Commit directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add branch-dashboard.html admin-dashboard.html .github/workflows/fix-courier-update-persistence.yml
          git commit -m "Fix courier update persistence and refresh"
          git push origin main
