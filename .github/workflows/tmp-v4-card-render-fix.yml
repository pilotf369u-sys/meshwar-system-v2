name: Temporary V4 card renderer fix
on:
  push:
    branches: [fix/local-store-v4-card-render-and-modal-trigger]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/local-store-v4-card-render-and-modal-trigger
          fetch-depth: 0
      - name: Apply renderer and modal trigger patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('js/local-store-card-v3.js')
          s=p.read_text()
          new_render=r'''function renderCards(grid,store,products,{fromCache=false}={}){
  window.MeshwarLocalStoreV4Context={store,products:Array.isArray(products)?products:[]};
  const cards=(products||[]).map(p=>{
    const base=Number(p.base_price),discount=Number(p.discount_price),hasDiscount=p.discount_price!==null&&p.discount_price!==''&&Number.isFinite(base)&&Number.isFinite(discount)&&base>0&&discount>=0&&discount<base;
    const hasStock=p.stock_quantity!==null&&p.stock_quantity!==undefined&&p.stock_quantity!=='';const stock=hasStock?Math.max(0,Math.floor(Number(p.stock_quantity)||0)):null;
    const iqd=customerPriceIqd(p,store),oldIqd=hasDiscount?oldCustomerPriceIqd(p,store):null,unavailable=!!p.is_out_of_stock||(hasStock&&stock===0)||iqd===null;
    const old=hasDiscount&&oldIqd!==null?`<div class="local-v3-old-row"><span class="local-v3-old" dir="ltr" style="text-decoration: line-through !important; -webkit-text-decoration-line: line-through !important; color: #94a3b8 !important; font-size: 0.85rem; display: inline-block; direction:ltr; unicode-bidi:isolate;">${esc(iqdLabel(oldIqd))}</span></div>`:'';
    const discountPct=hasDiscount?Pricing.discountPercent(base,discount):null;const badge=discountPct!==null?`<span class="local-v3-discount-badge">خصم ${esc(discountPct)}%</span>`:'';
    const stockNotice=hasStock&&stock>0&&stock<=3?`<div class="local-v3-low-stock">🔥 سارع بالطلب، متبقي ${esc(stock)} قطع فقط!</div>`:unavailable?'<div class="local-v3-sold-out">هذا المنتج غير متوفر حالياً</div>':'';
    return `<article class="local-v3-card mw-card-clean" data-product-card="${esc(p.id)}" data-stock="${hasStock?esc(stock):''}">${badge}<div class="local-v3-img-wrap"><img class="local-v3-img" src="${esc(p.image_url||placeholder)}" onerror="this.onerror=null;this.src='${esc(placeholder)}'" alt="${esc(p.product_name||'منتج')}"></div><div class="local-v3-body"><div class="local-v3-name">${esc(p.product_name||'منتج')}</div><div class="local-v3-desc">${esc(p.description||'')}</div>${stockNotice}<div class="local-v3-price">${unavailable?'غير متوفر':`${old}<div class="local-v3-local"><span class="local-v3-money" dir="ltr">${esc(iqdLabel(iqd))}</span></div><small class="local-v3-note">السعر للقطعة — التوصيل يحدد لاحقاً</small>`}</div><button type="button" class="local-v3-order" ${unavailable?'disabled':''} data-pid="${esc(p.id)}">${unavailable?'نفذت الكمية':'عرض التفاصيل والطلب'}</button></div></article>`;
  }).join('');
  grid.innerHTML=`${fromCache?'<div class="local-v3-cache-note">يتم عرض نسخة محفوظة مؤقتاً بسبب تعذر الاتصال المباشر.</div>':''}${cards||'<div class="local-v3-state">لا توجد منتجات مضافة لهذا المتجر حالياً.</div>'}`;
  grid.querySelectorAll('.local-v3-order[data-pid]').forEach(btn=>btn.addEventListener('click',()=>{
    if(btn.disabled)return;
    const pid=String(btn.dataset.pid||'').trim();
    if(typeof window.openProductModal!=='function')return alert('نافذة تفاصيل المنتج ما زالت قيد التحميل. يرجى المحاولة بعد لحظة.');
    window.openProductModal(pid).catch(err=>{console.error('Product modal error:',err);alert('تعذر فتح تفاصيل المنتج: '+(err?.message||err))});
  }));
}
'''
          s2,n=re.subn(r'function renderCards\(grid,store,products,\{fromCache=false\}=\{\}\)\{.*?\n\}\n\nasync function reserveStock',new_render+'\nasync function reserveStock',s,flags=re.S)
          if n!=1: raise SystemExit(f'renderCards replacement count={n}')
          marker='async function createOrder(product,store,selection={},requestedQuantity=1){'
          if marker not in s2: raise SystemExit('createOrder marker missing')
          s2=s2.replace(marker,marker,1)
          expose='\nwindow.createLocalStoreOrder=createOrder;\n'
          target='\nasync function renderStoreProductsV3(storeIdOverride){'
          if expose.strip() not in s2:
            if target not in s2: raise SystemExit('renderStoreProductsV3 marker missing')
            s2=s2.replace(target,expose+target,1)
          p.write_text(s2)

          p=Path('js/local-store-product-details-v4.js')
          s=p.read_text()
          new_modal=r'''async function openProductModal(productId){
    const pid=String(productId||'').trim();if(!pid)return;
    const rows=await rest(`local_products?select=id,product_name,image_url,description,base_price,discount_price,stock_quantity,is_out_of_stock,options&id=eq.${encodeURIComponent(pid)}&limit=1`);const p=Array.isArray(rows)?rows[0]:null;if(!p)return alert('تعذر تحميل تفاصيل المنتج.');
    const context=window.MeshwarLocalStoreV4Context||{};let store=context.store||null;
    if(!store){const storeId=String(new URLSearchParams(location.search).get('storeId')||'').trim();if(storeId){const stores=await rest(`local_stores?select=id,store_name,commission_rate,exchange_rate,status&id=eq.${encodeURIComponent(storeId)}&limit=1`);store=Array.isArray(stores)?stores[0]:null}}
    if(!store)return alert('تعذر تحميل بيانات المتجر.');
    const card=document.querySelector(`[data-product-card="${CSS.escape(pid)}"]`);const modal=ensureModal(),body=modal.querySelector('#mwDetailBody'),imgs=imagesFor(p),opts=productOpts(p),stockManaged=p.stock_quantity!==null&&p.stock_quantity!==undefined&&p.stock_quantity!=='';const stock=stockManaged?Math.max(0,Math.floor(Number(p.stock_quantity)||0)):99,unavailable=!!p.is_out_of_stock||(stockManaged&&stock===0);const price=card?.querySelector('.local-v3-local')?.textContent?.trim()||card?.querySelector('.local-v3-price')?.textContent?.trim()||'';
    body.innerHTML=`<div class="mw-detail-grid"><section><div class="mw-gallery-main"><img src="${esc(imgs[0]||p.image_url||'')}" alt="${esc(p.product_name||'منتج')}"></div><div class="mw-gallery-thumbs">${imgs.map((u,i)=>`<button type="button" class="mw-gallery-thumb ${i===0?'active':''}" data-src="${esc(u)}"><img src="${esc(u)}" alt="صورة ${i+1}"></button>`).join('')}</div></section><section><h3 class="mw-detail-title">${esc(p.product_name||'منتج')}</h3><div class="mw-detail-desc">${esc(p.description||'')}</div><div class="mw-detail-price">${esc(price)}</div>${stockManaged&&stock>0&&stock<=3?`<div class="mw-stock-note mw-stock-low">🔥 سارع بالطلب، متبقي ${stock} قطع فقط!</div>`:''}${optionGroup('color','اللون',opts.colors)}${optionGroup('size','المقاس',opts.sizes)}${optionGroup('volume','الحجم',opts.volumes)}<div class="mw-modal-qty"><b>الكمية</b><div class="mw-modal-qty-controls"><button type="button" data-q="minus">−</button><strong data-q-value>1</strong><button type="button" data-q="plus">+</button></div></div><button type="button" class="mw-modal-confirm" ${unavailable?'disabled':''}>${unavailable?'نفذت الكمية':'تأكيد الطلب'}</button></section></div>`;
    body.querySelectorAll('.mw-gallery-thumb').forEach(t=>t.addEventListener('click',()=>{body.querySelector('.mw-gallery-main img').src=t.dataset.src;body.querySelectorAll('.mw-gallery-thumb').forEach(x=>x.classList.toggle('active',x===t))}));
    body.querySelectorAll('.mw-option-btn').forEach(b=>b.addEventListener('click',()=>{const group=b.closest('[data-group]');group.querySelectorAll('.mw-option-btn').forEach(x=>x.classList.toggle('active',x===b))}));
    body.querySelectorAll('[data-q]').forEach(q=>q.addEventListener('click',()=>{const v=body.querySelector('[data-q-value]'),cur=Math.max(1,Number(v.textContent)||1),max=stockManaged?Math.max(1,stock):99;v.textContent=String(q.dataset.q==='plus'?Math.min(max,cur+1):Math.max(1,cur-1))}));
    body.querySelector('.mw-modal-confirm')?.addEventListener('click',async()=>{
      const selection={color:'',size:'',volume:''};
      for(const [key,label] of [['color','اللون'],['size','المقاس'],['volume','الحجم']]){const g=body.querySelector(`[data-group="${key}"]`);if(!g)continue;const active=g.querySelector('.mw-option-btn.active');if(!active)return alert('يرجى اختيار '+label);selection[key]=String(active.dataset.value||'').trim()}
      const requestedQuantity=Math.max(1,Math.floor(Number(body.querySelector('[data-q-value]')?.textContent)||1));
      if(typeof window.createLocalStoreOrder!=='function')return alert('نظام الطلب ما زال قيد التحميل. يرجى المحاولة بعد لحظة.');
      modal.classList.remove('open');
      await window.createLocalStoreOrder(p,store,selection,requestedQuantity);
    });
    modal.classList.add('open');
  }
  window.openProductModal=openProductModal;
  function polishCards(root=document){root.querySelectorAll?.('.local-v3-card').forEach(card=>{card.classList.add('mw-card-clean');const btn=card.querySelector('.local-v3-order[data-pid]');if(btn&&!btn.disabled)btn.textContent='عرض التفاصيل والطلب'})}
  function startPublic(){installCss();polishCards();const o=new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1)polishCards(n)})));o.observe(document.body,{childList:true,subtree:true})}
'''
          s2,n=re.subn(r'async function openDetails\(card,button\)\{.*?\n  function startPublic\(\)\{.*?\}\n',new_modal,s,flags=re.S)
          if n!=1: raise SystemExit(f'V4 modal replacement count={n}')
          p.write_text(s2)
          PY
          node --check js/local-store-card-v3.js
          node --check js/local-store-product-details-v4.js
          git diff --check
          grep -Fq "window.openProductModal=openProductModal" js/local-store-product-details-v4.js
          grep -Fq "window.createLocalStoreOrder=createOrder" js/local-store-card-v3.js
          ! grep -Fq 'local-v3-options' <(sed -n '/function renderCards/,/async function reserveStock/p' js/local-store-card-v3.js)
          grep -Fq 'عرض التفاصيل والطلب' js/local-store-card-v3.js
      - name: Commit clean fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-v4-card-render-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/local-store-card-v3.js js/local-store-product-details-v4.js .github/workflows/tmp-v4-card-render-fix.yml
          git commit -m 'fix: render V4 local product cards and modal trigger directly'
          git push origin HEAD:fix/local-store-v4-card-render-and-modal-trigger
