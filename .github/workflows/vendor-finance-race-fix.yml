name: Vendor finance race fix
on:
  push:
    branches:
      - fix/vendor-finance-admin-race
permissions:
  contents: write
jobs:
  patch-validate-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply surgical race fix
        run: python3 tools/patch_vendor_finance_race.py
      - name: Validate structure
        run: |
          grep -Fq "adminAccessVerificationPromise" admin-dashboard.html
          grep -Fq "async function checkAdminRole()" admin-dashboard.html
          grep -Fq "await checkAdminRole();const sb=await ensureCustomerSupabase()" admin-dashboard.html
          grep -Fq "جاري التحقق من صلاحية الأدمن وتحميل الحسابات" admin-dashboard.html
          grep -Fq "async function showAdminMasterSection" admin-dashboard.html
          grep -Fq "setTimeout(async()=>" admin-dashboard.html
      - name: Node syntax check
        run: |
          python3 - <<'PY'
          import re,pathlib
          text=pathlib.Path('admin-dashboard.html').read_text(encoding='utf-8')
          out=pathlib.Path('/tmp/admin-inline-js');out.mkdir(exist_ok=True)
          i=0
          for attrs,body in re.findall(r'<script([^>]*)>(.*?)</script>',text,flags=re.S|re.I):
            if re.search(r'\bsrc\s*=',attrs,re.I) or not body.strip(): continue
            i+=1
            ext='.mjs' if re.search(r'type\s*=\s*["\']module["\']',attrs,re.I) else '.js'
            (out/f'{i}{ext}').write_text(body,encoding='utf-8')
          print(i)
          PY
          for f in /tmp/admin-inline-js/*; do node --check "$f"; done
          git diff --check
      - name: Remove temporary machinery and commit fix
        run: |
          rm -f tools/patch_vendor_finance_race.py
          rm -f .github/workflows/vendor-finance-race-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-dashboard.html tools/patch_vendor_finance_race.py .github/workflows/vendor-finance-race-fix.yml
          git commit -m "Fix admin vendor finance authorization race"
          git push origin HEAD:fix/vendor-finance-admin-race
