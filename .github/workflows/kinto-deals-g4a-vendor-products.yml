name: KINTO Deals G4A vendor picker
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261002_kinto_deals_v1_g4a_vendor_products_off.sql'
      - 'ci/kinto-deals-g4a-vendor-products.test.mjs'
      - '.github/workflows/kinto-deals-g4a-vendor-products.yml'
  workflow_dispatch:
jobs:
  g4a-vendor-picker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test ci/kinto-deals-g4a-vendor-products.test.mjs
