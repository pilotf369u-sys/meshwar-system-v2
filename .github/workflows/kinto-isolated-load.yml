name: KINTO isolated concurrent load
on:
  pull_request:
    paths:
      - 'ci/load/**'
      - '.github/workflows/kinto-isolated-load.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  concurrent-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-load-test-only
          POSTGRES_DB: kinto_load
        ports:
          - 5432:5432
        options: >-
          --cpus 2 --memory 1024m
          --health-cmd "pg_isready -U postgres -d kinto_load"
          --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned isolated database driver
        run: npm install --prefix "$RUNNER_TEMP/kinto-load" --ignore-scripts --no-audit --no-fund pg@8.16.3
      - name: Exercise deployed schema with up to 1000 virtual users
        env:
          KINTO_LOAD_DATABASE_URL: postgresql://postgres:isolated-load-test-only@127.0.0.1:5432/kinto_load
        run: KINTO_PG_MODULE="$RUNNER_TEMP/kinto-load/node_modules/pg/lib/index.js" node ci/load/run.mjs
      - name: Upload latency and correctness results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kinto-isolated-load-report
          path: test-results/load-report.json
          if-no-files-found: warn
