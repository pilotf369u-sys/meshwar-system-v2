name: Local storefront browse fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/local-store-browse-fix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch local store browsing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="""function openStore(storeUrl,storeId){console.log('Opening store:',storeUrl,storeId);const id=String(storeId||'').trim();if(id){window.location.href='index.html?storeId='+encodeURIComponent(id);return}const url=String(storeUrl||'').trim();if(url){window.open(url,'_blank');return}alert('تعذر فتح المتجر حالياً.')}"""
          new="""async function openStore(storeUrl,storeId){console.log('Opening store:',storeUrl,storeId);const id=String(storeId||'').trim();if(id){const grid=document.getElementById('localStoresPublicGrid'),filters=document.getElementById('localSpecialtyFilters'),panel=document.getElementById('localStoreProductsPanel');if(grid)grid.style.display='none';if(filters)filters.style.display='none';if(panel)panel.style.display='block';await loadStoreDetails(id);panel?.scrollIntoView({behavior:'smooth',block:'start'});return}const url=String(storeUrl||'').trim();if(url){window.open(url,'_blank');return}alert('تعذر فتح المتجر حالياً.')}"""
          if old not in s: raise SystemExit('openStore block not found')
          s=s.replace(old,new,1)
          old="""function renderLocalPublicStores(){const grid=document.getElementById('localStoresPublicGrid');if(!grid)return;const focus=new URLSearchParams(location.search).get('storeId');const rows=localPublicStores.filter(s=>(!focus||String(s.id)===String(focus))&&(localActiveSpecialty==='الكل'||String(s.specialty||'شامل')===localActiveSpecialty));grid.innerHTML=rows.map(s=>"""
          new="""function renderLocalPublicStores(){const grid=document.getElementById('localStoresPublicGrid');if(!grid)return;const rows=localPublicStores.filter(s=>localActiveSpecialty==='الكل'||String(s.specialty||'شامل')===localActiveSpecialty);grid.style.display='grid';grid.innerHTML=rows.map(s=>"""
          if old not in s: raise SystemExit('render stores block not found')
          s=s.replace(old,new,1)
          old="""async function loadLocalPublicStores(){const grid=document.getElementById('localStoresPublicGrid');try{const{data,error}=await localStoresSb.from('local_stores').select('id,store_name,logo_url,store_url,country,governorate,store_type,specialty,default_currency,status').eq('status','active').order('created_at',{ascending:false});if(error)throw error;localPublicStores=data||[];renderLocalSpecialtyFilters();renderLocalPublicStores();const storeId=new URLSearchParams(window.location.search).get('storeId');if(storeId){window.showStoresTab?.('local');await loadStoreDetails(storeId);document.getElementById('localStoresPublic')?.scrollIntoView({behavior:'smooth',block:'start'})}}catch(e)"""
          new="""async function loadLocalPublicStores(){const grid=document.getElementById('localStoresPublicGrid');try{const{data,error}=await localStoresSb.from('local_stores').select('id,store_name,logo_url,store_url,country,governorate,store_type,specialty,default_currency,status').eq('status','active').order('created_at',{ascending:false}).range(0,999);if(error)throw error;localPublicStores=data||[];renderLocalSpecialtyFilters();renderLocalPublicStores();const storeId=new URLSearchParams(window.location.search).get('storeId');if(storeId){window.showStoresTab?.('local');await openStore('',storeId)}}catch(e)"""
          if old not in s: raise SystemExit('load stores block not found')
          s=s.replace(old,new,1)
          old="""<a href=\"index.html#localStoresPublic\" class=\"local-public-open\" style=\"width:auto;min-width:140px\">← كل المتاجر</a>"""
          new="""<button type=\"button\" id=\"backToLocalStoresBtn\" class=\"local-public-open\" style=\"width:auto;min-width:140px;cursor:pointer\">← كل المتاجر</button>"""
          if old not in s: raise SystemExit('back button not found')
          s=s.replace(old,new,1)
          marker="""window.loadStoreDetails=loadStoreDetails;"""
          addition="""window.loadStoreDetails=loadStoreDetails;\nfunction showLocalStoreList(){const grid=document.getElementById('localStoresPublicGrid'),filters=document.getElementById('localSpecialtyFilters'),panel=document.getElementById('localStoreProductsPanel');if(panel)panel.style.display='none';if(filters)filters.style.display='flex';if(grid)grid.style.display='grid';renderLocalPublicStores();document.getElementById('localStoresPublic')?.scrollIntoView({behavior:'smooth',block:'start'})}\ndocument.getElementById('backToLocalStoresBtn')?.addEventListener('click',showLocalStoreList);\nwindow.showLocalStoreList=showLocalStoreList;"""
          if marker not in s: raise SystemExit('loadStoreDetails marker not found')
          s=s.replace(marker,addition,1)
          p.write_text(s)
          PY
      - name: Validate patch
        run: |
          grep -F ".range(0,999)" index.html
          grep -F "grid.style.display='none'" index.html
          grep -F "showLocalStoreList" index.html
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix local store browsing and product view'
          git push origin main
