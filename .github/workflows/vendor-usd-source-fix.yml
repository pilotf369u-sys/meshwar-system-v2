name: Vendor USD source currency fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/vendor-usd-source-fix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Force vendor product source currency to USD
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('vendor-dashboard.html')
          s=p.read_text()
          old="$('exchangeBase').value=vendorStore.exchange_base_currency||vendorStore.default_currency||'USD';"
          new="$('exchangeBase').value='USD';"
          if old not in s: raise SystemExit('exchange base init not found')
          s=s.replace(old,new,1)
          old="currency:vendorStore.default_currency||'USD'"
          new="currency:'USD'"
          if old not in s: raise SystemExit('product currency payload not found')
          s=s.replace(old,new,1)
          old="base=$('exchangeBase').value,target=$('exchangeTarget').value;"
          new="base='USD',target=$('exchangeTarget').value;"
          if old not in s: raise SystemExit('exchange save base not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          grep -F "currency:'USD'" vendor-dashboard.html
          grep -F "$('exchangeBase').value='USD'" vendor-dashboard.html
          grep -F "base='USD',target=" vendor-dashboard.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor-dashboard.html
          git commit -m 'Force local product source prices to USD'
          git push origin main
