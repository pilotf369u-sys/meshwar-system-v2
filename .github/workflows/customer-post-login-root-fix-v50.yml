name: Customer Post Login Root Fix V50
on:
  push:
    branches: [main]
    paths:
      - 'scripts/customer-post-login-root-fix-v50.py'
      - '.github/workflows/customer-post-login-root-fix-v50.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/customer-post-login-root-fix-v50.py
      - name: Verify customer post-login renderer removal
        run: |
          python - <<'PY'
          from pathlib import Path
          shell=Path('external-shipping-shell.html').read_text(encoding='utf-8')
          fee=Path('js/external-shipping-fee-v2.js').read_text(encoding='utf-8')
          polish=Path('js/external-shipping-ui-polish-v3.js').read_text(encoding='utf-8')
          dash=Path('dashboard.html').read_text(encoding='utf-8')
          assert "return; // CUSTOMER_POST_LOGIN_ROOT_FIX_V50" in shell
          for x in ['appendCustomerInvoice','installCustomerRows','addCustomerHeaders','__mwExternalRenderPanelsV3','يشمل سعر السلعة + الشحن الخارجي']:
              assert x not in fee+polish, x
          assert dash.count('<th>المجموع الكلي النهائي</th>') == 1
          assert 'grandTotal.toFixed(2)' in dash
          print('V50 customer post-login renderer root fix OK')
          PY
      - name: Commit production root fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add external-shipping-shell.html js/external-shipping-fee-v2.js js/external-shipping-ui-polish-v3.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: remove customer post-login legacy renderers V50'
          git push
