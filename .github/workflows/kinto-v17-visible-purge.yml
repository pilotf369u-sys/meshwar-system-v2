name: KINTO V17 Visible Purge
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kinto-v17-visible-purge.yml'
jobs:
  purge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Purge remaining visible MeshWar labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<div class="font-black text-white">MeshWar</div>','<div class="font-black text-white">KINTO</div>')
          s=s.replace('>MeshWar Order<','>KINTO Order<')
          p.write_text(s)
          Path('.github/workflows/kinto-v17-visible-purge.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/kinto-v17-visible-purge.yml
          git commit -m 'fix: purge remaining visible MeshWar labels'
          git push
