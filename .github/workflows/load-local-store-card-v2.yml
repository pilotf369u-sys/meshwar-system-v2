name: Load local store card v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/load-local-store-card-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add v2 renderer to index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='<script type="module" src="js/local-store-enhancements.js?v=20260814-2030"></script>'
          add=marker+'\n<script type="module" src="js/local-store-card-v2.js?v=20260814-2045"></script>'
          if marker not in s:
              raise SystemExit('enhancement script marker not found')
          if 'js/local-store-card-v2.js' not in s:
              s=s.replace(marker,add,1)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          grep -F 'js/local-store-card-v2.js?v=20260814-2045' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Load stable local product card renderer'
          git push origin main
