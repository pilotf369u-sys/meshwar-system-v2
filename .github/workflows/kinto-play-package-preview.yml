name: KINTO Play package and launch preview27
'on':
  push:
    branches:
    - app/play-package-v27-20261024
    paths:
    - mobile/hybrid/android/**
    - mobile/hybrid/tools/**
    - .github/workflows/kinto-play-package-preview.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  candidate-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools platforms;android-36 build-tools;35.0.0
        log-accepted-android-sdk-licenses: false
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.11.1
    - name: Build unsigned non-production release candidate
      run: gradle --no-daemon -p mobile/hybrid/android :app:bundleRelease :app:assembleRelease
    - name: Verify fixture exclusion and signing separation
      run: python3 mobile/hybrid/tools/check-release-artifacts.py
    - uses: actions/upload-artifact@v4
      with:
        name: KINTO-Unsigned-Candidate-NOT-FOR-UPLOAD
        path: 'mobile/hybrid/android/app/build/outputs/bundle/release/app-release.aab

          mobile/hybrid/android/app/build/outputs/apk/release/app-release-unsigned.apk

          '
        retention-days: 14
        if-no-files-found: error
  preview:
    needs: candidate-bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools platforms;android-36 build-tools;35.0.0
        log-accepted-android-sdk-licenses: false
    - name: MAD reported layout and preserved readers
      run: 'node --test mobile/hybrid/android/checks/product-reader.test.cjs mobile/hybrid/android/checks/hepsiburada-reader.test.cjs
        mobile/hybrid/android/checks/zara-reader.test.cjs

        node --test mobile/release/account-deletion.test.cjs

        python3 mobile/hybrid/tools/new-store-markup-check.py

        python3 mobile/hybrid/tools/mad-price-check.py

        python3 mobile/hybrid/tools/mad-identity-check.py

        python3 mobile/hybrid/tools/check-mad-preservation.py'
    - name: Pure Java boundary and pricing tests
      run: 'mkdir -p "$RUNNER_TEMP/kinto-checks"

        javac -d "$RUNNER_TEMP/kinto-checks" mobile/hybrid/android/app/src/main/java/com/kinto/trendyollab/{UrlPolicy,CartRules,Pricing}.java
        mobile/hybrid/android/checks/{UrlPolicyCheck,CartRulesCheck,PricingCheck}.java

        for check in UrlPolicyCheck CartRulesCheck PricingCheck; do java -cp "$RUNNER_TEMP/kinto-checks" "$check"; done

        '
    - name: Build and verify private preview only
      env:
        KINTO_BUILD_OUTPUT: ${{ runner.temp }}/kinto-preview-output
        KINTO_PREVIEW_KEYSTORE: ${{ runner.temp }}/kinto-preview.keystore
        KINTO_PREVIEW_PASSWORD_FILE: ${{ runner.temp }}/kinto-preview-password
      run: 'umask 077

        openssl rand -base64 32 > "$KINTO_PREVIEW_PASSWORD_FILE"

        keytool -genkeypair -keystore "$KINTO_PREVIEW_KEYSTORE" -storepass:file "$KINTO_PREVIEW_PASSWORD_FILE" -keypass:file
        "$KINTO_PREVIEW_PASSWORD_FILE" -alias kinto-preview -dname ''CN=KINTO Disposable CI Preview'' -keyalg RSA -keysize
        2048 -validity 3650

        bash mobile/hybrid/tools/build-preview.sh

        '
    - uses: actions/download-artifact@v4
      with:
        name: KINTO-Unsigned-Candidate-NOT-FOR-UPLOAD
        path: ${{ runner.temp }}/kinto-candidate
    - name: Sign candidate APK with disposable test key only
      env:
        KINTO_PREVIEW_KEYSTORE: ${{ runner.temp }}/kinto-preview.keystore
        KINTO_PREVIEW_PASSWORD_FILE: ${{ runner.temp }}/kinto-preview-password
      run: 'java -jar "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" sign --ks "$KINTO_PREVIEW_KEYSTORE" --ks-key-alias
        kinto-preview --ks-pass "file:$KINTO_PREVIEW_PASSWORD_FILE" --out "$RUNNER_TEMP/kinto-preview-output/KINTO-Candidate-0.27.apk"
        "$RUNNER_TEMP/kinto-candidate/apk/release/app-release-unsigned.apk"

        '
    - name: Enable KVM for synthetic UI test
      run: 'echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm

        '
    - name: Prepare launch visual test dependency
      run: python3 -m pip install Pillow==11.3.0
    - name: Launch and preserved product flow
      uses: reactivecircus/android-emulator-runner@v2
      env:
        KINTO_APK: ${{ runner.temp }}/kinto-preview-output/KINTO-Preview-0.27.apk
        KINTO_ONLY_STORE: mango
      with:
        api-level: 36
        arch: x86_64
        target: google_apis
        profile: pixel_2
        disable-animations: true
        emulator-options: -wipe-data -no-window -noaudio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
        script: 'python3 mobile/hybrid/tools/new-store-native-smoke.py

          python3 mobile/hybrid/tools/stores-handoff-native-smoke.py

          python3 mobile/hybrid/tools/launch-native-smoke.py

          '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: KINTO-Hybrid-Preview-APK
        path: '${{ runner.temp }}/kinto-preview-output/KINTO-Preview-0.27.apk

          ${{ runner.temp }}/kinto-preview-output/KINTO-Candidate-0.27.apk

          ${{ runner.temp }}/kinto-preview-output/launch-*.png

          ${{ runner.temp }}/kinto-preview-output/invoice-test.png

          ${{ runner.temp }}/kinto-preview-output/store-test.png

          ${{ runner.temp }}/kinto-preview-output/navigation-return-test.png

          ${{ runner.temp }}/kinto-preview-output/product-review-test.png

          ${{ runner.temp }}/kinto-preview-output/hepsiburada-review-test.png

          ${{ runner.temp }}/kinto-preview-output/zara-native-failure.png

          '
        retention-days: 14
        if-no-files-found: error
