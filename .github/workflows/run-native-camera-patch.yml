name: Run native camera patch
on:
  push:
    branches:
      - main
    paths:
      - native_camera_patch.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python native_camera_patch.py
      - run: |
          git config user.name meshwar-delivery-bot
          git config user.email actions@users.noreply.github.com
          git add delivery-dashboard.html
          git commit -m "Add native camera fallback and instant barcode cleaning" || exit 0
          git push origin main
