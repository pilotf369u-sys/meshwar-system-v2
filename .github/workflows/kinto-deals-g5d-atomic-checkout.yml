name: kinto-deals-g5d-atomic-checkout
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261002_kinto_deals_v1_g5d_atomic_no_gift_checkout_off.sql'
      - 'ci/kinto-deals-g5d-atomic-checkout.test.mjs'
      - '.github/workflows/kinto-deals-g5d-atomic-checkout.yml'
  push:
    paths:
      - 'supabase/migrations/20261002_kinto_deals_v1_g5d_atomic_no_gift_checkout_off.sql'
      - 'ci/kinto-deals-g5d-atomic-checkout.test.mjs'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node ci/kinto-deals-g5d-atomic-checkout.test.mjs
