name: Branch Parcels Only Safe
on:
  push:
    branches: [branch-parcels-only-safe]
    paths:
      - '.github/workflows/branch-parcels-only-safe.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: branch-parcels-only-safe
      - name: Apply branch-only patch
        run: python3 tools/branch_parcels_safe_patch.py
      - name: Syntax check inline JavaScript
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          h=Path('branch-dashboard.html').read_text(encoding='utf-8')
          blocks=[]
          for m in re.finditer(r'<script(?:\s[^>]*)?>(.*?)</script>',h,re.S|re.I):
              tag=h[m.start():h.find('>',m.start())+1]
              if 'src=' not in tag.lower(): blocks.append(m.group(1))
          Path('/tmp/branch-inline.js').write_text('\n;\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/branch-inline.js
          grep -F 'function branchParcelsCount' branch-dashboard.html
          grep -F 'عدد الطرود' branch-dashboard.html
          grep -F '@page{size:50mm 40mm;margin:0}' branch-dashboard.html
      - name: Commit tested branch file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add branch-dashboard.html
          git diff --cached --quiet || git commit -m 'Show parcels count in branch dashboard only'
          git push origin branch-parcels-only-safe
