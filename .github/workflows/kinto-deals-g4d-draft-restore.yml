name: KINTO Deals G4D restore
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261002_kinto_deals_v1_g4d_vendor_draft_restore_off.sql'
      - 'ci/kinto-deals-g4d-draft-restore.test.mjs'
      - '.github/workflows/kinto-deals-g4d-draft-restore.yml'
  workflow_dispatch:
jobs:
  g4d-draft-restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test ci/kinto-deals-g4d-draft-restore.test.mjs
