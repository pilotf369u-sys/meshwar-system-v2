name: KINTO Deals G21 availability history
on:
  pull_request:
    paths:
      - 'vendor-dashboard-v2.html'
      - 'js/vendor-kinto-deals-g3g.js'
      - 'supabase/migrations/20261006_kinto_deals_v1_g21_availability_history.sql'
      - 'ci/kinto-deals-g21-availability-history.test.mjs'
      - '.github/workflows/kinto-deals-g21-availability-history.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check js/vendor-kinto-deals-g3g.js
      - run: node --test ci/kinto-deals-g21-availability-history.test.mjs
