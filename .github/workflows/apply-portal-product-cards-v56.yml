name: Apply Portal Product Cards V56
on:
  push:
    branches: [fix/portal-product-cards-v56]
    paths:
      - 'css/portal-product-cards-v56.css'
      - '.github/workflows/apply-portal-product-cards-v56.yml'
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/portal-product-cards-v56
          fetch-depth: 0
      - name: Wire V56 presentation stylesheet only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<link rel="stylesheet" href="css/portal-product-cards-v56.css?v=20260831">'
          if tag not in s:
              if '</head>' not in s: raise SystemExit('index.html missing </head>')
              s=s.replace('</head>', '    '+tag+'\n</head>', 1)
              p.write_text(s)
          PY
          grep -Fq 'css/portal-product-cards-v56.css?v=20260831' index.html
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "index.html"
      - name: Commit V56 wiring
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'style: enable portal and product card V56 presentation'
          git push origin HEAD:fix/portal-product-cards-v56
