name: CRO Polish 20260815
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cro-polish-20260815.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply CRO polish
        run: python3 tools/cro_polish_20260815.py
      - name: Verify
        run: |
          node --check js/local-store-card-v3.js
          grep -F 'background:linear-gradient(135deg,#2563eb,#1d4ed8)!important' js/local-store-card-v3.js
          grep -F 'color:#f1f5f9!important' js/local-store-card-v3.js
          grep -F 'color:#cbd5e1!important' js/local-store-card-v3.js
          grep -F 'js/local-store-card-v3.js?v=cro-20260815' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/local-store-card-v3.js index.html
          git diff --cached --quiet || git commit -m 'Polish local product card CRO styling'
          git push origin main
