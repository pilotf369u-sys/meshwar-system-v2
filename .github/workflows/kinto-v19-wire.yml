name: KINTO V19 Wire
on:
  push:
    branches: [main]
    paths: ['.github/workflows/kinto-v19-wire.yml']
jobs:
  wire:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Activate V19
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          old='js/index-featured-campaigns-v1.js?v=20260828-v18-kinto'
          new='js/index-featured-campaigns-v1.js?v=20260828-v19-kinto'
          assert old in s
          p.write_text(s.replace(old,new))
          q=Path('admin-content-cms.html'); x=q.read_text().replace('js/admin-featured-store-v18.js?v=20260828-v18','js/admin-featured-store-v18.js?v=20260828-v19')
          q.write_text(x)
          Path('.github/workflows/kinto-v19-wire.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html admin-content-cms.html .github/workflows/kinto-v19-wire.yml
          git commit -m 'feat: activate KINTO V19 final UI runtime'
          git push
