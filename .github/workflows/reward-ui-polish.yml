name: Reward UI polish
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reward-ui-polish.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/pilotf369u-sys/meshwar-system-v2/git/blobs/b3975a9f0456cbb01ac869a74c9d85a80f4ddf2f" | jq -r .content | base64 -d > /tmp/reward_patch.py
          python /tmp/reward_patch.py
      - name: Commit and cleanup
        run: |
          git config user.name "meshwar-rewards-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/reward-ui-polish.yml
          git add employee-dashboard.html dashboard.html admin-dashboard.html
          git commit -m "Polish reward feedback history and admin wallet"
          git push origin main
