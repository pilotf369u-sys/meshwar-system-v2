name: Reward UI polish
on:
  push:
    branches: [main]
    paths: ['.github/workflows/reward-ui-polish.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch reward UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          emp=Path('employee-dashboard.html')
          s=emp.read_text(encoding='utf-8')
          add=r'''
<script>
/* REWARD_UI_POLISH_V3 */
async function employeeResetCycleSilently(sb,c,id){if(!c)return;const direct=employeeCycleField(c);if(direct){const r=await sb.from('customers').update({[direct]:0}).eq('id',id);if(!r.error){c[direct]=0;return}console.warn('Cycle reset field failed:',r.error)}for(const field of ['current_cycle_delivered','delivered_orders_count']){if(direct===field)continue;try{const r=await sb.from('customers').update({[field]:0}).eq('id',id);if(!r.error){c[field]=0;return}}catch(e){console.warn('Cycle reset fallback skipped:',e)}}}
changeReward=async function(cid,dir){const id=cloudId(decodeURIComponent(cid)),c=cloudCustomers.find(x=>cloudId(x.id)===id),amount=Number(document.getElementById('reward-'+cid)?.value||0),currency=String(document.getElementById('reward-currency-'+cid)?.value||'USD');if(!c||!Number.isFinite(amount)||amount<=0)return alert('أدخل قيمة مكافأة صحيحة.');const rows=employeeRewardOrdersByCustomer.get(id)||[],cycle=employeeRewardCycle(c,rows),windowRows=cycle.slice(0,EMPLOYEE_REWARD_TARGET);if(dir>0&&windowRows.length<EMPLOYEE_REWARD_TARGET)return alert('العميل لم يصل إلى 6 طلبات مسلمة في الدورة الحالية.');const balanceField=employeeBalanceField(c);if(!balanceField)return alert('لا يوجد حقل رصيد متاح في سجل العميل.');const currentBalance=Number(c[balanceField]||0),nextBalance=currentBalance+(dir>0?amount:-amount);if(nextBalance<0)return alert('الرصيد غير كافٍ لإجراء السحب.');const currencyField=employeeCurrencyField(c),storedCurrency=employeeStoredCurrency(c);if(currentBalance!==0&&storedCurrency&&storedCurrency!==currency)return alert(`رصيد العميل الحالي بعملة ${storedCurrency}. لا يمكن خلط ${currency} معه في نفس الرصيد.`);const countField=employeeCountField(c),payload={[balanceField]:nextBalance};if(currencyField)payload[currencyField]=currency;if(dir>0&&countField)payload[countField]=employeeRewardUsage(c)+1;const sb=await ensureEmployeeSupabase(),{error}=await sb.from('customers').update(payload).eq('id',id);if(error)return alert('تعذر تحديث الرصيد: '+error.message);Object.assign(c,payload);if(dir>0)await employeeResetCycleSilently(sb,c,id);const entry={amount:dir>0?amount:-amount,currency,type:dir>0?'grant':'withdraw',date:new Date().toISOString(),employee_id:cloudId(currentEmployee?.id),employee_name:currentEmployee?.name||''};if(dir>0){entry.order_ids=windowRows.map(o=>o.id);entry.cycle_orders=windowRows.length;entry.cycle_totals=employeeRewardTotals(windowRows)}await employeeBestEffortRewardLog(sb,c,id,entry);await employeeBestEffortRewardMessage(sb,id,amount,currency,dir);await Promise.all([loadRewardsManagementTable(),refreshPipelineCounts()]);alert(dir>0?'تم منح المكافأة للعميل وتحديث الرصيد بنجاح!':'تم تحديث رصيد المكافآت بنجاح!')};
Object.assign(window,{changeReward});
</script>
'''
          if 'REWARD_UI_POLISH_V3' not in s:s+=add
          emp.write_text(s,encoding='utf-8')
          dash=Path('dashboard.html');s=dash.read_text(encoding='utf-8')
          add=r'''
<script>
/* REWARD_UI_POLISH_V3 */
function formatRewardDateTime(value){if(!value)return'—';const d=new Date(value);if(Number.isNaN(d.getTime()))return escapeHtml(value);const date=new Intl.DateTimeFormat('en-GB',{day:'2-digit',month:'2-digit',year:'numeric'}).format(d);const time=new Intl.DateTimeFormat('en-US',{hour:'2-digit',minute:'2-digit',hour12:true}).format(d);return `${date} - ${time}`}
renderCustomerRewardHistory=function(){const hist=document.getElementById('rewardsHistoryList');if(!hist)return;const log=customerRewardLog();hist.innerHTML=log.map((r,i)=>{const amount=Number(r?.amount||0),currency=escapeHtml(r?.currency||customerRewardCurrency()||''),type=String(r?.type||'').toLowerCase()==='withdraw'?'سحب':'مكافأة';return `<div style="padding:12px 10px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div><div style="font-weight:800;color:#12335b">${escapeHtml(type)} #${i+1}</div><div style="margin-top:4px;font-size:16px;font-weight:900;color:${amount<0?'#b91c1c':'#15803d'}">${amount.toFixed(2)} ${currency}</div></div><div style="font-size:12px;color:#64748b;font-weight:700;direction:ltr">${formatRewardDateTime(r?.date)}</div></div>`}).join('')||'<p style="color:#64748b">لا توجد مكافآت مسجلة.</p>'};
openRewardsModal=async function(){await refreshCustomerRewardProfile();renderCustomerRewardHistory();document.getElementById('rewardsModal').style.display='flex'};
Object.assign(window,{openRewardsModal,renderCustomerRewardHistory});
</script>
'''
          if 'REWARD_UI_POLISH_V3' not in s:s+=add
          dash.write_text(s,encoding='utf-8')
          adm=Path('admin-dashboard.html');s=adm.read_text(encoding='utf-8')
          add=r'''
<script>
/* REWARD_UI_POLISH_V3 */
function adminCustomerWalletText(c){const f=adminBalanceField(c),n=Number(f?c?.[f]:0),cur=adminStoredCurrency(c);return `${Number.isFinite(n)?n.toFixed(2):'0.00'}${cur?' '+esc(cur):''}`}
const adminCustomersWalletBase=loadCustomers;
loadCustomers=async function(){await adminCustomersWalletBase();const table=document.querySelector('#customers table'),head=table?.querySelector('thead tr'),body=document.getElementById('custTableBody');if(!head||!body)return;if(!head.querySelector('[data-wallet-head]')){const th=document.createElement('th');th.dataset.walletHead='1';th.innerText='الرصيد الحالي';const usage=head.children[8];head.insertBefore(th,usage||head.lastElementChild)}[...body.querySelectorAll('tr')].forEach((tr,i)=>{if(tr.querySelector('[data-wallet-cell]'))return;const c=adminCustomersCloud[i];if(!c||tr.children.length<9)return;const td=document.createElement('td');td.dataset.walletCell='1';td.innerHTML=`<b>${adminCustomerWalletText(c)}</b>`;const usage=tr.children[8];tr.insertBefore(td,usage||tr.lastElementChild)})};
Object.assign(window,{loadCustomers});
</script>
'''
          if 'REWARD_UI_POLISH_V3' not in s:s+=add
          adm.write_text(s,encoding='utf-8')
          PY
      - name: Commit and self-remove
        run: |
          git config user.name "meshwar-rewards-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/reward-ui-polish.yml
          git add employee-dashboard.html dashboard.html admin-dashboard.html
          git commit -m "Polish reward feedback history and admin wallet"
          git push origin main
