name: Reward UI polish
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reward-ui-polish.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch files
        env:
          PATCH_B64: "    iIiCmlmICJSRVdBUkRfVUlfUE9MSVNI   iIiCmlmICJSRVdBUkRfVUlfUE9MSVNI    iIiIK aWYgIlJFV0FSRF9VSV9QT0xJU0hfVjMiIG5vdCBpbiBzOiBzKz1hZGQKYWRtLndyaXRlX3RleHQocyxlbmNvZGluZz0idXRmLTgiKQo="
        run: python -c "import os,base64;exec(base64.b64decode(os.environ['PATCH_B64']).decode())"
      - name: Commit and cleanup
        run: |
          git config user.name "meshwar-rewards-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/reward-ui-polish.yml
          git add employee-dashboard.html dashboard.html admin-dashboard.html
          git commit -m "Polish reward feedback history and admin wallet"
          git push origin main
