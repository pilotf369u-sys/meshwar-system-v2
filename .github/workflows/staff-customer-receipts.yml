name: Staff customer receipt isolation
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  receipt-sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: node tests/staff-receipt-page-syntax.test.cjs
      - run: psql -h localhost -U postgres -d postgres -f tests/sql/staff-customer-receipts-v1.sql
        env:
          PGPASSWORD: postgres
