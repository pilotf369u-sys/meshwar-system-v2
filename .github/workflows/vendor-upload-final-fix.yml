name: Vendor upload final fix
on:
  push:
    branches:
      - agent/vendor-upload-final-fix
    paths:
      - '.github/workflows/vendor-upload-final-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vendor-upload-final-fix
          fetch-depth: 0
      - name: Patch vendor dashboard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('vendor-dashboard.html')
          s=p.read_text(encoding='utf-8')
          old='accept="image/*"'
          new='accept="image/jpeg, image/png, image/webp"'
          if old not in s:
              raise SystemExit('image accept marker not found')
          s=s.replace(old,new,1)
          old_catch="catch(e){console.error('Product save error:',e);showNotice('تعذر حفظ المنتج: '+(e.message||e),true)}}"
          new_catch="catch(e){console.error('Product save error:',e);const message=e?.message||String(e);showNotice('تعذر حفظ المنتج: '+message,true);alert(message)}}"
          if old_catch not in s:
              raise SystemExit('saveProduct catch marker not found')
          s=s.replace(old_catch,new_catch,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate patch
        run: |
          grep -Fq 'accept="image/jpeg, image/png, image/webp"' vendor-dashboard.html
          grep -Fq 'alert(message)' vendor-dashboard.html
          grep -Fq "PRODUCT_IMAGES_BUCKET='product-images'" vendor-dashboard.html
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor-dashboard.html
          git commit -m "Fix vendor image picker and save errors"
          git push origin HEAD:agent/vendor-upload-final-fix
