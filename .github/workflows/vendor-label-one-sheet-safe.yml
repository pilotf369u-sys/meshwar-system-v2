name: Vendor Label One Sheet Safe
on:
  push:
    branches: [vendor-label-one-sheet-safe]
    paths:
      - '.github/workflows/vendor-label-one-sheet-safe.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vendor-label-one-sheet-safe
      - name: Apply vendor label patch
        run: python3 tools/vendor_label_one_sheet_patch.py
      - name: Syntax check inline JavaScript
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          h=Path('vendor-dashboard.html').read_text(encoding='utf-8')
          blocks=[]
          for m in re.finditer(r'<script(?:\s[^>]*)?>(.*?)</script>',h,re.S|re.I):
              tag=h[m.start():h.find('>',m.start())+1]
              if 'src=' not in tag.lower(): blocks.append(m.group(1))
          Path('/tmp/vendor-inline.js').write_text('\n;\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/vendor-inline.js
          grep -F '@page{size:50mm 40mm;margin:0}' vendor-dashboard.html
          grep -F 'position:fixed!important;inset:.8mm!important' vendor-dashboard.html
          grep -F 'page-break-inside:avoid!important' vendor-dashboard.html
      - name: Commit tested vendor file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor-dashboard.html
          git diff --cached --quiet || git commit -m 'Keep vendor thermal label on one sheet'
          git push origin vendor-label-one-sheet-safe
