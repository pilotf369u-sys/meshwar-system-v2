name: Local Order Direct Product V30
on:
  push:
    branches: [main]
    paths: ['.github/workflows/local-order-direct-product-v30.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Patch order cycle directly
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # Canonical direct-product URL + durable product metadata for NEW local-store orders.
          p=Path('js/local-store-enhancements.js'); s=p.read_text()
          old="details:{source:'local_store',store_id:currentStoreId,store_name:currentStore?.store_name||'',product_id:String(product.id),product_name:product.product_name||'',vendor_price_usd:vendorUsd,commission_rate:rate,platform_margin_usd:platformMarginUsd,customer_price_usd:finalUsd,exchange_rate:fx,customer_price_local:finalLocal,local_currency:localCurrency,quantity:1},"
          new="details:{source:'local_store',store_id:currentStoreId,store_name:currentStore?.store_name||'',product_id:String(product.id),product_name:product.product_name||'',product_url:'index.html?storeId='+encodeURIComponent(currentStoreId)+'&productId='+encodeURIComponent(String(product.id))+'#localStoreProductsPanel',product_image:product.image_url||null,vendor_price_usd:vendorUsd,commission_rate:rate,platform_margin_usd:platformMarginUsd,customer_price_usd:finalUsd,exchange_rate:fx,customer_price_local:finalLocal,local_currency:localCurrency,quantity:1},"
          if old in s:s=s.replace(old,new,1)
          oldurl="order_url:'index.html?storeId='+encodeURIComponent(currentStoreId),"
          newurl="order_url:'index.html?storeId='+encodeURIComponent(currentStoreId)+'&productId='+encodeURIComponent(String(product.id))+'#localStoreProductsPanel',"
          if oldurl in s:s=s.replace(oldurl,newurl,1)
          assert 'productId=' in s and 'product_image:product.image_url' in s, 'direct product payload patch failed'
          # Deep-link must open store then scroll/highlight exact product.
          if 'V30 direct-product resolver' not in s:
            s += r'''

// V30 direct-product resolver: open exact store/product from dashboard links.
const v30Params=new URLSearchParams(location.search),v30ProductId=v30Params.get('productId')||v30Params.get('product');
async function resolveDirectProductV30(){
  if(!q||!v30ProductId)return;
  if(String(currentStoreId)!==String(q)){currentStoreId=q;try{await loadStoreContext(q)}catch(e){console.error(e)}}
  renderEnhancedProductCards();
  let tries=0;
  const timer=setInterval(()=>{
    const btn=[...document.querySelectorAll('.meshwar-local-product-order[data-product-id]')].find(el=>String(el.dataset.productId)===String(v30ProductId));
    const card=btn?.closest('.meshwar-local-product-card');
    if(card){clearInterval(timer);card.id='product-'+String(v30ProductId);card.style.setProperty('outline','3px solid #fbbf24','important');card.style.setProperty('outline-offset','4px','important');card.scrollIntoView({behavior:'smooth',block:'center'});}
    else if(++tries>12)clearInterval(timer);
  },250);
}
resolveDirectProductV30();
'''
          p.write_text(s)

          # Shared robust UI addon. It can enrich historical orders by product_id from details,
          # and directly injects into any opened order modal/card/table row.
          addon=Path('js/local-order-product-details-v30.js')
          addon.write_text(r'''/* KINTO V30 — direct product clarity for admin / employee / vendor */
(()=>{'use strict';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#039;'}[c]));
const parse=v=>{if(!v)return{};if(typeof v==='object')return v;try{return JSON.parse(v)||{}}catch{return{}}};
const pools=()=>[window.orders,window.allOrders,window.currentOrders,window.vendorOrders,window.filteredOrders,window.ordersData,window.loadedOrders].filter(Array.isArray);
function find(id){for(const a of pools()){const o=a.find(x=>String(x?.id||x?.order_id||x?.order_code)===String(id));if(o)return o}return null}
function data(o){const d=parse(o?.details),sid=String(d.store_id||o?.store_id||''),pid=String(d.product_id||o?.product_id||''),url=(sid&&pid)?`index.html?storeId=${encodeURIComponent(sid)}&productId=${encodeURIComponent(pid)}#localStoreProductsPanel`:(d.product_url||o?.product_url||o?.order_url||''),img=d.product_image||d.image_url||o?.image_url||o?.product_image||'',name=d.product_name||o?.product_name||o?.item_name||'';return{sid,pid,url,img,name}}
function html(o){const x=data(o);if(!x.url&&!x.img&&!x.name)return'';return `<div class="kinto-v30-product" style="display:grid;grid-template-columns:${x.img?'84px ':''}minmax(0,1fr);gap:12px;align-items:center;padding:12px;margin:10px 0;border:1px solid rgba(185,85,4,.32);border-radius:14px;background:rgba(6,59,50,.08)">${x.img?`<img src="${esc(x.img)}" alt="صورة المنتج" style="width:84px;height:84px;object-fit:contain;border-radius:10px;background:#fff">`:''}<div style="min-width:0"><b style="display:block;margin-bottom:5px">${esc(x.name||'المنتج المطلوب')}</b>${x.pid?`<small style="display:block;opacity:.72;margin-bottom:6px">Product ID: ${esc(x.pid)}</small>`:''}${x.url?`<a class="kinto-v30-direct-link" href="${esc(x.url)}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;padding:8px 12px;border-radius:9px;background:#b95504;color:#fff!important;text-decoration:none;font-weight:900">🔗 فتح المنتج مباشرة</a>`:''}</div></div>`}
window.KintoOrderProductV30={data,html,find};
function orderIdFrom(el){return el?.dataset?.orderId||el?.dataset?.id||el?.closest?.('[data-order-id]')?.dataset?.orderId||''}
function inject(host,o){if(!host||!o||host.querySelector('.kinto-v30-product'))return;const h=html(o);if(h)host.insertAdjacentHTML('beforeend',h)}
function scan(){document.querySelectorAll('[data-order-id]').forEach(el=>{const o=find(orderIdFrom(el));if(!o)return;const host=el.closest('[role="dialog"],.modal,.order-details,.order-card,tr')||el;inject(host,o)})}
document.addEventListener('click',e=>{const el=e.target.closest('[data-order-id]');if(el)setTimeout(()=>{const o=find(orderIdFrom(el));const modal=document.querySelector('[role="dialog"]:not([hidden]),.modal.show,.modal.active,.order-details');inject(modal||el.closest('tr,.order-card')||el,o)},60)},true);
new MutationObserver(()=>scan()).observe(document.documentElement,{childList:true,subtree:true});
setInterval(scan,900);scan();
})();''')

          # Wire all requested dashboards. Vendor gets a persistent one-step column/card enhancer,
          # not just a detail-modal hook.
          for fn in ('admin-dashboard.html','employee-dashboard.html','vendor-dashboard-v2.html'):
            p=Path(fn); s=p.read_text(); tag='<script src="js/local-order-product-details-v30.js?v=20260829-v30"></script>'
            if tag not in s:s=s.replace('</body>',tag+'\n</body>',1)
            p.write_text(s)

          vp=Path('vendor-dashboard-v2.html'); vs=vp.read_text()
          vendor=r'''<script>
// V30 Vendor Orders View — visible thumbnail + exact product link in one step.
(function(){
 function run(){
  if(!window.KintoOrderProductV30)return;
  document.querySelectorAll('[data-order-id]').forEach(el=>{
   const id=el.dataset.orderId,order=window.KintoOrderProductV30.find(id);if(!order)return;
   const row=el.closest('tr,.order-card,[class*="order"]')||el;
   if(row.querySelector('.kinto-v30-vendor-inline'))return;
   const wrap=document.createElement('div');wrap.className='kinto-v30-vendor-inline';wrap.innerHTML=window.KintoOrderProductV30.html(order);row.appendChild(wrap);
  });
 }
 setInterval(run,700);document.addEventListener('DOMContentLoaded',run);
})();
</script>'''
          if 'V30 Vendor Orders View' not in vs:vs=vs.replace('</body>',vendor+'\n</body>',1)
          vp.write_text(vs)

          # Syntax-check the module by stripping the CDN import line for node parser.
          txt=Path('js/local-store-enhancements.js').read_text(); Path('/tmp/local-check.js').write_text('\n'.join(x for x in txt.splitlines() if not x.startswith('import ')))
          PY
          node --check /tmp/local-check.js
          node --check js/local-order-product-details-v30.js
          grep -q 'productId=' js/local-store-enhancements.js
          grep -q 'local-order-product-details-v30.js' admin-dashboard.html
          grep -q 'local-order-product-details-v30.js' employee-dashboard.html
          grep -q 'V30 Vendor Orders View' vendor-dashboard-v2.html
          rm .github/workflows/local-order-direct-product-v30.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/local-store-enhancements.js js/local-order-product-details-v30.js admin-dashboard.html employee-dashboard.html vendor-dashboard-v2.html .github/workflows/local-order-direct-product-v30.yml
          git commit -m 'fix: direct product links and vendor order clarity V30'
          git push origin main
