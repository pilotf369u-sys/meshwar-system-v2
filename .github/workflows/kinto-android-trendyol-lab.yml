name: KINTO Android Trendyol lab
on:
 push:
  branches: [app/android-trendyol-lab-v1]
  paths: ['android-lab/**', '.github/workflows/kinto-android-trendyol-lab.yml']
 workflow_dispatch:
permissions:
 contents: read
jobs:
 build:
  runs-on: ubuntu-latest
  timeout-minutes: 20
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with:
      distribution: temurin
      java-version: '17'
   - uses: android-actions/setup-android@v3
     with:
      packages: platform-tools platforms;android-35 build-tools;35.0.0
      log-accepted-android-sdk-licenses: false
   - uses: gradle/actions/setup-gradle@v4
     with:
      gradle-version: '8.11.1'
   - uses: actions/cache@v4
     with:
      path: ~/.android/debug.keystore
      key: kinto-trendyol-lab-debug-signing-v1
   - name: Product reader and SPA button tests
     run: node --test android-lab/checks/product-reader.test.cjs
   - name: URL boundary tests
     run: |
      mkdir -p /tmp/kinto-lab-checks
      javac -d /tmp/kinto-lab-checks android-lab/app/src/main/java/com/kinto/trendyollab/UrlPolicy.java android-lab/checks/UrlPolicyCheck.java android-lab/app/src/main/java/com/kinto/trendyollab/CartRules.java android-lab/checks/CartRulesCheck.java
      java -cp /tmp/kinto-lab-checks UrlPolicyCheck
      java -cp /tmp/kinto-lab-checks CartRulesCheck
   - name: Build test APK
     working-directory: android-lab
     run: gradle --no-daemon :app:assembleDebug :app:lintDebug
   - uses: actions/upload-artifact@v4
     with:
      name: KINTO-Trendyol-Lab-APK
      path: android-lab/app/build/outputs/apk/debug/app-debug.apk
      retention-days: 14
   - uses: actions/upload-artifact@v4
     if: always()
     with:
      name: KINTO-Trendyol-Lab-Lint
      path: android-lab/app/build/reports/lint-results-debug.html
      if-no-files-found: ignore
