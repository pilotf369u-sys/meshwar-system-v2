name: KINTO Android Trendyol lab
on:
 push:
  branches: [app/android-trendyol-lab-v1]
  paths: ['android-lab/**', '.github/workflows/kinto-android-trendyol-lab.yml']
 workflow_dispatch:
permissions:
 contents: read
jobs:
 build:
  runs-on: ubuntu-latest
  timeout-minutes: 20
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with:
      distribution: temurin
      java-version: '17'
   - uses: android-actions/setup-android@v3
   - uses: gradle/actions/setup-gradle@v4
     with:
      gradle-version: '8.11.1'
   - name: URL boundary tests
     run: |
      mkdir -p /tmp/kinto-lab-checks
      javac -d /tmp/kinto-lab-checks android-lab/app/src/main/java/com/kinto/trendyollab/UrlPolicy.java android-lab/checks/UrlPolicyCheck.java
      java -cp /tmp/kinto-lab-checks UrlPolicyCheck
   - name: Build test APK
     working-directory: android-lab
     run: gradle --no-daemon :app:assembleDebug :app:lintDebug
   - uses: actions/upload-artifact@v4
     with:
      name: KINTO-Trendyol-Lab-APK
      path: android-lab/app/build/outputs/apk/debug/app-debug.apk
      retention-days: 14
   - uses: actions/upload-artifact@v4
     if: always()
     with:
      name: KINTO-Trendyol-Lab-Lint
      path: android-lab/app/build/reports/lint-results-debug.html
      if-no-files-found: ignore
