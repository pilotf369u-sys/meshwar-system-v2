name: KINTO Store Product Image Loading Offline
on:
  pull_request:
    paths:
      - 'js/local-store-card-v3.js'
      - 'tests/store-product-images-lazy-contract.test.cjs'
      - '.github/workflows/kinto-store-card-images-offline.yml'
  push:
    branches:
      - 'perf/store-product-images-lazy-isolated-20261106'
permissions:
  contents: read
jobs:
  offline-image-loading:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Storefront image loading and JS syntax without backend
        run: |
          node --check js/local-store-card-v3.js
          node --test tests/store-product-images-lazy-contract.test.cjs
