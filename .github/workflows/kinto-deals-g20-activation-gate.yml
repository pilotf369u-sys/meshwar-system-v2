name: kinto-deals-g20-activation-gate
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261006_kinto_deals_v1_g20_install_gift_capable_checkout.sql'
      - 'supabase/migrations/20261006_kinto_deals_v1_g20_activate_after_gift_checkout.sql'
      - 'ci/kinto-deals-g20-activation-gate.test.mjs'
      - '.github/workflows/kinto-deals-g20-activation-gate.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node ci/kinto-deals-g20-activation-gate.test.mjs