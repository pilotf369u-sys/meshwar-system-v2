name: Customer My Orders electronic invoice
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  customer-paid-invoice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/customer-my-orders-paid-invoice.test.cjs
