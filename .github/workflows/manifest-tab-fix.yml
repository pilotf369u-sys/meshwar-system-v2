name: Manifest tab fix
on:
  push:
    paths:
      - '.github/workflows/manifest-tab-fix.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python .github/manifest-tab-fix.py
      - run: |
          rm .github/manifest-tab-fix.py .github/workflows/manifest-tab-fix.yml
          git config user.name "meshwar-manifest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add employee-dashboard.html admin-dashboard.html .github
          git commit -m "Restore branch transfer manifest view"
          git push
