<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>KINTO | المتاجر المحلية</title>
<style>
:root{color-scheme:dark;--bg:#032b25;--gold:#e5b93f;--text:#f7fbfa;--muted:#b7cec8}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:radial-gradient(circle at 84% 0,rgba(229,185,63,.09),transparent 30%),linear-gradient(180deg,#063b32,#032b25);color:var(--text)}a{text-decoration:none;color:inherit}.top{position:sticky;top:0;z-index:30;background:rgba(3,43,37,.80);backdrop-filter:blur(20px);border-bottom:1px solid rgba(229,185,63,.22)}.top-inner{max-width:1280px;margin:auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-weight:950}.brand img{width:46px;height:46px;object-fit:contain;border-radius:12px;border:1px solid rgba(229,185,63,.35);background:rgba(255,255,255,.05)}.back{padding:10px 16px;border:1px solid rgba(229,185,63,.48);border-radius:999px;background:rgba(255,255,255,.055);font-weight:900}.hero{max-width:1280px;margin:28px auto 16px;padding:0 20px}.hero-card{padding:28px;border:1px solid rgba(229,185,63,.26);border-radius:28px;background:linear-gradient(135deg,rgba(255,255,255,.075),rgba(255,255,255,.025));backdrop-filter:blur(22px);box-shadow:0 24px 60px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.09)}.eyebrow{color:#f3d77b;font-size:12px;font-weight:900;letter-spacing:.08em}.hero h1{font-size:clamp(30px,6vw,58px);margin:8px 0 10px}.hero p{color:var(--muted);line-height:1.9;margin:0;max-width:850px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.search{flex:1;min-width:220px;padding:14px 16px;border-radius:15px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.065);color:#fff;outline:none}.search:focus{border-color:rgba(229,185,63,.55);box-shadow:0 0 0 3px rgba(229,185,63,.08)}.count{display:flex;align-items:center;padding:0 15px;border-radius:15px;border:1px solid rgba(229,185,63,.26);background:rgba(255,255,255,.04);color:#f3d77b;font-weight:900}.filters{display:flex;gap:9px;overflow-x:auto;padding:14px 2px 2px;scrollbar-width:thin}.filter-btn{flex:0 0 auto;cursor:pointer;border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:10px 15px;background:rgba(255,255,255,.055);color:#dcebe7;font-weight:900;white-space:nowrap}.filter-btn.active{border-color:rgba(240,209,110,.78);background:linear-gradient(135deg,rgba(246,220,131,.18),rgba(211,168,45,.12));color:#ffe69a}.wrap{max-width:1280px;margin:auto;padding:0 20px 56px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px}.card{min-height:250px;padding:18px;border-radius:22px;border:1px solid rgba(255,255,255,.11);background:linear-gradient(145deg,rgba(255,255,255,.085),rgba(255,255,255,.035));backdrop-filter:blur(18px);box-shadow:0 12px 30px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.08);display:flex;flex-direction:column;align-items:center;text-align:center;transition:.22s}.card:hover{transform:translateY(-4px);border-color:rgba(229,185,63,.52);box-shadow:0 18px 42px rgba(0,0,0,.22),0 0 0 1px rgba(229,185,63,.08)}.logo{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(229,185,63,.38);background:rgba(255,255,255,.92);padding:9px;overflow:hidden;box-shadow:0 10px 24px rgba(0,0,0,.14)}.logo img{width:100%;height:100%;object-fit:contain;border-radius:50%}.name{margin:14px 0 5px;font-size:17px;font-weight:950}.meta{color:var(--muted);font-size:12px;line-height:1.7}.chip{margin:8px 0;color:#f3d77b;font-size:11px;font-weight:900}.open{margin-top:auto;width:100%;padding:11px 13px;border-radius:12px;border:1px solid rgba(240,209,110,.85);background:linear-gradient(135deg,#f6dc83,#d3a82d);color:#12251f;font-weight:950}.state{grid-column:1/-1;padding:34px;text-align:center;border:1px solid rgba(255,255,255,.1);border-radius:20px;background:rgba(255,255,255,.04);color:var(--muted)}@media(max-width:600px){.top-inner{padding:10px 12px}.hero{padding:0 12px;margin-top:18px}.hero-card{padding:22px 18px}.wrap{padding:0 12px 42px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.card{min-height:222px;padding:12px}.logo{width:70px;height:70px}.name{font-size:14px}.open{font-size:12px;padding:9px 8px}}
</style>
</head>
<body>
<header class="top"><div class="top-inner"><a class="brand" href="index.html"><img src="images/meshwar-logo.png" alt="KINTO"><span>KINTO</span></a><a class="back" href="index.html">⌂ الرجوع للرئيسية</a></div></header>
<main>
<section class="hero"><div class="hero-card"><div class="eyebrow">KINTO LOCAL STORES</div><h1>🏪 المتاجر المحلية</h1><p>اكتشف المتاجر المحلية الموثقة في KINTO، وابحث حسب التخصص أو المنطقة ثم افتح المتجر مباشرة لتصفح منتجاته.</p><div class="tools"><input id="storeSearch" class="search" type="search" placeholder="ابحث عن متجر أو منطقة..." autocomplete="off"><div class="count"><span id="storeCount">0</span>&nbsp; متجر</div></div><nav id="filters" class="filters" aria-label="تصنيفات المتاجر المحلية"><button class="filter-btn active" type="button" data-filter="الكل">الكل</button></nav></div></section>
<div class="wrap"><div id="storesGrid" class="grid"><div class="state">جاري تحميل المتاجر المحلية...</div></div></div>
</main>
<script>
(()=>{'use strict';
const SUPABASE_URL='https://hsmmbloouskqdnptiiad.supabase.co';
const SUPABASE_KEY='sb_publishable_6_IDhNRdtxboDuCfBeAulQ_RRrBqpFH';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const flag=c=>({'العراق':'🇮🇶','iraq':'🇮🇶','تركيا':'🇹🇷','turkey':'🇹🇷','türkiye':'🇹🇷','سوريا':'🇸🇾','syria':'🇸🇾','السعودية':'🇸🇦','saudi arabia':'🇸🇦','الإمارات':'🇦🇪','uae':'🇦🇪','الأردن':'🇯🇴','jordan':'🇯🇴'}[String(c||'').trim().toLowerCase()]||'📍');
const placeholder='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160"><rect width="160" height="160" rx="80" fill="#eef2f1"/><text x="80" y="92" text-anchor="middle" font-family="Arial" font-size="42" font-weight="700" fill="#31564d">K</text></svg>');
const grid=document.getElementById('storesGrid'),filters=document.getElementById('filters'),search=document.getElementById('storeSearch'),count=document.getElementById('storeCount');let rows=[],active='الكل';
function renderFilters(){const specs=['الكل',...new Set(rows.map(s=>String(s.specialty||s.store_type||'شامل').trim()).filter(Boolean))];filters.innerHTML=specs.map(x=>`<button class="filter-btn${x===active?' active':''}" type="button" data-filter="${esc(x)}">${esc(x)}</button>`).join('');filters.querySelectorAll('.filter-btn').forEach(b=>b.addEventListener('click',()=>{active=b.dataset.filter||'الكل';renderFilters();render()}))}
function render(){const q=String(search.value||'').trim().toLowerCase();const visible=rows.filter(s=>{const spec=String(s.specialty||s.store_type||'شامل').trim();const text=[s.store_name,s.country,s.governorate,s.specialty,s.store_type].filter(Boolean).join(' ').toLowerCase();return(active==='الكل'||spec===active)&&(!q||text.includes(q))});count.textContent=String(visible.length);grid.innerHTML=visible.map(s=>`<article class="card"><div class="logo"><img src="${esc(s.logo_url||placeholder)}" onerror="this.onerror=null;this.src='${esc(placeholder)}'" alt="${esc(s.store_name||'متجر')}"></div><div class="name">${esc(s.store_name||'متجر محلي')}</div><div class="meta">${esc(s.specialty||s.store_type||'شامل')}</div><div class="meta">${flag(s.country)} ${esc(s.governorate||s.country||'غير محدد')}</div><div class="chip">${esc(s.default_currency||'')} · متجر نشط</div><a class="open" href="store.html?storeId=${encodeURIComponent(String(s.id||''))}">✨ فتح المتجر</a></article>`).join('')||'<div class="state">لا توجد متاجر مطابقة حالياً.</div>'}
search.addEventListener('input',render);
fetch(`${SUPABASE_URL}/rest/v1/local_stores?select=id,store_name,logo_url,country,governorate,store_type,specialty,default_currency,status&status=eq.active&order=created_at.desc&limit=1000`,{cache:'no-store',headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`,Accept:'application/json'}}).then(r=>{if(!r.ok)throw new Error(`Local stores REST ${r.status}`);return r.json()}).then(data=>{rows=Array.isArray(data)?data:[];renderFilters();render()}).catch(err=>{console.error('Local stores directory load error:',err);grid.innerHTML='<div class="state">تعذر تحميل المتاجر المحلية حالياً.</div>';count.textContent='0'});
})();
</script>
</body>
</html>
