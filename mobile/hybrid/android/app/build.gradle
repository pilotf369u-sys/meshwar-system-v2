plugins { id 'com.android.application' }
android {
 namespace 'com.kinto.trendyollab'
 compileSdk 36
 // Candidate identity only. Production identity/version/signing await Play Console verification.
 defaultConfig { applicationId 'com.kinto.preview.hybrid.v18'; minSdk 28; targetSdk 36; versionCode 18; versionName '0.18-candidate' }
 buildTypes { release { debuggable false; minifyEnabled false; signingConfig null } }
 sourceSets { main { assets.srcDirs = [layout.buildDirectory.dir('candidate-assets')] } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

// Android asset merging does not honor generic source-directory excludes.
// Build a dedicated allowlisted asset tree and wire it before every asset merge.
def candidateAssets = tasks.register('prepareCandidateAssets', Sync) {
 from('src/main/assets') {
  include 'customer-navigation.html', 'hepsiburada-reader.js', 'zara-reader.js', 'product-reader.js', 'order-button.js', 'kinto-webview-compat.js'
 }
 into(layout.buildDirectory.dir('candidate-assets'))
}
tasks.configureEach {
 if ((name.startsWith('merge') && name.endsWith('Assets')) || name.toLowerCase().contains('lint')) dependsOn(candidateAssets)
}
