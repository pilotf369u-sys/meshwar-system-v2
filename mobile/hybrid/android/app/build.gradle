plugins { id 'com.android.application' }
def production = providers.gradleProperty('kintoProduction').orNull == 'true'
def productionId = providers.gradleProperty('kintoProductionApplicationId').orNull
def productionCode = providers.gradleProperty('kintoProductionVersionCode').orNull
if (production && (!productionId || !productionCode)) throw new GradleException('Verify Play Console identity/version before production build')
def secretFile = { String name ->
 def value = System.getenv(name)
 if (!value) throw new GradleException('Missing external signing input: ' + name)
 def f = new File(value).canonicalFile
 if (!f.isFile() || f.toPath().startsWith(rootProject.projectDir.parentFile.parentFile.parentFile.canonicalFile.toPath())) throw new GradleException('Signing files must exist outside checkout')
 return f
}
android {
 namespace 'com.kinto.trendyollab'
 compileSdk 36
 // Candidate identity only. Production identity/version/signing await Play Console verification.
 defaultConfig { applicationId production ? productionId : 'com.kinto.preview.hybrid.v28'; minSdk 28; targetSdk 36; versionCode production ? Integer.parseInt(productionCode) : 28; versionName production ? '1.0' : '0.28-candidate' }
 signingConfigs {
  if (production) {
   playUpload {
    storeFile secretFile('KINTO_UPLOAD_KEYSTORE')
    storePassword secretFile('KINTO_UPLOAD_STORE_PASSWORD_FILE').getText('UTF-8').replaceFirst(/\r?\n$/, '')
    keyAlias System.getenv('KINTO_UPLOAD_KEY_ALIAS')
    keyPassword secretFile('KINTO_UPLOAD_KEY_PASSWORD_FILE').getText('UTF-8').replaceFirst(/\r?\n$/, '')
   }
  }
 }
 buildTypes { release { debuggable false; minifyEnabled false; signingConfig production ? signingConfigs.playUpload : null } }
 sourceSets { main { assets.srcDirs = [layout.buildDirectory.dir('candidate-assets')] } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

// Android asset merging does not honor generic source-directory excludes.
// Build a dedicated allowlisted asset tree and wire it before every asset merge.
def candidateAssets = tasks.register('prepareCandidateAssets', Sync) {
 from('src/main/assets') {
  include 'account-privacy-entry.js', 'account-deletion.html', 'customer-navigation.html', 'hepsiburada-reader.js', 'zara-reader.js', 'madamecoco-reader.js', 'mango-reader.js', 'madparfum-reader.js', 'product-reader.js', 'order-button.js', 'kinto-webview-compat.js'
 }
 into(layout.buildDirectory.dir('candidate-assets'))
}
tasks.configureEach {
 if ((name.startsWith('merge') && name.endsWith('Assets')) || name.toLowerCase().contains('lint')) dependsOn(candidateAssets)
}

// Google Play flexible in-app updates; no permissions or account access.
dependencies { implementation 'com.google.android.play:app-update:2.1.0' }
