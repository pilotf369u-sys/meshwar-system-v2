<!doctype html><meta charset="utf-8"><body><h2 id="branchOrdersSection">LOCAL BRANCH ORDERS</h2><output id="result">PENDING</output><script>
let calls=[],phase='routed',revision=5;const order={id:'TEST-order',reference:'KG-TEST',state:'shipping',revision,request:{items:[{title:'TEST product',quantity:1}],contact:{name:'TEST customer',phone:'000000',address:'TEST address'}},paid:true,fulfillment:{phase,branch_id:'branch-1',courier_id:null}};window.KintoBranchSessionV148={read:()=>({token:'TEST-branch'})};window.fetch=async(url,args)=>{const a=JSON.parse(args.body);calls.push({url,a});if(url.endsWith('kinto_world_dispatch_list_v1'))return{ok:true,json:async()=>[order]};if(url.endsWith('kinto_world_dispatch_directory_v1'))return{ok:true,json:async()=>({branches:[],couriers:[{id:'courier-1',name:'TEST Courier',branch_id:'branch-1'}]})};if(url.endsWith('kinto_world_dispatch_action_v1')){if(a.p_action==='receive')order.fulfillment.phase='received';if(a.p_action==='assign_courier')order.fulfillment.courier_id='courier-1';order.revision++;return{ok:true,json:async()=>({ok:true})};}throw Error('unexpected endpoint');};
</script><script src="../../js/kinto-world-dispatch-v1.js" data-role="branch"></script><script>
setTimeout(async()=>{try{const box=document.querySelector('#worldDispatchMailbox');box.open=true;await new Promise(r=>setTimeout(r,50));if(!box.textContent.includes('KG-TEST')||!box.textContent.includes('لا تحصيل'))throw Error('global branch card missing');[...box.querySelectorAll('button')].find(b=>b.textContent==='تأكيد استلام الفرع').click();await new Promise(r=>setTimeout(r,100));const select=box.querySelector('select');if(!select)throw Error('courier picker missing');select.value='courier:courier-1';[...box.querySelectorAll('button')].find(b=>b.textContent==='تحويل إلى موظف التوصيل').click();await new Promise(r=>setTimeout(r,100));const sent=calls.filter(c=>c.url.endsWith('kinto_world_dispatch_action_v1'));if(sent.length!==2||sent[1].a.p_data.target_id!=='courier-1'||sent[1].a.p_expected_revision!==6)throw Error('assignment contract');if(document.querySelector('#branchOrdersSection').textContent!=='LOCAL BRANCH ORDERS')throw Error('local orders touched');document.querySelector('#result').textContent='PASS_DISPATCH_UI';}catch(e){document.querySelector('#result').textContent='FAIL '+e.message;}},100);
</script>
