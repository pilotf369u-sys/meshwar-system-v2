<!doctype html><meta charset="utf-8"><body data-workspace="staff"><select id="staffRole"><option value="world_employee">world_employee</option></select><p id="policy"></p><p id="notice"></p><button id="refresh"></button><nav id="stages"></nav><section id="orders"></section><output id="result">PENDING</output><script>
const rows=Array.from({length:10},(_,i)=>({id:'TEST-'+i,reference:'KG-TEST-'+i,state:i===0?'shipping':i===1?'purchased':'review',revision:0,request:{items:[{title:'TEST product '+i,quantity:1}]},purchase:i===1?{reference:'TEST-store',shipping_requested_at:'2026-10-23'}:undefined,estimates:[{amount:'35750',currency:'IQD'}]}));let routes=[],writes=[];window.KintoWorldStaffSessionV1={read:()=>({token:'TEST-world'})};window.fetch=async(url,args)=>{const a=JSON.parse(args.body);let data;if(url.endsWith('kinto_world_list_v1'))data=rows;else if(url.endsWith('kinto_world_dispatch_list_v1'))data=routes;else if(url.endsWith('kinto_world_dispatch_directory_v1'))data={branches:[{id:'branch-1',name:'TEST Branch'}],couriers:[{id:'courier-1',name:'TEST Courier'}]};else if(url.endsWith('kinto_world_dispatch_action_v1')){writes.push(a);if(a.p_order_id!=='TEST-0'||a.p_expected_revision!==rows[0].revision)throw Error('wrong order or revision');rows[0].revision++;routes=[{...rows[0],fulfillment:{phase:'routed',branch_id:a.p_data.target_role==='branch'?a.p_data.target_id:null,courier_id:a.p_data.target_role==='courier'?a.p_data.target_id:null}}];data={ok:true};}else throw Error('Unexpected API');return{ok:true,json:async()=>JSON.parse(JSON.stringify(data))};};
</script><script src="../../js/kinto-world-core-v1.js"></script><script src="../../js/kinto-world-workspace-v1.js"></script><script src="../../js/kinto-world-dispatch-v1.js" data-role="staff" data-root="body"></script><script>
const wait=()=>new Promise(r=>setTimeout(r,100));setTimeout(async()=>{try{if(document.querySelector('#worldDispatchMailbox'))throw Error('duplicate bottom mailbox');if(document.querySelectorAll('#orders>article').length!==8)throw Error('page size');const pager=document.querySelector('.world-orders-pager');[...pager.querySelectorAll('button')].find(b=>b.textContent==='التالي').click();if(document.querySelectorAll('#orders>article').length!==2||!pager.textContent.includes('الصفحة 2 من 2'))throw Error('second page');[...pager.querySelectorAll('button')].find(b=>b.textContent==='السابق').click();await wait();let slot=document.querySelector('[data-order-id="TEST-0"] .world-order-dispatch');if(!slot?.querySelector('select'))throw Error('inline shipping target missing');slot.querySelector('select').value='branch:branch-1';slot.querySelector('button').click();await wait();await wait();slot=document.querySelector('[data-order-id="TEST-0"] .world-order-dispatch');if(!slot.textContent.includes('TEST Branch'))throw Error('route status stale');slot.querySelector('select').value='courier:courier-1';slot.querySelector('button').click();await wait();await wait();if(writes.map(x=>x.p_action).join(',')!=='route,reroute'||writes[1].p_expected_revision!==1)throw Error('independent transfer contract');[...document.querySelectorAll('#stages button')].find(b=>b.textContent.startsWith('تجهيز الشحن')).click();await wait();const preparing=document.querySelector('.world-order-dispatch');if(document.querySelectorAll('#orders>article').length!==1||preparing.querySelector('select')||!preparing.textContent.includes('بعد تأكيد تم الشحن'))throw Error('preparation bypass');document.querySelector('#result').textContent='PASS_COMPACT_STAFF_UI';}catch(e){document.querySelector('#result').textContent='FAIL '+e.message;}},200);
</script>
