<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><base href="../../"><link rel="stylesheet" href="css/kinto-world-panels-v1.css"><section id="activeOrders"><div class="panel-card"><div class="panel-head"><h2>طلباتي</h2></div><div id="localOrderSentinel">LOCAL ORDER KN-TEST</div></div></section><output id="result">PENDING</output><script>
let submitted,requests=[];sessionStorage.clear();location.hash=new URLSearchParams({draft:JSON.stringify({requestKey:'00000000-0000-0000-0000-000000000091',items:[{url:'https://www.trendyol.com/test-p-123456',title:'TEST Product',price:'1000',quantity:1,selectedOptions:{size:'M',color:'Black'},optionsConfirmed:true}]})}).toString();window.KintoCustomerSessionV150={read:()=>({token:'TEST-customer'})};window.fetch=async(url,args)=>{const a=JSON.parse(args.body);requests.push(url);if(url.endsWith('customer_session_identity_v150'))return{ok:true,json:async()=>({ok:true,customer:{name:'TEST Customer',phone:'00000000',country:'TEST Country',address:'TEST saved address'}})};if(url.endsWith('kinto_world_submit_v1')){submitted=a;return{ok:true,json:async()=>({reference:'KG-TEST'})};}if(url.endsWith('kinto_world_list_v1'))return{ok:true,json:async()=>[{id:'TEST-global',reference:'KG-TEST',state:'review',revision:0,request:{items:[{title:'TEST Product',quantity:1,size:'M',color:'Black'}]},estimates:[{amount:'35750',currency:'IQD'}]}]};throw Error('Unexpected request '+url);};
</script><script src="js/kinto-world-panels-v1.js" data-panel="customer"></script><script>

</script></html>
