derSentinel').parentElement).display==='none')throw Error('all filter broken');get('submit').click();await new Promise(r=>setTimeout(r,50));if(submitted)throw Error('consent bypass');get('accept').checked=true;get('submit').click();await new Promise(r=>setTimeout(r,100));if(submitted?.p_request.items[0].url!=='https://www.madamecoco.com/test-nt0000000001-101/')throw Error('Madame URL lost');if(submitted?.p_request.contact.name!=='TEST Customer'||submitted.p_request.items[0].size!=='M')throw Error('saved data not submitted');if(document.querySelector('#localOrderSentinel').textContent!=='LOCAL ORDER KN-TEST')throw Error('local order changed');if(!get('notice').textContent.includes('KG-TEST'))throw Error('false success message');document.querySelector('#result').textContent='PASS_MADAMECOCO_UI';}catch(e){document.querySelector('#result').textContent='FAIL '+e.message;}},1200);
