<!doctype html><meta charset="utf-8"><body data-workspace="staff"><select id="staffRole"><option value="world_employee">world_employee</option></select><p id="policy"></p><p id="notice"></p><button id="refresh"></button><nav id="stages"></nav><section id="orders"></section><output id="result">PENDING</output>
<script>
let calls=[];const order={id:'TEST-order',reference:'KG-TEST',state:'purchased',revision:4,payment:{status:'confirmed'},purchase:{reference:'TEST-store-order'},estimates:[],request:{items:[{title:'TEST product',quantity:1}],contact:{name:'TEST',phone:'00000000',address:'TEST address'}}};window.KintoWorldStaffSessionV1={read:()=>({token:'TEST-world'})};window.fetch=async(url,args)=>{const data=JSON.parse(args.body);calls.push({url,...data});if(url.endsWith('kinto_world_fulfillment_action_v2')){order.revision++;if(data.p_action==='tracking')order.purchase.tracking=data.p_data.tracking;if(data.p_action==='prepare_shipping'){order.purchase.tracking=data.p_data.tracking;order.purchase.shipping_requested_at='2026-10-23';}if(data.p_action==='ship_world')order.state='shipping';if(data.p_action==='deliver_world')order.state='delivered';return{ok:true,json:async()=>order};}return{ok:true,json:async()=>[order]};};
</script><script src="../../js/kinto-world-core-v1.js"></script><script src="../../js/kinto-world-workspace-v1.js"></script><script>
const wait=()=>new Promise(r=>setTimeout(r,100));function form(label){return [...document.querySelectorAll('#orders form')].find(f=>f.querySelector('button').textContent===label);}async function send(label,values={}){const f=form(label);if(!f)throw Error('missing action '+label);for(const[k,v]of Object.entries(values)){const input=f.elements.namedItem(k);if(input.type==='checkbox')input.checked=v;else input.value=v;}f.dispatchEvent(new Event('submit',{cancelable:true}));await wait();}
setTimeout(async()=>{try{await send('حفظ رقم البارشيل / التتبع',{tracking:'TEST-parcel'});await send('طلب تجهيز الشحن',{tracking:'TEST-parcel'});if(!document.body.textContent.includes('طلب تجهيز الشحن'))throw Error('prepare state');await send('تم الشحن',{tracking:'TEST-parcel'});await send('تأكيد تم التسليم',{received_confirmed:true});if(order.state!=='delivered')throw Error('delivery');const actions=calls.filter(c=>c.url.endsWith('kinto_world_fulfillment_action_v2'));if(actions.map(c=>c.p_expected_revision).join(',')!=='4,5,6,7')throw Error('revision');const search=document.querySelector('.world-staff-search');search.querySelector('input').value='TEST-parcel';search.dispatchEvent(new Event('submit',{cancelable:true}));await wait();if(!calls.some(c=>c.url.endsWith('kinto_world_staff_search_v2')&&c.p_search==='TEST-parcel'&&c.p_role==='world_employee'))throw Error('server search');document.querySelector('#result').textContent='PASS_STAFF_FULFILLMENT_UI';}catch(e){document.querySelector('#result').textContent='FAIL '+e.message;}},100);
</script>
