<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KINTO | معاينة الموظف المستقلة</title>
<style>*{box-sizing:border-box}body{background:#08291e;color:#f0f7f1;font:15px/1.65 Tahoma,Arial,sans-serif;margin:0}main{max-width:620px;margin:0 auto;padding:18px}.k{color:#eccf7e;font-weight:900;letter-spacing:.15em;font-size:27px}.panel{background:#124431;border:1px solid #58836d;border-radius:20px;margin:13px 0;padding:16px;box-shadow:0 12px 30px #001e1355}.panel h2{margin:0 0 10px;font-size:20px;color:#eacd72}.subtitle{color:#b9d4c6;font-size:13px}.alert{border:1px dashed #d6ad53;border-radius:12px;padding:12px;color:#edd98a;margin:12px 0}label{display:block;margin:10px 0 6px}select{width:100%;padding:12px;border:1px solid #8db19a;border-radius:12px;background:#082d21;color:#fff;font:inherit}button{font:inherit;font-weight:bold;border-radius:12px;border:1px solid #e8bd62;background:#d7b45e;color:#0b2e23;padding:10px 16px;margin:6px 5px 6px 0;cursor:pointer}button.secondary{background:#184e38;color:#f0d98d}.card{padding:16px;border:1px solid #ab9c61;border-radius:17px;background:linear-gradient(145deg,#155e3a,#064527);min-height:110px}.card b{display:block;font-size:19px}.card p{margin:2px 0}pre{background:#09281e;color:#f5f4eb;padding:15px;white-space:pre-wrap;overflow-wrap:anywhere;border-radius:13px;font:14px/1.8 Tahoma,Arial,sans-serif}small{color:#c6d5cd}button:focus-visible,select:focus-visible{outline:3px solid #ffe38e}</style></head><body><main>
<div class="k">KINTO</div><h1>الموظف | إرسال تعليمات الدفع</h1><p class="subtitle">معاينة منفصلة بالطلب التجريبي KN-000160</p>
<p class="alert">هذا نموذج مستقل، لا يحتوي اتصالاً بالشبكة ولا بيانات حساب حقيقية. زر تجهيز الرسالة لا يرسل شيئاً ولا يغير حالة الطلب أو المخزون أو الفاتورة.</p>
<section class="panel"><h2>اختيار طريقة الدفع</h2>
<label for="mode">طريقة التسديد</label><select id="mode"><option value="card_full">تحويل كامل إلى البطاقة</option><option value="goods_now_shipping_cod">دفع المنتجات الآن والشحن عند الباب</option><option value="full_cod">دفع كامل عند الباب</option></select>
<div id="card-select"><label for="card">اختر البطاقة المعتمدة من الأدمن</label><select id="card"><option value="a">بطاقة تجريبية رئيسية — افتراضية</option><option value="b">بطاقة تجريبية ثانية — معتمدة</option></select></div>
<label for="channel">طريقة التواصل</label><select id="channel"><option value="whatsapp">واتساب</option><option value="internal_chat">الدردشة الداخلية</option></select>
<button id="preview" type="button">تجهيز المعاينة</button><button id="copy" type="button" class="secondary">نسخ الرسالة التجريبية</button>
</section>
<section class="panel"><h2>معاينة البطاقة والتعليمات</h2><div class="card" id="cardview"></div><p id="total"></p><pre id="message"></pre><p id="status" aria-live="polite" class="subtitle"></p></section>
</main><script src="../js/kinto-invoice-readonly-v1.js"></script><script src="../js/kinto-manual-card-policy-v1.js"></script><script src="../js/kinto-manual-payment-message-v1.js"></script><script src="../js/kinto-manual-dispatch-preflight-v1.js"></script><script src="../js/kinto-payment-instruction-snapshot-v1.js"></script><script src="../js/kinto-manual-instruction-assembly-v1.js"></script><script>
(function(){'use strict';
 const p=window.KintoManualCardPolicyV1,msg=window.KintoManualPaymentMessageV1,guard=window.KintoManualDispatchPreflightV1,snapshot=window.KintoPaymentInstructionSnapshotV1;
 const $=id=>document.getElementById(id),cards=[
 {id:'a',label:'بطاقة تجريبية رئيسية',provider:'مصرف تجريبي',method_type:'manual',is_enabled:true,
 destination_verified_at:'2026-11-24T10:00:00Z',is_default:true,recipient_name:'اسم حساب تجريبي',account_reference:'TEST-ACCOUNT-001'},
 {id:'b',label:'بطاقة تجريبية ثانية',provider:'مصرف تجريبي',method_type:'manual',is_enabled:true,
 destination_verified_at:'2026-11-24T10:00:00Z',is_default:false,recipient_name:'اسم حساب تجريبي ثانٍ',account_reference:'TEST-ACCOUNT-002'}];
 const invoice=window.KintoInvoiceReadOnlyV1.extract({trustedInvoiceSource:true,accessApproved:true,invoice:{orderCode:'KN-000160',currency:'IQD',version:'demo-v1',prepaidMinor:1500,goodsMinor:1200,deliveryDueMinor:300}});
 let current=null;
 function update(){const mode=$('mode').value;$('card-select').hidden=mode==='full_cod';$('cardview').hidden=mode==='full_cod'}
 function render(){
  try{
   const mode=$('mode').value;
   const assembled=window.KintoManualInstructionAssemblyV1.assemble({
    serverAuthorized:true,employeeAuthorized:true,invoiceAuthorized:true,orderEligible:true,
    approvedInvoice:invoice,orderCode:invoice.orderCode,invoiceVersion:invoice.version,
    serverCards:cards,selectedCardId:mode==='full_cod'?null:$('card').value,
    requestId:'DEMO-'+invoice.orderCode+'-'+mode+'-'+$('card').value+'-'+$('channel').value,
    actorId:'demo-employee',mode,channel:$('channel').value
   });
   const card=assembled.selectedCard;
   $('cardview').replaceChildren();if(card){const title=document.createElement('b');title.textContent=card.label;
    const name=document.createElement('p');name.textContent='اسم الحساب: '+card.recipient_name;
    const number=document.createElement('p');number.textContent='رقم التحويل: '+card.account_reference;
    $('cardview').append(title,name,number);}
   $('total').textContent=mode==='full_cod'?'دفع كامل عند الباب — دون تحويل':'المبلغ المطلوب الآن: '+msg.money(assembled.transferAmountMinor,assembled.currency);
   $('message').textContent=assembled.messageText;
   $('status').textContent='معاينة جاهزة فقط — لم تُرسل ولم تُحفظ. لا تغيير على الطلب.';
   current=assembled.instructionSnapshot;
  }catch(error){current=null;$('message').textContent='';$('status').textContent='تعذر تجهيز المعاينة: '+String(error.message||error);}
 }
 $('mode').addEventListener('change',()=>{update();render()});
 $('card').addEventListener('change',render);$('channel').addEventListener('change',render);
 $('preview').addEventListener('click',render);
 $('copy').addEventListener('click',async()=>{if(!current)return;try{if(!navigator.clipboard)throw Error('Clipboard unavailable');await navigator.clipboard.writeText($('message').textContent);$('status').textContent='تم نسخ الرسالة التجريبية، ولم تُرسل.'}catch{$('status').textContent='النسخ غير متاح هنا، يمكنك تحديد النص يدوياً.'}});
 update();render();
})();
</script></body></html>
