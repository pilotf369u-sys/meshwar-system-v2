<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KINTO | حملات المتاجر</title><style>
:root{color-scheme:dark;font-family:Tahoma,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:#071f18;color:#f6f1e4}header{background:#0a2f23;border-bottom:1px solid #a88c4c;padding:22px max(18px,calc((100vw - 1120px)/2))}h1{font-size:clamp(23px,4vw,35px);margin:6px 0;color:#d8bd79}.muted{color:#b4c6b9;font-size:13px}main{max-width:1120px;margin:auto;padding:24px 16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,285px),1fr));gap:16px}.card{background:#103b2d;border:1px solid #45644a;border-radius:18px;overflow:hidden;box-shadow:0 12px 30px #0003}.art{height:175px;background:linear-gradient(140deg,#123f31,#17382d);position:relative;display:grid;place-items:center;overflow:hidden}.art:before{content:"";position:absolute;inset:-25px;background:var(--img) center/cover;filter:blur(19px) brightness(.5)}.art img{position:relative;width:100%;height:100%;object-fit:contain}.fallback{position:relative;font-size:46px;color:#d7b76b}.body{padding:17px}.store{font-size:12px;color:#d9bd79}.name{font-size:20px;margin:9px 0}.tag{display:inline-block;background:#244c3c;border:1px solid #947f48;border-radius:20px;padding:5px 9px;font-size:12px}.meta{display:flex;justify-content:space-between;gap:8px;margin:13px 0;font-size:12px}.progress{height:6px;background:#284b3b;border-radius:20px;overflow:hidden}.progress span{display:block;background:#d9b76b;height:100%}.gift{margin-top:13px;color:#f1d58b;font-size:13px}.empty{padding:45px 18px;text-align:center;border:1px dashed #6a765b;border-radius:16px}.note{font-size:12px;color:#b4c6b9;margin-top:16px}button{background:#d9b76b;color:#0a2f23;border:0;border-radius:10px;padding:10px 16px;font-weight:bold;cursor:pointer}button:disabled{opacity:.6;cursor:not-allowed}@media(max-width:520px){header{padding:18px}main{padding:14px}.art{height:155px}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>window.ensureCustomerSupabase=window.ensureCustomerSupabase||(()=>{if(!window.supabase?.createClient)throw Error("Supabase SDK unavailable");return window.KintoSupabase||(window.KintoSupabase=window.supabase.createClient("https://hsmmbloouskqdnptiiad.supabase.co","sb_publishable_6_IDhNRdtxboDuCfBeAulQ_RRrBqpFH"))});</script></head><body><header><div class="muted">KINTO / المتاجر المحلية</div><h1>حملات المتاجر</h1><div class="muted">عروض محدودة معتمدة من الإدارة — تظهر فقط أثناء فترة الحملة</div></header><main><div id="state" class="empty">جاري التحقق من الحملات المعتمدة…</div><div id="cards" class="grid" hidden></div><p class="note">المعاينة لا تنشئ طلباً ولا تحجز هدية. أهلية الشراء تُراجع من الخادم عند إتمام الربط.</p></main><script>
(async()=>{const state=document.getElementById('state'),cards=document.getElementById('cards');const client=window.ensureCustomerSupabase?.();if(!client){state.textContent='واجهة العرض جاهزة للربط داخل منصة KINTO. لا توجد بيانات تجريبية تُعرض على أنها حملات حقيقية.';return}try{const {data,error}=await client.rpc('kinto_deals_v1_customer_catalog_g6',{p_limit:24});if(error)throw error;if(!data?.enabled){state.textContent='حملات المتاجر غير مفعّلة حالياً.';return}if(!data.items?.length){state.textContent='لا توجد حملات معتمدة ونشطة حالياً.';return}state.hidden=true;cards.hidden=false;for(const c of data.items){const el=document.createElement('article');el.className='card';const img=c.products?.find(p=>p.image_url)?.image_url||c.gift?.image_url||c.store_logo_url;const art=document.createElement('div');art.className='art';if(img&&/^https:\/\//i.test(img)){art.style.setProperty('--img',`url("${img.replaceAll('"','%22')}")`);const im=document.createElement('img');im.src=img;im.alt=c.title;im.loading='lazy';art.append(im)}else{const f=document.createElement('span');f.className='fallback';f.textContent='KINTO';art.append(f)}el.append(art);const b=document.createElement('div');b.className='body';const store=document.createElement('div');store.className='store';store.textContent=c.store_name;const name=document.createElement('h2');name.className='name';name.textContent=c.title;const desc=document.createElement('p');desc.className='muted';desc.textContent=c.description||'';const tag=document.createElement('span');tag.className='tag';tag.textContent=c.kind==='choose_n'?'اختر '+c.threshold_units+' منتجات مختلفة':c.kind==='buy_n'?'اشترِ '+c.threshold_units+' قطع':'كمية محدودة';const meta=document.createElement('div');meta.className='meta';const timer=document.createElement('span');const count=document.createElement('span');const update=()=>{const t=Math.max(0,new Date(c.ends_at)-Date.now());const d=Math.floor(t/86400000),h=Math.floor(t%86400000/3600000),m=Math.floor(t%3600000/60000);timer.textContent=t?'المتبقي: '+d+'ي '+h+'س '+m+'د':'انتهت الحملة'};update();setInterval(update,60000);count.textContent=c.max_total_redemptions==null?'الكمية حسب التوفر':'المتبقي: '+Math.max(0,c.max_total_redemptions-c.used_allocations);meta.append(timer,count);b.append(store,name,desc,tag,meta);if(c.max_total_redemptions){const bar=document.createElement('div');bar.className='progress';const fill=document.createElement('span');fill.style.width=Math.min(100,100*c.used_allocations/c.max_total_redemptions)+'%';bar.append(fill);b.append(bar)}if(c.gift){const g=document.createElement('p');g.className='gift';g.textContent='الهدية: '+c.gift.name+' (بعد تحقق شروط الحملة)';b.append(g)}el.append(b);cards.append(el)}}catch(e){state.textContent='تعذّر تحميل الحملات الآن. حاول مجدداً لاحقاً.';console.error('KINTO deals catalog',e)}})();
</script></body></html>
