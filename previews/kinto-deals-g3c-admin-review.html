<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KINTO DEALS — مراجعة الإدارة (معاينة معزولة)</title>
<style>
:root{font-family:system-ui;background:#0a2f23;color:#f8f5e9}*{box-sizing:border-box}body{margin:0;padding:22px}main{max-width:960px;margin:auto}h1{color:#d6b66b}.notice{border:1px solid #8d7747;border-radius:12px;padding:12px;margin:14px 0}.card{background:#153c2f;border:1px solid #42604b;border-radius:14px;padding:16px;margin:12px 0}.meta{color:#d5d4c8;font-size:13px;line-height:2}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{border:1px solid #c7a55b;background:#c7a55b;color:#122b20;border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer}button.secondary{background:transparent;color:#f5e6c0}button:disabled{opacity:.5}textarea{width:100%;min-height:80px;border-radius:8px;background:#0a2f23;color:white;padding:10px;border:1px solid #78927f}#cards:empty:after{content:'لا توجد طلبات في المعاينة'}@media(max-width:540px){body{padding:12px}.card{padding:12px}}
</style></head><body><main><h1>KINTO DEALS — مراجعة حملات التجار</h1>
<div class="notice"><strong>معاينة معزولة فقط:</strong> بيانات تجريبية. لا اتصال بـSupabase، ولا موافقة حقيقية، ولا نشر أو إرسال إشعارات.</div>
<p>بانتظار المراجعة: <strong id="count">0</strong></p><div id="cards"></div>
</main><script>
'use strict';
const sample=[{id:'demo-1',store:'متجر تجريبي ١',title:'اختر ٤ منتجات',kind:'choose_n',start:'2026-10-08',end:'2026-10-15',revision:1},{id:'demo-2',store:'متجر تجريبي ٢',title:'منتج حصري محدود',kind:'limited_purchase',start:'2026-10-10',end:'2026-10-20',revision:2}];
const cards=document.getElementById('cards'),count=document.getElementById('count');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
function render(){count.textContent=sample.length;cards.replaceChildren();for(const item of sample){const card=document.createElement('article');card.className='card';card.innerHTML='<h2>'+esc(item.title)+'</h2><div class="meta">المتجر: '+esc(item.store)+'<br>النوع: '+esc(item.kind)+'<br>المدة: '+esc(item.start)+' — '+esc(item.end)+'<br>نسخة المراجعة: '+item.revision+'</div><label>سبب الرفض (إلزامي عند الرفض)<textarea maxlength="1000" placeholder="اذكر سبباً واضحاً للتاجر"></textarea></label><div class="actions"><button data-action="approve">موافقة تجريبية</button><button class="secondary" data-action="reject">رفض تجريبي</button></div>';card.querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>{if(btn.dataset.action==='reject'&&card.querySelector('textarea').value.trim().length<3){alert('اكتب سبب رفض من 3 أحرف على الأقل');return;}if(!confirm('تأكيد القرار في المعاينة فقط؟'))return;sample.splice(sample.indexOf(item),1);render();}));cards.append(card);}}
render();
</script></body></html>
