<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KINTO DEALS — مراجعة الإدارة (معاينة معزولة)</title>
<style>
:root{font-family:system-ui;background:#0a2f23;color:#f8f5e9}*{box-sizing:border-box}body{margin:0;padding:22px}main{max-width:960px;margin:auto}h1{color:#d6b66b}.notice{border:1px solid #8d7747;border-radius:12px;padding:12px;margin:14px 0}.card{background:#153c2f;border:1px solid #42604b;border-radius:14px;padding:16px;margin:12px 0}.meta{color:#d5d4c8;font-size:13px;line-height:2}.hero{position:relative;display:grid;place-items:center;height:190px;border-radius:12px;overflow:hidden;background:#234b3b;margin:12px 0}.hero .blur{position:absolute;inset:-20px;width:calc(100% + 40px);height:calc(100% + 40px);object-fit:cover;filter:blur(18px);opacity:.45}.hero .original{position:relative;width:100%;height:100%;object-fit:contain}.details{border:1px solid #58715d;border-radius:10px;padding:10px;margin:12px 0}.details summary{cursor:pointer;color:#e2c477;font-weight:700}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px;margin-top:10px}.product{background:#0b2d22;border-radius:9px;padding:8px;font-size:12px;display:flex;gap:8px;align-items:center}.product img{width:44px;height:44px;object-fit:contain;background:#234b3b;border-radius:7px}.fine{font-size:12px;color:#d3d9cd;line-height:1.9}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{border:1px solid #c7a55b;background:#c7a55b;color:#122b20;border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer}button.secondary{background:transparent;color:#f5e6c0}button:disabled{opacity:.5}textarea{width:100%;min-height:80px;border-radius:8px;background:#0a2f23;color:white;padding:10px;border:1px solid #78927f}#cards:empty:after{content:'لا توجد طلبات في المعاينة'}@media(max-width:540px){body{padding:12px}.card{padding:12px}}
</style></head><body><main><h1>KINTO DEALS — مراجعة حملات التجار</h1>
<div class="notice"><strong>معاينة معزولة فقط:</strong> بيانات تجريبية. لا اتصال بـSupabase، ولا موافقة حقيقية، ولا نشر أو إرسال إشعارات.</div>
<p>بانتظار المراجعة: <strong id="count">0</strong></p><div id="cards"></div>
</main><script>
'use strict';
// All illustrations below are inline SVG demo art: no external images or network.
const art=(title,bg,accent)=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400"><rect width="800" height="400" fill="'+bg+'"/><circle cx="650" cy="110" r="155" fill="'+accent+'" opacity=".5"/><circle cx="140" cy="320" r="180" fill="'+accent+'" opacity=".3"/><rect x="175" y="105" width="450" height="190" rx="28" fill="#09291f" opacity=".8"/><text x="400" y="216" fill="#f8e8b6" text-anchor="middle" font-family="sans-serif" font-size="38">'+title+'</text></svg>');
const thumb=(label)=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="15" fill="#315b43"/><circle cx="50" cy="43" r="23" fill="#d5b46c"/><text x="50" y="82" fill="#fff" font-size="11" text-anchor="middle" font-family="sans-serif">'+label+'</text></svg>');
const sample=[
{id:'demo-1',store:'متجر تجريبي ١',title:'اختر ٤ منتجات',kind:'choose_n',start:'2026-10-08',end:'2026-10-15',revision:1,description:'اختر ٤ منتجات مختلفة من المجموعة لتحصل على هدية يحددها المتجر.',image:art('حملة اختر ٤','#123f2e','#b18c42'),threshold:4,limit:1,stock:30,gift:'هدية المتجر المختارة',products:[['منتج العناية ١','KIN-101'],['منتج العناية ٢','KIN-102'],['منتج العناية ٣','KIN-103'],['منتج العناية ٤','KIN-104']]},
{id:'demo-2',store:'متجر تجريبي ٢',title:'منتج حصري محدود',kind:'limited_purchase',start:'2026-10-10',end:'2026-10-20',revision:2,description:'شراء حصري بكمية محدودة؛ لا هدية ولا خصم مطلوب.',image:art('إصدار حصري','#143e38','#a88649'),threshold:null,limit:2,stock:20,gift:null,products:[['المنتج الحصري','KIN-205']]}
];
const cards=document.getElementById('cards'),count=document.getElementById('count');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'" :'&#39;'}[c]));
function render(){count.textContent=sample.length;cards.replaceChildren();for(const item of sample){
 const card=document.createElement('article');card.className='card';
 const details='<details class="details"><summary>عرض تفاصيل وصور الحملة والمنتجات</summary><p class="fine">'+esc(item.description)+'</p><div class="fine">العدد الإجمالي للحملة: '+item.stock+' | الحد لكل عميل: '+item.limit+(item.threshold?' | المنتجات المطلوبة: '+item.threshold:'')+(item.gift?' | الهدية: '+esc(item.gift):' | لا توجد هدية')+'</div><div class="products">'+item.products.map(p=>'<div class="product"><img alt="صورة تجريبية للمنتج" src="'+thumb(p[0])+'"><span>'+esc(p[0])+'<br>باركود: '+esc(p[1])+'</span></div>').join('')+'</div></details>';
 card.innerHTML='<h2>'+esc(item.title)+'</h2><div class="hero"><img class="blur" alt="" aria-hidden="true" src="'+item.image+'"><img class="original" alt="صورة تجريبية للحملة" src="'+item.image+'"></div><div class="meta">المتجر: '+esc(item.store)+'<br>النوع: '+esc(item.kind)+'<br>المدة: '+esc(item.start)+' — '+esc(item.end)+'<br>نسخة المراجعة: '+item.revision+'</div>'+details+'<label>سبب الرفض (إلزامي عند الرفض)<textarea maxlength="1000" placeholder="اذكر سبباً واضحاً للتاجر"></textarea></label><div class="actions"><button data-action="approve">موافقة تجريبية</button><button class="secondary" data-action="reject">رفض تجريبي</button></div>';
 card.querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>{if(btn.dataset.action==='reject'&&card.querySelector('textarea').value.trim().length<3){alert('اكتب سبب رفض من 3 أحرف على الأقل');return;}if(!confirm('تأكيد القرار في المعاينة فقط؟'))return;sample.splice(sample.indexOf(item),1);render();}));cards.append(card);
}}

render();
</script></body></html>
