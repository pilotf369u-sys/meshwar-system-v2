<!-- M2_SITE_CONTENT_SAFE_SNIPPET -->
<div id="m2SiteContentFormTemplate" style="display:none"><div style="margin-top:16px;padding:18px;border-radius:16px;border:1px solid #dbeafe;background:linear-gradient(135deg,rgba(248,250,252,.96),rgba(239,246,255,.92));box-shadow:0 12px 30px #0f172a12"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px"><label style="font-weight:800;color:#334155">نص الإعلان المتحرك<input id="siteTickerText" type="text" placeholder="نص الشريط الإعلاني" style="display:block;width:100%;margin-top:6px"></label><label style="font-weight:800;color:#334155">رابط فيديو الإعلانات<input id="sitePromoVideoUrl" type="url" dir="ltr" placeholder="https://..." style="display:block;width:100%;margin-top:6px"></label><label style="font-weight:800;color:#334155">رابط واتساب<input id="siteWhatsappUrl" type="url" dir="ltr" placeholder="https://wa.me/..." style="display:block;width:100%;margin-top:6px"></label><label style="font-weight:800;color:#334155">رابط تيليجرام<input id="siteTelegramUrl" type="url" dir="ltr" placeholder="https://t.me/..." style="display:block;width:100%;margin-top:6px"></label><label style="font-weight:800;color:#334155">رابط إنستغرام<input id="siteInstagramUrl" type="url" dir="ltr" placeholder="https://instagram.com/..." style="display:block;width:100%;margin-top:6px"></label></div><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px"><button id="siteContentSaveBtn" class="btn-green" type="button" onclick="handleSiteContent('save')">حفظ المحتوى</button><button id="siteContentRefreshBtn" class="btn-blue" type="button" onclick="handleSiteContent('load')">تحديث</button><span id="siteContentNotice" class="mini"></span></div></div></div>
<!-- ADMIN_SCRIPT_START -->
<script>
/* SITE_CONTENT_INLINE_SAFE_V1 */
async function handleSiteContent(action){
    try {
        const notice=document.getElementById('siteContentNotice');
        if(notice) notice.textContent=action==='save'?'جاري الحفظ...':'جاري تحميل المحتوى...';
        const sb=await ensureCustomerSupabase();
        if(action==='save'){
            const adminId=String((typeof currentAdminCloud!=='undefined'&&currentAdminCloud&&currentAdminCloud.id)||getAdminId()||'').trim();
            if(!adminId) throw new Error('تعذر تحديد حساب الأدمن');
            const {error}=await sb.rpc('save_site_content',{
                p_admin_id:adminId,
                p_ticker_text:String(document.getElementById('siteTickerText')?.value||'').trim(),
                p_promo_video_url:String(document.getElementById('sitePromoVideoUrl')?.value||'').trim(),
                p_whatsapp_url:String(document.getElementById('siteWhatsappUrl')?.value||'').trim(),
                p_telegram_url:String(document.getElementById('siteTelegramUrl')?.value||'').trim(),
                p_instagram_url:String(document.getElementById('siteInstagramUrl')?.value||'').trim()
            });
            if(error) throw error;
            if(notice) notice.textContent='تم حفظ المحتوى بنجاح';
            return;
        }
        const {data,error}=await sb.from('site_content').select('ticker_text,promo_video_url,whatsapp_url,telegram_url,instagram_url').eq('id',1).maybeSingle();
        if(error) throw error;
        const row=data||{};
        [['siteTickerText','ticker_text'],['sitePromoVideoUrl','promo_video_url'],['siteWhatsappUrl','whatsapp_url'],['siteTelegramUrl','telegram_url'],['siteInstagramUrl','instagram_url']].forEach(([id,key])=>{const el=document.getElementById(id);if(el)el.value=row[key]||''});
        if(notice) notice.textContent='تم تحديث البيانات';
    } catch(error) {
        console.error('Site content isolated error:',error);
        const notice=document.getElementById('siteContentNotice');
        if(notice) notice.textContent='تعذر تنفيذ العملية: '+(error?.message||error);
    }
}
</script>
<!-- ADMIN_SCRIPT_END -->
<!-- PUBLIC_SCRIPT_START -->
<script>
/* SITE_CONTENT_PUBLIC_INLINE_SAFE_V1 */
(async function loadPublicSiteContent(){
    try{
        if(typeof ensureMainSupabase!=='function') return;
        const sb=await ensureMainSupabase();
        const {data,error}=await sb.from('site_content').select('ticker_text,promo_video_url,whatsapp_url,telegram_url,instagram_url').eq('id',1).maybeSingle();
        if(error||!data){if(error)console.warn('site_content fallback:',error);return;}
        const ticker=document.querySelector('#meshwarTicker .meshwar-ticker-track');
        if(ticker&&data.ticker_text)ticker.textContent=data.ticker_text;
        const video=document.getElementById('meshwarPromoVideo');
        if(video&&data.promo_video_url){video.src=data.promo_video_url;video.load();video.play().catch(()=>{});}
        [['WhatsApp',data.whatsapp_url],['Telegram',data.telegram_url],['Instagram',data.instagram_url]].forEach(([label,url])=>{if(!url)return;const a=document.querySelector('#meshwarSocialFooter a[aria-label="'+label+'"]');if(a){a.href=url;a.target='_blank';a.rel='noopener noreferrer';}});
    }catch(error){console.warn('Public site content unavailable; keeping fallback values.',error);}
})();
</script>
<!-- PUBLIC_SCRIPT_END -->
