<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الموظف - MeshWar</title><style>body{font-family:Tahoma;background:#f4f7f6;margin:0;padding:20px;color:#263238}.box{max-width:1500px;margin:auto;background:#fff;padding:22px;border-radius:12px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.tabs{display:flex;gap:8px;overflow:auto;padding:15px 0}.tab{white-space:nowrap;border:1px solid #dbe3ea;background:#fff;color:#334155;border-radius:30px;padding:9px 13px;font-weight:bold;cursor:pointer}.tab.active{background:#1f4f78;color:#fff}.count{background:#e2e8f0;color:#334155;border-radius:20px;padding:3px 7px}.tab.active .count{background:#fff}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#f8fafc;padding:10px;border-radius:8px;margin-bottom:10px}.branchTools{display:none;background:#eff6ff}.branchTools.show{display:flex}input,select{padding:7px;border:1px solid #cbd5e1;border-radius:6px}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1150px}th,td{padding:9px;border:1px solid #e2e8f0;text-align:center}th{background:#2c3e50;color:white}.btn{border:0;border-radius:6px;padding:7px 10px;color:white;font-weight:bold;cursor:pointer}.blue{background:#2980b9}.green{background:#27ae60}.red{background:#c0392b}.purple{background:#8e44ad}.mini{font-size:11px;color:#64748b}.pager{display:flex;justify-content:center;gap:6px;align-items:center;margin-top:12px}.reward{display:none}.reward.show{display:block}.orders.hide{display:none}@media(max-width:700px){body{padding:8px}.box{padding:10px}}</style></head><body><div class="box"><div class="top"><div><h2>لوحة الموظف - إدارة الطلبات</h2><div id="identity" class="mini">جاري التحقق...</div></div><a href="login.html" class="btn red" style="text-decoration:none">تسجيل الخروج</a></div><div id="tabs" class="tabs"></div><div id="ordersPanel" class="orders"><div class="tools"><b>بحث:</b><input id="search" placeholder="MW / Sipariş / العميل / الهاتف" oninput="searchLater()"><select id="pageSize" onchange="setPageSize(this.value)"><option>20</option><option>40</option></select><span id="activeLabel"></span></div><div id="branchTools" class="tools branchTools"><b>الفرع:</b><select id="branchFilter" onchange="reloadFirst()"><option value="">كل الفروع</option></select><button class="btn green" onclick="exportCsv()">تصدير CSV</button><button class="btn blue" onclick="printReport()">طباعة / PDF</button></div><div class="table"><table><thead><tr><th>MW / Sipariş</th><th>العميل</th><th>السعر / الدفع</th><th>الفرع</th><th>الحالة</th><th>حفظ</th></tr></thead><tbody id="body"><tr><td colspan="6">جاري التحميل...</td></tr></tbody></table></div><div class="pager"><button class="btn blue" id="prev" onclick="movePage(-1)">السابق</button><span id="pageInfo"></span><button class="btn blue" id="next" onclick="movePage(1)">التالي</button></div></div><div id="rewardPanel" class="reward"><h3>🎁 مستحق مكافأة</h3><div class="table"><table><thead><tr><th>العميل</th><th>الهاتف</th><th>الطلبات المسلمة</th></tr></thead><tbody id="rewardBody"></tbody></table></div></div></div><script>const URL='https://hsmmbloouskqdnptiiad.supabase.co',KEY='sb_publishable_6_IDhNRdtxboDuCfBeAulQ_RRrBqpFH';const STATUSES=['انتظار رد الموظف','بانتظار موافقة الزبون','بانتظار التسعير','تم التسعير / بانتظار موافقة العميل','تمت الموافقة - بانتظار الدفع','تمت الموافقة','تم التسديد','ملغي من قبل العميل','قيد الطلب','مخزن شركة','تجهيز شحن','تم الشحن','مخزن محلي','مندوب','توزيع داخلي','تم التسليم','رفض الطلب','مرفوض'];const P={waiting_employee:{label:'📩 بانتظار رد الموظف',s:['انتظار رد الموظف']},waiting_customer:{label:'⏳ بانتظار موافقة العميل',s:['بانتظار موافقة الزبون','بانتظار التسعير','تم التسعير / بانتظار موافقة العميل']},waiting_payment:{label:'💳 بانتظار تأكيد الدفع',s:['تمت الموافقة - بانتظار الدفع','تمت الموافقة']},cancelled:{label:'❌ ملغية من قبل العميل',s:['ملغي من قبل العميل']},branch:{label:'🏢 محولة إلى الفرع',s:['تجهيز شحن','مخزن محلي','مندوب','توزيع داخلي'],branch:true},in_order:{label:'🔄 قيد الطلب',s:['قيد الطلب']},company_store:{label:'🏬 مخزن الشركة',s:['مخزن شركة']},shipped:{label:'🚚 تم الشحن',s:['تم الشحن']},rewards:{label:'🎁 مستحق مكافأة',reward:true}};let sb,employee,branches=[],orders=[],active='waiting_employee',page=1,size=20,total=0,timer;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const id=v=>v==null?'':String(v).trim();async function client(){if(sb)return sb;const{createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');return sb=createClient(URL,KEY)}async function verify(){const eid=new URLSearchParams(location.search).get('employeeId');if(!eid)throw Error('لا توجد جلسة موظف صالحة');const c=await client(),{data,error}=await c.from('employees').select('*').eq('id',eid).maybeSingle();if(error)throw error;if(!data)throw Error('الموظف غير موجود');employee=data;identity.textContent='الموظف: '+(data.name||'---')}function renderTabs(){tabs.innerHTML=Object.entries(P).map(([k,v])=>`<button class="tab ${k===active?'active':''}" onclick="switchTab('${k}')">${v.label} <span class="count" id="c-${k}">0</span></button>`).join('')}async function loadBranches(){try{const c=await client(),{data,error}=await c.from('branches').select('*').order('id',{ascending:true});if(error)throw error;branches=data||[];branchFilter.innerHTML='<option value="">كل الفروع</option>'+branches.map(b=>`<option value="${esc(id(b.id))}">${esc(b.name||b.branch_name||b.id)}</option>`).join('')}catch(e){console.warn('branches:',e)}}function branchOptions(v){return '<option value="">بدون فرع</option>'+branches.map(b=>`<option value="${esc(id(b.id))}" ${id(b.id)===id(v)?'selected':''}>${esc(b.name||b.branch_name||b.id)}</option>`).join('')}function statusOptions(v){return STATUSES.map(s=>`<option ${s===v?'selected':''}>${esc(s)}</option>`).join('')}function payOptions(v){return [['cod_full','تحصيل كامل عند الاستلام'],['paid_prepaid','مدفوع مقدماً'],['product_paid_delivery_cod','البضاعة مدفوعة - التوصيل عند الاستلام']].map(x=>`<option value="${x[0]}" ${x[0]===v?'selected':''}>${x[1]}</option>`).join('')}function buildQuery(c,withCount=true){const p=P[active],term=String(search.value||'').trim().replace(/[,%()]/g,' ');let query=c.from('orders').select('*',withCount?{count:'exact'}:{});query=query.in('status',p.s);if(p.branch){query=query.or('branch_id.not.is.null,branch_name.not.is.null');const b=id(branchFilter.value);if(b)query=query.eq('branch_id',b)}if(term){const x=`%${term}%`;query=query.or(`order_code.ilike.${x},reference_order_no.ilike.${x},customer_name.ilike.${x},customer_phone.ilike.${x}`)}return query}async function loadOrders(){if(P[active].reward)return;body.innerHTML='<tr><td colspan="6">جاري التحميل من Supabase...</td></tr>';try{const c=await client();let query=buildQuery(c,true);query=query.order('created_at',{ascending:false});const from=(page-1)*size;const{data,error,count}=await query.range(from,from+size-1);if(error)throw error;orders=data||[];total=count||0;body.innerHTML=orders.map(rowHtml).join('')||'<tr><td colspan="6">لا توجد طلبات في هذا التبويب.</td></tr>';renderPager()}catch(e){console.error('orders load:',e);body.innerHTML=`<tr><td colspan="6" style="color:#b91c1c">تعذر تحميل الطلبات: ${esc(e.message||e)}<br><button class="btn blue" onclick="loadOrders()">إعادة المحاولة</button></td></tr>`;pageInfo.textContent='حدث خطأ أثناء الجلب'}}function rowHtml(o){const x=encodeURIComponent(id(o.id));return `<tr><td><b>${esc(o.order_code||o.id)}</b><br><input id="ref-${x}" value="${esc(o.reference_order_no||'')}" placeholder="Sipariş No"></td><td>${esc(o.customer_name||'---')}<br>${esc(o.customer_phone||'')}</td><td><input id="price-${x}" type="number" value="${o.total_price??''}" style="width:90px"><select id="pay-${x}">${payOptions(o.delivery_payment_type)}</select></td><td><select id="branch-${x}">${branchOptions(o.branch_id)}</select></td><td><select id="status-${x}">${statusOptions(o.status)}</select></td><td><button class="btn green" onclick="save('${x}')">حفظ</button></td></tr>`}async function save(x){const oid=decodeURIComponent(x),o=orders.find(z=>id(z.id)===id(oid));if(!o)return;try{const bid=id(document.getElementById('branch-'+x).value),b=branches.find(z=>id(z.id)===bid),raw=document.getElementById('price-'+x).value,payload={reference_order_no:document.getElementById('ref-'+x).value.trim()||null,total_price:raw===''?null:Number(raw),delivery_payment_type:document.getElementById('pay-'+x).value,branch_id:bid||null,branch_name:b?(b.name||b.branch_name||null):null,status:document.getElementById('status-'+x).value};const c=await client(),{error}=await c.from('orders').update(payload).eq('id',oid);if(error)throw error;await Promise.all([loadOrders(),counts()])}catch(e){alert('تعذر الحفظ: '+(e.message||e))}}function renderPager(){const pages=Math.max(1,Math.ceil(total/size));if(page>pages)page=pages;prev.disabled=page<=1;next.disabled=page>=pages;pageInfo.textContent=`الصفحة ${page} من ${pages} — ${total} طلب`}function movePage(d){const pages=Math.max(1,Math.ceil(total/size));page=Math.max(1,Math.min(pages,page+d));loadOrders()}function setPageSize(v){size=Number(v)===40?40:20;reloadFirst()}function reloadFirst(){page=1;loadOrders()}function searchLater(){clearTimeout(timer);page=1;timer=setTimeout(loadOrders,180)}async function switchTab(k){if(!P[k])return;active=k;page=1;renderTabs();activeLabel.textContent=P[k].label;ordersPanel.classList.toggle('hide',!!P[k].reward);rewardPanel.classList.toggle('show',!!P[k].reward);branchTools.classList.toggle('show',!!P[k].branch);if(P[k].reward)await loadRewards();else await loadOrders()}async function counts(){try{const c=await client();await Promise.all(Object.entries(P).map(async([k,p])=>{let n=0;if(p.reward){n=await rewardCount()}else{let q=c.from('orders').select('id',{count:'exact',head:true}).in('status',p.s);if(p.branch)q=q.or('branch_id.not.is.null,branch_name.not.is.null');const{count,error}=await q;if(!error)n=count||0}const e=document.getElementById('c-'+k);if(e)e.textContent=n}))}catch(e){console.warn('counts:',e)}}async function rewardCount(){try{const c=await client(),{data,error}=await c.from('orders').select('customer_id').eq('status','تم التسليم').limit(10000);if(error)throw error;const m={};(data||[]).forEach(o=>{if(o.customer_id)m[o.customer_id]=(m[o.customer_id]||0)+1});return Object.values(m).filter(n=>n>=5).length}catch{return 0}}async function loadRewards(){rewardBody.innerHTML='<tr><td colspan="3">جاري التحميل...</td></tr>';try{const c=await client(),[a,b]=await Promise.all([c.from('customers').select('id,name,phone,code').limit(2000),c.from('orders').select('customer_id').eq('status','تم التسليم').limit(10000)]);if(a.error)throw a.error;if(b.error)throw b.error;const m={};(b.data||[]).forEach(o=>{if(o.customer_id)m[o.customer_id]=(m[o.customer_id]||0)+1});rewardBody.innerHTML=(a.data||[]).filter(x=>(m[x.id]||0)>=5).map(x=>`<tr><td>${esc(x.name||'---')}<br>${esc(x.code||x.id)}</td><td>${esc(x.phone||'---')}</td><td>${m[x.id]}</td></tr>`).join('')||'<tr><td colspan="3">لا يوجد مستحقون حالياً.</td></tr>'}catch(e){rewardBody.innerHTML=`<tr><td colspan="3" style="color:red">${esc(e.message||e)}</td></tr>`}}async function branchRows(){const bid=id(branchFilter.value);if(!bid)throw Error('اختر فرعاً محدداً أولاً');const c=await client();let q=c.from('orders').select('*').eq('branch_id',bid).in('status',P.branch.s);q=q.order('created_at',{ascending:false});const{data,error}=await q.limit(10000);if(error)throw error;return data||[]}function csv(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}async function exportCsv(){try{const rows=await branchRows(),lines=[['MW','Sipariş','العميل','الهاتف','الحالة','المبلغ','العملة','الفرع'].map(csv).join(',')];rows.forEach(o=>lines.push([o.order_code,o.reference_order_no,o.customer_name,o.customer_phone,o.status,o.total_price,o.currency,o.branch_name].map(csv).join(',')));const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='meshwar-branch.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}catch(e){alert(e.message||e)}}async function printReport(){try{const rows=await branchRows(),b=branches.find(x=>id(x.id)===id(branchFilter.value)),w=open('','_blank');if(!w)return;w.document.write(`<!doctype html><html dir="rtl"><meta charset="utf-8"><style>body{font-family:Tahoma}table{width:100%;border-collapse:collapse}td,th{border:1px solid #777;padding:6px;text-align:center}</style><h2>MeshWar — كشف ${esc(b?.name||b?.branch_name||'الفرع')}</h2><table><tr><th>MW</th><th>Sipariş</th><th>العميل</th><th>الحالة</th><th>المبلغ</th></tr>${rows.map(o=>`<tr><td>${esc(o.order_code||o.id)}</td><td>${esc(o.reference_order_no||'---')}</td><td>${esc(o.customer_name||'---')}</td><td>${esc(o.status||'')}</td><td>${esc(o.total_price??'---')} ${esc(o.currency||'')}</td></tr>`).join('')}</table><script>onload=()=>setTimeout(()=>print(),200)<\/script>`);w.document.close()}catch(e){alert(e.message||e)}}async function realtime(){try{const c=await client();c.channel('employee-orders-tabs').on('postgres_changes',{event:'*',schema:'public',table:'orders'},async()=>{await counts();if(P[active].reward)loadRewards();else loadOrders()}).subscribe()}catch(e){console.warn('realtime:',e)}}window.onload=async()=>{try{await verify();await loadBranches();renderTabs();activeLabel.textContent=P[active].label;await Promise.all([loadOrders(),counts(),realtime()])}catch(e){console.error(e);identity.textContent='تعذر التحقق: '+(e.message||e);body.innerHTML=`<tr><td colspan="6" style="color:red">${esc(e.message||e)}</td></tr>`}};Object.assign(window,{switchTab,loadOrders,movePage,setPageSize,reloadFirst,searchLater,save,exportCsv,printReport});</script></body></html>
