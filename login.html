<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول - MeshWar</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f6f9; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .box { background: white; padding: 30px; border-radius: 15px; width: 100%; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #cc0000; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; }
        button:hover { background: #a30000; }
        p { text-align: center; margin-top: 15px; }
        a { color: #2980b9; text-decoration: none; }
    </style>
</head>
<body>

<div class="box">
    <h2>تسجيل الدخول</h2>
    <input type="text" id="phone" placeholder="رقم الهاتف أو كود الدخول">
    <input type="password" id="password" placeholder="كلمة المرور">
    <button onclick="login()">دخول</button>
    <p>
        <a href="register.html">ليس لديك حساب؟ سجل الآن</a>
    </p>
</div>

<script>
   function login() {
        let inputId = document.getElementById('phone').value.trim();
        const passwordInput = document.getElementById('password').value.trim();

        if (!inputId || !passwordInput) {
            alert('الرجاء إدخال رقم الهاتف/الكود وكلمة المرور');
            return;
        }

        // --- الحالة الأولى: دخول الأدمن ---
        const adminPhone = "123456"; 
        const adminPass = "123";     
        if (inputId === adminPhone && passwordInput === adminPass) {
            window.location.href = 'admin-dashboard.html';
            return;
        }

        let cleanInput = inputId.replace(/[^0-9]/g, '');

        // --- الحالة الثانية: دخول الموظف (من قاعدة بيانات الموظفين) ---
        const employeesList = JSON.parse(localStorage.getItem('employeesList')) || [];
        const employee = employeesList.find(emp => {
            let empPhone = (emp.phone || '').toString().replace(/[^0-9]/g, '');
            let empPass = emp.password || "123";
            return empPhone === cleanInput && passwordInput === empPass;
        });

        if (employee) {
            localStorage.setItem('loggedInEmployee', JSON.stringify(employee));
            window.location.href = 'employee-dashboard.html';
            return;
        }

        // --- الحالة الثالثة: دخول المندوب (من قاعدة بيانات المندوبين) ---
        const deliveryList = JSON.parse(localStorage.getItem('deliveryList')) || [];
        const deliveryGuy = deliveryList.find(del => {
            let delPhone = (del.phone || '').toString().replace(/[^0-9]/g, '');
            let delPass = del.password || "123";
            return delPhone === cleanInput && passwordInput === delPass;
        });

       if (deliveryGuy) {
            localStorage.setItem('loggedInDelivery', JSON.stringify(deliveryGuy));
            localStorage.setItem('loggedDeliveryName', deliveryGuy.name); // <--- أضف هذا السطر فقط هنا
            window.location.href = 'delivery-dashboard.html';
            return;
        }

        // --- الحالة الرابعة: دخول الفرع (من قاعدة بيانات الفروع) ---
        const branchList = JSON.parse(localStorage.getItem('branchList')) || [];
        const branchUser = branchList.find(br => {
            let brPhone = (br.phone || '').toString().replace(/[^0-9]/g, '');
            let brPass = br.password || "";
            return brPhone === cleanInput && passwordInput === brPass;
        });

        if (branchUser) {
            localStorage.setItem('loggedBranchName', branchUser.name);
            window.location.href = 'branch-dashboard.html'; // توجيه الفرع إلى لوحة تحكمه الخاصة
            return;
        }

      // --- الحالة الخامسة: دخول العميل (من قاعدة بيانات العملاء) ---
        const customersDB = JSON.parse(localStorage.getItem('adminCustomersList')) || [];
        const user = customersDB.find(c => {
            let custPhone = (c.phone || '').toString().replace(/[^0-9]/g, '');
            let custCode = (c.code || '').toString().trim();
            return (custPhone === cleanInput || custCode === inputId) && c.password.trim() === passwordInput;
        });

        if (user) {
            // 1. مسح أي مخلفات أو اختيار قديم من لوحة الموظف أو جلسات سابقة فوراً
            localStorage.removeItem('selectedCustomerPhone');
            localStorage.removeItem('selectedCustomerName');
            sessionStorage.removeItem('selectedCustomerPhone');
            
            // 2. حفظ العميل الجديد والتوجه للوحة
            localStorage.setItem('loggedInUser', JSON.stringify(user));
            window.location.href = 'dashboard.html';
        } else {
            alert('بيانات الدخول غير صحيحة، أو أن الحساب غير مسجل في النظام.');
        }
   }
</script>
</body>
</html>
