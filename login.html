<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><title>تسجيل الدخول - MeshWar</title>
<style>body{font-family:Tahoma,sans-serif;background:#f4f6f9;padding:20px;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}.box{background:#fff;padding:30px;border-radius:15px;width:100%;max-width:400px;box-shadow:0 4px 10px rgba(0,0,0,.1)}h2{text-align:center;color:#2c3e50;margin-bottom:20px}input{width:100%;padding:12px;margin:10px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}button{width:100%;padding:12px;background:#c00;color:#fff;border:0;border-radius:8px;cursor:pointer;font-weight:bold;font-size:16px}button:hover{background:#a30000}p{text-align:center;margin-top:15px}a{color:#2980b9;text-decoration:none}</style>
</head><body><div class="box"><h2>تسجيل الدخول</h2><input type="text" id="phone" placeholder="رقم الهاتف أو كود الدخول"><input type="password" id="password" placeholder="كلمة المرور"><button onclick="login()">دخول</button><p><a href="register.html">ليس لديك حساب؟ سجل الآن</a></p></div>
<script>
const LOGIN_SUPABASE_URL='https://hsmmbloouskqdnptiiad.supabase.co',LOGIN_SUPABASE_KEY='sb_publishable_6_IDhNRdtxboDuCfBeAulQ_RRrBqpFH';let loginSupabase=null;
async function ensureLoginSupabase(){if(loginSupabase)return loginSupabase;const{createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');loginSupabase=createClient(LOGIN_SUPABASE_URL,LOGIN_SUPABASE_KEY);return loginSupabase}function phoneCandidates(input){const raw=String(input||'').trim(),digits=raw.replace(/[^0-9]/g,'');return Array.from(new Set([raw,digits,digits?'+'+digits:''].filter(Boolean)))}function normalizeRole(role){const r=String(role||'').trim().toLowerCase();if(r==='admin'||r==='أدمن'||r==='ادمن')return'admin';if(r==='employee'||r==='موظف')return'employee';return r}function cloudId(value){return value==null?'':String(value).trim()}function accountEnabled(a){return a&&a.is_active!==false&&a.active!==false&&a.disabled!==true}function passwordMatches(a,p){return String(a?.password??'')===String(p??'')}
async function findByPhone(table,inputId){const supabase=await ensureLoginSupabase();for(const phoneValue of phoneCandidates(inputId)){const{data,error}=await supabase.from(table).select('*').eq('phone',phoneValue).maybeSingle();if(error)throw error;if(data)return data}return null}async function findEmployeeInSupabase(v){return findByPhone('employees',v)}async function findBranchInSupabase(v){return findByPhone('branches',v)}async function findCourierInSupabase(v){return findByPhone('couriers',v)}
async function hasAdminAccount(){const supabase=await ensureLoginSupabase(),{data,error}=await supabase.from('employees').select('id,role').limit(1000);if(error)throw error;return(data||[]).some(r=>normalizeRole(r.role)==='admin')}async function bootstrapFirstAdmin(inputId,passwordInput){if(inputId!=='123456'||passwordInput!=='123'||await hasAdminAccount())return null;const supabase=await ensureLoginSupabase(),permissions={orders:true,branches:true,rewards:true,pricing:true},{data:existing,error:ee}=await supabase.from('employees').select('*').eq('phone','123456').maybeSingle();if(ee)throw ee;if(existing){const{data,error}=await supabase.from('employees').update({role:'admin',permissions}).eq('id',existing.id).select('*').single();if(error)throw error;return data}const{data,error}=await supabase.from('employees').insert([{name:'Admin',phone:'123456',password:'123',role:'admin',permissions}]).select('*').single();if(error)throw error;return data}
async function findCustomerInSupabase(inputId){const supabase=await ensureLoginSupabase(),raw=String(inputId||'').trim();if(raw){const{data,error}=await supabase.from('customers').select('*').eq('code',raw).maybeSingle();if(error)throw error;if(data)return data}return findByPhone('customers',raw)}
function saveCustomerSession(customer){const id=cloudId(customer?.id);if(!id)return;localStorage.setItem('meshwar_customer_id',id);localStorage.setItem('viewingCustomerId',id);localStorage.setItem('loggedInUser',JSON.stringify({id,name:String(customer?.name||'')}))}
async function login(){const inputId=phone.value.trim(),passwordInput=password.value.trim();if(!inputId||!passwordInput)return alert('الرجاء إدخال رقم الهاتف/الكود وكلمة المرور');try{const boot=await bootstrapFirstAdmin(inputId,passwordInput);if(boot){location.href='admin-dashboard.html?adminId='+encodeURIComponent(cloudId(boot.id));return}const employee=await findEmployeeInSupabase(inputId);if(employee){if(!accountEnabled(employee))return alert('الحساب معطل. راجع الإدارة.');if(!passwordMatches(employee,passwordInput))return alert('كلمة المرور غير صحيحة.');const role=normalizeRole(employee.role);if(role==='admin'){location.href='admin-dashboard.html?adminId='+encodeURIComponent(cloudId(employee.id));return}if(role==='employee'){location.href='employee-dashboard.html?employeeId='+encodeURIComponent(cloudId(employee.id));return}return alert('نوع الحساب غير محدد في Supabase.')}const branch=await findBranchInSupabase(inputId);if(branch){if(!accountEnabled(branch))return alert('حساب الفرع معطل. راجع الإدارة.');if(!passwordMatches(branch,passwordInput))return alert('كلمة المرور غير صحيحة.');const branchId=cloudId(branch.id);if(!branchId)return alert('معرف الفرع غير صالح في Supabase.');location.href='branch-dashboard.html?branchId='+encodeURIComponent(branchId)+'&branchLogin=1';return}const courier=await findCourierInSupabase(inputId);if(courier){if(!accountEnabled(courier))return alert('حساب المندوب معطل. راجع الإدارة.');if(!passwordMatches(courier,passwordInput))return alert('كلمة المرور غير صحيحة.');const courierId=cloudId(courier.id),branchId=cloudId(courier.branch_id);if(!courierId||!branchId)return alert('معرف المندوب أو الفرع غير صالح في Supabase.');location.href='delivery-dashboard.html?courierId='+encodeURIComponent(courierId)+'&branchId='+encodeURIComponent(branchId);return}}catch(error){console.error('Cloud account login Supabase error:',error);alert('تعذر التحقق من حساب النظام عبر Supabase: '+(error.message||error));return}try{const user=await findCustomerInSupabase(inputId);if(!user)return alert('بيانات الدخول غير صحيحة، أو أن الحساب غير مسجل في النظام.');const stored=user.password==null?'':String(user.password).trim();if(!stored){const supabase=await ensureLoginSupabase(),{error}=await supabase.from('customers').update({password:passwordInput}).eq('id',user.id);if(error)throw error}else if(stored!==passwordInput)return alert('كلمة المرور غير صحيحة.');saveCustomerSession(user);location.href='dashboard.html?customerId='+encodeURIComponent(cloudId(user.id))}catch(error){console.error('Customer login Supabase error:',error);alert('تعذر تسجيل الدخول عبر Supabase: '+(error.message||error))}}
window.login=login;
</script></body></html>
