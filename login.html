<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><title>تسجيل الدخول - MeshWar</title>
<style>
*{box-sizing:border-box}
html,body{min-height:100%}
body{font-family:Tahoma,sans-serif;margin:0;padding:20px;display:flex;justify-content:center;align-items:center;min-height:100vh;color:#e2e8f0;background:#020617;background-image:radial-gradient(circle at 15% 20%,rgba(14,165,233,.16),transparent 30%),radial-gradient(circle at 85% 80%,rgba(79,70,229,.16),transparent 32%),linear-gradient(135deg,#020617 0%,#0f172a 50%,#071426 100%);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(120deg,transparent,rgba(255,255,255,.025),transparent)}
.box{position:relative;background:rgba(15,23,42,.72);padding:34px 30px;border-radius:24px;width:100%;max-width:420px;border:1px solid rgba(255,255,255,.1);box-shadow:0 28px 80px rgba(0,0,0,.48),0 0 50px rgba(14,165,233,.08);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.box:before{content:"";position:absolute;inset:-1px;border-radius:24px;padding:1px;background:linear-gradient(135deg,rgba(56,189,248,.55),rgba(99,102,241,.15),rgba(251,191,36,.25));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
h2{text-align:center;color:#f8fafc;margin:0 0 8px;font-size:28px;font-weight:900;letter-spacing:-.5px}
.box:after{content:"MeshWar • بوابة الدخول الموحدة";display:block;text-align:center;color:#94a3b8;font-size:12px;margin-bottom:22px}
input{width:100%;padding:13px 14px;margin:8px 0;border:1px solid rgba(148,163,184,.22);border-radius:12px;background:rgba(15,23,42,.88);color:#f8fafc;outline:none;font-size:15px;transition:.25s ease;box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
input::placeholder{color:#64748b}
input:focus{border-color:rgba(56,189,248,.72);box-shadow:0 0 0 3px rgba(14,165,233,.12),0 8px 24px rgba(14,165,233,.08)}
button{width:100%;padding:13px;margin-top:10px;background:linear-gradient(135deg,#0284c7,#4f46e5);color:#fff;border:1px solid rgba(251,191,36,.26);border-radius:12px;cursor:pointer;font-weight:900;font-size:16px;transition:transform .25s ease,box-shadow .25s ease,filter .25s ease;box-shadow:0 12px 28px rgba(37,99,235,.24)}
button:hover{transform:translateY(-1px);filter:brightness(1.08);box-shadow:0 16px 34px rgba(37,99,235,.32),0 0 18px rgba(251,191,36,.08)}
button:active{transform:translateY(0)}
p{text-align:center;margin:18px 0 0;color:#94a3b8;font-size:13px}a{color:#38bdf8;text-decoration:none;font-weight:700}a:hover{color:#7dd3fc}
@media(max-width:520px){body{padding:14px}.box{padding:28px 20px;border-radius:20px}h2{font-size:24px}}
</style>
</head><body><div class="box"><h2>تسجيل الدخول</h2><input type="text" id="phone" placeholder="رقم الهاتف أو كود الدخول"><input type="password" id="password" placeholder="كلمة المرور"><button onclick="login()">دخول</button><p><a href="register.html">ليس لديك حساب؟ سجل الآن</a></p></div>
<script>
const LOGIN_SUPABASE_URL='https://hsmmbloouskqdnptiiad.supabase.co',LOGIN_SUPABASE_KEY='sb_publishable_6_IDhNRdtxboDuCfBeAulQ_RRrBqpFH';let loginSupabase=null;
async function ensureLoginSupabase(){if(loginSupabase)return loginSupabase;const{createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');loginSupabase=createClient(LOGIN_SUPABASE_URL,LOGIN_SUPABASE_KEY);return loginSupabase}function phoneCandidates(input){const raw=String(input||'').trim(),digits=raw.replace(/[^0-9]/g,'');return Array.from(new Set([raw,digits,digits?'+'+digits:''].filter(Boolean)))}function normalizeRole(role){const r=String(role||'').trim().toLowerCase();if(r==='admin'||r==='أدمن'||r==='ادمن')return'admin';if(r==='employee'||r==='موظف')return'employee';return r}function cloudId(value){return value==null?'':String(value).trim()}function accountEnabled(a){return a&&a.is_active!==false&&a.active!==false&&a.disabled!==true}function passwordMatches(a,p){return String(a?.password??'')===String(p??'')}
async function findByPhone(table,inputId){const supabase=await ensureLoginSupabase();for(const phoneValue of phoneCandidates(inputId)){const{data,error}=await supabase.from(table).select('*').eq('phone',phoneValue).maybeSingle();if(error)throw error;if(data)return data}return null}async function findEmployeeInSupabase(v){return findByPhone('employees',v)}async function findCourierInSupabase(v){return findByPhone('couriers',v)}
async function findBranchInSupabase(inputId){const supabase=await ensureLoginSupabase(),raw=String(inputId||'').trim();if(!raw)return null;for(const field of ['code','branch_code']){const{data,error}=await supabase.from('branches').select('*').eq(field,raw).maybeSingle();if(!error&&data)return data;if(error&&!String(error.message||'').includes(field))console.warn('Branch code lookup warning:',error)}return findByPhone('branches',raw)}
async function findCustomerInSupabase(inputId){const supabase=await ensureLoginSupabase(),raw=String(inputId||'').trim();if(raw){const{data,error}=await supabase.from('customers').select('*').eq('code',raw).maybeSingle();if(error)throw error;if(data)return data}return findByPhone('customers',raw)}
function saveCustomerSession(customer){const id=cloudId(customer?.id);if(!id)return;localStorage.setItem('meshwar_customer_id',id);localStorage.setItem('viewingCustomerId',id);localStorage.setItem('loggedInUser',JSON.stringify({id,name:String(customer?.name||'')}))}
async function findVendorByRpc(inputId,passwordInput){const supabase=await ensureLoginSupabase(),{data,error}=await supabase.rpc('vendor_login',{p_identity:String(inputId||'').trim(),p_password:String(passwordInput??'')});if(error)throw error;return Array.isArray(data)?(data[0]||null):(data||null)}
function saveVendorSession(store){if(!store?.id)return;sessionStorage.setItem('meshwar_vendor_store',JSON.stringify(store))}
async function login(){const inputId=phone.value.trim(),passwordInput=password.value.trim();if(!inputId||!passwordInput)return alert('الرجاء إدخال رقم الهاتف/الكود وكلمة المرور');let legacyPasswordMismatch=false;try{const employee=await findEmployeeInSupabase(inputId);if(employee){if(!accountEnabled(employee))return alert('الحساب معطل. راجع الإدارة.');if(passwordMatches(employee,passwordInput)){const role=normalizeRole(employee.role);if(role==='admin'){location.href='admin-dashboard.html?adminId='+encodeURIComponent(cloudId(employee.id));return}if(role==='employee'){location.href='employee-dashboard.html?employeeId='+encodeURIComponent(cloudId(employee.id));return}return alert('نوع الحساب غير محدد في Supabase.')}legacyPasswordMismatch=true}const branch=await findBranchInSupabase(inputId);if(branch){if(!accountEnabled(branch))return alert('حساب الفرع معطل. راجع الإدارة.');if(passwordMatches(branch,passwordInput)){const branchId=cloudId(branch.id);if(!branchId)return alert('معرف الفرع غير صالح في Supabase.');location.href='branch-dashboard.html?branchId='+encodeURIComponent(branchId);return}legacyPasswordMismatch=true}const courier=await findCourierInSupabase(inputId);if(courier){if(!accountEnabled(courier))return alert('حساب المندوب معطل. راجع الإدارة.');if(passwordMatches(courier,passwordInput)){const courierId=cloudId(courier.id),branchId=cloudId(courier.branch_id);if(!courierId||!branchId)return alert('معرف المندوب أو الفرع غير صالح في Supabase.');location.href='delivery-dashboard.html?courierId='+encodeURIComponent(courierId)+'&branchId='+encodeURIComponent(branchId);return}legacyPasswordMismatch=true}}catch(error){console.error('Cloud account login Supabase error:',error);alert('تعذر التحقق من حساب النظام عبر Supabase: '+(error.message||error));return}try{const user=await findCustomerInSupabase(inputId);if(user){const stored=user.password==null?'':String(user.password).trim();if(!stored){const supabase=await ensureLoginSupabase(),{error}=await supabase.from('customers').update({password:passwordInput}).eq('id',user.id);if(error)throw error}else if(stored!==passwordInput){legacyPasswordMismatch=true}else{saveCustomerSession(user);location.href='dashboard.html?customerId='+encodeURIComponent(cloudId(user.id));return}if(!stored){saveCustomerSession(user);location.href='dashboard.html?customerId='+encodeURIComponent(cloudId(user.id));return}}try{const vendor=await findVendorByRpc(inputId,passwordInput);if(vendor){saveVendorSession(vendor);location.href='vendor-dashboard.html';return}}catch(vendorError){console.error('Vendor fallback login error:',vendorError)}if(legacyPasswordMismatch)return alert('كلمة المرور غير صحيحة.');return alert('بيانات الدخول غير صحيحة، أو أن الحساب غير مسجل في النظام.')}catch(error){console.error('Customer/vendor login Supabase error:',error);alert('تعذر تسجيل الدخول عبر Supabase: '+(error.message||error))}}
window.login=login;
</script></body></html>
