</head><body><div class="box"><img id="loginBrandLogo" class="login-logo" src="images/kinto-header-logo-v158.jpeg" alt="KINTO"><h2>تسجيل الدخول</h2><form id="loginForm"><input type="text" id="phone" autocomplete="username" enterkeyhint="next" placeholder="رقم الهاتف أو كود الدخول"><input type="password" id="password" autocomplete="current-password" enterkeyhint="go" placeholder="كلمة المرور"><div id="loginRoleChooser" class="role-chooser" aria-live="polite"><div class="role-chooser-title">هذا الرقم مرتبط بأكثر من صفة — اختر طريقة الدخول</div><div id="loginRoleOptions" class="role-options"></div></div><button id="loginSubmitBtn" type="submit">دخول</button></form><p><a id="loginSupportLink" href="index.html?openRegistration=1">ليس لديك حساب؟ سجّل حسابك عبر الدعم</a></p></div>

<script>
const LOGIN_SUPABASE_URL='https://hsmmbloouskqdnptiiad.supabase.co',LOGIN_SUPABASE_KEY='sb_publishable_6_IDhNRdtxboDuCfBeAulQ_RRrBqpFH';let loginSupabase=null;
async function ensureLoginSupabase(){if(loginSupabase)return loginSupabase;const{createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');loginSupabase=createClient(LOGIN_SUPABASE_URL,LOGIN_SUPABASE_KEY);return loginSupabase}function parseSiteSettings(v){if(v==null)return{};if(Array.isArray(v))return parseSiteSettings(v[0]);if(typeof v==='string'){try{return parseSiteSettings(JSON.parse(v))}catch{return{}}}if(typeof v==='object'){if(v.value!=null)return parseSiteSettings(v.value);return v}return{}}async function hydrateLoginBrandAndSupport(){try{const sb=await ensureLoginSupabase(),{data,error}=await sb.rpc('get_site_settings');if(error)throw error;const s=parseSiteSettings(data),logo=String(s.brand_logo_url||'').trim(),img=document.getElementById('loginBrandLogo');if(logo&&img)img.src=logo}catch(e){console.warn('KINTO login branding settings unavailable:',e)}}function phoneCandidates(input){const raw=String(input||'').trim(),digits=raw.replace(/[^0-9]/g,'');return Array.from(new Set([raw,digits,digits?'+'+digits:''].filter(Boolean)))}function normalizeRole(role){const r=String(role||'').trim().toLowerCase();if(r==='admin'||r==='أدمن'||r==='ادمن')return'admin';if(r==='employee'||r==='موظف')return'employee';return r}function cloudId(value){return value==null?'':String(value).trim()}function accountEnabled(a){return a&&a.is_active!==false&&a.active!==false&&a.disabled!==true}function passwordMatches(a,p){return String(a?.password??'')===String(p??'')}
function saveCustomerSession(customer){const id=cloudId(customer?.id);if(!id)return;localStorage.setItem('meshwar_customer_id',id);localStorage.setItem('viewingCustomerId',id);localStorage.setItem('loggedInUser',JSON.stringify({id,name:String(customer?.name||'')}))}
async function saveCustomerReviewSession(identity,passwordInput){try{const supabase=await ensureLoginSupabase(),{data,error}=await supabase.rpc('customer_review_login_v132',{p_identity:String(identity||'').trim(),p_password:String(passwordInput||'')});if(error)throw error;if(!data?.ok||!data?.session_token)throw new Error(data?.error||'REVIEW_SESSION_NOT_CREATED');KintoCustomerSessionV150.save(data.session_token,data.expires_at);return true}catch(error){console.warn('Customer session bootstrap failed:',{code:String(error?.code||''),message:String(error?.message||error)});return false}}
async function findVendorByRpc(inputId,passwordInput){const supabase=await ensureLoginSupabase(),{data,error}=await supabase.rpc('vendor_login_session',{p_identity:String(inputId||'').trim(),p_password:String(passwordInput??'')});if(error)throw error;return data?.store?.id&&data?.session_token?data:null}
function saveVendorSession(payload){if(!payload?.store?.id||!payload?.session_token)throw Error('VENDOR_SESSION_REQUIRED');sessionStorage.removeItem('meshwar_vendor_session_v95');sessionStorage.removeItem('meshwar_vendor_store');sessionStorage.setItem('meshwar_vendor_session_v95',JSON.stringify({token:payload.session_token,expiresAt:payload.expires_at,storeId:String(payload.store.id)}));sessionStorage.setItem('meshwar_vendor_store',JSON.stringify(payload.store))}
function roleShell(screen,params){if(screen==='customer'){if(new URLSearchParams(location.search||'').get('next')==='global-order-review.html')return 'global-order-review.html';const q=new URLSearchParams(params);return'dashboard.html'+(q.toString()?'?'+q.toString():'')}const q=new URLSearchParams({screen,...params});return'external-shipping-shell.html?'+q.toString()}
let selectedLoginRole='',resolvedIdentity='';
const LOGIN_ROLE_LABELS={admin:'أدمن',employee:'موظف',branch:'فرع',courier:'موظف توصيل',customer:'عميل',vendor:'متجر',world_employee:'موظف طلبات عالمية'};
async function resolveLoginRole(inputId){
  const supabase=await ensureLoginSupabase(),{data,error}=await supabase.rpc('login_role_resolver_v299',{p_identity:String(inputId||'').trim()});
  if(error)throw error;
  let globalRoles=[];try{const x=await supabase.rpc('kinto_world_login_roles_v1',{p_identity:String(inputId||'').trim()});if(!x.error&&Array.isArray(x.data?.roles))globalRoles=x.data.roles.filter(v=>v==='world_employee');}catch{}
  if(!globalRoles.length)return data||{ok:false,error:'LOGIN_ROLE_RESOLVER_FAILED'};const roles=[...new Set([...(data?.ok?(data.roles||[data.role]):[]),...globalRoles].filter(Boolean))];return {ok:true,roles,...(roles.length===1?{role:roles[0]}:{requires_role_choice:true})};
}
function loginErrorMessage(code){if(code==='LOGIN_ROLE_UNSUPPORTED')return 'نوع الحساب غير مدعوم.';return 'بيانات الدخول غير صحيحة، أو أن الحساب غير مسجل في النظام.'}
function clearRoleChoice(){selectedLoginRole='';resolvedIdentity='';const c=document.getElementById('loginRoleChooser'),o=document.getElementById('loginRoleOptions');c?.classList.remove('show');if(o)o.innerHTML=''}
function showRoleChoice(identity,roles){const c=document.getElementById('loginRoleChooser'),o=document.getElementById('loginRoleOptions');if(!c||!o)return;resolvedIdentity=identity;selectedLoginRole='';o.innerHTML='';for(const role of roles){const b=document.createElement('button');b.type='button';b.textContent=LOGIN_ROLE_LABELS[role]||role;b.dataset.role=role;b.addEventListener('click',()=>{selectedLoginRole=role;for(const x of o.querySelectorAll('button'))x.classList.toggle('selected',x===b);submitLoginForm()});o.appendChild(b)}c.classList.add('show')}
async function secureAwareLogin(){
 const inputId=String(document.getElementById('phone')?.value||'').trim(),passwordInput=String(document.getElementById('password')?.value||'').trim();
 if(!inputId||!passwordInput)return alert('الرجاء إدخال رقم الهاتف/الكود وكلمة المرور');
 if(resolvedIdentity&&resolvedIdentity!==inputId)clearRoleChoice();
 let role=selectedLoginRole;
 if(!role){let r;try{r=await resolveLoginRole(inputId)}catch(e){console.error('Login role resolver error:',e);return alert('تعذر التحقق من نوع الحساب: '+(e.message||e))}if(!r?.ok)return alert(loginErrorMessage(r?.error));const roles=Array.isArray(r.roles)?r.roles.map(x=>String(x||'').trim().toLowerCase()).filter(Boolean):[];if(roles.length>1){showRoleChoice(inputId,roles);return}role=String(r.role||roles[0]||'').trim().toLowerCase()}
 let a;
 if(role==='admin'){try{a=await KintoAdminSessionV147.login(await ensureLoginSupabase(),inputId,passwordInput)}catch(e){return alert('تعذر التحقق الآمن من حساب الأدمن: '+(e.message||e))}if(a.ok){const adminId=cloudId(a.admin?.id);if(!adminId){KintoAdminSessionV147.clear();return alert('معرف الأدمن غير صالح.')}location.href=roleShell('admin',{adminId});return}if(a.error==='ADMIN_LOGIN_DISABLED')return alert('الحساب معطل. راجع الإدارة.');if(a.error==='ADMIN_LOGIN_RATE_LIMITED')return alert('محاولات كثيرة. انتظر 15 دقيقة ثم أعد المحاولة.');return alert('كلمة المرور غير صحيحة.')}
 if(role==='world_employee'){try{const sb=await ensureLoginSupabase(),x=await sb.rpc('kinto_world_staff_login_normalized_v1',{p_phone:inputId,p_password:passwordInput});if(x.error)throw x.error;a=x.data;}catch(e){return alert('تعذر دخول موظف الطلبات العالمية. حاول مجددًا.')}if(a?.ok&&a.session_token){KintoWorldStaffSessionV1.save(a);location.href=roleShell('world_employee',{employeeId:cloudId(a.staff?.id)});return;}return alert(a?.error==='WORLD_LOGIN_LOCKED'?'محاولات كثيرة. انتظر 15 دقيقة ثم أعد المحاولة.':'بيانات الدخول غير صحيحة أو الحساب معطّل.');}
 if(role==='employee'){try{a=await KintoEmployeeSessionV143.login(await ensureLoginSupabase(),inputId,passwordInput)}catch(e){return alert('تعذر التحقق الآمن من حساب الموظف: '+(e.message||e))}if(a.ok){const employeeId=cloudId(a.employee?.id);if(!employeeId){KintoEmployeeSessionV143.clear();return alert('معرف الموظف غير صالح.')}location.href=roleShell('employee',{employeeId});return}if(a.error==='EMPLOYEE_LOGIN_DISABLED')return alert('الحساب معطل. راجع الإدارة.');if(a.error==='EMPLOYEE_LOGIN_RATE_LIMITED')return alert('محاولات كثيرة. انتظر 15 دقيقة ثم أعد المحاولة.');return alert('كلمة المرور غير صحيحة.')}
 if(role==='branch'){try{a=await KintoBranchSessionV148.login(await ensureLoginSupabase(),inputId,passwordInput)}catch(e){return alert('تعذر التحقق الآمن من حساب الفرع: '+(e.message||e))}if(a.ok){const branchId=cloudId(a.branch?.id);if(!branchId){KintoBranchSessionV148.clear();return alert('معرف الفرع غير صالح.')}location.href=roleShell('branch',{branchId});return}if(a.error==='BRANCH_LOGIN_DISABLED')return alert('حساب الفرع معطل. راجع الإدارة.');if(a.error==='BRANCH_LOGIN_RATE_LIMITED')return alert('محاولات كثيرة. انتظر 15 دقيقة ثم أعد المحاولة.');return alert('كلمة المرور غير صحيحة.')}
 if(role==='courier'){try{a=await KintoCourierSessionV149.login(await ensureLoginSupabase(),inputId,passwordInput)}catch(e){return alert('تعذر التحقق الآمن من حساب موظف التوصيل: '+(e.message||e))}if(a.ok){const courierId=cloudId(a.courier?.id),branchId=cloudId(a.courier?.branch_id);if(!courierId){KintoCourierSessionV149.clear();return alert('معرف موظف التوصيل غير صالح.')}location.href=roleShell('delivery',{courierId,...(branchId?{branchId}:{})});return}if(a.error==='COURIER_LOGIN_DISABLED')return alert('حساب موظف التوصيل معطل. راجع الإدارة.');if(a.error==='COURIER_LOGIN_RATE_LIMITED')return alert('محاولات كثيرة. انتظر 15 دقيقة ثم أعد المحاولة.');return alert('كلمة المرور غير صحيحة.')}
 if(role==='customer'){try{const s=await ensureLoginSupabase(),x=await s.rpc('customer_review_login_v132',{p_identity:inputId,p_password:passwordInput});if(x.error)throw x.error;a=x.data}catch(e){return alert('تعذر التحقق الآمن من حساب العميل: '+(e.message||e))}if(a?.ok&&a?.session_token&&a?.customer?.id){KintoCustomerSessionV150.save(a.session_token,a.expires_at);saveCustomerSession(a.customer);location.href=roleShell('customer',{customerId:cloudId(a.customer.id)});return}if(a?.error==='REVIEW_LOGIN_RATE_LIMITED')return alert('محاولات كثيرة. انتظر 15 دقيقة ثم أعد المحاولة.');return alert('كلمة المرور غير صحيحة.')}
 if(role==='vendor'){try{const v=await findVendorByRpc(inputId,passwordInput);if(v){saveVendorSession(v);location.href='vendor-dashboard.html';return}}catch(e){return alert('تعذر تسجيل دخول المتجر: '+(e.message||e))}return alert('كلمة المرور غير صحيحة.')}
 return alert('نوع الحساب غير مدعوم.');
}
window.login=secureAwareLogin;
const loginForm=document.getElementById('loginForm'),loginPhone=document.getElementById('phone'),loginPassword=document.getElementById('password');
async function submitLoginForm(){if(loginForm?.dataset.submitting==='1')return;loginForm.dataset.submitting='1';const b=document.getElementById('loginSubmitBtn');if(b)b.disabled=true;try{await secureAwareLogin()}finally{loginForm.dataset.submitting='';if(b)b.disabled=false}}
loginForm?.addEventListener('submit',e=>{e.preventDefault();submitLoginForm()});
loginPhone?.addEventListener('input',clearRoleChoice);loginPhone?.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();loginPassword?.focus()}});
loginPassword?.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submitLoginForm()}});
// Login is submitted only by the form button or Enter; never while typing.
// Only resume an existing customer token; dashboard performs server verification.
function restoreCustomerLogin(){
 try{
  const attempted='kinto_customer_login_restore_attempted_v150';
  if(sessionStorage.getItem(attempted)==='1')return false;
  // Preserve the shared login form when another role has a session or explicit target.
  const params=new URLSearchParams(location.search);
  if(['screen','role','viewedBy','next'].some(key=>params.has(key)))return false;
  if(['kinto_admin_session_v147','kinto_employee_session_v143','kinto_branch_session_v148','kinto_courier_session_v149','kinto_world_staff_session_v1','meshwar_vendor_session_v95'].some(key=>sessionStorage.getItem(key)))return false;
  const session=window.KintoCustomerSessionV150?.read();
  if(!session?.token||!Number.isFinite(Date.parse(session.expiresAt))||Date.parse(session.expiresAt)<=Date.now())return false;
  sessionStorage.setItem(attempted,'1');
  location.replace('dashboard.html');
  return true;
 }catch{return false}
}
if(!restoreCustomerLogin())hydrateLoginBrandAndSupport();
