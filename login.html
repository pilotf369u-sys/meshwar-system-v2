<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول - MeshWar</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f6f9; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .box { background: white; padding: 30px; border-radius: 15px; width: 100%; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #cc0000; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; }
        button:hover { background: #a30000; }
        p { text-align: center; margin-top: 15px; }
        a { color: #2980b9; text-decoration: none; }
    </style>
</head>
<body>
<div class="box">
    <h2>تسجيل الدخول</h2>
    <input type="text" id="phone" placeholder="رقم الهاتف أو كود الدخول">
    <input type="password" id="password" placeholder="كلمة المرور">
    <button onclick="login()">دخول</button>
    <p><a href="register.html">ليس لديك حساب؟ سجل الآن</a></p>
</div>
<script>
    const LOGIN_SUPABASE_URL = 'https://hsmmbloouskqdnptiiad.supabase.co';
    const LOGIN_SUPABASE_KEY = 'sb_publishable_6_IDhNRdtxboDuCfBeAulQ_RRrBqpFH';
    let loginSupabase = null;

    async function ensureLoginSupabase() {
        if (loginSupabase) return loginSupabase;
        const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
        loginSupabase = createClient(LOGIN_SUPABASE_URL, LOGIN_SUPABASE_KEY);
        return loginSupabase;
    }

    function phoneCandidates(input) {
        const raw = String(input || '').trim();
        const digits = raw.replace(/[^0-9]/g, '');
        return Array.from(new Set([raw, digits, digits ? '+' + digits : ''].filter(Boolean)));
    }

    async function findEmployeeInSupabase(inputId) {
        const supabase = await ensureLoginSupabase();
        for (const phoneValue of phoneCandidates(inputId)) {
            const { data, error } = await supabase.from('employees').select('*').eq('phone', phoneValue).maybeSingle();
            if (error) throw error;
            if (data) return data;
        }
        return null;
    }

    async function findCustomerInSupabase(inputId) {
        const supabase = await ensureLoginSupabase();
        const rawInput = String(inputId || '').trim();
        if (rawInput) {
            const { data: byCode, error: codeError } = await supabase.from('customers').select('*').eq('code', rawInput).maybeSingle();
            if (codeError) throw codeError;
            if (byCode) return byCode;
        }
        for (const phoneValue of phoneCandidates(rawInput)) {
            const { data: byPhone, error: phoneError } = await supabase.from('customers').select('*').eq('phone', phoneValue).maybeSingle();
            if (phoneError) throw phoneError;
            if (byPhone) return byPhone;
        }
        return null;
    }

    async function login() {
        const inputId = document.getElementById('phone').value.trim();
        const passwordInput = document.getElementById('password').value.trim();
        if (!inputId || !passwordInput) return alert('الرجاء إدخال رقم الهاتف/الكود وكلمة المرور');

        if (inputId === '123456' && passwordInput === '123') {
            window.location.href = 'admin-dashboard.html';
            return;
        }

        try {
            const employee = await findEmployeeInSupabase(inputId);
            if (employee) {
                const employeePassword = employee.password == null ? '' : String(employee.password);
                const enabled = employee.is_active !== false && employee.active !== false && employee.disabled !== true;
                if (!enabled) return alert('حساب الموظف معطل. راجع الإدارة.');
                if (employeePassword !== passwordInput) return alert('كلمة المرور غير صحيحة.');
                window.location.href = 'employee-dashboard.html?employeeId=' + encodeURIComponent(employee.id);
                return;
            }
        } catch (error) {
            console.error('Employee login Supabase error:', error);
            alert('تعذر التحقق من حساب الموظف عبر Supabase: ' + (error.message || error));
            return;
        }

        /* بقية أنواع الحسابات تبقى كما هي مؤقتاً إلى أن يحين دور تحويلها للسحابة. */
        const deliveryList = JSON.parse(localStorage.getItem('deliveryList')) || [];
        const cleanInput = inputId.replace(/[^0-9]/g, '');
        const deliveryGuy = deliveryList.find(del => (del.phone || '').toString().replace(/[^0-9]/g, '') === cleanInput && passwordInput === (del.password || '123'));
        if (deliveryGuy) {
            localStorage.setItem('loggedInDelivery', JSON.stringify(deliveryGuy));
            localStorage.setItem('loggedDeliveryName', deliveryGuy.name);
            window.location.href = 'delivery-dashboard.html';
            return;
        }
        const branchList = JSON.parse(localStorage.getItem('branchList')) || [];
        const branchUser = branchList.find(br => (br.phone || '').toString().replace(/[^0-9]/g, '') === cleanInput && passwordInput === (br.password || ''));
        if (branchUser) {
            localStorage.setItem('loggedBranchName', branchUser.name);
            window.location.href = 'branch-dashboard.html';
            return;
        }

        try {
            const user = await findCustomerInSupabase(inputId);
            if (!user) return alert('بيانات الدخول غير صحيحة، أو أن الحساب غير مسجل في النظام.');
            const storedPassword = user.password == null ? '' : String(user.password).trim();
            if (!storedPassword) {
                const supabase = await ensureLoginSupabase();
                const { error } = await supabase.from('customers').update({ password: passwordInput }).eq('id', user.id);
                if (error) throw error;
            } else if (storedPassword !== passwordInput) {
                return alert('كلمة المرور غير صحيحة.');
            }
            localStorage.setItem('viewingCustomerId', String(user.id));
            localStorage.setItem('loggedInUser', JSON.stringify({id:user.id,code:user.code||'',name:user.name||'',phone:user.phone||'',email:user.email||'',country:user.country||'',address:user.address||''}));
            window.location.href = 'dashboard.html';
        } catch (error) {
            console.error('Customer login Supabase error:', error);
            alert('تعذر تسجيل الدخول عبر Supabase: ' + (error.message || error));
        }
    }
    window.login = login;
</script>
</body>
</html>
