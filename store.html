<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>KINTO Store</title>
  <link rel="stylesheet" href="css/local-cart-v93.css?v=20260902-v94">
  <link rel="stylesheet" href="css/store-unified-header-v1.css?v=20260910-v2">
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(180deg,#063b32 0%,#04362e 46%,#032b25 100%);color:#f8fafc}
    .store-shell{width:min(1180px,calc(100% - 28px));margin:0 auto;padding:18px 0 48px}
    .store-hero{margin:20px 0 16px;padding:22px;border:1px solid rgba(229,185,63,.28);border-radius:24px;background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.04));box-shadow:0 22px 55px rgba(0,0,0,.16)}
    .store-title{margin:0;font-size:clamp(24px,4vw,38px);color:#ffe08a}
    .store-meta{margin:8px 0 0;color:#c8d7d3;line-height:1.8}
    #localStoreProductsPanel{display:block!important}
    #localStoreProductsGrid{margin-top:16px}
    .store-state{padding:26px;border:1px solid rgba(255,255,255,.12);border-radius:18px;background:rgba(15,23,42,.32);text-align:center;color:#d7e4e0}
  </style>
</head>
<body>
  <main class="store-shell">
    <header id="kintoStoreHeader" class="store-nav" aria-label="ترويسة متجر KINTO">
      <div class="store-nav-main">
        <a class="store-brand" href="index.html" aria-label="KINTO الرئيسية">
          <img src="https://hsmmbloouskqdnptiiad.supabase.co/storage/v1/object/public/site-hero-media/hero/21d10e8c-4d05-4e21-bb4f-883188259e97.jpg" width="48" height="48" alt="شعار KINTO">
          <span><strong>KINTO</strong><small>SHOP • SHIP • ENJOY</small></span>
        </a>
        <nav class="store-primary-nav" aria-label="التنقل الرئيسي">
          <a class="store-header-btn store-back" href="index.html"><span aria-hidden="true">⌂</span><span>الرئيسية</span></a>
          <a class="store-header-btn" href="local-stores.html"><span aria-hidden="true">▣</span><span>المتاجر المحلية</span></a>
          <a class="store-header-btn" href="global-stores.html"><span aria-hidden="true">◉</span><span>المتاجر العالمية</span></a>
          <a class="store-header-btn" href="index.html#meshwarFeaturedCampaigns"><span aria-hidden="true">★</span><span>المتاجر المميزة</span></a>
        </nav>
        <nav class="store-header-actions" aria-label="أدوات العميل">
          <a class="store-header-btn store-shop-now" href="index.html?openOrder=1"><span aria-hidden="true">🛒</span><span>تسوق الآن</span></a>
          <button class="store-header-btn" type="button" id="mwGlobalThemeToggle" aria-label="تبديل الوضع المضيء والداكن"></button>
          <a class="store-header-btn" id="kintoStoreAccount" href="login.html"><span aria-hidden="true">◉</span><span id="kintoStoreAccountLabel">حسابي</span></a>
          <button class="store-header-btn store-logout" type="button" id="kintoStoreLogout" hidden><span aria-hidden="true">↪</span><span>تسجيل الخروج</span></button>
        </nav>
      </div>
      <div class="store-customer-state" id="kintoStoreCustomerState" aria-live="polite">
        <span class="store-customer-greeting">مرحباً بك في متجر KINTO</span>
        <span class="store-customer-chip" id="kintoStoreCustomerCode" hidden></span>
      </div>
    </header>

    <section class="store-hero">
      <h1 id="localStoreProductsTitle" class="store-title">جاري فتح المتجر...</h1>
      <p id="localStoreProductsMeta" class="store-meta">يتم التحقق من معرف المتجر وتحميل بياناته مباشرة.</p>
    </section>

    <section id="localStoreProductsPanel">
      <div id="localStoreProductsGrid"><div class="store-state">جاري تحميل المنتجات...</div></div>
    </section>
  </main>

  <script src="js/local-store-pricing.js?v=local-modal-v4-2"></script>
  <script src="js/global-theme-toggle-v1.js?v=20260909-global-theme-v1.2-toggle-fix"></script>
  <script type="module" src="js/store-unified-header-v1.js?v=20260910-v2"></script>
  <script>
  (()=>{'use strict';
    const SUPABASE_URL='https://hsmmbloouskqdnptiiad.supabase.co';
    const SUPABASE_KEY='sb_publishable_6_IDhNRdtxboDuCfBeAulQ_RRrBqpFH';
    const id=String(new URLSearchParams(location.search).get('storeId')||'').trim();
    const title=document.getElementById('localStoreProductsTitle');
    const meta=document.getElementById('localStoreProductsMeta');
    const grid=document.getElementById('localStoreProductsGrid');
    if(!id){
      title.textContent='معرف المتجر غير موجود';
      meta.textContent='الرابط لا يحتوي storeId صالحاً.';
      grid.innerHTML='<div class="store-state">تعذر فتح المتجر بدون storeId.</div>';
      return;
    }
    window.__KINTO_STORE_ID__=id;
    fetch(`${SUPABASE_URL}/rest/v1/local_stores?select=id,store_name,country,governorate,store_type,specialty,status&id=eq.${encodeURIComponent(id)}&status=eq.active&limit=1`,{
      cache:'no-store',headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`,Accept:'application/json'}
    }).then(r=>{if(!r.ok)throw new Error(`Store REST ${r.status}`);return r.json()}).then(rows=>{
      const s=Array.isArray(rows)?rows[0]:null;
      if(!s)throw new Error('Store not found or inactive');
      title.textContent=s.store_name||'منتجات المتجر';
      meta.textContent=[s.specialty||s.store_type,s.governorate||s.country].filter(Boolean).join(' · ')||'متجر نشط';
      document.title=`${s.store_name||'KINTO Store'} - KINTO`;
    }).catch(err=>{
      console.error('Store header load error:',err);
      title.textContent='منتجات المتجر';
      meta.textContent='سيتم محاولة تحميل المنتجات مباشرة من معرف المتجر.';
    });
  })();
  </script>
  <script src="js/local-cart-v93.js?v=20260905-v101-shipping-destination"></script>
  <script type="module" src="js/local-store-card-v3.js?v=20260901-v93"></script>
  <link rel="stylesheet" href="css/store-product-reviews-v140.css?v=20260912-v143-compact-cards">
  <link rel="stylesheet" href="css/store-card-modern-v144.css?v=20260912-v144">
  <script src="js/store-product-reviews-v140.js?v=20260912-v141" defer></script>
  <script src="js/store-card-modern-v144.js?v=20260912-v144" defer></script>
</body>
</html>
