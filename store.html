<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>KINTO Store</title>
  <script>try{const t=localStorage.getItem("meshwar_global_theme")||localStorage.getItem("meshwar_employee_theme")||"dark";document.documentElement.dataset.mwGlobalTheme=t==="light"?"light":"dark";document.documentElement.dataset.mwTheme=t==="light"?"light":"dark"}catch{document.documentElement.dataset.mwGlobalTheme="dark";document.documentElement.dataset.mwTheme="dark"}</script>
  <link rel="stylesheet" href="css/local-cart-v93.css?v=20260902-v94">
  <link rel="stylesheet" href="css/store-product-reviews-v140.css?v=20260912-v143-compact-cards">
<link rel="stylesheet" href="css/store-card-modern-v144.css?v=20260912-v144-2-polish">
<link rel="stylesheet" href="css/storefront-premium-v145.css?v=20260912-v145-1-badge">
<link rel="stylesheet" href="css/customer-favorites-v147.css?v=20260912-v147">
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(180deg,#063b32 0%,#04362e 46%,#032b25 100%);color:#f8fafc}
    html[data-mw-global-theme="dark"] body{background:#063b32!important;background-image:none!important;color:#f8fafc!important}
    .store-shell{width:min(1180px,calc(100% - 28px));margin:0 auto;padding:18px 0 48px}
    .store-hero{margin:20px 0 16px;padding:22px;border:1px solid rgba(229,185,63,.28);border-radius:24px;background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.04));box-shadow:0 22px 55px rgba(0,0,0,.16)}
    .store-title{margin:0;font-size:clamp(24px,4vw,38px);color:#ffe08a}
    .store-meta{margin:8px 0 0;color:#c8d7d3;line-height:1.8}
    #localStoreProductsPanel{display:block!important;overflow:visible!important;contain:none!important}
    #local-store-products-container{position:relative!important;width:100%;min-width:0;overflow:visible!important;contain:none!important}
    #mwGlobalStoreSearch{position:relative;z-index:51;margin:0 0 12px;padding:12px;border:1px solid rgba(212,175,55,.28);border-radius:16px;background:rgba(6,59,50,.96);box-shadow:0 10px 28px rgba(2,6,23,.18);backdrop-filter:blur(14px)}
    #mwGlobalStoreSearch .mw-global-search-row{display:flex;align-items:center;gap:8px}
    #mwGlobalStoreSearch input{width:100%;min-width:0;box-sizing:border-box;border:1px solid rgba(212,175,55,.24);border-radius:12px;background:rgba(3,43,37,.92);color:#f8fafc;padding:11px 13px;font-size:14px;font-weight:700;outline:none}
    #mwGlobalStoreSearch button{flex:0 0 auto;border:1px solid rgba(212,175,55,.42);border-radius:12px;background:linear-gradient(135deg,#D4AF37,#FFDF73);color:#111827;padding:10px 14px;font-weight:900;cursor:pointer}
    #mwGlobalStoreSearchStatus{margin-top:7px;color:#c8d7d3;font-size:11px;font-weight:700}
    #mwCategoryShell{position:sticky;top:0;z-index:50;margin:0 0 14px;padding:10px;border:1px solid rgba(212,175,55,.28);border-radius:16px;background:rgba(6,59,50,.96);box-shadow:0 12px 30px rgba(2,6,23,.22);backdrop-filter:blur(14px);isolation:isolate}
    #mwCategoryShell .mw-category-bar,#mwCategoryShell .mw-subcategory-bar{display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin;-webkit-overflow-scrolling:touch;padding:2px 1px}
    #mwCategoryShell .mw-subcategory-bar:empty{display:none}
    #mwCategoryShell button{flex:0 0 auto;border-radius:999px;border:1px solid rgba(212,175,55,.34);background:rgba(255,255,255,.06);color:#f8fafc;padding:9px 14px;font-size:14px;font-weight:900;white-space:nowrap}
    #mwCategoryShell button.active{background:linear-gradient(135deg,#D4AF37,#FFDF73);color:#111827;border-color:#D4AF37}
    #localStoreProductsGrid{margin-top:16px}
    .store-state{padding:8px 0;border:0;border-radius:0;background:transparent;text-align:center;color:#d7e4e0}
    @media(max-width:640px){#mwGlobalStoreSearch{padding:9px;border-radius:12px}#mwGlobalStoreSearch button{padding:10px 11px}#mwGlobalStoreSearch input{font-size:13px}#mwCategoryShell{border-radius:12px;padding:8px;margin-inline:-2px}#mwCategoryShell button{font-size:13px;padding:8px 12px}}
  </style>
</head>
<body>
  <main class="store-shell">
    <div id="kintoSharedPublicHeaderMount"></div>
    <script src="js/kinto-shared-public-header-v164.js?v=20260915-v164"></script>


    <section class="store-hero">
      <div class="store-hero-identity">
        <img id="localStoreLogo" class="store-hero-logo" alt="شعار المتجر" hidden>
        <div class="store-hero-copy"><h1 id="localStoreProductsTitle" class="store-title">جاري فتح المتجر...</h1>
        <p id="localStoreProductsMeta" class="store-meta">يتم التحقق من معرف المتجر وتحميل بياناته مباشرة.</p></div>
      </div>
    </section>

    <section id="localStoreProductsPanel">
      <div id="local-store-products-container">
        <div id="mwGlobalStoreSearch">
          <div class="mw-global-search-row"><input id="mwGlobalStoreSearchInput" type="search" autocomplete="off" inputmode="search" placeholder="ابحث باسم المنتج أو امسح الباركود"><button id="mwGlobalStoreSearchBtn" type="button">بحث</button></div>
          <div id="mwGlobalStoreSearchStatus">البحث شامل جميع أقسام هذا المتجر.</div>
        </div>
        <div id="mwCategoryShell" data-mw-storefront-shell="1">
          <div class="mw-category-bar" data-main-row><button type="button" data-cat-filter="all" class="active">الكل</button><button type="button" data-cat-filter="featured">⭐ المميزة</button></div>
          <div class="mw-subcategory-bar" data-sub-row></div>
        </div>
        <div id="localStoreProductsGrid"></div>
      </div>
    </section>
  </main>

  <script src="js/local-store-pricing.js?v=local-modal-v4-2"></script>
  <script>
  (()=>{'use strict';
    const SUPABASE_URL='https://hsmmbloouskqdnptiiad.supabase.co';
    const SUPABASE_KEY='sb_publishable_6_IDhNRdtxboDuCfBeAulQ_RRrBqpFH';
    const id=String(new URLSearchParams(location.search).get('storeId')||'').trim();
    const title=document.getElementById('localStoreProductsTitle');
    const meta=document.getElementById('localStoreProductsMeta');
    const grid=document.getElementById('localStoreProductsGrid');
    if(!id){
      title.textContent='معرف المتجر غير موجود';
      meta.textContent='الرابط لا يحتوي storeId صالحاً.';
      grid.innerHTML='<div class="store-state">تعذر فتح المتجر بدون storeId.</div>';
      return;
    }
    window.__KINTO_STORE_ID__=id;
    fetch(`${SUPABASE_URL}/rest/v1/local_stores?select=id,store_name,logo_url,country,governorate,store_type,specialty,status&id=eq.${encodeURIComponent(id)}&status=eq.active&limit=1`,{
      cache:'no-store',headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`,Accept:'application/json'}
    }).then(r=>{if(!r.ok)throw new Error(`Store REST ${r.status}`);return r.json()}).then(rows=>{
      const s=Array.isArray(rows)?rows[0]:null;
      if(!s)throw new Error('Store not found or inactive');
      title.textContent=s.store_name||'منتجات المتجر';
      meta.textContent=[s.specialty||s.store_type,s.governorate||s.country].filter(Boolean).join(' · ')||'متجر نشط';
      const logo=document.getElementById('localStoreLogo'),fallback=document.querySelector('.store-brand img')?.src||'';
      if(logo){logo.src=s.logo_url||fallback;logo.alt=`شعار ${s.store_name||'المتجر'}`;logo.hidden=!logo.src;logo.onerror=()=>{if(fallback&&logo.src!==fallback){logo.src=fallback;logo.hidden=false}else logo.hidden=true}}
      document.title=`${s.store_name||'KINTO Store'} - KINTO`;
    }).catch(err=>{
      console.error('Store header load error:',err);
      title.textContent='منتجات المتجر';
      meta.textContent='سيتم محاولة تحميل المنتجات مباشرة من معرف المتجر.';
    });
  })();
  </script>
  <script src="js/local-cart-v93.js?v=20260905-v101-shipping-destination"></script>
  <script type="module" src="js/local-store-card-v3.js?v=20260901-v93"></script>
  <script src="js/store-product-reviews-v140.js?v=20260912-v144-1" defer></script>
  <script src="js/store-card-modern-v144.js?v=20260912-v144" defer></script>
  <script src="js/storefront-product-modal-v145.js?v=20260912-v145" defer></script>
  <script src="js/customer-favorites-v147.js?v=20260912-v147" defer></script>
</body>
</html>
