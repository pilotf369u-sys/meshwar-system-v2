function cards(){return Array.from(grid.querySelectorAll(':scope > .local-v3-card[data-product-card]'))}
function update(){
 const all=cards();if(!all.length){navs.forEach(n=>n.replaceChildren());return}
 const signature=all.map(x=>x.dataset.productCard).join('|');
 const activeFilters=Array.from(document.querySelectorAll('#mwCategoryShell button.active')).map(x=>x.dataset.catFilter||x.textContent).join('|');
 const filterKey=activeFilters+'|'+String(search?.value||'');
 if(signature!==lastSignature||filterKey!==lastFilter){page=1;lastSignature=signature;lastFilter=filterKey}
 // Respect category/search controls' existing visibility decisions, never override them.
 const eligible=all.filter(el=>{const inline=el.style.display;return inline!=='none'&&!el.hidden});
 const direct=directId&&eligible.findIndex(el=>el.dataset.productCard===directId);
 if(direct>=0&&!grid.dataset.kintoV177DirectHandled){page=Math.floor(direct/SIZE)+1;grid.dataset.kintoV177DirectHandled='1'}
 const total=Math.max(1,Math.ceil(eligible.length/SIZE));page=Math.min(page,total);
 all.forEach(el=>{if(!eligible.includes(el))return;const i=eligible.indexOf(el);el.style.setProperty('display',i>=(page-1)*SIZE&&i<page*SIZE?'':'none','important');el.dataset.kintoV177Paged=i>=(page-1)*SIZE&&i<page*SIZE?'0':'1'});
 for(const nav of navs){nav.replaceChildren();const info=document.createElement('span');info.className='kinto-store-product-page-info';info.textContent='صفحة '+page+' من '+total+' — '+eligible.length+' منتج';nav.append(info);if(total===1)continue;const button=(label,target,disabled,current)=>{const b=document.createElement('button');b.type='button';b.textContent=label;b.disabled=disabled;if(current)b.setAttribute('aria-current','page');b.addEventListener('click',()=>{all.forEach(el=>{if(el.dataset.kintoV177Paged==='1'){el.style.removeProperty('display');el.dataset.kintoV177Paged='0'}});page=target;lastSignature=signature;lastFilter=filterKey;update();if(nav===navs[1])navs[0].scrollIntoView({block:'nearest'})});nav.append(b)};button('السابق',page-1,page===1,false);const start=Math.max(1,Math.min(page-2,total-4));for(let i=start;i<=Math.min(total,start+4);i++)button(String(i),i,false,i===page);button('التالي',page+1,page===total,false)}
}
let pending=false;function schedule(){if(pending)return;pending=true;requestAnimationFrame(()=>{pending=false;update()})}
const observer=new MutationObserver(records=>{if(records.some(r=>r.type==='childList'))schedule()});
observer.observe(grid,{childList:true});
search?.addEventListener('input',()=>{page=1;grid.querySelectorAll('[data-kinto-v177-paged="1"]').forEach(el=>{el.style.removeProperty('display');el.dataset.kintoV177Paged='0'});schedule()});
document.getElementById('mwCategoryShell')?.addEventListener('click',()=>{page=1;grid.querySelectorAll('[data-kinto-v177-paged="1"]').forEach(el=>{el.style.removeProperty('display');el.dataset.kintoV177Paged='0'});setTimeout(schedule,0)});
schedule();
})();
</script>

<script id="kintoStoreAdaptiveImageScriptV181">
/* No product source, order, stock or data mutations: only a class on existing media wrappers. */
(()=>{'use strict';const grid=document.getElementById('localStoreProductsGrid');if(!grid)return;
function classify(img){
 if(!img||!img.naturalWidth||!img.naturalHeight)return;
 const wrap=img.closest('.local-v3-img-wrap');if(!wrap)return;
 // Tall poster / packaging photos benefit from the subdued blurred side gutters.
 const ratio=img.naturalWidth/img.naturalHeight;
 wrap.classList.toggle('kinto-v181-portrait',ratio<.78);
}
function scan(){grid.querySelectorAll('.local-v3-img-wrap > img.local-v3-img').forEach(img=>{
 if(!img.dataset.kintoV181Observed){img.dataset.kintoV181Observed='1';img.addEventListener('load',()=>classify(img));}
 if(img.complete)classify(img);
})}
new MutationObserver(records=>{if(records.some(r=>r.type==='childList'))scan()}).observe(grid,{childList:true,subtree:true});
scan();
})();
</script>
