<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MeshWar</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020617}#app{width:100%;height:100%;border:0;display:block}</style>
</head>
<body>
<iframe id="app" title="MeshWar"></iframe>
<script>
(function(){
  const BUILD='20260827-branch-whatsapp-v18.9';
  const allowed={admin:'admin-dashboard.html',employee:'employee-dashboard.html',branch:'branch-dashboard.html',delivery:'delivery-dashboard.html',customer:'dashboard.html',manifest:'branch-manifest.html'};
  const params=new URLSearchParams(location.search),screen=String(params.get('screen')||'').trim().toLowerCase(),target=allowed[screen];
  if(!target){location.replace('login.html?v='+BUILD);return}
  params.delete('screen');
  params.set('_v',BUILD);
  const qs=params.toString(),frame=document.getElementById('app');
  frame.src=target+(qs?'?'+qs:'');
  frame.addEventListener('load',()=>{
    try{
      const d=frame.contentDocument;
      const theme=d.createElement('script');
      theme.src='js/global-theme-toggle-v1.js?v=20260826-global-theme-v1.1-customer';
      theme.dataset.meshwarScreen=screen;
      d.head.appendChild(theme);
      const visualPolish=d.createElement('link');
      visualPolish.rel='stylesheet';
      visualPolish.href='css/dashboard-polish-v17.css?v=20260827-v17.9';
      d.head.appendChild(visualPolish);
      if(screen==='customer'){
        const customerPolish=d.createElement('script');
        customerPolish.src='js/customer-light-polish-v1.js?v=20260826-customer-polish-v1.1-final';
        d.head.appendChild(customerPolish);
      }
      if(screen==='branch'){
        const branchContact=d.createElement('script');
        branchContact.src='js/branch-whatsapp-contact-v1.js?v=20260827-v1';
        d.head.appendChild(branchContact);
      }
      if(screen==='employee'||screen==='admin'){
        const nativeRender=d.createElement('script');
        nativeRender.src='js/external-shipping-native-order-render-v1.js?v=20260826-native-render-v1';
        nativeRender.dataset.meshwarScreen=screen;
        d.head.appendChild(nativeRender);
        return;
      }
      const base=d.createElement('script');
      base.src='js/external-shipping-fee-v2.js?v=20260825-v2';
      base.dataset.meshwarScreen=screen;
      base.onload=()=>{
        const polish=d.createElement('script');
        polish.src='js/external-shipping-ui-polish-v3.js?v=20260825-v3';
        polish.dataset.meshwarScreen=screen;
        d.head.appendChild(polish);
      };
      d.head.appendChild(base);
    }catch(e){console.error('External shipping bridge injection failed',e)}
  });
})();
</script>
</body>
</html>
