<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MeshWar</title>
<script>(function(){const p=new URLSearchParams(location.search);if(p.get('screen')!=='delivery')return;let t='';try{t=localStorage.getItem('meshwar_global_theme')||localStorage.getItem('meshwar-theme')||''}catch(e){}if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme:light)').matches?'light':'dark';document.documentElement.dataset.deliveryShellTheme=t})();</script>
<style>html,body{margin:0!important;padding:0!important;width:100%!important;max-width:100%!important;height:100%!important;overflow:hidden;background:#020617}html[data-delivery-shell-theme="dark"],html[data-delivery-shell-theme="dark"] body{background:#0a2f23!important}html[data-delivery-shell-theme="light"],html[data-delivery-shell-theme="light"] body{background:#eef2f7!important}#app{position:fixed!important;inset:0!important;width:100vw!important;max-width:none!important;height:100vh!important;margin:0!important;padding:0!important;border:0;display:block}</style>
</head>
<body>
<iframe id="app" title="MeshWar"></iframe>
<script>
(function(){
  const BUILD='20260829-admin-money-v40';
  const allowed={admin:'admin-dashboard.html',employee:'employee-dashboard.html',branch:'branch-dashboard.html',delivery:'delivery-dashboard.html',customer:'dashboard.html',manifest:'branch-manifest.html'};
  const params=new URLSearchParams(location.search),screen=String(params.get('screen')||'').trim().toLowerCase(),target=allowed[screen];
  if(!target){location.replace('login.html?v='+BUILD);return}
  params.delete('screen');
  params.set('_v',BUILD);
  const qs=params.toString(),frame=document.getElementById('app');
  if(screen==='customer'){location.replace(target+(qs?'?'+qs:''));return}
  frame.src=target+(qs?'?'+qs:'');
  frame.addEventListener('load',()=>{
    try{
      const d=frame.contentDocument;
      const theme=d.createElement('script');
      theme.src='js/global-theme-toggle-v1.js?v=20260909-global-theme-v1.2-toggle-fix';
      theme.dataset.meshwarScreen=screen;
      d.head.appendChild(theme);
      const visualPolish=d.createElement('link');
      visualPolish.rel='stylesheet';
      visualPolish.href='css/dashboard-polish-v17.css?v=20260827-v17.9';
      d.head.appendChild(visualPolish);
      if(screen==='employee'){
        const employeeContrast=d.createElement('link');
        employeeContrast.rel='stylesheet';
        employeeContrast.href='css/employee-light-contrast-v1.css?v=20260827-v1.1';
        d.head.appendChild(employeeContrast);
      }
      if(screen==='delivery'){
        const deliveryDark=d.createElement('link');
        deliveryDark.rel='stylesheet';
        deliveryDark.href='css/delivery-dark-polish-v1.css?v=20260920-v1.5-kinto-emerald';
        d.head.appendChild(deliveryDark);
      }
      if(screen==='customer'){
        const landingResponsive=d.createElement('link');
        landingResponsive.rel='stylesheet';
        landingResponsive.href='css/customer-landing-responsive-v1.css?v=20260827-cms-video-v1';
        d.head.appendChild(landingResponsive);
        // Keep the customer palette last in the cascade: dashboard-polish is injected
        // after dashboard.html and must never restore the legacy navy dark surfaces.
        const customerTheme=d.createElement('link');
        customerTheme.rel='stylesheet';
        customerTheme.href='css/customer-kinto-theme-v126.css?v=20260909-v129-ivory-pagination';
        d.head.appendChild(customerTheme);
        // The shell injects customerTheme after dashboard.html. Re-append the shared
        // navigation stylesheet after it so the unified header remains authoritative
        // on desktop too (legacy .main-nav must not reappear through cascade order).
        const unifiedHeader=d.createElement('link');
        unifiedHeader.rel='stylesheet';
        unifiedHeader.href='css/public-customer-navigation-v157.css?v=20260915-v167-desktop-single-nav';
        d.head.appendChild(unifiedHeader);
        const customerPolish=d.createElement('script');
        customerPolish.src='js/customer-light-polish-v1.js?v=20260826-customer-polish-v1.1-final';
        d.head.appendChild(customerPolish);
        return; // CUSTOMER_POST_LOGIN_ROOT_FIX_V50: customer uses dashboard.html canonical renderer only.
      }
      if(screen==='branch'){
        const branchContact=d.createElement('script');
        branchContact.src='js/branch-whatsapp-contact-v1.js?v=20260827-v1';
        d.head.appendChild(branchContact);
      }
      if(screen==='employee'||screen==='admin'){
        const nativeRender=d.createElement('script');
        nativeRender.src='js/external-shipping-native-order-render-v1.js?v=20260829-native-render-v40';
        nativeRender.dataset.meshwarScreen=screen;
        d.head.appendChild(nativeRender);
        return;
      }
      const base=d.createElement('script');
      base.src='js/external-shipping-fee-v2.js?v=20260825-v2';
      base.dataset.meshwarScreen=screen;
      base.onload=()=>{
        const polish=d.createElement('script');
        polish.src='js/external-shipping-ui-polish-v3.js?v=20260825-v3';
        polish.dataset.meshwarScreen=screen;
        d.head.appendChild(polish);
      };
      d.head.appendChild(base);
    }catch(e){console.error('External shipping bridge injection failed',e)}
  });
})();
</script>
</body>
</html>
